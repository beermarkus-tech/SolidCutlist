<style>
    /* * Frontend/CSS/css_global.html
     * We keep CSS minimal and rely mostly on Bootstrap utility classes.
     */
    
    body {
        /* Standardizing font to look a bit more polished */
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* * The app-view class is applied to our main sections. 
     * We use Bootstrap's 'd-none' (display: none) to hide inactive views.
     */
    .app-view {
        animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Fix for Android Chrome selection quirk on dropdowns and buttons */
    select, button, input[type="button"], .form-label {
        -webkit-user-select: none;
        user-select: none;
    }

    /* Strip Bootstrap's default input padding inside small tables to normalize row height */
    .table-sm .form-control-sm {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        height: auto !important;
    }
    
    .table-sm td {
        vertical-align: middle;
    }

    /* 🪄 Elegant Table Dropdowns: Prevent text from overlapping the arrow */
    .table-sm .form-select:not(.badge) {
        padding-right: 1.5rem !important; /* Give the arrow its personal space */
        text-overflow: ellipsis !important; /* Add "..." if the text is too long */
        white-space: nowrap !important; /* Stop text from stacking vertically */
        overflow: hidden !important; 
        background-position: right 0.25rem center !important; /* Push arrow neatly to the edge */
        background-size: 12px 12px !important; /* Shrink the arrow just a hair */
    }

    /* 🪄 UNIVERSAL STICKY HEADER CLASS */
    .shop-sticky-header {
        position: sticky !important;
        top: 52px !important;     /* Locks exactly under your top navbar */
        z-index: 1050 !important; /* Crushes all scrolling content beneath it */
        opacity: 1 !important;    /* Kills Bootstrap frosted-glass bleed-through */
    }

    /* 🪄 CONTRAST FOR TABLE WARNINGS IN DARK MODE */
    [data-bs-theme="dark"] .table-warning {
        --bs-table-bg: #4a3600;
        --bs-table-striped-bg: #543d00;
        --bs-table-hover-bg: #5e4500;
    }

    /* Keep it clean for the printer */
    @media print {
        .shop-sticky-header {
            position: relative !important;
            top: auto !important;
        }
    }
</style>
