    function applyTranslations() {
        const lang = (appState.settings && appState.settings.language) ? appState.settings.language : 'en';
        const dict = translations[lang] || translations['en'];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) {
                if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
                    el.setAttribute('placeholder', dict[key]);
                } else if (el.hasAttribute('data-i18n-title')) {
                    el.setAttribute('title', dict[key]);
                } else {
                    el.innerHTML = dict[key]; 
                }
            }
        });
    }
    function t(key, replacements = {}) {
        const lang = (appState.settings && appState.settings.language) ? appState.settings.language : 'en';
        const dict = translations[lang] || translations['en'];
        let text = dict[key] || key;

        // Handle pluralization and variable replacement
        for (const placeholder in replacements) {
            text = text.replace(`{${placeholder}}`, replacements[placeholder]);
        }

        return text;
    }
    function handleLanguageChange(newLang) {
        if (!appState.settings) appState.settings = {};
        appState.settings.language = newLang;
        saveState();
        applyTranslations(); 
        showToast( t('msg_lang_changed') );
    }
</script>
