<script>
        /**
         * Frontend/JS/js_canvas.html
         * Renders the visual board cards and HTML5 Canvas diagrams for 1D and 2D parts.
         */
    
        function renderDiagramsTab(results) {
            const container = document.getElementById('pane-diagrams');
            let html = '';
            
            const k1D = appState.settings.bladeKerf || 3.175;
            const t1D = appState.settings.factoryEdgeTrim || 6.35;
            const k2D = appState.settings.sheetBladeKerf || 3.175;
            const t2D = appState.settings.sheetFactoryTrim || 6.35;
            const threshold = appState.settings.cutoffThreshold || 200.0; 
            const minW = appState.settings.sheetScrapMinWidth || 50.0;   
            const minL = appState.settings.sheetScrapMinLength || 400.0; 
            const isMetric = appState.settings.displayUnit === 'mm';
            
            let boardCounter = 1; 
            const canvasDrawQueue = []; 
    
            results.forEach(res => {
                if (res.error) return;
                
                const purchase = res.purchase;
                const isSheet = res.sku.category === 'sheet';
                const prof = appState.profiles.find(p => p.id === res.sku.profileId);
                const mat = appState.materials.find(m => m.id === res.sku.materialId);
                const rawLength = purchase.catalogItem.length;
                const rawWidth = isSheet ? purchase.catalogItem.width : 0;
                
                const sizeString = isSheet 
                    ? `${formatForDisplay(rawLength)} x ${formatForDisplay(rawWidth)}`
                    : `${formatForDisplay(rawLength)}`;
    
                html += `
                    <div class="mt-4 mb-2 border-bottom border-2 border-dark pb-1 d-flex justify-content-between align-items-end">
                        <h5 class="mb-0 fw-bold text-dark">${safeHTML(prof?.name)} - ${safeHTML(mat?.name)}</h5>
                        <span class="badge bg-secondary">Raw Size: ${sizeString} <span class="display-unit-label"></span></span>
                    </div>
                `;
    
                purchase.layout.forEach((board, bIndex) => {
                    const canvasId = `canvas-board-${boardCounter}`;
                    
                    let canvasHeight = 80; 
                    if (isSheet && rawLength > 0) {
                        canvasHeight = Math.floor(1000 * (rawWidth / rawLength)); 
                    }
    
                    let wasteVal = 0;
                    if (isSheet) {
                        board.freeRects.forEach(r => wasteVal += (r.w * r.l));
                    } else {
                        wasteVal = board.remaining;
                    }
                    const wasteLabel = isSheet ? 'Waste Area' : 'Waste Length';
                    const wasteDisplay = isSheet 
                        ? (wasteVal / 1000000).toFixed(2) + ' m²' 
                        : formatForDisplay(wasteVal);
    
                    html += `
                    <div class="card shadow-sm mb-4 border-secondary">
                        <div class="card-header bg-light py-1 d-flex justify-content-between align-items-center">
                            <small class="fw-bold text-muted">Board #${bIndex + 1} of ${purchase.layout.length}</small>
                            <small class="text-muted">${wasteLabel}: ${wasteDisplay} ${isSheet ? '' : '<span class="display-unit-label"></span>'}</small>
                        </div>
                        
                        <div class="card-body p-3 text-center overflow-auto bg-white">
                            <canvas id="${canvasId}" width="1000" height="${canvasHeight}" style="width: 100%; min-width: 600px; max-width: 1000px; border-radius: 4px; border: 1px solid #ced4da;"></canvas>
                        </div>
                        
                        <div class="table-responsive">
                            <table class="table table-sm table-hover mb-0 border-top">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3" style="width: 50px;">Cut</th>
                                        <th>Part Label</th>
                                        <th class="text-center">Grain</th>
                                        <th class="text-end pe-3">Cut Size</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
    
                    board.cuts.forEach((cut, cIndex) => {
                        const partData = appState.parts.find(p => p.id === cut.partId);
                        const projName = appState.projects.find(p => p.id === partData?.projectId)?.name || 'Unknown';
                        const label = appState.settings.optimizer.selectedProjects.length > 1 
                            ? `[${safeHTML(projName)}] ${safeHTML(cut.name)}` 
                            : safeHTML(cut.name);
                        
                        const grainStr = isSheet && partData ? partData.grain : '-';
                        const cutSizeStr = isSheet 
                            ? `${formatForDisplay(cut.l)} x ${formatForDisplay(cut.w)}` 
                            : `${formatForDisplay(cut.length)}`;
    
                        const rotationWarning = (isSheet && cut.rotated) ? ' <span class="badge bg-warning text-dark ms-1">Rotated</span>' : '';
    
                        html += `
                                    <tr>
                                        <td class="ps-3 fw-bold text-muted">${cIndex + 1}</td>
                                        <td>${label}${rotationWarning}</td>
                                        <td class="text-center text-capitalize text-muted"><small>${grainStr}</small></td>
                                        <td class="text-end pe-3 fw-bold">${cutSizeStr} <span class="display-unit-label"></span></td>
                                    </tr>
                        `;
                    });
    
                    html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                    `;
                    
                    canvasDrawQueue.push({ 
                        id: canvasId, board: board, isSheet: isSheet,
                        length: rawLength, width: rawWidth,
                        kerf: isSheet ? k2D : k1D, trim: isSheet ? t2D : t1D,
                        threshold: threshold, minW: minW, minL: minL
                    });
                    boardCounter++;
                });
            });
    
            if (html === '') {
                html = `<div class="alert alert-warning mt-3">No diagrams could be generated.</div>`;
            }
    
            container.innerHTML = html;
            updateUnitLabels();
    
            canvasDrawQueue.forEach(job => {
                if (job.isSheet) {
                    drawSheetGraphic(job.id, job.board, job.length, job.width, job.kerf, job.trim, job.minW, job.minL);
                } else {
                    drawBoardGraphic(job.id, job.board, job.length, job.kerf, job.trim);
                }
            });
        }
    
        // ==========================================
        // 2D SHEET RENDERING ENGINE
        // ==========================================
        function drawSheetGraphic(canvasId, board, sheetLength, sheetWidth, kerf, trim, minW, minL) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;  
            const h = canvas.height; 
            
            const pxPerMm = w / sheetLength;
    
            // 1. Paint Background
            ctx.fillStyle = '#e9ecef'; 
            ctx.fillRect(0, 0, w, h);
    
            // 2. Paint Factory Trim
            if (trim > 0 && board.cuts.length > 0) {
                ctx.fillStyle = '#adb5bd'; 
                ctx.fillRect(0, 0, sheetLength * pxPerMm, trim * pxPerMm); 
                ctx.fillRect(0, 0, trim * pxPerMm, sheetWidth * pxPerMm); 
            }
    
            // 🪄 Negative Space (Guillotine Cuts)
            board.freeRects.forEach(rect => {
                const cx = rect.y * pxPerMm; 
                const cy = rect.x * pxPerMm; 
                const cw = rect.l * pxPerMm; 
                const ch = rect.w * pxPerMm; 
    
                // The Strip Rule logic
                const shortestEdge = Math.min(rect.l, rect.w);
                const longestEdge = Math.max(rect.l, rect.w);
                const isUsable = (shortestEdge >= minW && longestEdge >= minL);
    
                if (isUsable) {
                    ctx.fillStyle = 'rgba(40, 167, 69, 0.15)'; // Green for Usable Offcut
                    ctx.strokeStyle = '#28a745'; 
                } else {
                    ctx.fillStyle = 'rgba(220, 53, 69, 0.1)'; // Red for True Scrap
                    ctx.strokeStyle = '#dc3545'; 
                }
    
                ctx.fillRect(cx, cy, cw, ch);
                ctx.setLineDash([5, 5]); 
                ctx.lineWidth = 1;
                ctx.strokeRect(cx, cy, cw, ch);
                ctx.setLineDash([]); 
            });
    
            // 3. Draw Parts
            board.cuts.forEach((cut, index) => {
                const cx = cut.y * pxPerMm; 
                const cy = cut.x * pxPerMm; 
                const cw = cut.l * pxPerMm; 
                const ch = cut.w * pxPerMm; 
    
                ctx.fillStyle = '#DEB887'; 
                ctx.fillRect(cx, cy, cw, ch);
    
                let partData = appState.parts.find(p => p.id === cut.partId);
                let grainPref = partData ? partData.grain : 'none';
                
                if (grainPref !== 'none') {
                    let isHorizontal = true;
                    if (grainPref === 'length') {
                        isHorizontal = !cut.rotated;
                    } else if (grainPref === 'width') {
                        isHorizontal = cut.rotated;
                    }
    
                    ctx.strokeStyle = 'rgba(139, 69, 19, 0.25)'; 
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    
                    if (isHorizontal) {
                        const step = ch / 6;
                        for (let i = 1; i < 6; i++) {
                            ctx.moveTo(cx, cy + (i * step));
                            ctx.lineTo(cx + cw, cy + (i * step));
                        }
                    } else {
                        const step = cw / 6;
                        for (let i = 1; i < 6; i++) {
                            ctx.moveTo(cx + (i * step), cy);
                            ctx.lineTo(cx + (i * step), cy + ch);
                        }
                    }
                    ctx.stroke();
                }
    
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(cx, cy, cw, ch);
    
                if (cw > 20 && ch > 20) {
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 14px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(index + 1, cx + (cw / 2), cy + (ch / 2));
                }
            });
        }
    
        // ==========================================
        // 1D LUMBER RENDERING ENGINE
        // ==========================================
        function drawBoardGraphic(canvasId, board, fullLength, kerf, trim) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;  
            const h = canvas.height; 
            const pxPerMm = w / fullLength;
    
            ctx.fillStyle = '#e9ecef';
            ctx.fillRect(0, 0, w, h);
    
            let currentX = 0;
    
            if (trim > 0 && board.cuts.length > 0) {
                const trimPx = trim * pxPerMm;
                ctx.fillStyle = '#adb5bd'; 
                ctx.fillRect(currentX, 0, trimPx, h);
                currentX += trimPx;
            }
    
            board.cuts.forEach((cut, index) => {
                if (index > 0) {
                    const kerfPx = kerf * pxPerMm;
                    ctx.fillStyle = '#dc3545'; 
                    ctx.fillRect(currentX, 0, kerfPx, h);
                    currentX += kerfPx;
                }
    
                const cutPx = cut.length * pxPerMm;
                
                ctx.fillStyle = '#8B4513'; 
                ctx.fillRect(currentX, 0, cutPx, h);
                
                ctx.strokeStyle = '#5c2e0b';
                ctx.lineWidth = 2;
                ctx.strokeRect(currentX, 0, cutPx, h);
    
                if (cutPx > 25) { 
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(index + 1, currentX + (cutPx / 2), h / 2);
                }
    
                currentX += cutPx;
            });
        }
    </script>
