<script>
    // --- MAIN TABLE RENDER FUNCTIONS ---
    function renderDictionaries() {
        renderProjectsTable(); 
        renderStockTable();
        renderCatalogTable();
        renderMaterialsTable();
        renderProfilesTable();
        
        // 🪄 Tell the Parts view to instantly update its dropdowns
        if (typeof refreshPartsDropdowns === 'function') refreshPartsDropdowns();
        if (typeof renderPartsTable === 'function') renderPartsTable();
    }
    function renderSettings() {
        if (!appState.settings) appState.settings = {};
        if (!appState.settings.displayUnit) appState.settings.displayUnit = 'mm';
        if (appState.settings.bladeKerf === undefined) appState.settings.bladeKerf = 3.175;
        if (appState.settings.sheetBladeKerf === undefined) appState.settings.sheetBladeKerf = 3.175; // 🪄 NEW
        if (appState.settings.cutoffThreshold === undefined) appState.settings.cutoffThreshold = 200.0;
        if (appState.settings.sheetScrapMinWidth === undefined) appState.settings.sheetScrapMinWidth = 50.0; // 🪄 NEW
        if (appState.settings.sheetScrapMinLength === undefined) appState.settings.sheetScrapMinLength = 400.0; // 🪄 NEW
        if (appState.settings.factoryEdgeTrim === undefined) appState.settings.factoryEdgeTrim = 6.35;
        if (appState.settings.sheetFactoryTrim === undefined) appState.settings.sheetFactoryTrim = 6.35; // 🪄 NEW
        if (!appState.settings.currency) appState.settings.currency = '$'; // 🪄 NEW
        
        document.getElementById('setting-display-unit').value = appState.settings.displayUnit;
        document.getElementById('setting-kerf').value = formatForDisplay(appState.settings.bladeKerf);
        document.getElementById('setting-sheet-kerf').value = formatForDisplay(appState.settings.sheetBladeKerf); // 🪄 NEW
        document.getElementById('setting-cutoff').value = formatForDisplay(appState.settings.cutoffThreshold);
        document.getElementById('setting-sheet-scrap-width').value = formatForDisplay(appState.settings.sheetScrapMinWidth); // 🪄 NEW
        document.getElementById('setting-sheet-scrap-length').value = formatForDisplay(appState.settings.sheetScrapMinLength); // 🪄 NEW
        document.getElementById('setting-factory-trim').value = formatForDisplay(appState.settings.factoryEdgeTrim);
        document.getElementById('setting-sheet-trim').value = formatForDisplay(appState.settings.sheetFactoryTrim); // 🪄 NEW
        document.getElementById('setting-currency').value = appState.settings.currency; // 🪄 NEW

        const langDropdown = document.getElementById('setting-language');
        if (langDropdown) langDropdown.value = appState.settings.language;

        updateUnitLabels();
    }
    function renderProjectsTable() {
    
    const tbody = document.getElementById('table-projects-body');
        tbody.innerHTML = ''; 
        
        // Failsafe in case appState.projects is undefined
        if (!appState.projects) appState.projects = [];

        appState.projects.forEach(proj => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(proj, 'projects')) return;
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${proj.name}" 
                           onchange="updateProjectName('${proj.id}', this.value)"
                           title="Tap to edit">
                </td>
                <td><span class="badge bg-secondary">${proj.status || 'Design'}</span></td>
                <td class="text-center px-1 py-0" style="width: 40px;">
                    <button class="btn btn-sm btn-light border shadow-sm py-0 px-2" onclick="openGroupModal('${proj.id}')" title="Manage Groups">⚙️</button>
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('projects', '${proj.id}')" title="Duplicate Row">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteProject('${proj.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('projects', ['name', 'status']);
        }

    }
    function renderStockTable() {
        const tbody = document.getElementById('table-stock-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 
        
        if (!appState.stock) appState.stock = [];

        appState.stock.forEach(item => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(item, 'stock')) return;

            const tr = document.createElement('tr');
            const badgeClass = getCategoryBadgeClass(item.categoryId);
            
            // 🪄 0. VALIDATE REALITY & DYNAMIC DROPDOWNS FOR PROFILE/MATERIAL
            const filteredProfiles = appState.profiles.filter(p => p.type === item.categoryId);
            const isProfValid = filteredProfiles.some(p => p.id === item.profileId);
            
            let profOptions = !isProfValid ? `<option value="" disabled selected>⚠️ Select Profile...</option>` : '';
            filteredProfiles.forEach(p => {
                profOptions += `<option value="${p.id}" ${p.id === item.profileId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
            });
            let profHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 align-middle text-center" margin: 0 auto;" onchange="updateStock('${item.id}', 'profileId', this.value)" title="Tap to change Profile">
                    ${profOptions}
                </select>`;

            const filteredMaterials = appState.materials.filter(m => m.category === item.categoryId);
            const isMatValid = filteredMaterials.some(m => m.id === item.materialId);

            let matOptions = !isMatValid ? `<option value="" disabled selected>⚠️ Select Material...</option>` : '';
            filteredMaterials.forEach(m => {
                matOptions += `<option value="${m.id}" ${m.id === item.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`;
            });
            let matHtml = `
                <select class="text-center form-select form-select-sm border-0 bg-transparent px-0 py-0" margin: 0 auto;" onchange="updateStock('${item.id}', 'materialId', this.value)" title="Tap to change Material">
                    ${matOptions}
                </select>`;

            // 🪄 0.5 APPLY ROW HIGHLIGHT IF INVALID
            if (!isProfValid || !isMatValid) {
                tr.classList.add('table-warning');
            }

            // 🪄 1. DYNAMIC SIZE INPUTS
            let dimHtml = '';
            const displayL = formatForDisplay(item.length);
            if (item.categoryId === 'sheet') {
                const displayW = formatForDisplay(item.width);
                dimHtml = `
                    <div class="d-flex align-items-center justify-content-center gap-1">
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width: 50px;" 
                               value="${displayW}" onchange="updateStock('${item.id}', 'width', this.value)" title="Tap to edit width">
                        <span class="text-muted text-sm">x</span>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-start px-0" style="width: 50px;" 
                               value="${displayL}" onchange="updateStock('${item.id}', 'length', this.value)" title="Tap to edit length">
                    </div>`;
            } else {
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 60px;" 
                           value="${displayL}" onchange="updateStock('${item.id}', 'length', this.value)" title="Tap to edit length">`;
            }

            // 🪄 2. INLINE GRAIN DROPDOWN
            let grainHtml = '<span class="text-muted">-</span>';
            if (item.categoryId === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center" style="width: 75px;" onchange="updateStock('${item.id}', 'grain', this.value)" title="Change Grain">
                        <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${item.grain === 'length' ? 'selected' : ''}>Length</option>
                        <option value="width" ${item.grain === 'width' ? 'selected' : ''}>Width</option>
                    </select>
                `;
            }

            // 🪄 3. INLINE TYPE DROPDOWN
            let typeHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center ${item.isCutoff ? 'text-warning fw-bold' : 'text-success fw-bold'}" style="width: 75px;" onchange="updateStock('${item.id}', 'isCutoff', this.value === 'true')" title="Change Type">
                    <option value="false" ${!item.isCutoff ? 'selected' : ''} class="text-success">New</option>
                    <option value="true" ${item.isCutoff ? 'selected' : ''} class="text-warning">Scrap</option>
                </select>
            `;

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${item.categoryId === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${item.categoryId === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${item.categoryId === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="text-center px-1 py-0 align-middle"><small>
                    <input type="number" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 50px;"
                           value="${item.qty}" onchange="updateStock('${item.id}', 'qty', this.value)" title="Tap to edit qty">
                </small></td>
                <td class="px-1 py-0 align-middle text-center">${profHtml}</td>
                <td class="text-center text-nowrap px-1 py-0 align-middle">${dimHtml}</td>
                <td class="px-1 py-0 align-middle text-center">${matHtml}</td>
                <td class="text-center text-capitalize px-1 py-0 align-middle">${grainHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${typeHtml}</td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('stock', '${item.id}')" title="Duplicate Row">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteStock('${item.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('stock', ['categoryId', 'length', 'profileId', 'materialId', 'grain', 'isCutoff']);
        }

        updateUnitLabels();
    }
    function renderCatalogTable() {
        const tbody = document.getElementById('table-catalog-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 
        if (!appState.catalog) appState.catalog = [];

        const viewUnit = document.getElementById('table-price-view').value;
        const isMetric = appState.settings.displayUnit === 'mm';
        const currency = appState.settings.currency || '$'; // 🪄 ADD THIS

        appState.catalog.forEach(item => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(item, 'catalog')) return;

            const tr = document.createElement('tr');
            const store = appState.stores?.find(s => s.id === item.storeId);
            const badgeClass = getCategoryBadgeClass(item.categoryId);
            
            // 🪄 0. VALIDATE REALITY & DYNAMIC DROPDOWNS
            const filteredProfiles = appState.profiles.filter(p => p.type === item.categoryId);
            const isProfValid = filteredProfiles.some(p => p.id === item.profileId);
            
            let profOptions = !isProfValid ? `<option value="" disabled selected>⚠️ Select Profile...</option>` : '';
            filteredProfiles.forEach(p => {
                profOptions += `<option value="${p.id}" ${p.id === item.profileId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
            });
            // Text is standard, no yellow text classes
            let profHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 text-center align-middle" margin: 0 auto;" onchange="updateCatalogItem('${item.id}', 'profileId', this.value)" title="Tap to change Profile">
                    ${profOptions}
                </select>`;

            const filteredMaterials = appState.materials.filter(m => m.category === item.categoryId);
            const isMatValid = filteredMaterials.some(m => m.id === item.materialId);

            let matOptions = !isMatValid ? `<option value="" disabled selected>⚠️ Select Material...</option>` : '';
            filteredMaterials.forEach(m => {
                matOptions += `<option value="${m.id}" ${m.id === item.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`;
            });
            // Text is standard, no yellow text classes
            let matHtml = `
                <select class="text-center form-select form-select-sm border-0 bg-transparent px-0 py-0" margin: 0 auto;" onchange="updateCatalogItem('${item.id}', 'materialId', this.value)" title="Tap to change Material">
                    ${matOptions}
                </select>`;

            // 🪄 NEW: Pre-calculate if the store actually exists
            const isStoreValid = appState.stores && appState.stores.some(s => s.id === item.storeId);

            // 🪄 0.5 APPLY ROW HIGHLIGHT IF INVALID (Now includes Store)
            if (!isProfValid || !isMatValid || !isStoreValid) {
                tr.classList.add('table-warning');
            }
            
            // 🪄 1. DYNAMIC SIZE INPUTS
            let dimHtml = '';
            const displayL = formatForDisplay(item.length);
            if (item.categoryId === 'sheet') {
                const displayW = formatForDisplay(item.width);
                dimHtml = `
                    <div class="d-flex align-items-baseline justify-content-center gap-1">
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0 py-0" style="width: 50px;" 
                               value="${displayW}" onchange="updateCatalogItem('${item.id}', 'width', this.value)" title="Tap to edit width">
                        <span class="text-muted text-sm">x</span>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-start px-0 py-0" style="width: 50px;" 
                               value="${displayL}" onchange="updateCatalogItem('${item.id}', 'length', this.value)" title="Tap to edit length">
                    </div>
                `;
            } else {
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0 py-0 mx-auto" style="width: 60px;" 
                           value="${displayL}" onchange="updateCatalogItem('${item.id}', 'length', this.value)" title="Tap to edit length">
                `;
            }

            // 🪄 2. INLINE STORE DROPDOWN
            let storeOptions = !isStoreValid ? '<option value="" disabled selected>⚠️ Select Store...</option>' : '';
            
            if (appState.stores) {
                appState.stores.forEach(s => {
                    storeOptions += `<option value="${s.id}" ${s.id === item.storeId ? 'selected' : ''}>${safeHTML(s.name)}</option>`;
                });
            }
            let storeHtml = `
                <select class="text-center form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updateCatalogItem('${item.id}', 'storeId', this.value)" title="Tap to change Store">
                    ${storeOptions}
                </select>`;

            // 🪄 3. DYNAMIC PRICE INPUT & INLINE UNIT DROPDOWN
            const uLin = isMetric ? 'm' : 'ft';
            const uArea = isMetric ? 'm²' : 'sqft';
            const uVol = isMetric ? 'm³' : 'BF';

            let unitSelectHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 text-muted" 
                        style="width: auto; appearance: none; cursor: pointer; text-align: left;" 
                        onchange="updateCatalogItem('${item.id}', 'priceUnit', this.value)" title="Tap to change Unit">
                    <option value="piece" ${item.priceUnit === 'piece' ? 'selected' : ''}>pc</option>
                    <option value="linear" ${item.priceUnit === 'linear' ? 'selected' : ''}>${uLin}</option>
                    <option value="area" ${item.priceUnit === 'area' ? 'selected' : ''}>${uArea}</option>
                    <option value="volume" ${item.priceUnit === 'volume' ? 'selected' : ''}>${uVol}</option>
                </select>
            `;

            let priceHtml = `
                <div class="d-flex align-items-center justify-content-center text-nowrap mx-auto" style="width: 130px;">
                    <input type="number" step="0.01" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width: 60px;" 
                           value="${parseFloat(item.price).toFixed(2)}" onchange="updateCatalogItem('${item.id}', 'price', this.value)" title="Tap to edit price">
                    <span class="text-muted px-1">/</span>
                    ${unitSelectHtml}
                </div>`;

            let grainHtml = '<span class="text-muted">-</span>';
            if (item.categoryId === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 mx-auto text-center" style="width: 75px;" onchange="updateCatalogItem('${item.id}', 'grain', this.value)" title="Change Grain">
                        <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${item.grain === 'length' ? 'selected' : ''}>Length</option>
                        <option value="width" ${item.grain === 'width' ? 'selected' : ''}>Width</option>
                    </select>
                `;
            }

            // Calculate normalized comparison price
            const displayPrice = getNormalizedPriceDisplay(item, viewUnit);

            let linkHtml = item.link 
                ? `<a href="${safeHTML(item.link)}" target="_blank" class="text-decoration-none me-2" title="Open Link">🔗</a>` 
                : `<span class="text-muted me-2" style="opacity: 0.3;">🔗</span>`;

                tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${item.categoryId === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${item.categoryId === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${item.categoryId === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="px-1 py-0 align-middle text-center">${profHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${dimHtml}</td>
                <td class="px-1 py-0 align-middle text-center">${matHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${grainHtml}</td>
                <td class="px-1 py-0 align-middle">${storeHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${priceHtml}</td>
                <td class="text-center fw-bold text-success align-middle">${currency}${displayPrice}</td>
                <td class="text-end text-nowrap align-middle">
                    ${linkHtml}
                    <button class="btn btn-sm py-0 px-1" onclick="openLinkModal('${item.id}', '${safeHTML(item.link || '')}')" title="Edit Link">✏️</button>
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('catalog', '${item.id}')" title="Duplicate Row">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteCatalogItem('${item.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        const filterColumns = ['categoryId', 'length', 'profileId', 'materialId', 'grain', 'storeId'];
        const hasAnyFilter = updateFilterUI('catalog', filterColumns);
    }
    function renderProfilesTable() {
        const tbody = document.getElementById('table-profiles-body');
        tbody.innerHTML = ''; 
        
        appState.profiles.forEach(prof => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(prof, 'profiles')) return;

            const tr = document.createElement('tr');
            
            // 🪄 MAGIC: Convert internal base mm back to UI strings (e.g., 38.1 -> "1 1/2")
            let displayThick = formatForDisplay(prof.thickness);
            let displayWidth = formatForDisplay(prof.width);
            
            // 🪄 COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(prof.type);

            // 🪄 DYNAMIC DIMENSIONS DISPLAY
            let dimHtml = '';
            if (prof.type === 'sheet') {
                // Sheets only show Thickness
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 60px;"
                           value="${displayThick}" onchange="updateProfile('${prof.id}', 'thickness', this.value)" title="Tap to edit thickness">
                `;
            } else if (prof.type === 'lumber') {
                // Lumber shows Thickness x Width
                dimHtml = `
                    <div class="d-flex align-items-baseline justify-content-center gap-1">
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0 py-0" style="width: 45px;"
                            value="${displayThick}" onchange="updateProfile('${prof.id}', 'thickness', this.value)" title="Tap to edit thickness">
                        <span class="text-muted text-sm">x</span>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-left px-0 py-0" style="width: 45px;"
                            value="${displayWidth}" onchange="updateProfile('${prof.id}', 'width', this.value)" title="Tap to edit width">
                    </div>
                `;
            } else {
                dimHtml = `<span class="text-muted">-</span>`;
            }

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${prof.type === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${prof.type === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${prof.type === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1 text-center align-middle" 
                           value="${safeHTML(prof.name)}"
                           onchange="updateProfile('${prof.id}', 'name', this.value)" title="Tap to edit">
                </td>
                <td class="text-center px-1 py-0 align-middle">${dimHtml}</td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('profiles', '${prof.id}')" title="Duplicate Row">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteProfile('${prof.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('profiles', ['name', 'type']);
        }

    }
    function renderMaterialsTable() {
        const tbody = document.getElementById('table-materials-body');
        tbody.innerHTML = ''; 
        
        appState.materials.forEach(mat => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(mat, 'materials')) return;

            const tr = document.createElement('tr');
           
            let currentCat = mat.category || 'lumber';

            // 🪄 COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(currentCat);

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${currentCat === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${currentCat === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${currentCat === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1 text-center align-middle" 
                           value="${safeHTML(mat.name)}"

    // --- MAIN TABLE DELETE FUNCTIONS ---
    function deleteProject(id, isConfirmed = false) {
        // 1. The Safety Shield (Made extra scary for a destructive action)
        if (!isConfirmed) {
            requestConfirm("Are you sure you want to delete this Project? This will also DELETE ALL PARTS associated with it. This cannot be undone.", () => deleteProject(id, true));
            return; 
        }

        // 2. The Cascade Delete (Purge the Parts)
        let deletedPartsCount = 0;
        if (appState.parts) {
            const originalLength = appState.parts.length;
            // Keep only the parts that DO NOT belong to this project
            appState.parts = appState.parts.filter(part => part.projectId !== id);
            deletedPartsCount = originalLength - appState.parts.length;
        }

        // 3. The Execution (Purge the Project)
        appState.projects = appState.projects.filter(p => p.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (deletedPartsCount > 0) {
            showToast(`Project deleted along with ${deletedPartsCount} associated part(s).`, true);
        } else {
            showToast('Project deleted.');
        }
    }
    function deleteStock(id, isConfirmed = false) {
        if (!isConfirmed) {
            requestConfirm("Remove this item from your stock?", () => deleteStock(id, true));
            return; 
        }

        appState.stock = appState.stock.filter(s => s.id !== id);
        saveState();
        renderStockTable();
        showToast('Item removed from stock.');
    }
    function deleteCatalogItem(id, isConfirmed = false) {

            return; 
        }
        appState.catalog = appState.catalog.filter(c => c.id !== id);
        saveState();
        renderCatalogTable();
        showToast('Item removed.');
    }
    function deleteProfile(id, isConfirmed = false) {
        // 1. The Safety Shield
        if (!isConfirmed) {
            requestConfirm("Are you sure you want to delete this Profile?", () => deleteProfile(id, true));
            return; 
        }
        
        // 2. The Cascade Nullify
        let inUseCount = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.profileId === id) {
                    part.profileId = ''; // Snap back to "(!) Select..."
                    part.status = 'needs_mapping'; // Turn the row Yellow
                    inUseCount++;
                }
            });
        }

        // 3. The Execution
        appState.profiles = appState.profiles.filter(p => p.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (inUseCount > 0) {
            showToast(`Profile deleted. ${inUseCount} part(s) using it were reset.`, true);
        } else {
            showToast('Profile deleted.');
        }
    }
    function deleteMaterial(id, isConfirmed = false) {
        // 1. The Safety Shield
        if (!isConfirmed) {
            requestConfirm("Are you sure you want to delete this Material?", () => deleteMaterial(id, true));
            return; 
        }
        
        // 2. The Cascade Nullify
        let inUseCount = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.materialId === id) {
                    part.materialId = ''; 
                    part.status = 'needs_mapping'; 
                    inUseCount++;
                }
            });
        }

        // 3. The Execution
        appState.materials = appState.materials.filter(m => m.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (inUseCount > 0) {
            showToast(`Material deleted. ${inUseCount} part(s) using it were reset.`, true);
        } else {
            showToast('Material deleted.');
        }
    }
    function deleteStore(id, isConfirmed = false) {
        // 🪄 The Safety Shield (Custom Modal)
        if (!isConfirmed) {
            requestConfirm("Delete this store? This will also remove the store from any catalog items using it.", () => deleteStore(id, true));
            return;
        }

        let affected = 0;
        if (appState.catalog) {
            appState.catalog.forEach(item => {
                if (item.storeId === id) {
                    item.storeId = '';
                    affected++;
                }
            });
        }
        appState.stores = appState.stores.filter(s => s.id !== id);
        saveState();
        renderStoreModalTable();

        showToast(`Store deleted. ${affected} catalog items reset.`, true);

    function updateProfile(id, field, newValue) {
        const prof = appState.profiles.find(p => p.id === id);
        if (prof) {
            if (field === 'thickness' || field === 'width') {
                // Intercept and parse to base unit
                prof[field] = parseToBaseUnit(newValue);
            } else {
                prof[field] = newValue;
                
                // 🪄 PHYSICS AUTO-HEAL: If they change it to a Sheet, zero out the width so it doesn't leave bad data behind
                if (field === 'type' && (newValue === 'sheet' || newValue === 'fastener')) {
                    prof.width = 0;
                }
            }
            
            saveState();
            renderDictionaries();
            showToast('Profile updated.');
        }
    }
    function updateMaterial(id, field, newValue) {
        const mat = appState.materials.find(m => m.id === id);
        if (mat) {
            // 🪄 If changing density, parse the lb/ft3 back to kg/m3 for the database
            mat[field] = (field === 'density') ? parseDensityToBase(newValue) : newValue;
            saveState();
            renderDictionaries();
            showToast('Material updated.');
        }
    }

    // --- HELPER FUNCTIONS ---
    function updateUnitLabels() {
        const isMetric = appState.settings.displayUnit === 'mm';
        const currencyText = appState.settings.currency || '$';
        const unitText = isMetric ? 'mm' : 'in';
        const densityText = isMetric ? 'kg/m³' : 'lb/ft³';
        const weightText = isMetric ? 'kg' : 'lbs';
        const linearText = isMetric ? 'm' : 'ft';
        const areaText = isMetric ? 'm²' : 'sqft';
        const volText = isMetric ? 'm³' : 'BF';
        
        // Update basic global labels
        document.querySelectorAll('.display-unit-label').forEach(label => label.innerText = unitText);
        document.querySelectorAll('.density-unit-label').forEach(label => label.innerText = densityText);
        document.querySelectorAll('.density-weight-label').forEach(label => label.innerText = weightText);
        document.querySelectorAll('.currency-label').forEach(label => label.innerText = currencyText);
        
        // Update the header drop-down in the Catalog table (safely checks if it exists first)
        const tableViewSelect = document.getElementById('table-price-view');
        if (tableViewSelect && tableViewSelect.options && tableViewSelect.options.length > 3) {
            tableViewSelect.options[1].text = `Cost / ${linearText}`;
            tableViewSelect.options[2].text = `Cost / ${areaText}`;
            tableViewSelect.options[3].text = `Cost / ${volText}`;
        }

        // 🪄 Update the new Cycle Button text safely
        const btnCycle = document.getElementById('btn-cycle-unit');
        const hiddenUnit = document.getElementById('cat-price-unit');
        if (btnCycle && hiddenUnit) {
            let u = hiddenUnit.value;
            let display = 'pc';
            if (u === 'linear') display = linearText;
            if (u === 'area') display = areaText;
            if (u === 'volume') display = volText;
            btnCycle.innerText = '/ ' + display;
        }
    }

            }
            
            // 🪄 3. RESTORE the selection
            if (currentStoreId) {
                storeSelect.value = currentStoreId;
            }
        }

        // 🪄 4. RESTORE the Category dropdown trigger (fixes the missing Profile/Material bug)
        const catSelect = document.getElementById('cat-category');
        if (catSelect && catSelect.value) {
            handleCatalogCategoryChange();
        }
    }
    function handleAddCatalogItem(event) {
        event.preventDefault();
        const category = document.getElementById('cat-category').value;
        
        // 🪄 Smart URL Formatter
        let rawLink = document.getElementById('cat-link').value || '';
        if (rawLink && !/^https?:\/\//i.test(rawLink)) {
            rawLink = 'https://' + rawLink;
        }
        
        if (!appState.catalog) appState.catalog = [];

        appState.catalog.unshift({
            id: 'CAT-' + Date.now(),
            categoryId: category,
            profileId: document.getElementById('cat-profile').value,
            materialId: document.getElementById('cat-material').value,
            storeId: document.getElementById('cat-store').value,
            length: parseToBaseUnit(document.getElementById('cat-length').value),
            width: category === 'sheet' ? parseToBaseUnit(document.getElementById('cat-width').value) : 0,
            grain: document.getElementById('cat-grain').value, // 🪄 NEW
            price: parseFloat(document.getElementById('cat-price').value) || 0,
            priceUnit: document.getElementById('cat-price-unit').value,
            link: rawLink
        });
        
        saveState();
        renderCatalogTable();
        showToast('Item added to Catalog.');

        // Reset form but keep category to allow rapid entry
        document.getElementById('cat-length').value = '';

        if (category === 'sheet') {
            const widthInput = document.getElementById('cat-width');
            widthInput.value = '';
            widthInput.focus(); // Snap to width for 2D materials
        } else {
            document.getElementById('cat-length').focus(); // Snap to length for 1D materials
        }
    }

    // THE MATH ENGINE: Calculates the true cost of ONE physical piece, no matter what unit the store uses.
    function calculateCostPerPiece(item) {
        if (!item.price || item.price === 0) return 0;
        if (item.priceUnit === 'piece') return item.price;
        
        const isMetric = appState.settings.displayUnit === 'mm';
        const prof = appState.profiles.find(p => p.id === item.profileId);
        if (!prof) return 0;

        const l_mm = item.length;
        const w_mm = item.categoryId === 'sheet' ? item.width : (prof.width || 0);
        const t_mm = prof.thickness || 0;

        if (isMetric) {
            if (item.priceUnit === 'linear') return item.price * (l_mm / 1000);
            if (item.priceUnit === 'area') return item.price * ((l_mm / 1000) * (w_mm / 1000));
            if (item.priceUnit === 'volume') return item.price * ((l_mm / 1000) * (w_mm / 1000) * (t_mm / 1000));
        } else {
            if (item.priceUnit === 'linear') return item.price * (l_mm / 304.8);
            if (item.priceUnit === 'area') return item.price * ((l_mm * w_mm) / 92903.04);
            if (item.priceUnit === 'volume') return item.price * ((l_mm * w_mm * t_mm) / 2359737.216); // Board Foot Math
        }
        return 0;
    }
    // Displays the normalized column price
    function getNormalizedPriceDisplay(item, viewUnit) {
        const costPerPiece = calculateCostPerPiece(item);
        if (viewUnit === 'piece') return costPerPiece.toFixed(2);
        
        const isMetric = appState.settings.displayUnit === 'mm';
        const prof = appState.profiles.find(p => p.id === item.profileId);
        if (!prof || item.length === 0) return '0.00';

        const l_mm = item.length;
        const w_mm = item.categoryId === 'sheet' ? item.width : (prof.width || 0);
        const t_mm = prof.thickness || 0;

        let factor = 1;
        if (isMetric) {
            if (viewUnit === 'linear') factor = (l_mm / 1000);
            else if (viewUnit === 'area') factor = ((l_mm / 1000) * (w_mm / 1000));
            else if (viewUnit === 'volume') factor = ((l_mm / 1000) * (w_mm / 1000) * (t_mm / 1000));
        } else {
            if (viewUnit === 'linear') factor = (l_mm / 304.8);
            else if (viewUnit === 'area') factor = ((l_mm * w_mm) / 92903.04);
            else if (viewUnit === 'volume') factor = ((l_mm * w_mm * t_mm) / 2359737.216);
        }

        if (factor === 0) return '0.00';
        return (costPerPiece / factor).toFixed(2);
    }
    function updateCatalogItem(id, field, newValue) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            if (field === 'length' || field === 'width') {
                // Safely convert fractional UI input to base mm
                item[field] = parseToBaseUnit(newValue) || 0;
            } else if (field === 'price') {
                // Ensure price is a clean float
                item[field] = parseFloat(newValue) || 0;
            } else {
                // For storeId or generic text
                item[field] = newValue;
            }
            
            saveState();
            renderCatalogTable();
            showToast('Catalog item updated.');
        }
    }

    // --- Link Modal Logic ---
    let linkModalInstance = null;
    function openLinkModal(itemId, currentLink) {
        if (!linkModalInstance) linkModalInstance = new bootstrap.Modal(document.getElementById('modal-link-editor'));
        document.getElementById('modal-link-item-id').value = itemId;
        document.getElementById('modal-link-url').value = currentLink || '';
        linkModalInstance.show();
        setTimeout(() => document.getElementById('modal-link-url').focus(), 400);
    }
    function saveCatalogLink(event) {
        if (event) event.preventDefault(); // Prevents the page from refreshing when you hit ENTER
        
        const id = document.getElementById('modal-link-item-id').value;
        let newLink = document.getElementById('modal-link-url').value || '';
        
        // 🪄 Smart URL Formatter
        if (newLink && !/^https?:\/\//i.test(newLink)) {
            newLink = 'https://' + newLink;
        }

        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            item.link = newLink;
            saveState();
            renderCatalogTable();
        }
        linkModalInstance.hide();
    }
</script>
