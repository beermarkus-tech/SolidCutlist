<script>
    /**
     * Frontend/JS/js_dictionaries.html
     * Handles logic for adding/removing Materials and Profiles.
     */

    // --- RENDER FUNCTIONS ---

    function renderDictionaries() {
        renderProjectsTable(); 
        renderStockTable();
        renderMaterialsTable();
        renderProfilesTable();
        
        // 🪄 Tell the Parts view to instantly update its dropdowns
        if (typeof refreshPartsDropdowns === 'function') refreshPartsDropdowns();
        if (typeof renderPartsTable === 'function') renderPartsTable();
    }

    function renderSettings() {
        // AUTO-HEAL: If local storage is missing these keys, inject the defaults safely
        if (!appState.settings) appState.settings = {};
        if (!appState.settings.displayUnit) appState.settings.displayUnit = 'mm';
        if (appState.settings.bladeKerf === undefined) appState.settings.bladeKerf = 3.175;
        if (appState.settings.cutoffThreshold === undefined) appState.settings.cutoffThreshold = 200.0;
        if (appState.settings.factoryEdgeTrim === undefined) appState.settings.factoryEdgeTrim = 6.35;

        // Set the dropdown
        document.getElementById('setting-display-unit').value = appState.settings.displayUnit;
        
        // 🪄 Apply the math engine so variables translate dynamically
        document.getElementById('setting-kerf').value = formatForDisplay(appState.settings.bladeKerf);
        document.getElementById('setting-cutoff').value = formatForDisplay(appState.settings.cutoffThreshold);
        document.getElementById('setting-factory-trim').value = formatForDisplay(appState.settings.factoryEdgeTrim);
        
        updateUnitLabels();
    }

    function renderProjectsTable() {
        const tbody = document.getElementById('table-projects-body');
        tbody.innerHTML = ''; 
        
        // Failsafe in case appState.projects is undefined
        if (!appState.projects) appState.projects = [];

        appState.projects.forEach(proj => {
            const tr = document.createElement('tr');
            
            // Notice the inline input field. It looks like plain text until you tap it.
            // When you change the text and tap away, it fires onchange="updateProjectName(...)"
            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${proj.name}" 
                           onchange="updateProjectName('${proj.id}', this.value)"
                           title="Tap to edit">
                </td>
                <td><span class="badge bg-secondary">${proj.status || 'Design'}</span></td>
                <td class="text-center" style="width: 40px;">
                    <button class="btn btn-sm btn-light border shadow-sm py-0 px-2" onclick="openGroupModal('${proj.id}')" title="Manage Groups">⚙️</button>
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteProject('${proj.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderStockTable() {
        const tbody = document.getElementById('table-stock-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 
        
        if (!appState.stock) appState.stock = [];

        appState.stock.forEach(item => {
            const tr = document.createElement('tr');
            
            // Lookups
            const prof = appState.profiles.find(p => p.id === item.profileId);
            const mat = appState.materials.find(m => m.id === item.materialId);
            
            // Formatting
            const badgeClass = getCategoryBadgeClass(item.categoryId);
            const sizeString = item.categoryId === 'sheet' 
                ? `${formatForDisplay(item.length)} x ${formatForDisplay(item.width)}`
                : `${formatForDisplay(item.length)}`;
            
            const typeBadge = item.isCutoff 
                ? '<span class="badge bg-warning text-dark">Scrap</span>' 
                : '<span class="badge bg-success">New</span>';

            const grainString = item.categoryId === 'sheet' ? item.grain : '-';

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" 
                                onchange="updateMaterial('${mat.id}', 'category', this.value)" title="Tap to change category" disabled>
                            <option value="lumber" class="bg-light text-dark" ${item.categoryId === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${item.categoryId === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${item.categoryId === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="text-center"><small>${prof ? safeHTML(prof.name) : '<span class="text-danger">Missing Profile</span>'}</small></td>
                <td class="text-center"><small>${mat ? safeHTML(mat.name) : '<span class="text-danger">Missing Material</span>'}</small></td>
                <td class="text-center"><small>
                    <input type="number" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 50px;"
                           value="${item.qty}" 
                           onchange="updateStock('${item.id}', 'qty', this.value)" title="Tap to edit qty">
                </small></td>
                <td class="text-center text-nowrap"><small>${sizeString}</small></td>
                <td class="text-center text-capitalize">${grainString}</small></td>
                <td class="text-center">${typeBadge}</td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm py-0 px-2 text-danger" onclick="deleteStock('${item.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        updateUnitLabels();
    }

    function renderMaterialsTable() {
        const tbody = document.getElementById('table-materials-body');
        tbody.innerHTML = ''; 
        
        appState.materials.forEach(mat => {
            const tr = document.createElement('tr');
           
            let currentCat = mat.category || 'lumber';

            // 🪄 COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(currentCat);

            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1" 
                           value="${safeHTML(mat.name)}" 
                           onchange="updateMaterial('${mat.id}', 'name', this.value)" title="Tap to edit">
                </td>
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" 
                                onchange="updateMaterial('${mat.id}', 'category', this.value)" title="Tap to change category" disabled>
                            <option value="lumber" class="bg-light text-dark" ${currentCat === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${currentCat === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${currentCat === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td>
                    <input type="number" step="0.01" class="form-control form-control-sm border-0 bg-transparent text-center" 
                           value="${formatDensityForDisplay(mat.density)}" 
                           onchange="updateMaterial('${mat.id}', 'density', this.value)" title="Tap to edit">
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteMaterial('${mat.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderProfilesTable() {
        const tbody = document.getElementById('table-profiles-body');
        tbody.innerHTML = ''; 
        
        appState.profiles.forEach(prof => {
            const tr = document.createElement('tr');
            
            // 🪄 MAGIC: Convert internal base mm back to UI strings (e.g., 38.1 -> "1 1/2")
            let displayThick = formatForDisplay(prof.thickness);
            let displayWidth = formatForDisplay(prof.width);
            
            // 🪄 COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(prof.type);

            // 🪄 DYNAMIC DIMENSIONS DISPLAY
            let dimHtml = '';
            if (prof.type === 'sheet') {
                // Sheets only show Thickness
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0" style="width: 60px;"
                           value="${displayThick}" 
                           onchange="updateProfile('${prof.id}', 'thickness', this.value)" title="Tap to edit thickness">
                `;
            } else if (prof.type === 'lumber') {
                // Lumber shows Thickness x Width
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width: 45px;"
                           value="${displayThick}" 
                           onchange="updateProfile('${prof.id}', 'thickness', this.value)" title="Tap to edit thickness">
                    <span class="text-muted text-sm px-1">x</span>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-left px-0" style="width: 45px;"
                           value="${displayWidth}" 
                           onchange="updateProfile('${prof.id}', 'width', this.value)" title="Tap to edit width">
                `;
            } else {
                dimHtml = `<span class="text-muted">-</span>`;
            }

            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1" 
                           value="${safeHTML(prof.name)}"
                           onchange="updateProfile('${prof.id}', 'name', this.value)" title="Tap to edit">
                </td>
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" 
                                onchange="updateProfile('${prof.id}', 'type', this.value)" title="Tap to change category" disabled>
                            <option value="lumber" class="bg-light text-dark" ${prof.type === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${prof.type === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${prof.type === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="d-flex align-items-center justify-content-center gap-1">
                    ${dimHtml}
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteProfile('${prof.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- CRUD OPERATIONS ---

    function handleUnitChange() {
        // 1. ONLY update the unit preference. 
        // We strictly DO NOT read the kerf/cutoff text boxes here because they are still formatted in the old unit.
        appState.settings.displayUnit = document.getElementById('setting-display-unit').value;
        saveState();
        
        // 2. Redraw the UI. The kerf/cutoff boxes will now pull the safe, uncorrupted base-mm 
        // from the appState and automatically translate it into the new unit.
        renderSettings(); 
        renderDictionaries();
        showToast('Display units updated.');
    }

    function handleAddProject(event) {
        event.preventDefault();
        
        const nameInput = document.getElementById('proj-name');
        const newId = 'PROJ-' + Date.now(); // Generates unique ID
        
        const newProject = {
            id: newId,
            name: nameInput.value,
            status: 'Design'
        };
        
        appState.projects.push(newProject);
        saveState();
        renderDictionaries();
        showToast('Project created.');
        
        nameInput.value = ''; // Clear the form
    }

    function handleAddMaterial(event) {
        event.preventDefault(); 
        
        const name = document.getElementById('mat-name').value;
        const category = document.getElementById('mat-category').value;
        const densityInput = document.getElementById('mat-density').value;
        
        const newMaterial = {
            id: 'M-' + Date.now(),
            name: name,
            category: category, // 🪄 Now saving the category
            density: parseDensityToBase(densityInput) 
        };
        
        appState.materials.push(newMaterial);
        saveState();
        renderDictionaries();
        showToast('Material added successfully.');
        
        document.getElementById('form-add-material').reset();
    }

    function handleAddProfile(event) {
        event.preventDefault();
        
        const name = document.getElementById('prof-name').value;
        const category = document.getElementById('prof-category').value;
        const thicknessInput = document.getElementById('prof-thickness').value;
        const widthInput = document.getElementById('prof-width').value;
        
        // 🪄 MAGIC: Convert whatever the user typed into base mm before saving
        const thicknessBase = parseToBaseUnit(thicknessInput);
        const widthBase = parseToBaseUnit(widthInput);
        
        const newId = 'PR-' + Date.now();
        
        const newProfile = {
            id: newId,
            name: name,
            type: category, 
            thickness: thicknessBase,
            width: widthBase
        };
        
        appState.profiles.push(newProfile);
        saveState();
        renderDictionaries();
        showToast('Profile added successfully.');
        
        document.getElementById('form-add-profile').reset();
    }

    function handleProfileCategoryChange() {
        const cat = document.getElementById('prof-category').value;
        const widthInput = document.getElementById('prof-width');
        
        if (cat === 'sheet' || cat === 'fastener') {
            widthInput.value = '';
            widthInput.disabled = true;
        } else {
            widthInput.disabled = false;
        }
    }

    function updateProjectName(id, newName) {
        // Find the project by ID and update its name
        const project = appState.projects.find(p => p.id === id);
        if (project) {
            project.name = newName;
            saveState();
            renderDictionaries();
            showToast('Project renamed.');
        }
    }

    function updateMaterial(id, field, newValue) {
        const mat = appState.materials.find(m => m.id === id);
        if (mat) {
            // 🪄 If changing density, parse the lb/ft3 back to kg/m3 for the database
            mat[field] = (field === 'density') ? parseDensityToBase(newValue) : newValue;
            saveState();
            renderDictionaries();
            showToast('Material updated.');
        }
    }

    function updateProfile(id, field, newValue) {
        const prof = appState.profiles.find(p => p.id === id);
        if (prof) {
            if (field === 'thickness' || field === 'width') {
                // Intercept and parse to base unit
                prof[field] = parseToBaseUnit(newValue);
            } else {
                prof[field] = newValue;
                
                // 🪄 PHYSICS AUTO-HEAL: If they change it to a Sheet, zero out the width so it doesn't leave bad data behind
                if (field === 'type' && (newValue === 'sheet' || newValue === 'fastener')) {
                    prof.width = 0;
                }
            }
            
            saveState();
            renderDictionaries();
            showToast('Profile updated.');
        }
    }

    function deleteProject(id) {
        // 1. The Safety Shield (Made extra scary for a destructive action)
        if (!confirm("Are you sure you want to delete this Project? This will also DELETE ALL PARTS associated with it. This cannot be undone.")) {
            return; // User got cold feet. Abort.
        }

        // 2. The Cascade Delete (Purge the Parts)
        let deletedPartsCount = 0;
        if (appState.parts) {
            const originalLength = appState.parts.length;
            // Keep only the parts that DO NOT belong to this project
            appState.parts = appState.parts.filter(part => part.projectId !== id);
            deletedPartsCount = originalLength - appState.parts.length;
        }

        // 3. The Execution (Purge the Project)
        appState.projects = appState.projects.filter(p => p.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (deletedPartsCount > 0) {
            showToast(`Project deleted along with ${deletedPartsCount} associated part(s).`, true);
        } else {
            showToast('Project deleted.');
        }
    }

    function deleteMaterial(id) {
        // 1. The Safety Shield
        if (!confirm("Are you sure you want to delete this Material?")) {
            return; 
        }

        // 2. The Cascade Nullify
        let inUseCount = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.materialId === id) {
                    part.materialId = ''; 
                    part.status = 'needs_mapping'; 
                    inUseCount++;
                }
            });
        }

        // 3. The Execution
        appState.materials = appState.materials.filter(m => m.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (inUseCount > 0) {
            showToast(`Material deleted. ${inUseCount} part(s) using it were reset.`, true);
        } else {
            showToast('Material deleted.');
        }
    }

    function deleteProfile(id) {
        // 1. The Safety Shield
        if (!confirm("Are you sure you want to delete this Profile?")) {
            return; // User clicked Cancel. Abort mission.
        }

        // 2. The Cascade Nullify
        let inUseCount = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.profileId === id) {
                    part.profileId = ''; // Snap back to "(!) Select..."
                    part.status = 'needs_mapping'; // Turn the row Yellow
                    inUseCount++;
                }
            });
        }

        // 3. The Execution
        appState.profiles = appState.profiles.filter(p => p.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (inUseCount > 0) {
            showToast(`Profile deleted. ${inUseCount} part(s) using it were reset.`, true);
        } else {
            showToast('Profile deleted.');
        }
    }

    // --- HELPER FUNCTIONS ---

    function updateUnitLabels() {
        const isMetric = appState.settings.displayUnit === 'mm';
        const unitText = isMetric ? 'mm' : 'in';
        const densityText = isMetric ? 'kg/m³' : 'lb/ft³';
        const weightText = isMetric ? 'kg' : 'lbs';
        
        document.querySelectorAll('.display-unit-label').forEach(label => label.innerText = unitText);
        document.querySelectorAll('.density-unit-label').forEach(label => label.innerText = densityText);
        document.querySelectorAll('.density-weight-label').forEach(label => label.innerText = weightText);
    }

    function handleSettingsValueChange() {
        // 1. ONLY read the text boxes. The unit preference is already safely set.
        const kerfInput = document.getElementById('setting-kerf').value;
        const cutoffInput = document.getElementById('setting-cutoff').value;
        const trimInput = document.getElementById('setting-factory-trim').value;
        
        appState.settings.bladeKerf = parseToBaseUnit(kerfInput);
        appState.settings.cutoffThreshold = parseToBaseUnit(cutoffInput);
        appState.settings.factoryEdgeTrim = parseToBaseUnit(trimInput);
        
        saveState();
        renderSettings(); // Cleans up the formatting in case they typed a messy fraction
        showToast('Settings saved.');
    }

    // --- INITIALIZATION ---
    // Ensure the tables render when the app boots up
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            renderSettings();
            renderDictionaries();
        }, 100); 
    });

    // ==========================================
    // PROJECT GROUP MANAGER
    // ==========================================
    let groupModalInstance = null;

    function openGroupModal(preSelectedProjectId = '') {
        // 1. Initialize Bootstrap Modal if it doesn't exist
        if (!groupModalInstance) {
            groupModalInstance = new bootstrap.Modal(document.getElementById('modal-group-manager'), {
                keyboard: true // Enables ESC to close natively
            });

            // When modal closes, forcefully update the Parts UI so new groups appear
            document.getElementById('modal-group-manager').addEventListener('hidden.bs.modal', function () {
                // Also trigger handleProjectChange to refresh the specific part-group dropdown 
                // without wiping out what the user was currently doing
                if (typeof handleProjectChange === 'function') handleProjectChange();
                if (typeof renderPartsTable === 'function') renderPartsTable();
            });
        }

        // 2. Populate the Project Dropdown
        const projSelect = document.getElementById('modal-group-project-select');
        projSelect.innerHTML = '<option value="" disabled selected>Select a Project...</option>';
        if (appState.projects) {
            appState.projects.forEach(p => {
                projSelect.innerHTML += `<option value="${p.id}">${safeHTML(p.name)}</option>`;
            });
        }

        // 3. Set Context (Pre-select or stay blank)
        if (preSelectedProjectId) {
            projSelect.value = preSelectedProjectId;
        } else {
            projSelect.value = ""; // Force it to stay on "Select a Project..."
        }

        renderGroupModalTable();
        groupModalInstance.show();

        // Bonus UX: Auto-focus the text input when modal opens (needs a tiny delay for the animation)
        setTimeout(() => {
            document.getElementById('modal-new-group-name').focus();
        }, 400);
    }

    function renderGroupModalTable() {
        const tbody = document.getElementById('table-modal-groups-body');
        tbody.innerHTML = '';
        
        const activeProjectId = document.getElementById('modal-group-project-select').value;
        if (!activeProjectId) return;

        if (!appState.groups) appState.groups = [];

        // Filter groups for the active project
        const projectGroups = appState.groups.filter(g => g.projectId === activeProjectId);

        if (projectGroups.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted py-3">No groups defined.</td></tr>';
            return;
        }

        projectGroups.forEach(grp => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(grp.name)}" 
                           onchange="updateGroupName('${grp.id}', this.value)"
                           title="Tap to edit">
                </td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm py-0 px-2 text-danger" onclick="deleteGroup('${grp.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function handleAddGroup(event) {
        event.preventDefault();
        const activeProjectId = document.getElementById('modal-group-project-select').value;
        const nameInput = document.getElementById('modal-new-group-name');
        
        if (!activeProjectId) {
            showToast('Please select a project first.', true);
            return;
        }

        if (!appState.groups) appState.groups = [];
        
        appState.groups.push({
            id: 'GRP-' + Date.now(),
            projectId: activeProjectId,
            name: nameInput.value
        });
        
        saveState();
        renderGroupModalTable();
        nameInput.value = ''; // Clear input
        nameInput.focus();
    }

    function updateGroupName(id, newName) {
        const grp = appState.groups.find(g => g.id === id);
        if (grp) {
            grp.name = newName;
            saveState();
            showToast('Group renamed.');
        }
    }

    function deleteGroup(id) {
        if (!confirm("Delete this group? All parts in this group will be reset to 'no group'.")) return;

        // 1. Cascade Nullify: Reset parts using this group
        let affectedParts = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.groupId === id) {
                    part.groupId = ''; // Snap back to 'no group'
                    affectedParts++;
                }
            });
        }

        // 2. Delete the group
        appState.groups = appState.groups.filter(g => g.id !== id);
        saveState();
        renderGroupModalTable();
        
        showToast(`Group deleted. ${affectedParts} part(s) reset to 'no group'.`, true);
    }

    // ==========================================
    // STOCK MANAGER LOGIC
    // ==========================================

    function handleStockCategoryChange() {
        const cat = document.getElementById('stock-category').value;
        const profSelect = document.getElementById('stock-profile');
        const matSelect = document.getElementById('stock-material');
        const lengthInput = document.getElementById('stock-length');
        const widthInput = document.getElementById('stock-width');
        const grainSelect = document.getElementById('stock-grain');
        
        // Reset and enable
        profSelect.innerHTML = '<option value="" disabled selected>Select...</option>';
        matSelect.innerHTML = '<option value="" disabled selected>Select...</option>';
        profSelect.disabled = false;
        matSelect.disabled = false;
        lengthInput.disabled = false;
        
        // Filter and Populate Profile Dropdown
        if (appState.profiles) {
            appState.profiles.filter(p => p.type === cat).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                profSelect.appendChild(opt);
            });
        }
        
        // Filter and Populate Material Dropdown
        if (appState.materials) {
            appState.materials.filter(m => m.category === cat).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                matSelect.appendChild(opt);
            });
        }

        // Toggle Width and Grain based on category physics
        if (cat === 'sheet') {
            widthInput.disabled = false;
            widthInput.required = true;
            grainSelect.disabled = false;
        } else {
            widthInput.disabled = true;
            widthInput.required = false;
            widthInput.value = '';
            grainSelect.disabled = true;
            grainSelect.value = 'none';
        }
    }

    function populateStockDropdowns() {
        // Only refresh if a category is already selected
        if (document.getElementById('stock-category').value) {
            handleStockCategoryChange();
        }
    }

    function handleAddStock(event) {
        event.preventDefault();
        
        const category = document.getElementById('stock-category').value;
        const lengthInput = parseToBaseUnit(document.getElementById('stock-length').value);
        const widthInput = category === 'sheet' ? parseToBaseUnit(document.getElementById('stock-width').value) : 0;
        
        if (!appState.stock) appState.stock = [];

        appState.stock.push({
            id: 'STK-' + Date.now(),
            categoryId: category,
            profileId: document.getElementById('stock-profile').value,
            materialId: document.getElementById('stock-material').value,
            qty: parseInt(document.getElementById('stock-qty').value, 10),
            length: lengthInput,
            width: widthInput,
            grain: document.getElementById('stock-grain').value,
            isCutoff: document.getElementById('stock-is-cutoff').checked
        });
        
        saveState();
        renderStockTable();
        showToast('Item added to Shop Stock.');
        
        // Reset form but keep category to allow rapid entry
        document.getElementById('stock-length').value = '';
        document.getElementById('stock-width').value = '';
        document.getElementById('stock-qty').value = '1';
        document.getElementById('stock-is-cutoff').checked = false;
    }

    function updateStock(id, field, newValue) {
        const item = appState.stock.find(s => s.id === id);
        if (item) {
            item[field] = (field === 'qty') ? parseInt(newValue, 10) : newValue;
            saveState();
            renderStockTable();
        }
    }

    function deleteStock(id) {
        if (!confirm("Remove this item from your stock?")) return;
        appState.stock = appState.stock.filter(s => s.id !== id);
        saveState();
        renderStockTable();
        showToast('Item removed from stock.');
    }
</script>
