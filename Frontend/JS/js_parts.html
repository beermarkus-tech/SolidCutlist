<script>
    /**
     * Frontend/JS/js_parts.html
     * Handles dynamic form logic, math calculations, and part CRUD operations.
     */

    // --- INITIALIZATION ---
    
    // Call this when the app boots or when navigating to the Parts view
    function renderPartsView() {
        populateProjectDropdown();
        renderPartsTable();
    }

    function populateProjectDropdown() {
        const projSelect = document.getElementById('part-project');
        projSelect.innerHTML = '<option value="" disabled selected>Select Project...</option>';
        
        if (!appState.projects || appState.projects.length === 0) return;

        appState.projects.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.innerText = p.name;
            projSelect.appendChild(opt);
        });
    }

    // --- DYNAMIC FORM ENGINE ---

    // Forces the Parts form to refresh its dropdowns if the dictionaries or units change
    function refreshPartsDropdowns() {
        populateProjectDropdown();
        
        const cat = document.getElementById('part-category').value;
        if (!cat) return; // If no category is selected yet, do nothing.

        const profSelect = document.getElementById('part-profile');
        const matSelect = document.getElementById('part-material');

        // 🪄 1. MEMORIZE current selections before wiping the HTML
        const currentProfId = profSelect.value;
        const currentMatId = matSelect.value;

        // 🪄 2. REBUILD Profile Dropdown
        profSelect.innerHTML = '<option value="" disabled selected>Select...</option>';
        const filteredProfiles = appState.profiles.filter(p => p.type === cat);
        filteredProfiles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.innerText = p.name;
            profSelect.appendChild(opt);
        });

        // 🪄 3. REBUILD Material Dropdown
        matSelect.innerHTML = '<option value="" disabled selected>Select...</option>';
        const filteredMaterials = appState.materials.filter(m => m.category === cat);
        filteredMaterials.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.innerText = m.name;
            matSelect.appendChild(opt);
        });

        // 🪄 4. RESTORE the memorized selections (so the user doesn't lose their place)
        if (currentProfId) profSelect.value = currentProfId;
        if (currentMatId) matSelect.value = currentMatId;
    }

    // Fires when the user selects Lumber, Sheet, or Fastener
    function handleCategoryChange() {
        const cat = document.getElementById('part-category').value;
        const widthInput = document.getElementById('part-width');
        const lengthInput = document.getElementById('part-length');
        const profSelect = document.getElementById('part-profile');
        const matSelect = document.getElementById('part-material');
        const profLabel = document.getElementById('label-part-profile');
        const grainSelect = document.getElementById('part-grain');

        // 1. Reset inputs
        widthInput.value = '';
        lengthInput.value = '';
        profSelect.innerHTML = '<option value="" disabled selected>Select...</option>';
        matSelect.innerHTML = '<option value="" disabled selected>Select...</option>';
        
        // 2. Lock/Unlock based on Category Physics
        if (cat === 'lumber') {
            widthInput.disabled = true;   // Width comes from the profile
            lengthInput.disabled = false;
            profLabel.innerText = 'Profile';
            grainSelect.disabled = true;  // 🪄 ADD THIS
            grainSelect.value = 'none';   // 🪄 ADD THIS
        } else if (cat === 'sheet') {
            widthInput.disabled = false;  // Sheets need both W and L
            lengthInput.disabled = false;
            profLabel.innerText = 'Thickness';
            grainSelect.disabled = false; // 🪄 ADD THIS
        } else if (cat === 'fastener') {
            widthInput.disabled = true;   
            lengthInput.disabled = true;
            profLabel.innerText = 'Type / Size';
        }

        // 3. Populate Profile Dropdown (Filtered by Category)
        const filteredProfiles = appState.profiles.filter(p => p.type === cat);
        const unitText = appState.settings.displayUnit === 'mm' ? 'mm' : 'in'; // Get current global unit
        
        filteredProfiles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            // 🪄 Dynamically format dimensions and append the correct unit text
            opt.innerText = `${p.name}`;
            profSelect.appendChild(opt);
        });

        // 4. Populate Material Dropdown (Filtered by Category)
        const filteredMaterials = appState.materials.filter(m => m.category === cat);

        filteredMaterials.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.innerText = m.name;
            matSelect.appendChild(opt);
        });

        // 5. Unlock the rest of the form
        profSelect.disabled = false;
        matSelect.disabled = false;
        document.getElementById('btn-add-part').disabled = false; // 🪄 UNLOCK THE ADD BUTTON
    }

    // --- CRUD OPERATIONS ---

    function handleAddPart(event) {
        event.preventDefault();

        const projId = document.getElementById('part-project').value;
        const groupId = document.getElementById('part-group').value;
        const cat = document.getElementById('part-category').value;
        const nameInput = document.getElementById('part-name');
        const qtyInput = document.getElementById('part-qty');
        const widthInput = document.getElementById('part-width');
        const lengthInput = document.getElementById('part-length');
        const profId = document.getElementById('part-profile').value;
        const matId = document.getElementById('part-material').value;

        const newPart = {
            id: 'PART-' + Date.now(),
            projectId: projId,
            groupId: groupId,
            category: cat,
            name: nameInput.value,
            qty: parseInt(qtyInput.value) || 1,
            width: parseToBaseUnit(widthInput.value) || 0,
            length: parseToBaseUnit(lengthInput.value) || 0,
            grain: document.getElementById('part-grain').value, // 🪄 NEW
            profileId: profId,
            materialId: matId
        };

        // Initialize array if it doesn't exist
        if (!appState.parts) appState.parts = [];
        
        appState.parts.unshift(newPart);
        saveState();
        renderPartsTable();
        showToast('Part added to cutlist.');

        // BATCH ENTRY LOOP: Clear only what needs to be cleared
        nameInput.value = '';
        lengthInput.value = '';
        if (cat === 'sheet') widthInput.value = '';
        qtyInput.value = 1;
                
        // Snap focus back to name so you can keep typing
        nameInput.focus();
    }

    function updatePartsMetricMode() {
        const mode = document.getElementById('table-parts-metric-view').value;
        if (!appState.settings) appState.settings = {};
        appState.settings.partsMetricMode = mode;
        saveState();
        renderPartsTable();
    }

    function renderPartsTable() {
        const tbody = document.getElementById('table-parts-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        // 🪄 1. Initialize the running totals
        let totalVisibleQty = 0;
        let totalVisibleWeightKg = 0;
        let totalVisibleCost = 0;

        // Retrieve the saved user preference (or default to weight)
        const metricMode = (appState.settings && appState.settings.partsMetricMode) ? appState.settings.partsMetricMode : 'weight';
        const metricDropdown = document.getElementById('table-parts-metric-view');
        if (metricDropdown) metricDropdown.value = metricMode;
        const currencySymbol = (appState.settings && appState.settings.currency) ? appState.settings.currency : '$';

        if (!appState.parts || appState.parts.length === 0) {
            // Updated colspan to match the new number of headers
            tbody.innerHTML = '<tr><td colspan="11" class="text-center py-4 text-muted">No parts added yet.</td></tr>';
            return;
        }

        appState.parts.forEach(part => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(part, 'parts')) return;

            const tr = document.createElement('tr');
            
            // Relational Lookups (Moved up so we can use them for validation)
            const proj = appState.projects.find(p => p.id === part.projectId);
            const prof = appState.profiles.find(p => p.id === part.profileId);
            const mat = appState.materials.find(m => m.id === part.materialId);

            // 🪄 1. EVALUATE STATUS & COLOR THE ROW (Reality Check Standard)
            const isReady = prof && mat; // Only true if the objects actually exist in the dictionary
            part.status = isReady ? 'ready' : 'needs_mapping'; 
            
            if (!isReady) {
                tr.classList.add('table-warning'); 
            }
            
            // 🪄 2. INLINE DROPDOWNS & WARNINGS
            let projOptions = '<option value="" disabled>Select...</option>';
            appState.projects.forEach(p => {
                projOptions += `<option value="${p.id}" ${p.id === part.projectId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
            });

            // Profile Dropdown with ⚠️ Warning
            let profOptions = !prof ? `<option value="" disabled selected>⚠️ Select Profile...</option>` : '';
            const filteredProfiles = appState.profiles.filter(p => p.type === part.category);
            filteredProfiles.forEach(p => {
                const unitText = appState.settings.displayUnit === 'mm' ? 'mm' : 'in';
                const dimLabel = `${formatForDisplay(p.thickness)} x ${formatForDisplay(p.width)} ${unitText}`;
                profOptions += `<option value="${p.id}" ${p.id === part.profileId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
            });

            // Material Dropdown with ⚠️ Warning
            let matOptions = !mat ? `<option value="" disabled selected>⚠️ Select Material...</option>` : '';
            const filteredMaterials = appState.materials.filter(m => m.category === part.category);
            filteredMaterials.forEach(m => {
                matOptions += `<option value="${m.id}" ${m.id === part.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`;
            });

            // 🪄 NEW: Filter Groups for this specific row's Project
            let groupOptions = '<option value="">-</option>';
            if (appState.groups) {
                const rowGroups = appState.groups.filter(g => g.projectId === part.projectId);
                rowGroups.forEach(g => {
                    groupOptions += `<option value="${g.id}" ${g.id === part.groupId ? 'selected' : ''}>${safeHTML(g.name)}</option>`;
                });
            }

            // 🪄 3. DIMENSIONS LOGIC
            const displayW = part.category === 'lumber' ? formatForDisplay(prof ? prof.width : 0) : formatForDisplay(part.width);
            const displayL = formatForDisplay(part.length);
            
            let dimHtml = '';
            if (part.category === 'lumber') {
                dimHtml = `<input type="text" class="form-control form-control-sm border-0 bg-transparent text-center mx-auto py-0" style="width: 60px;"
                           value="${displayL}" onchange="updatePart('${part.id}', 'length', this.value)" title="Tap to edit length">
                `;
            } else if (part.category === 'sheet') {
                dimHtml = `
                    <div class="d-flex align-items-baseline justify-content-center gap-1">
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0 py-0" style="width: 60px;"
                            value="${displayW}" onchange="updatePart('${part.id}', 'width', this.value)" title="Tap to edit width">
                        <span class="text-muted text-sm px-1">x</span>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-left px-0 py-0" style="width: 60px;"
                            value="${displayL}" onchange="updatePart('${part.id}', 'length', this.value)" title="Tap to edit length">
                    </div>
                `;
            } else {
                dimHtml = `<span class="text-muted">-</span>`;
            }

            // 🪄 4. DUAL ENGINE: WEIGHT & ESTIMATED COST
            let displayMetric = '-';
            let rowWeightKg = 0; 
            let rowCost = 0;
            const rowQty = parseInt(part.qty) || 1;
            const trueWidth = part.category === 'lumber' ? (prof ? prof.width : 0) : (part.width || 0);
            
            // --- A. Weight Math ---
            if (part.category !== 'fastener' && prof && mat) {
                const safeThick = prof.thickness || 0;
                const volumeM3 = ((part.length || 0) * trueWidth * safeThick) / 1000000000;
                rowWeightKg = volumeM3 * (mat.density || 0) * rowQty; 
            }

            // --- B. Average Cost Math ---
            if (part.category !== 'fastener' && appState.catalog && appState.catalog.length > 0) {
                // Find all matching items in the catalog
                const matchingItems = appState.catalog.filter(c => 
                    c.categoryId === part.category && 
                    c.profileId === part.profileId && 
                    c.materialId === part.materialId
                );

                if (matchingItems.length > 0) {
                    let totalNormalizedPrice = 0;
                    
                    // Convert every matching item into a "Price per millimeter" (or mm² for sheets)
                    matchingItems.forEach(catItem => {
                        const baseCost = calculateCostPerPiece(catItem); // Native base cost
                        if (part.category === 'sheet') {
                            const catArea = catItem.length * catItem.width;
                            if (catArea > 0) totalNormalizedPrice += (baseCost / catArea);
                        } else {
                            if (catItem.length > 0) totalNormalizedPrice += (baseCost / catItem.length);
                        }
                    });

                    // Average the price per unit
                    const avgPricePerUnit = totalNormalizedPrice / matchingItems.length;

                    // Apply the average back to our specific Part geometry
                    if (part.category === 'sheet') {
                        const partArea = part.length * trueWidth;
                        rowCost = avgPricePerUnit * partArea * rowQty;
                    } else {
                        rowCost = avgPricePerUnit * part.length * rowQty;
                    }
                }
            }

            // --- C. Format the Visual Output based on user selection ---
            if (metricMode === 'cost') {
                if (rowCost > 0) {
                    displayMetric = `<small>${currencySymbol}${rowCost.toFixed(2)}</small>`;
                } else {
                    displayMetric = `<small class="text-muted opacity-50">No Data</small>`;
                }
            } else {
                if (rowWeightKg > 0) {
                    const isMetric = appState.settings.displayUnit === 'mm';
                    const finalWeight = isMetric ? rowWeightKg : (rowWeightKg * 2.20462);
                    const weightUnit = isMetric ? 'kg' : 'lbs';
                    displayMetric = `<small>${finalWeight.toFixed(2)} ${weightUnit}</small>`;
                }
            }

            // 🪄 ADD TO RUNNING TOTALS
            totalVisibleQty += rowQty;
            totalVisibleWeightKg += rowWeightKg;
            totalVisibleCost += rowCost;

            // COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(part.category);

            // 🪄 NEW: INLINE GRAIN DROPDOWN
            let grainHtml = '<span class="text-muted">-</span>';
            if (part.category === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center" style="width: 75px;" onchange="updatePart('${part.id}', 'grain', this.value)" title="Change Grain">
                        <option value="none" ${part.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${part.grain === 'length' ? 'selected' : ''}>Length</option>
                        <option value="width" ${part.grain === 'width' ? 'selected' : ''}>Width</option>
                    </select>
                `;
            }

            // 🪄 5. BUILD THE ROW
            tr.innerHTML = `
                <td class="p-0 px-1">
                    <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updatePart('${part.id}', 'projectId', this.value)">
                        ${projOptions}
                    </select>
                </td>
                <td class="p-0 px-1">
                    <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updatePart('${part.id}', 'groupId', this.value)">
                        ${groupOptions}
                    </select>
                </td>
                <td class="p-0 px-1">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1" 
                           value="${safeHTML(part.name)}" 
                           onchange="updatePart('${part.id}', 'name', this.value)" title="Tap to edit">
                </td>
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${part.category === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${part.category === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${part.category === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                </td>
                <td class="p-0 px-1">
                    <div class="d-flex justify-content-center">
                        <input type="number" class="form-control form-control-sm border-0 bg-transparent text-center px-0" style="width: 40px;"
                           value="${part.qty}" min="1"
                           onchange="updatePart('${part.id}', 'qty', this.value)" title="Tap to edit">
                    </div>
                </td>
                <td class="p-0 px-1">
                    <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 align-middle text-center" onchange="updatePart('${part.id}', 'profileId', this.value)" title="Tap to edit Profile">
                        ${profOptions}
                    </select>
                </td>
                <td class="text-center p-0 px-1 align-middle">${dimHtml}</td>
                <td class="p-0 px-1">
                    <select class="text-center form-select form-select-sm border-0 bg-transparent px-0 py-0" onchange="updatePart('${part.id}', 'materialId', this.value)" title="Tap to edit Material">
                        ${matOptions}
                    </select>
                </td>
                <td class="p-0 px-1 align-middle text-center">${grainHtml}</td>
                <td class="p-0 px-1 text-center">${displayMetric}</td>
                 
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('parts', '${part.id}')" title="Duplicate Row">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deletePart('${part.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        const filterColumns = ['projectId', 'groupId', 'category', 'profileId', 'materialId', 'grain'];
        const hasAnyFilter = updateFilterUI('parts', filterColumns);

        // 🪄 UPDATE THE STICKY FOOTER TOTALS
        const tfootQty = document.getElementById('tfoot-parts-qty');
        const tfootWeight = document.getElementById('tfoot-parts-weight');
        const tfootMetric = document.getElementById('tfoot-parts-metric');
        
        if (tfootQty) {
            tfootQty.innerText = totalVisibleQty;
        }

        if (tfootMetric) {
            if (metricMode === 'cost') {
                tfootMetric.innerText = `${currencySymbol}${totalVisibleCost.toFixed(2)}`;
            } else {
                const isMetric = appState.settings.displayUnit === 'mm';
                const finalTotalWeight = isMetric ? totalVisibleWeightKg : (totalVisibleWeightKg * 2.20462);
                const weightUnit = isMetric ? 'kg' : 'lbs';
                tfootMetric.innerText = `${finalTotalWeight.toFixed(1)} ${weightUnit}`;
            }
        }

    }

    function updatePartCategory(partId, newCategory) {
        const part = appState.parts.find(p => p.id === partId);
        if (part) {
            part.category = newCategory;
            // 🪄 WIPE invalid profiles, materials, and width when physics change
            part.profileId = '';
            part.materialId = '';
            part.width = 0; 
            
            saveState();
            renderPartsTable(); 
            showToast('Category changed. Please re-select Profile and Material.');
        }
    }

    function updatePart(partId, field, newValue) {
        const part = appState.parts.find(p => p.id === partId);
        if (part) {
            if (field === 'width' || field === 'length') {
                // Run dimensions through the fractional math engine
                part[field] = parseToBaseUnit(newValue) || 0;
            } else if (field === 'qty') {
                part[field] = parseInt(newValue) || 1;
            } else if (field === 'projectId') {
                part.projectId = newValue;
                part.groupId = ''; 
                showToast('Project changed. Group reset to "-".');
            } else {
                part[field] = newValue; // For text like Name
            }
            
            saveState();
            renderPartsTable();
            showToast('Part updated.');
        }
    }
    
    function deletePart(id, isConfirmed = false) {
        // The Safety Shield
        if (!isConfirmed) {
            requestConfirm("Delete this part?", () => deletePart(id, true));
            return; 
        }

        appState.parts = appState.parts.filter(p => p.id !== id);
        saveState();
        renderPartsTable();
        showToast('Part removed.', true);
    }

    function handleProjectChange() {
        const projId = document.getElementById('part-project').value;
        const groupSelect = document.getElementById('part-group');
        
        // 🪄 1. MEMORIZE the current selection
        const currentGroupId = groupSelect.value;
        
        // 2. Reset to default
        groupSelect.innerHTML = '<option value="">-</option>';
        
        // 3. Populate filtered groups
        if (projId && appState.groups) {
            const projectGroups = appState.groups.filter(g => g.projectId === projId);
            projectGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.name;
                groupSelect.appendChild(opt);
            });
        }
        
        // 🪄 4. RESTORE the selection so the user doesn't lose their place
        if (currentGroupId) {
            groupSelect.value = currentGroupId;
        }
    }

    function openGroupModalFromParts() {
        const currentProjId = document.getElementById('part-project').value;
        // Pass the ID if one is selected, otherwise pass the empty string
        if (typeof openGroupModal === 'function') openGroupModal(currentProjId);
    }

    // ==========================================
    // PARTS PRINT ENGINE
    // ==========================================
    function printPartsTable() {
        // Fallback to '$' / 'letter' if currency setting isn't explicitly set yet
        const currency = (appState.settings && appState.settings.currency) ? appState.settings.currency : '$';
        const pageSize = (currency === '$') ? 'letter' : 'A4';

        let printWindow = window.open('', '_blank');
        if (!printWindow) {
            showToast('Please allow popups to print.', true);
            return;
        }

        // 1. Build the Static Table Rows
        let rowsHtml = '';
        
        if (!appState.parts || appState.parts.length === 0) {
            rowsHtml = '<tr><td colspan="9" class="text-center py-4">No parts added yet.</td></tr>';
        } else {
            appState.parts.forEach(part => {
                // 🪄 CRITICAL: Only print rows that pass the current active filters!
                if (typeof rowPassesFilters === 'function' && !rowPassesFilters(part, 'parts')) return;

                // Relational lookups to get human-readable names
                const projName = appState.projects.find(p => p.id === part.projectId)?.name || '-';
                const groupName = appState.groups?.find(g => g.id === part.groupId)?.name || '-';
                const prof = appState.profiles.find(p => p.id === part.profileId);
                const matName = appState.materials.find(m => m.id === part.materialId)?.name || '-';
                const profName = prof ? prof.name : '-';
                
                // Format Dimensions beautifully for paper
                const displayW = part.category === 'lumber' ? formatForDisplay(prof ? prof.width : 0) : formatForDisplay(part.width);
                const displayL = formatForDisplay(part.length);
                let dimText = '-';
                
                if (part.category === 'lumber') {
                    dimText = displayL;
                } else if (part.category === 'sheet') {
                    dimText = `${displayW} x ${displayL}`;
                }

                // Format Grain
                let grainText = '-';
                if (part.category === 'sheet' && part.grain && part.grain !== 'none') {
                    // Capitalize the first letter (Length / Width)
                    grainText = part.grain.charAt(0).toUpperCase() + part.grain.slice(1);
                }

                rowsHtml += `
                    <tr>
                        <td>${projName}</td>
                        <td><small class="text-muted">${groupName}</small></td>
                        <td><strong>${part.name || '-'}</strong></td>
                        <td>${part.category.charAt(0).toUpperCase() + part.category.slice(1)}</td>
                        <td class="text-center"><strong>${part.qty}</strong></td>
                        <td class="text-center">${dimText}</td>
                        <td>${profName}</td>
                        <td>${matName}</td>
                        <td class="text-center">${grainText}</td>
                    </tr>
                `;
            });
        }

        // 2. Assemble the Table
        let htmlContent = `
            <h3 class="border-bottom border-2 border-dark pb-2 mb-4">🪵 Master Partlist</h3>
            <table class="table table-sm table-striped">
                <thead>
                    <tr>
                        <th>Project</th>
                        <th>Group</th>
                        <th>Part Name</th>
                        <th>Category</th>
                        <th class="text-center">Qty</th>
                        <th class="text-center">Dimensions</th>
                        <th>Profile</th>
                        <th>Material</th>
                        <th class="text-center">Grain</th>
                    </tr>
                </thead>
                <tbody>
                    ${rowsHtml}
                </tbody>
            </table>
        `;

        // 3. Wrap in the Ink-Saver Print Shell
        let finalHtml = `
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <title>Parts Printout</title>
                <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
                <style>
                    @page { size: ${pageSize} landscape; margin: 15mm; }
                    
                    /* Ink-Saver Overrides */
                    body { font-family: Arial, sans-serif; background: #fff !important; color: #000 !important; font-size: 13px; }
                    
                    .table { margin-bottom: 0 !important; width: 100%; border-collapse: collapse; }
                    .table th { background-color: #f8f9fa !important; color: #000 !important; border-bottom: 2px solid #000 !important; font-size: 12px; text-transform: uppercase;}
                    .table td, .table th { border-color: #ccc !important; padding: 6px 8px; vertical-align: middle; }
                    
                    /* Force alternating stripe color in print mode */
                    .table-striped tbody tr:nth-of-type(odd) { background-color: #f4f4f4 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                </style>
            </head>
            <body>
                <div class="container-fluid pt-2">
                    ${htmlContent}
                </div>
                <script>
                    window.onload = function() {
                        setTimeout(function() { window.print(); }, 300);
                    };
                <\/script>
            </body>
            </html>
        `;

        printWindow.document.write(finalHtml);
        printWindow.document.close();
    }

</script>
