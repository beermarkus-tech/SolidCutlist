<script>
    /**
     * Frontend/JS/js_main.html
     * Handles UI state, View navigation, and global UI helpers (like Toasts).
     */

    // ==========================================
    // GLOBAL APP STATE
    // ==========================================

    const initialAppState = {
    
    // ==========================================

    // 1. Materials (Wood species, treatments)
    materials: [
        // { id: 'M-001', name: 'Pine (Untreated)', density: 0.45, category: 'lumber' },
        // { id: 'M-002', name: 'Oak (White)', density: 0.77, category: 'lumber' },
        // { id: 'M-003', name: 'Birch Plywood', density: 0.68, category: 'sheet' }
    ],

    // 2. Profiles (Cross-sections and sheet thicknesses. NO LENGTHS HERE)
    profiles: [
        // { id: 'PR-001', name: '2x4 Nominal', thickness: 38.0, width: 89.0, type: 'lumber' },
        // { id: 'PR-002', name: '3/4" Sheet', thickness: 19.05, width: 1220.0, type: 'sheet' }
    ],

    // ==========================================
    // TIER 2: SOURCING & INVENTORY (Physical Reality)
    // ==========================================

    // 3. Catalog (What stores sell, lengths, and prices)
    catalog: [
        // { id: 'CAT-001', store: 'Local Big Box', materialId: 'M-001', profileId: 'PR-001', length: 2438.4, price: 4.50 },
        // { id: 'CAT-002', store: 'Local Big Box', materialId: 'M-001', profileId: 'PR-001', length: 3048.0, price: 6.00 }
    ],

    // 4. Stock (What is actually sitting in your shop right now)
    stock: [
        // { id: 'STK-001', materialId: 'M-002', profileId: 'PR-001', length: 950.0, qty: 2, isCutoff: true }
    ],

    // ==========================================
    // TIER 3: THE WORK (Projects & Cutlists)
    // ==========================================

    // 0. Projects
    projects: [
        // { id: 'PROJ-001', name: 'Workbench', status: 'Design' }
    ],

    // 0.5 Groups (Sub-assemblies attached to Projects)
    groups: [
        // { id: 'GRP-001', projectId: 'PROJ-001', name: 'South Wall' }
    ],
    
    // 5. Parts (The Master Cutlist - every piece of wood to be cut)
    parts: [
        // { id: 'PART-001', projectId: 'PROJ-001', name: 'Front Left Leg', materialId: 'M-001', profileId: 'PR-001', length: 850.0, qty: 1 }
    ],

    // Settings
    settings: {
        baseUnit: 'mm',           // The immutable backend unit
        displayUnit: 'frac_in',   // The UI mask: 'mm', 'dec_in', or 'frac_in'
        bladeKerf: 3.175,         // mm (Default to 1/8" standard blade)
        cutoffThreshold: 200.0,    // mm. Anything smaller goes in the trash.
        factoryEdgeTrim: 6.35     // mm. Amount to chop off a new board to square it up.
    }
    };

    // We will use this global variable to hold the active data while the app runs.
    // This is our Single Source of Truth for the UI.
    let appState = {}; 

    // ==========================================
    // STATE MANAGEMENT ENGINE (Local Storage)
    // ==========================================

    /**
     * Loads the state from localStorage. 
     * If no state exists (first time user or cleared cache), it injects the initialAppState.
     */
     function loadState() {
        const savedState = localStorage.getItem('lumberLogicState');
        
        if (savedState) {
            try {
                appState = JSON.parse(savedState);
                console.log('SolidCutlist state loaded successfully.');
            } catch (e) {
                console.error('Data corruption detected.', e);
                initAppState();
            }
        } else {
            initAppState();
        }

        // 🪄 Apply the saved theme immediately before drawing the UI
        if (typeof applyTheme === 'function') applyTheme();

        // FIRE THE RENDERERS ON BOOT
        if (typeof renderSettings === 'function') renderSettings();
        if (typeof renderDictionaries === 'function') renderDictionaries();
        if (typeof renderPartsView === 'function') renderPartsView();
    }

    /**
     * Wipes current state and resets to the baseline initialAppState.
     * We use deep copy (JSON stringify/parse) so we don't accidentally mutate the original blueprint.
     */
    function initAppState() {
    appState = JSON.parse(JSON.stringify(initialAppState));
    saveState();
    }

    /**
     * Commits the current appState to the browser's localStorage.
     * Call this function anytime a user adds a material, part, or changes a setting.
     */
    function saveState() {
    localStorage.setItem('lumberLogicState', JSON.stringify(appState));
    console.log('Shop data instantly saved to local memory.');
    
    // Note: Phase 7 Debounced Cloud Sync trigger will eventually go here.
    }

    // ==========================================
    // MATH & UTILITY ENGINE
    // ==========================================

    /**
     * Prevents inch marks (") from breaking HTML input values
     */
     function safeHTML(str) {
        if (!str) return '';
        return String(str).replace(/"/g, '&quot;');
    }
    
    /**
     * Parses user UI input (string or number) into Base Units (decimal mm) for the AppState.
     * Safely handles "1 3/4", "1.75", or "44.45" based on the current Global Setting.
     */
     function parseToBaseUnit(input) {
        if (!input) return 0;
        let val = String(input).trim();
        let unit = appState.settings.displayUnit;
        let decimalInches = 0;

        if (unit === 'mm') {
            return parseFloat(val) || 0;
        }

        // If Fractional Inches
        if (unit === 'frac_in') {
            if (val.includes('/')) {
                let parts = val.split(' ');
                if (parts.length === 2) {
                    // It's a mixed fraction (e.g., "1 3/4")
                    let whole = parseFloat(parts[0]) || 0;
                    let frac = parts[1].split('/');
                    let num = parseFloat(frac[0]) || 0;
                    let den = parseFloat(frac[1]) || 1;
                    decimalInches = whole + (num / den);
                } else {
                    // It's just a fraction (e.g., "3/4")
                    let frac = val.split('/');
                    let num = parseFloat(frac[0]) || 0;
                    let den = parseFloat(frac[1]) || 1;
                    decimalInches = num / den;
                }
            } else {
                // It's just a whole number typed into the fraction setting (e.g., "2")
                decimalInches = parseFloat(val) || 0;
            }
            return decimalInches * 25.4; // Convert inches to mm
        }

        // If Decimal Inches
        if (unit === 'dec_in') {
            decimalInches = parseFloat(val) || 0;
            return decimalInches * 25.4;
        }

        return parseFloat(val) || 0; // Fallback
    }

    /**
     * Formats Base Units (decimal mm) from the AppState back into a user-friendly string.
     * Snaps fractional inches to the nearest 1/16th (Woodworking standard).
     */
    function formatForDisplay(mmValue) {
        let val = parseFloat(mmValue) || 0;
        let unit = appState.settings.displayUnit;

        if (unit === 'mm') {
            return (Math.round(val * 100) / 100).toString(); // Max 2 decimal places
        }

        let inches = val / 25.4;

        if (unit === 'dec_in') {
            return (Math.round(inches * 1000) / 1000).toString(); // Max 3 decimal places
        }

        if (unit === 'frac_in') {
            let whole = Math.floor(inches);
            let remainder = inches - whole;
            let denominator = 16; // Lock accuracy to 1/16th
            let numerator = Math.round(remainder * denominator);

            // Edge Case: perfectly whole number
            if (numerator === 0) {
                return whole > 0 ? whole.toString() : "0";
            }
            
            // Edge Case: rounded up to the next whole number (e.g., 16/16)
            if (numerator === denominator) {
                return (whole + 1).toString();
            }

            // Simplify the fraction (e.g., 8/16 becomes 1/2)
            while (numerator % 2 === 0 && denominator % 2 === 0) {
                numerator /= 2;
                denominator /= 2;
            }

            if (whole === 0) {
                return `${numerator}/${denominator}`;
            } else {
                return `${whole} ${numerator}/${denominator}`;
            }
        }
        
        return val.toString();
    }

    /**
     * Converts UI density input into Base kg/m³ for storage.
     */
     function parseDensityToBase(input) {
        let val = parseFloat(input) || 0;
        if (appState.settings.displayUnit === 'mm') return val; // Already kg/m³
        return val / 0.06242796; // Convert lb/ft³ back to kg/m³
    }

    /**
     * Formats Base kg/m³ into UI display density (kg/m³ or lb/ft³).
     */
    function formatDensityForDisplay(kgm3) {
        let val = parseFloat(kgm3) || 0;
        if (appState.settings.displayUnit === 'mm') return val.toFixed(2);
        return (val * 0.06242796).toFixed(2); // Convert to lb/ft³
    }

    // ==========================================
    // SORTING ENGINE
    // ==========================================

    // Tracks current sort directions (Ascending/Descending)
    const sortTracker = {};

    function handleSort(arrayName, key, type) {
        // Toggle sort direction
        const sortId = arrayName + '_' + key;
        sortTracker[sortId] = !sortTracker[sortId]; 
        const dir = sortTracker[sortId] ? 1 : -1;

        appState[arrayName].sort((a, b) => {
            let valA = a[key];
            let valB = b[key];

            // 🪄 Smart Lookups for Relational IDs and Dynamic Math
            if (arrayName === 'parts' || arrayName === 'stock' || arrayName === 'catalog') {
                if (key === 'storeId') {
                    valA = appState.stores?.find(s => s.id === a.storeId)?.name || '';
                    valB = appState.stores?.find(s => s.id === b.storeId)?.name || '';
                } else if (key === 'calculatedPrice' && arrayName === 'catalog') {
                    // Calculate dynamic normalized price on the fly for accurate sorting
                    const viewUnit = document.getElementById('table-price-view').value;
                    valA = parseFloat(getNormalizedPriceDisplay(a, viewUnit)) || 0;
                    valB = parseFloat(getNormalizedPriceDisplay(b, viewUnit)) || 0;
                } else if (key === 'projectId' && arrayName === 'parts') {
                    valA = appState.projects.find(p => p.id === a.projectId)?.name || '';
                    valB = appState.projects.find(p => p.id === b.projectId)?.name || '';
                } else if (key === 'profileId') {
                    valA = appState.profiles.find(p => p.id === a.profileId)?.name || '';
                    valB = appState.profiles.find(p => p.id === b.profileId)?.name || '';
                } else if (key === 'materialId') {
                    valA = appState.materials.find(m => m.id === a.materialId)?.name || '';
                    valB = appState.materials.find(m => m.id === b.materialId)?.name || '';
                } else if (key === 'weight' && arrayName === 'parts') {
                    // 🪄 Background Weight Calculation for Sorting
                    const getWeight = (p) => {
                        if (p.category === 'fastener') return 0;
                        const prof = appState.profiles.find(pr => pr.id === p.profileId);
                        const mat = appState.materials.find(m => m.id === p.materialId);
                        if (!prof || !mat) return 0;
                        const safeThick = prof.thickness || 0;
                        const trueWidth = p.category === 'lumber' ? (prof.width || 0) : p.width;
                        const volumeM3 = (p.length * trueWidth * safeThick) / 1000000000;
                        return volumeM3 * (mat.density || 0) * p.qty;
                    };
                    valA = getWeight(a);
                    valB = getWeight(b);
                }
            }
            
            // Clean up values based on type
            if (type === 'number') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
            } else {
                valA = String(valA || '').toLowerCase();
                valB = String(valB || '').toLowerCase();
            }

            // Execute Sort
            if (valA < valB) return -1 * dir;
            if (valA > valB) return 1 * dir;
            return 0;
        });

        saveState();

        // Trigger the correct redraw
        if (arrayName === 'projects') renderProjectsTable();
        if (arrayName === 'materials') renderMaterialsTable();
        if (arrayName === 'profiles') renderProfilesTable();
        if (arrayName === 'parts') renderPartsTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stagingParts') renderStagingTable();
        if (arrayName === 'groups' && typeof renderGroupModalTable === 'function') renderGroupModalTable();
        if (arrayName === 'stores' && typeof renderStoreModalTable === 'function') renderStoreModalTable();
    }

    // ==========================================
    // FILTER ENGINE
    // ==========================================

    // 1. The Global State Tracker
    // Remembers which checkboxes are ticked: e.g. { parts: { category: ['lumber'] } }
    let activeFilters = {};

    // 2. Open the Modal & Populate Data
    function openFilterModal(event, arrayName, columnKey, displayTitle) {
        // 🪄 CRITICAL: Stop the click from triggering a column sort!
        event.stopPropagation();

        // Ensure the tracker exists for this table
        if (!activeFilters[arrayName]) activeFilters[arrayName] = {};

        // Set hidden inputs and Title
        document.getElementById('filter-array-name').value = arrayName;
        document.getElementById('filter-column-key').value = columnKey;
        document.getElementById('filterModalTitle').innerText = `Filter: ${displayTitle}`;

        // Extract unique values from the database
        const uniqueValues = new Map(); // Use a Map to hold { rawValue: humanReadableText }

        appState[arrayName].forEach(row => {
            let rawValue = row[columnKey];
            let displayText = rawValue;

            // Handle Empty/Null
            if (rawValue === '' || rawValue === null || rawValue === undefined) {
                rawValue = '___EMPTY___';
                displayText = '(Blank)';
            } else {
                // 🪄 TRANSLATION DICTIONARY: Convert IDs to Human Readable Names
                if (columnKey === 'projectId') displayText = appState.projects.find(p => p.id === rawValue)?.name || 'Unknown Project';
                else if (columnKey === 'groupId') displayText = appState.groups.find(g => g.id === rawValue)?.name || 'Unknown Group';
                else if (columnKey === 'profileId') displayText = appState.profiles.find(p => p.id === rawValue)?.name || 'Unknown Profile';
                else if (columnKey === 'materialId') displayText = appState.materials.find(m => m.id === rawValue)?.name || 'Unknown Material';
                else if (columnKey === 'storeId') displayText = appState.stores?.find(s => s.id === rawValue)?.name || 'Unknown Store';
            }

            uniqueValues.set(rawValue, displayText);
        });

        // Sort alphabetically by the Human Readable text
        const sortedEntries = Array.from(uniqueValues.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1])));

        // Build the HTML Checkboxes
        const listContainer = document.getElementById('filter-checkbox-list');
        listContainer.innerHTML = '';

        const currentActive = activeFilters[arrayName][columnKey] || [];

        sortedEntries.forEach(([rawVal, displayTxt]) => {
            // If there's no active filter array, default to checking everything
            const isChecked = currentActive.length === 0 || currentActive.includes(rawVal);
            
            const div = document.createElement('div');
            div.className = 'form-check mb-1';
            div.innerHTML = `
                <input class="form-check-input filter-option-cb" type="checkbox" value="${safeHTML(rawVal)}" id="flt-${safeHTML(rawVal)}" ${isChecked ? 'checked' : ''}>
                <label class="form-check-label w-100" for="flt-${safeHTML(rawVal)}" style="cursor:pointer;">
                    ${safeHTML(displayTxt)}
                </label>
            `;
            listContainer.appendChild(div);
        });

        // Show the Modal
        const modal = new bootstrap.Modal(document.getElementById('universalFilterModal'));
        modal.show();
    }

    // 3. Modal Button Helpers
    function toggleAllFilters(checkThem) {
        document.querySelectorAll('.filter-option-cb').forEach(cb => cb.checked = checkThem);
    }

    function clearCurrentFilter() {
        toggleAllFilters(true); // Visually check all
        applyFilter(); // Applying with everything checked is the same as clearing it
    }

    // 4. Save the Filter & Redraw
    function applyFilter() {
        const arrayName = document.getElementById('filter-array-name').value;
        const columnKey = document.getElementById('filter-column-key').value;
        
        const checkboxes = document.querySelectorAll('.filter-option-cb');
        const checkedValues = [];
        let allChecked = true;

        checkboxes.forEach(cb => {
            if (cb.checked) checkedValues.push(cb.value);
            else allChecked = false;
        });

        if (!activeFilters[arrayName]) activeFilters[arrayName] = {};

        // If everything is checked, we don't need to filter at all. Remove it to save math.
        if (allChecked) {
            delete activeFilters[arrayName][columnKey];
        } else {
            activeFilters[arrayName][columnKey] = checkedValues;
        }

        // Hide Modal
        bootstrap.Modal.getInstance(document.getElementById('universalFilterModal')).hide();

        // 🪄 Trigger the correct redraw function
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        // Add other table render triggers here as needed...
    }

    // 5. The Gatekeeper (Called inside your render loops)
    function rowPassesFilters(row, arrayName) {
        if (!activeFilters[arrayName]) return true; // No filters active for this table

        for (const [columnKey, allowedValues] of Object.entries(activeFilters[arrayName])) {
            let cellValue = row[columnKey];
            if (cellValue === '' || cellValue === null || cellValue === undefined) cellValue = '___EMPTY___';
            
            // If the cell's value is NOT in the allowed list, kill the row immediately
            if (!allowedValues.includes(String(cellValue))) {
                return false; 
            }
        }
        return true; // Passed all active filters!
    }

    // 6. Global Master Clear Switch
    function clearAllFiltersForTable(arrayName) {
        if (activeFilters[arrayName]) {
            activeFilters[arrayName] = {}; // Wipe the filters clean for this table
        }
        
        // Trigger the redraw to bring all rows back instantly
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
    }

    // ==========================================
    // BOOT SEQUENCE
    // ==========================================
    // Initialize app when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        loadState();
    });

    // --- NAVIGATION ---
    function navigateTo(viewId) {
        // 1. Hide all views
        const views = document.querySelectorAll('.app-view');
        views.forEach(view => view.classList.add('d-none'));

        // 2. Show requested view
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.remove('d-none');

        // 3. Highlight the active nav button
        document.querySelectorAll('.nav-buttons-container .btn').forEach(btn => {
            btn.classList.remove('active', 'bg-light', 'text-dark', 'fw-bold');
        });
        const activeBtn = document.getElementById('nav-btn-' + viewId);
        if (activeBtn) activeBtn.classList.add('active', 'bg-light', 'text-dark', 'fw-bold');

        // 4. View-Specific Initializations 🪄 ADDED THIS BLOCK
        if (viewId === 'view-import') {
            renderImportView(); // Fills the project dropdown and resets the UI
        } else if (viewId === 'view-cutlist') {
            if (typeof renderOptimizerConfig === 'function') renderOptimizerConfig();
        }
    }

    // --- TOAST NOTIFICATIONS ---
    // Instead of ugly alert() boxes, we slide up a modern notification
    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        
        // Create the toast element
        const toastEl = document.createElement('div');
        toastEl.className = `toast align-items-center text-white border-0 ${isError ? 'bg-danger' : 'bg-success'}`;
        toastEl.setAttribute('role', 'alert');
        toastEl.setAttribute('aria-live', 'assertive');
        toastEl.setAttribute('aria-atomic', 'true');
        
        // Inner HTML of the toast
        toastEl.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        `;
        
        container.appendChild(toastEl);
        
        // Initialize and show using Bootstrap's JS API
        const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
        bsToast.show();
        
        // Clean up DOM after it hides
        toastEl.addEventListener('hidden.bs.toast', () => {
            toastEl.remove();
        });
    }

    /**
     * Returns the exact Bootstrap classes for a given category badge.
     * Centralizes color management so it can be updated in one place.
     * @param {string} category - The category name ('lumber', 'sheet', 'fastener')
     * @returns {string} The CSS class list for the badge.
     */
     function getCategoryBadgeClass(category) {
        const badgeMap = {
            lumber: 'bg-lumber text-white',
            sheet: 'bg-sheet text-dark',
            fastener: 'bg-fastener text-white'
        };

        // Return the mapped color, or fallback to the default gray if unknown
        return badgeMap[category] || 'bg-secondary text-white';
    }

    // ==========================================
    // THEME & DARK MODE LOGIC
    // ==========================================

    function toggleTheme() {
        const isDark = document.getElementById('setting-theme-toggle').checked;
        
        // Ensure settings object exists
        if (!appState.settings) appState.settings = {};
        
        // Save choice to database
        appState.settings.theme = isDark ? 'dark' : 'light';
        saveState();
        
        // Apply instantly
        applyTheme();
    }

    function applyTheme() {
        // Default to light if not set
        const theme = (appState.settings && appState.settings.theme) ? appState.settings.theme : 'light';
        
        // 1. Tell Bootstrap to flip the global component colors (tables, inputs, etc.)
        document.documentElement.setAttribute('data-bs-theme', theme);
        
        // 2. 🪄 The Bulletproof Background Fix: Manually swap the body classes
        if (theme === 'dark') {
            document.body.classList.remove('bg-light', 'bg-white');
            document.body.classList.add('bg-dark');
        } else {
            document.body.classList.remove('bg-dark');
            document.body.classList.add('bg-light'); 
        }
        
        // 3. Keep the switch UI perfectly synced with the data
        const toggle = document.getElementById('setting-theme-toggle');
        if (toggle) {
            toggle.checked = (theme === 'dark');
        }
    }
</script>
