<script>
    // ==========================================
    // GLOBAL APP STATE
    // ==========================================

    const initialAppState = {
    
    // ==========================================
    // TIER 1: THE DICTIONARIES (Design Building Blocks)
    // ==========================================
    
    // 1. Materials (Wood species, treatments)
    materials: [
        // { id: 'M-001', name: 'Pine (Untreated)', density: 0.45, category: 'lumber' },
        // { id: 'M-002', name: 'Oak (White)', density: 0.77, category: 'lumber' },
        // { id: 'M-003', name: 'Birch Plywood', density: 0.68, category: 'sheet' }
    ],

    // 2. Profiles (Cross-sections and sheet thicknesses. NO LENGTHS HERE)
    profiles: [
        // { id: 'PR-001', name: '2x4 Nominal', thickness: 38.0, width: 89.0, type: 'lumber' },
        // { id: 'PR-002', name: '3/4" Sheet', thickness: 19.05, width: 1220.0, type: 'sheet' }
    ],

    // ==========================================
    // TIER 2: SOURCING & INVENTORY (Physical Reality)
    // ==========================================

    // 3. Catalog (What stores sell, lengths, and prices)
    catalog: [
        // { id: 'CAT-001', store: 'Local Big Box', materialId: 'M-001', profileId: 'PR-001', length: 2438.4, price: 4.50 },
        // { id: 'CAT-002', store: 'Local Big Box', materialId: 'M-001', profileId: 'PR-001', length: 3048.0, price: 6.00 }
    ],

    // 4. Stock (What is actually sitting in your shop right now)
    stock: [
        // { id: 'STK-001', materialId: 'M-002', profileId: 'PR-001', length: 950.0, qty: 2, isCutoff: true }
    ],

    // ==========================================
    // TIER 3: THE WORK (Projects & Cutlists)
    // ==========================================

    // 0. Projects
    projects: [
        // { id: 'PROJ-001', name: 'Workbench', status: 'Design' }
    ],

    // 0.5 Groups (Sub-assemblies attached to Projects)
    groups: [
        // { id: 'GRP-001', projectId: 'PROJ-001', name: 'South Wall' }
    ],
    
    // 5. Parts (The Master Cutlist - every piece of wood to be cut)
    parts: [
        // { id: 'PART-001', projectId: 'PROJ-001', name: 'Front Left Leg', materialId: 'M-001', profileId: 'PR-001', length: 850.0, qty: 1 }
    ],

    // Settings
    settings: {
        baseUnit: 'mm',           // The immutable backend unit
        displayUnit: 'frac_in',   // The UI mask: 'mm', 'dec_in', or 'frac_in'
        bladeKerf: 3.175,         // mm (Default to 1/8" standard blade)
        cutoffThreshold: 200.0,    // mm. Anything smaller goes in the trash.
        factoryEdgeTrim: 6.35     // mm. Amount to chop off a new board to square it up.
    }
    };

    // We will use this global variable to hold the active data while the app runs.
    // This is our Single Source of Truth for the UI.
    let appState = {}; 

    // ==========================================
    // STATE MANAGEMENT ENGINE (Local Storage)
    // ==========================================

    /**
    * BOOT LOADER: Negotiates between Cloud Data and Local Storage
    */
    function loadState() {
        // 1. Show the loader (it should be visible by default, but just in case)
        const loader = document.getElementById('boot-loader');
        if (loader) loader.classList.remove('d-none');

        // 2. Fetch the offline backup (just in case the cloud fails or is older)
        const localSaved = localStorage.getItem('lumberLogicState');
        let localData = null;
        if (localSaved) {
            try { localData = JSON.parse(localSaved); } catch(e) { console.warn("Local data corrupted."); }
        }

        // 3. Call Google Scripts (The Cloud)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(responseStr) {
                    handleCloudDataResponse(responseStr, localData);
                })
                .withFailureHandler(function(error) {
                    console.error("Failed to fetch from cloud. Falling back to local.", error);
                    finalizeBoot(localData ? localData : initialAppState);
                })
                .getAppStateFromSheet();
        } else {
            // Failsafe for Local Desktop Testing (outside of Google's environment)
            console.warn("Google Script context not found. Booting from local memory.");
            finalizeBoot(localData ? localData : initialAppState);
        }
    }

    /**
     * The Handshake: Compares timestamps and resolves conflicts
     */
    function handleCloudDataResponse(responseStr, localData) {
        try {
            const response = JSON.parse(responseStr);
            if (response.status === 'error') throw new Error(response.message);

            const cloudData = response.appState;
            const cloudTime = response.cloud_timestamp || 0;
            const localTime = localData ? (localData.local_timestamp || 0) : 0;

            // 🪄 THE FAILSAFE: Local is more than 10 seconds newer than the Cloud
            if (localTime > cloudTime + 10000) {
                // We use a native browser confirm here because it physically halts the Javascript thread 
                // and prevents the app from rendering bad data while the user decides.
                const useLocal = confirm(t('msg_unsaved_local_changes'));

                if (useLocal) {
                    finalizeBoot(localData);
                } else {
                    finalizeBoot(cloudData);
                }
            } else {
                // Cloud is newer, or perfectly equal. Proceed normally.
                finalizeBoot(cloudData);
            }
        } catch(e) {
            console.error("Cloud data parsing error:", e);
            alert(t('err_cloud_parse'));
            finalizeBoot(localData ? localData : initialAppState);
        }
    }

    /**
     * Executes the final render sequence and hides the loading screen
     */
     function finalizeBoot(dataToLoad) {
        // 1. Assign the Master State safely
        appState = dataToLoad || {};
        
        // 🪄 TIER 1 SANITIZER: Ensure all master tables exist
        const TABS = ['projects', 'groups', 'parts', 'stock', 'catalog', 'materials', 'profiles', 'stores'];
        TABS.forEach(tab => {
            if (!appState[tab] || !Array.isArray(appState[tab])) appState[tab] = [];
        });

        // 🪄 TIER 2 SANITIZER: Deep JSON parsing & corruption repair
        if (!appState.settings) appState.settings = {};
        for (let key in appState.settings) {
            let val = appState.settings[key];
            if (typeof val === 'string') {
                if (val === 'TRUE') appState.settings[key] = true;
                else if (val === 'FALSE') appState.settings[key] = false;
                else if (val.startsWith('[')) {
                    try { appState.settings[key] = JSON.parse(val); } catch(e) { appState.settings[key] = []; }
                }
                else if (val.startsWith('{')) {
                    try { appState.settings[key] = JSON.parse(val); } catch(e) { appState.settings[key] = {}; }
                }
            }
        }

        // 2. The Auto-Heal Engine
        autoHealMissingIDs();

        // 3. Run theme and renders
        if (typeof applyTheme === 'function') applyTheme();
        if (typeof renderSettings === 'function') renderSettings();
        if (typeof renderDictionaries === 'function') renderDictionaries();
        if (typeof renderPartsView === 'function') renderPartsView();
        
        // 4. Safely apply translations only after data is fully loaded
        if (typeof applyTranslations === 'function') applyTranslations(); 

        // 5. Hide loader
        const loader = document.getElementById('boot-loader');
        if (loader) loader.classList.add('d-none');
        
        console.log('🪵 SolidCutlist successfully booted.');
        updateSyncUI('success');
    }

    function autoHealMissingIDs() {
        // 🪄 FIX: Added 'stores' here as well
        const TABS = ['projects', 'groups', 'parts', 'stock', 'catalog', 'materials', 'profiles', 'stores'];
        let healedCount = 0;
        TABS.forEach(tab => {
            appState[tab].forEach((item, index) => {
                if (!item.id) {
                    let prefix = 'ID';
                    if (tab === 'projects') prefix = 'PROJ';
                    if (tab === 'parts') prefix = 'PART';
                    if (tab === 'materials') prefix = 'M';
                    if (tab === 'profiles') prefix = 'PR';
                    if (tab === 'catalog') prefix = 'CAT';
                    if (tab === 'stock') prefix = 'STK';
                    if (tab === 'stores') prefix = 'STR';
                    item.id = prefix + '-' + Date.now() + '-' + index;
                    healedCount++;
                }
            });
        });
        if (healedCount > 0) saveState(); 
    }
    
    /**
     * Wipes current state and resets to the baseline initialAppState.
     * We use deep copy (JSON stringify/parse) so we don't accidentally mutate the original blueprint.
     */
    function initAppState() {
    appState = JSON.parse(JSON.stringify(initialAppState));
    saveState();
    }

    // ==========================================
    // CLOUD SYNC ENGINE (Debounced 1-Way Sync)
    // ==========================================
    let syncTimeout = null;
    let lastCloudSyncTime = 0; // Tracks the last successful Google Sheet write

    function updateSyncUI(status) {
        const icon = document.getElementById('sync-icon');
        const text = document.getElementById('sync-text');
        if (!icon || !text) return;

        // Combine both local and cloud saving into one seamless state
        if (status === 'local' || status === 'syncing') {
            // Injects a tiny, animated Bootstrap spinner
            icon.innerHTML = '<span class="spinner-border spinner-border-sm text-warning" role="status" style="width: 0.8rem; height: 0.8rem; border-width: 0.15em;"></span>'; 
            text.innerText = t('msg_saving');
        } 
        else if (status === 'success') {
            // The Cloud + Checkmark combo
            icon.innerHTML = '<span style="color: #00ff00;">✔</span>'; 
            text.innerText = t('msg_saved'); 
            // Note: If you want NO text at all, just change 'Saved' to ''
        } 
        else if (status === 'error') {
            icon.innerHTML = '⚠️'; 
            text.innerText = t('msg_sync_failed');
        }
    }

    function triggerCloudSync() {
        updateSyncUI('syncing');

        // Package the payload with a timestamp
        const currentTimestamp = Date.now();
        const payload = {
            appState: appState,
            timestamp: currentTimestamp
        };

        // Fire to Google Apps Script asynchronously
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.status === 'success') {
                        lastCloudSyncTime = response.cloud_timestamp;
                        updateSyncUI('success');
                    } else {
                        console.error('Cloud Sync Error:', response.message);
                        updateSyncUI('error');
                    }
                })
                .withFailureHandler(function(error) {
                    console.error('Cloud Sync Network Failure:', error);
                    updateSyncUI('error');
                })
                .saveAppStateToSheet(JSON.stringify(payload));
        } else {
            console.warn('Google Script context not found. Cloud sync skipped (Local Dev Mode).');
            updateSyncUI('error');
        }
    }

    /**
     * Commits the current appState to the browser's localStorage AND triggers the Cloud Sync.
     */
    function saveState() {
        // 1. Recalculate totals (from our Project Dashboard update)
        if (typeof recalculateAllProjectTotals === 'function') recalculateAllProjectTotals();

        // 2. Inject a local timestamp into the state 
        // (We will use this in Phase 3 to check if the browser crashed before the cloud sync finished)
        appState.local_timestamp = Date.now();

        // 3. Save to browser storage instantly
        localStorage.setItem('lumberLogicState', JSON.stringify(appState));
        console.log('Shop data instantly saved to local memory.');
        
        // 4. Update UI to show local save
        updateSyncUI('local');

        // 5. The Debounce Trap (3 seconds)
        if (syncTimeout) {
            clearTimeout(syncTimeout); // User is still typing! Reset the clock.
        }
        syncTimeout = setTimeout(() => {
            triggerCloudSync(); // 3 seconds of silence have passed. Fire the payload!
        }, 3000);
    }

    // ==========================================
    // MATH & UTILITY ENGINE
    // ==========================================

    /**
     * Prevents inch marks (") from breaking HTML input values
     */
     function safeHTML(str) {
        if (!str) return '';
        return String(str).replace(/"/g, '&quot;');
    }
    
    /**
     * Parses user UI input (string or number) into Base Units (decimal mm) for the AppState.
     * Safely handles "1 3/4", "1.75", or "44.45" based on the current Global Setting.
     */
     function parseToBaseUnit(input) {
        if (!input) return 0;
        let val = String(input).trim();
        let unit = appState.settings.displayUnit;
        let decimalInches = 0;

        if (unit === 'mm') {
            return parseFloat(val) || 0;
        }

        // If Fractional Inches
        if (unit === 'frac_in') {
            if (val.includes('/')) {
                let parts = val.split(' ');
                if (parts.length === 2) {
                    // It's a mixed fraction (e.g., "1 3/4")
                    let whole = parseFloat(parts[0]) || 0;
                    let frac = parts[1].split('/');
                    let num = parseFloat(frac[0]) || 0;
                    let den = parseFloat(frac[1]) || 1;
                    decimalInches = whole + (num / den);
                } else {
                    // It's just a fraction (e.g., "3/4")
                    let frac = val.split('/');
                    let num = parseFloat(frac[0]) || 0;
                    let den = parseFloat(frac[1]) || 1;
                    decimalInches = num / den;
                }
            } else {
                // It's just a whole number typed into the fraction setting (e.g., "2")
                decimalInches = parseFloat(val) || 0;
            }
            return decimalInches * 25.4; // Convert inches to mm
        }

        // If Decimal Inches
        if (unit === 'dec_in') {
            decimalInches = parseFloat(val) || 0;
            return decimalInches * 25.4;
        }

        return parseFloat(val) || 0; // Fallback
    }

    /**
     * Formats Base Units (decimal mm) from the AppState back into a user-friendly string.
     * Snaps fractional inches to the nearest 1/16th (Woodworking standard).
     */
    function formatForDisplay(mmValue) {
        let val = parseFloat(mmValue) || 0;
        let unit = appState.settings.displayUnit;

        if (unit === 'mm') {
            return (Math.round(val * 100) / 100).toString(); // Max 2 decimal places
        }

        let inches = val / 25.4;

        if (unit === 'dec_in') {
            return (Math.round(inches * 1000) / 1000).toString(); // Max 3 decimal places
        }

        if (unit === 'frac_in') {
            let whole = Math.floor(inches);
            let remainder = inches - whole;
            let denominator = 16; // Lock accuracy to 1/16th
            let numerator = Math.round(remainder * denominator);

            // Edge Case: perfectly whole number
            if (numerator === 0) {
                return whole > 0 ? whole.toString() : "0";
            }
            
            // Edge Case: rounded up to the next whole number (e.g., 16/16)
            if (numerator === denominator) {
                return (whole + 1).toString();
            }

            // Simplify the fraction (e.g., 8/16 becomes 1/2)
            while (numerator % 2 === 0 && denominator % 2 === 0) {
                numerator /= 2;
                denominator /= 2;
            }

            if (whole === 0) {
                return `${numerator}/${denominator}`;
            } else {
                return `${whole} ${numerator}/${denominator}`;
            }
        }
        
        return val.toString();
    }

    /**
     * Converts UI density input into Base kg/m³ for storage.
     */
     function parseDensityToBase(input) {
        let val = parseFloat(input) || 0;
        if (appState.settings.displayUnit === 'mm') return val; // Already kg/m³
        return val / 0.06242796; // Convert lb/ft³ back to kg/m³
    }

    /**
     * Formats Base kg/m³ into UI display density (kg/m³ or lb/ft³).
     */
    function formatDensityForDisplay(kgm3) {
        let val = parseFloat(kgm3) || 0;
        if (appState.settings.displayUnit === 'mm') return val.toFixed(2);
        return (val * 0.06242796).toFixed(2); // Convert to lb/ft³
    }

    function calculatePartCost(part) {
        if (part.category === 'fastener' || !appState.catalog) return 0;
        const matchingItems = appState.catalog.filter(c => c.categoryId === part.category && c.profileId === part.profileId && c.materialId === part.materialId);
        if (matchingItems.length === 0) return 0;

        let totalNormPrice = 0;
        matchingItems.forEach(c => {
            const bCost = typeof calculateCostPerPiece === 'function' ? calculateCostPerPiece(c) : 0;
            if (part.category === 'sheet') {
                const cArea = c.length * c.width;
                if (cArea > 0) totalNormPrice += (bCost / cArea);
            } else {
                if (c.length > 0) totalNormPrice += (bCost / c.length);
            }
        });
        
        const avgUnitCost = totalNormPrice / matchingItems.length;
        const trueWidth = part.category === 'lumber' ? (appState.profiles.find(pr => pr.id === part.profileId)?.width || 0) : part.width;
        const unitSize = part.category === 'sheet' ? (part.length * trueWidth) : part.length;
        return avgUnitCost * unitSize * part.qty;
    }

    function calculatePartWeight(part) {
        if (part.category === 'fastener') return 0;
        const prof = appState.profiles.find(pr => pr.id === part.profileId);
        const mat = appState.materials.find(m => m.id === part.materialId);
        if (!prof || !mat) return 0;
        const trueWidth = part.category === 'lumber' ? (prof.width || 0) : part.width;
        const safeThick = prof.thickness || 0;
        const volumeM3 = (part.length * trueWidth * safeThick) / 1000000000;
        return volumeM3 * (mat.density || 0) * part.qty;
    }

    function recalculateAllProjectTotals() {
        if (!appState.projects) return;
        
        // 1. Initialize empty buckets
        const totals = {};
        appState.projects.forEach(p => { totals[p.id] = { parts: 0, cost: 0, weight: 0 }; });

        // 2. Tally up every part directly from the source of truth
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (totals[part.projectId]) {
                    totals[part.projectId].parts += (parseInt(part.qty) || 0);
                    totals[part.projectId].cost += calculatePartCost(part);
                    totals[part.projectId].weight += calculatePartWeight(part);
                }
            });
        }

        // 3. Inject silently back into memory
        appState.projects.forEach(p => {
            p.totalParts = totals[p.id].parts;
            p.totalCost = totals[p.id].cost;
            p.totalWeight = totals[p.id].weight;
        });
    }
    
    // ==========================================
    // SORTING ENGINE
    // ==========================================

    // Tracks current sort directions (Ascending/Descending)
    const sortTracker = {};

    function handleSort(arrayName, key, type) {
        // Toggle sort direction
        const sortId = arrayName + '_' + key;
        sortTracker[sortId] = !sortTracker[sortId]; 
        const dir = sortTracker[sortId] ? 1 : -1;

        appState[arrayName].sort((a, b) => {
            let valA = a[key];
            let valB = b[key];

            // 🪄 Smart Lookups for Relational IDs and Dynamic Math
            if (arrayName === 'parts' || arrayName === 'stock' || arrayName === 'catalog' || arrayName === 'profiles' || arrayName === 'stagingParts' || arrayName === 'commitStock') {
                if (key === 'storeId') {
                    valA = appState.stores?.find(s => s.id === a.storeId)?.name || '';
                    valB = appState.stores?.find(s => s.id === b.storeId)?.name || '';
                } else if (key === 'calculatedPrice' && arrayName === 'catalog') {
                    // Calculate dynamic normalized price on the fly for accurate sorting
                    const viewUnit = document.getElementById('table-price-view').value;
                    valA = parseFloat(getNormalizedPriceDisplay(a, viewUnit)) || 0;
                    valB = parseFloat(getNormalizedPriceDisplay(b, viewUnit)) || 0;
                } else if (key === 'projectId' && arrayName === 'parts') {
                    valA = appState.projects.find(p => p.id === a.projectId)?.name || '';
                    valB = appState.projects.find(p => p.id === b.projectId)?.name || '';
                } else if (key === 'profileId') {
                    valA = appState.profiles.find(p => p.id === a.profileId)?.name || '';
                    valB = appState.profiles.find(p => p.id === b.profileId)?.name || '';
                } else if (key === 'materialId') {
                    valA = appState.materials.find(m => m.id === a.materialId)?.name || '';
                    valB = appState.materials.find(m => m.id === b.materialId)?.name || '';
                } else if (key === 'weight' && arrayName === 'parts') {
                    // 🪄 Background Weight Calculation for Sorting
                    const getWeight = (p) => {
                        if (p.category === 'fastener') return 0;
                        const prof = appState.profiles.find(pr => pr.id === p.profileId);
                        const mat = appState.materials.find(m => m.id === p.materialId);
                        if (!prof || !mat) return 0;
                        const safeThick = prof.thickness || 0;
                        const trueWidth = p.category === 'lumber' ? (prof.width || 0) : p.width;
                        const volumeM3 = (p.length * trueWidth * safeThick) / 1000000000;
                        return volumeM3 * (mat.density || 0) * p.qty;
                    };
                    valA = getWeight(a);
                    valB = getWeight(b);
                } else if (key === 'dimensions') {
                    // 🪄 UNIVERSAL 2D DIMENSIONAL SORTING
                    
                    if (arrayName === 'profiles') {
                        // 1. Profiles Table: Tie-break Width vs Thickness
                        let widthA = a.width || 0;
                        let widthB = b.width || 0;
                        if (widthA === widthB) {
                            valA = a.thickness || 0;
                            valB = b.thickness || 0;
                        } else {
                            valA = widthA;
                            valB = widthB;
                        }
                    } else {
                        // 2. Parts/Stock Tables: Tie-break Width vs Length
                        let widthA = a.category === 'lumber' ? (appState.profiles.find(pr => pr.id === a.profileId)?.width || 0) : (a.width || 0);
                        let widthB = b.category === 'lumber' ? (appState.profiles.find(pr => pr.id === b.profileId)?.width || 0) : (b.width || 0);
                        
                        if (widthA === widthB) {
                            valA = a.length || 0;
                            valB = b.length || 0;
                        } else {
                            valA = widthA;
                            valB = widthB;
                        }
                    }
                // 🪄 ADDED: 3D Cascading Tie-Breaker (Thickness -> Width -> Length)
                } else if (key === 'extracted_dimensions') {
                    let tA = a.thickness || 0;
                    let tB = b.thickness || 0;
                    
                    if (tA === tB) {
                        // Thickness matches, tie-break with Width
                        let wA = a.width || 0;
                        let wB = b.width || 0;
                        
                        if (wA === wB) {
                            // Thickness and Width match, tie-break with Length
                            valA = a.length || 0;
                            valB = b.length || 0;
                        } else {
                            valA = wA;
                            valB = wB;
                        }
                    } else {
                        // Thickness is different, sort purely by Thickness
                        valA = tA;
                        valB = tB;
                    }
                } else if (key === 'weight_cost' && arrayName === 'parts') {
                    // 🪄 DYNAMIC PARTS COLUMN SORTING
                    const metricMode = (appState.settings && appState.settings.partsMetricMode) ? appState.settings.partsMetricMode : 'weight';
                    
                    const getWeight = (p) => {
                        if (p.category === 'fastener') return 0;
                        const prof = appState.profiles.find(pr => pr.id === p.profileId);
                        const mat = appState.materials.find(m => m.id === p.materialId);
                        if (!prof || !mat) return 0;
                        const trueWidth = p.category === 'lumber' ? (prof.width || 0) : p.width;
                        const volumeM3 = (p.length * trueWidth * (prof.thickness || 0)) / 1000000000;
                        return volumeM3 * (mat.density || 0) * p.qty;
                    };

                    const getEstimatedCost = (p) => {
                        if (p.category === 'fastener' || !appState.catalog) return 0;
                        const matchingItems = appState.catalog.filter(c => c.categoryId === p.category && c.profileId === p.profileId && c.materialId === p.materialId);
                        if (matchingItems.length === 0) return 0;

                        let totalNormPrice = 0;
                        matchingItems.forEach(c => {
                            const bCost = typeof calculateCostPerPiece === 'function' ? calculateCostPerPiece(c) : 0;
                            if (p.category === 'sheet') {
                                const cArea = c.length * c.width;
                                if (cArea > 0) totalNormPrice += (bCost / cArea);
                            } else {
                                if (c.length > 0) totalNormPrice += (bCost / c.length);
                            }
                        });
                        
                        const avgUnitCost = totalNormPrice / matchingItems.length;
                        const trueWidth = p.category === 'lumber' ? (appState.profiles.find(pr => pr.id === p.profileId)?.width || 0) : p.width;
                        const unitSize = p.category === 'sheet' ? (p.length * trueWidth) : p.length;
                        return avgUnitCost * unitSize * p.qty;
                    };

                    valA = metricMode === 'cost' ? getEstimatedCost(a) : getWeight(a);
                    valB = metricMode === 'cost' ? getEstimatedCost(b) : getWeight(b);
                }
                
            }
            
            // Clean up values based on type
            if (type === 'number') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
            } else {
                valA = String(valA || '').toLowerCase();
                valB = String(valB || '').toLowerCase();
            }

            // Execute Sort
            if (valA < valB) return -1 * dir;
            if (valA > valB) return 1 * dir;
            return 0;
        });

        saveState();

        // Trigger the correct redraw
        if (arrayName === 'projects') renderProjectsTable();
        if (arrayName === 'materials') renderMaterialsTable();
        if (arrayName === 'profiles') renderProfilesTable();
        if (arrayName === 'parts') renderPartsTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stagingParts') renderStagingTable();
        if (arrayName === 'groups' && typeof renderGroupModalTable === 'function') renderGroupModalTable();
        if (arrayName === 'stores' && typeof renderStoreModalTable === 'function') renderStoreModalTable();
    }

    // ==========================================
    // FILTER ENGINE
    // ==========================================

    // 1. The Global State Tracker
    // Remembers which checkboxes are ticked: e.g. { parts: { category: ['lumber'] } }
    let activeFilters = {};

    // 2. Open the Modal & Populate Data
    function openFilterModal(event, arrayName, columnKey, displayTitle) {
        // 🪄 CRITICAL: Stop the click from triggering a column sort!
        event.stopPropagation();

        // Ensure the tracker exists for this table
        if (!activeFilters[arrayName]) activeFilters[arrayName] = {};

        // Set hidden inputs and Title
        document.getElementById('filter-array-name').value = arrayName;
        document.getElementById('filter-column-key').value = columnKey;
        document.getElementById('filterModalTitle').innerText = `${t('hdr_filter')}: ${displayTitle}`;

        // Extract unique values from the database
        const uniqueValues = new Map(); // Use a Map to hold { rawValue: humanReadableText }

        appState[arrayName].forEach(row => {
            let rawValue = row[columnKey];
            let displayText = rawValue;

            // Handle Empty/Null
            if (rawValue === '' || rawValue === null || rawValue === undefined) {
                rawValue = '___EMPTY___';
                displayText = t('lbl_blank');
            } else {
                // 🪄 TRANSLATION DICTIONARY: Convert IDs to Human Readable Names
                if (columnKey === 'projectId') displayText = appState.projects.find(p => p.id === rawValue)?.name || t('lbl_unknown_project');
                else if (columnKey === 'groupId') displayText = appState.groups.find(g => g.id === rawValue)?.name || t('lbl_unknown_group');
                else if (columnKey === 'profileId') displayText = appState.profiles.find(p => p.id === rawValue)?.name || t('lbl_unknown_profile');
                else if (columnKey === 'materialId') displayText = appState.materials.find(m => m.id === rawValue)?.name || t('lbl_unknown_material');
                else if (columnKey === 'storeId') displayText = appState.stores?.find(s => s.id === rawValue)?.name || t('lbl_unknown_store');
            }

            uniqueValues.set(rawValue, displayText);
        });

        // Sort alphabetically by the Human Readable text
        const sortedEntries = Array.from(uniqueValues.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1])));

        // Build the HTML Checkboxes
        const listContainer = document.getElementById('filter-checkbox-list');
        listContainer.innerHTML = '';

        const currentActive = activeFilters[arrayName][columnKey] || [];

        sortedEntries.forEach(([rawVal, displayTxt]) => {
            // If there's no active filter array, default to checking everything
            const isChecked = currentActive.length === 0 || currentActive.includes(rawVal);
            
            const div = document.createElement('div');
            div.className = 'form-check mb-1';
            div.innerHTML = `
                <input class="form-check-input filter-option-cb" type="checkbox" value="${safeHTML(rawVal)}" id="flt-${safeHTML(rawVal)}" ${isChecked ? 'checked' : ''}>
                <label class="form-check-label w-100" for="flt-${safeHTML(rawVal)}" style="cursor:pointer;">
                    ${safeHTML(displayTxt)}
                </label>
            `;
            listContainer.appendChild(div);
        });

        // Show the Modal
        const modal = new bootstrap.Modal(document.getElementById('universalFilterModal'));
        modal.show();
    }

    // 3. Modal Button Helpers
    function toggleAllFilters(checkThem) {
        document.querySelectorAll('.filter-option-cb').forEach(cb => cb.checked = checkThem);
    }

    function clearCurrentFilter() {
        toggleAllFilters(true); // Visually check all
        applyFilter(); // Applying with everything checked is the same as clearing it
    }

    // 4. Save the Filter & Redraw
    function applyFilter() {
        const arrayName = document.getElementById('filter-array-name').value;
        const columnKey = document.getElementById('filter-column-key').value;
        
        const checkboxes = document.querySelectorAll('.filter-option-cb');
        const checkedValues = [];
        let allChecked = true;

        checkboxes.forEach(cb => {
            if (cb.checked) checkedValues.push(cb.value);
            else allChecked = false;
        });

        if (!activeFilters[arrayName]) activeFilters[arrayName] = {};

        // If everything is checked, we don't need to filter at all. Remove it to save math.
        if (allChecked) {
            delete activeFilters[arrayName][columnKey];
        } else {
            activeFilters[arrayName][columnKey] = checkedValues;
        }

        // Hide Modal
        bootstrap.Modal.getInstance(document.getElementById('universalFilterModal')).hide();

        // 🪄 Trigger the correct redraw function
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'projects' && typeof renderProjectsTable === 'function') renderProjectsTable();
        if (arrayName === 'profiles' && typeof renderProfilesTable === 'function') renderProfilesTable();
        if (arrayName === 'stagingParts' && typeof renderStagingTable === 'function') renderStagingTable();
    }

    // 5. The Gatekeeper (Called inside your render loops)
    function rowPassesFilters(row, arrayName) {
        if (!activeFilters[arrayName]) return true; // No filters active for this table

        for (const [columnKey, allowedValues] of Object.entries(activeFilters[arrayName])) {
            let cellValue = row[columnKey];
            if (cellValue === '' || cellValue === null || cellValue === undefined) cellValue = '___EMPTY___';
            
            // If the cell's value is NOT in the allowed list, kill the row immediately
            if (!allowedValues.includes(String(cellValue))) {
                return false; 
            }
        }
        return true; // Passed all active filters!
    }

    // 6. Global Master Clear Switch
    function clearAllFiltersForTable(arrayName) {
        if (activeFilters[arrayName]) {
            activeFilters[arrayName] = {}; // Wipe the filters clean for this table
        }
        
        // Trigger the redraw to bring all rows back instantly
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'projects' && typeof renderProjectsTable === 'function') renderProjectsTable();
        if (arrayName === 'profiles' && typeof renderMaterialsTable === 'function') renderProfilesTable();
        if (arrayName === 'stagingParts' && typeof renderStagingTable === 'function') renderStagingTable();
    }

    // 7. Global UI Painter for Filters
    // Call this at the end of any table's render loop to instantly update all icon colors
    function updateFilterUI(arrayName, filterableColumns) {
        const clearBtn = document.getElementById(`flt-clear-${arrayName}`);
        let hasAnyFilter = false;

        // 1. Paint the Column Icons
        filterableColumns.forEach(col => {
            const icon = document.getElementById(`flt-icon-${arrayName}-${col}`);
            if (icon) {
                // If this specific column has an active filter
                if (activeFilters[arrayName] && activeFilters[arrayName][col] && activeFilters[arrayName][col].length > 0) {
                    icon.classList.remove('text-muted');
                    icon.classList.add('text-primary'); 
                    hasAnyFilter = true;
                } else {
                    icon.classList.add('text-muted');
                    icon.classList.remove('text-primary');
                }
            }
        });

        // 2. Paint the Master Clear Button
        if (clearBtn) {
            if (hasAnyFilter) {
                clearBtn.classList.remove('text-secondary', 'opacity-25');
                clearBtn.classList.add('text-danger', 'fw-bold');
            } else {
                clearBtn.classList.add('text-secondary', 'opacity-25');
                clearBtn.classList.remove('text-danger', 'fw-bold');
            }
        }

        // Return this boolean just in case the local table needs to know if a filter is active!
        return hasAnyFilter; 
    }
    
    // ==========================================
    // BOOT SEQUENCE
    // ==========================================
    // Initialize app when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        loadState();
    });

    // --- NAVIGATION ---
    function navigateTo(viewId) {
        // 1. Hide all views
        const views = document.querySelectorAll('.app-view');
        views.forEach(view => view.classList.add('d-none'));

        // 2. Show requested view
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.classList.remove('d-none');

        // 3. Highlight the active nav button
        document.querySelectorAll('.nav-buttons-container .btn').forEach(btn => {
            btn.classList.remove('active', 'bg-light', 'text-dark', 'fw-bold');
        });
        const activeBtn = document.getElementById('nav-btn-' + viewId);
        if (activeBtn) activeBtn.classList.add('active', 'bg-light', 'text-dark', 'fw-bold');

        // 4. View-Specific Initializations 🪄 ADDED THIS BLOCK
        if (viewId === 'view-import') {
            renderImportView(); // Fills the project dropdown and resets the UI
        } else if (viewId === 'view-cutlist') {
            if (typeof renderOptimizerConfig === 'function') renderOptimizerConfig();
        }

        // 🪄 5. DYNAMIC IMPORT BUTTON STYLING
        const importBtn = document.getElementById('nav-btn-resume-import');
        if (importBtn) {
            if (viewId === 'view-import') {
                // When ON the import view: Make it solid yellow, bold, and shadowed
                importBtn.classList.remove('btn-outline-warning', 'btn-outline-light');
                importBtn.classList.add('btn-warning', 'fw-bold', 'shadow-sm', 'text-dark');
            } else {
                // When OFF the import view: Make it hollow, un-bold, and blend in
                importBtn.classList.remove('btn-warning', 'fw-bold', 'shadow-sm', 'text-dark');
                importBtn.classList.add('btn-outline-warning'); 
            }
        }
    }

    // --- UNIVERSAL UI TOGGLES ---
    function toggleInputSection(arrayName, normalOffset, hiddenOffset, btnElement) {
        const inputSection = document.getElementById(`input-section-${arrayName}`);
        const tableWrapper = document.getElementById(`table-wrapper-${arrayName}`);

        if (!inputSection || !tableWrapper) return; // Failsafe

        if (inputSection.classList.contains('d-none')) {
            // SHOW THE FORM
            inputSection.classList.remove('d-none');
            // Shrink the table back down
            tableWrapper.style.maxHeight = `calc(100vh - ${normalOffset}px)`;
            tableWrapper.style.height = `calc(100vh - ${normalOffset}px)`; 
            btnElement.innerHTML = '<b>▽</b>';
        } else {
            // HIDE THE FORM
            inputSection.classList.add('d-none');
            // Expand the table to fill the void
            tableWrapper.style.maxHeight = `calc(100vh - ${hiddenOffset}px)`;
            tableWrapper.style.height = `calc(100vh - ${hiddenOffset}px)`; 
            btnElement.innerHTML = '<b>◁</b>';
        }
    }

    // --- TOAST NOTIFICATIONS ---
    // Instead of ugly alert() boxes, we slide up a modern notification
    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const MAX_TOASTS = 3;

        const currentToasts = container.querySelectorAll('.toast');
        if (currentToasts.length >= MAX_TOASTS) {
            // Target the oldest toast (the first one in the container)
            const oldestToast = currentToasts[0];
            
            // Use Bootstrap's API to gracefully hide it (which triggers our cleanup listener)
            const bsOldest = bootstrap.Toast.getInstance(oldestToast);
            if (bsOldest) {
                bsOldest.hide();
            } else {
                oldestToast.remove(); // Failsafe if Bootstrap loses track of it
            }
        }
        
        // Create the toast element
        const toastEl = document.createElement('div');
        toastEl.className = `toast align-items-center text-white border-0 ${isError ? 'bg-danger' : 'bg-success'}`;
        toastEl.setAttribute('role', 'alert');
        toastEl.setAttribute('aria-live', 'assertive');
        toastEl.setAttribute('aria-atomic', 'true');
        
        // Inner HTML of the toast
        toastEl.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        `;
        
        container.appendChild(toastEl);
        
        // Initialize and show using Bootstrap's JS API
        const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
        bsToast.show();
        
        // Clean up DOM after it hides
        toastEl.addEventListener('hidden.bs.toast', () => {
            toastEl.remove();
        });
    }

    /**
     * Returns the exact Bootstrap classes for a given category badge.
     * Centralizes color management so it can be updated in one place.
     * @param {string} category - The category name ('lumber', 'sheet', 'fastener')
     * @returns {string} The CSS class list for the badge.
     */
     function getCategoryBadgeClass(category) {
        const badgeMap = {
            lumber: 'bg-lumber text-white',
            sheet: 'bg-sheet text-dark',
            fastener: 'bg-fastener text-white'
        };

        // Return the mapped color, or fallback to the default gray if unknown
        return badgeMap[category] || 'bg-secondary text-white';
    }

    // ==========================================
    // THEME & DARK MODE LOGIC
    // ==========================================

    function toggleTheme() {
        const isDark = document.getElementById('setting-theme-toggle').checked;
        
        // Ensure settings object exists
        if (!appState.settings) appState.settings = {};
        
        // Save choice to database
        appState.settings.theme = isDark ? 'dark' : 'light';
        saveState();
        
        // Apply instantly
        applyTheme();
    }

    function applyTheme() {
        // Default to light if not set
        const theme = (appState.settings && appState.settings.theme) ? appState.settings.theme : 'light';
        
        // 1. Tell Bootstrap to flip the global component colors (tables, inputs, etc.)
        document.documentElement.setAttribute('data-bs-theme', theme);
        
        // 2. 🪄 The Bulletproof Background Fix: Manually swap the body classes
        if (theme === 'dark') {
            document.body.classList.remove('bg-light', 'bg-white');
            document.body.classList.add('bg-dark');
        } else {
            document.body.classList.remove('bg-dark');
            document.body.classList.add('bg-light'); 
        }
        
        // 3. Keep the switch UI perfectly synced with the data
        const toggle = document.getElementById('setting-theme-toggle');
        if (toggle) {
            toggle.checked = (theme === 'dark');
        }
    }

    // ==========================================
    // UNIVERSAL DUPLICATION ENGINE
    // ==========================================
    
    // 🪄 The Glow Registry: Remembers active animations across table redraws
    if (!window.activeGlows) window.activeGlows = [];

    function duplicateRow(arrayName, rowId) {
        // 1. Failsafe
        if (!appState[arrayName]) return;

        // 2. Find the exact index of the item we clicked
        const index = appState[arrayName].findIndex(item => item.id === rowId);
        if (index === -1) return;

        // 3. Deep Clone the object
        const original = appState[arrayName][index];
        const clone = JSON.parse(JSON.stringify(original));

        // 4. Generate the new ID
        const idParts = original.id.split('-');
        const prefix = idParts.length > 1 ? idParts[0] + '-' : 'ID-';
        clone.id = prefix + Date.now();

        if (clone.name !== undefined) {
            clone.name = clone.name + ` (${t('lbl_copy')})`;
        }

        // 5. Inject the clone directly below the original
        appState[arrayName].splice(index + 1, 0, clone);

        // 6. Save and Redraw
        saveState();
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'projects' && typeof renderProjectsTable === 'function') renderProjectsTable();
        if (arrayName === 'profiles' && typeof renderProfilesTable === 'function') renderProfilesTable();

        showToast(t('msg_row_duplicated'));

        // 7. 🪄 VISUAL HIGHLIGHT: Add the new row to the registry
        window.activeGlows.push({ id: clone.id, timestamp: Date.now() });

        // Clean up memory: Remove any rows from the registry that are older than 4 seconds
        window.activeGlows = window.activeGlows.filter(g => Date.now() - g.timestamp < 4000);

        // 8. Re-apply animations to ALL active rows
        setTimeout(() => {
            const renderTime = Date.now();
            
            window.activeGlows.forEach(glowObj => {
                const newRowElement = document.querySelector(`[onclick*="${glowObj.id}"]`);
                if (newRowElement) {
                    const tr = newRowElement.closest('tr');
                    if (tr) {
                        const cells = tr.querySelectorAll('td, th');
                        
                        // Calculate exact time and opacity remaining for this specific row
                        const elapsed = renderTime - glowObj.timestamp;
                        const remainingMs = Math.max(0, 4000 - elapsed);
                        const currentOpacity = 0.4 * (remainingMs / 4000);

                        if (remainingMs > 0) {
                            // Step A: Snap to the exact color it should be right now
                            cells.forEach(cell => {
                                cell.style.transition = 'none';
                                cell.style.backgroundColor = `rgba(25, 135, 84, ${currentOpacity})`;
                                cell.style.boxShadow = 'none'; 
                            });

                            // Step B: Force the browser to draw it
                            void tr.offsetWidth;

                            // Step C: Resume the fade-out for the remaining time
                            cells.forEach(cell => {
                                cell.style.transition = `background-color ${remainingMs}ms ease-out, box-shadow ${remainingMs}ms ease-out`;
                                cell.style.backgroundColor = 'transparent';
                                cell.style.boxShadow = ''; 
                            });
                        }
                    }
                }
            });
        }, 150); 
    }

    // ==========================================
    // UNIVERSAL DELETE ENGINE
    // ==========================================
    let pendingDeleteAction = null;

    function requestConfirm(message, actionCallback, theme = 'danger', btnText = 'Delete') {
        document.getElementById('modal-delete-message').innerText = message;
        pendingDeleteAction = actionCallback; 
        
        const modalContent = document.getElementById('modal-confirm-content');
        const modalHeader = document.getElementById('modal-confirm-header');
        const confirmBtn = document.getElementById('btn-confirm-delete');
        const titleIcon = document.getElementById('modal-confirm-title');

        if(modalContent && modalHeader && confirmBtn && titleIcon) {
            // Hot-swap the CSS classes to match the vibe
            modalContent.className = `modal-content border-${theme} shadow-lg`;
            modalHeader.className = `modal-header bg-${theme} text-white py-2`;
            confirmBtn.className = `btn btn-sm btn-${theme} px-4 fw-bold`;
            
            // 🪄 i18n Fix: Handle "Delete" vs "Duplicate" vs custom text
            // If btnText is "Delete", use translated delete. Otherwise assume it's custom and translate it if possible or pass thru.
            if (btnText === 'Delete') confirmBtn.innerText = t('btn_delete');
            else if (btnText === 'Duplicate') confirmBtn.innerText = t('btn_duplicate');
            else confirmBtn.innerText = btnText;

            titleIcon.innerText = theme === 'danger' ? `⚠️ ${t('hdr_confirm_deletion')}` : `ℹ️ ${t('hdr_confirm_action')}`;
        }
        
        const modal = new bootstrap.Modal(document.getElementById('modal-universal-delete'));
        modal.show();
        setTimeout(() => confirmBtn.focus(), 400);
    }

    function executeConfirm() {
        if (pendingDeleteAction) {
            pendingDeleteAction(); // Execute the memorized function
            pendingDeleteAction = null; // Clear memory
        }
        const modalEl = document.getElementById('modal-universal-delete');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
    }

    // DEEP CLONING ENGINE (Projects, Groups, and Parts)
    function duplicateProject(projectId) {
        const originalProject = appState.projects.find(p => p.id === projectId);
        if (!originalProject) return;

        // 1. Clone Project
        const newProjId = 'PROJ-' + Date.now() + Math.floor(Math.random() * 1000);
        const clonedProject = JSON.parse(JSON.stringify(originalProject));
        clonedProject.id = newProjId;
        clonedProject.name = clonedProject.name + ` (${t('lbl_copy')})`;
        // Wipe cached totals clean; they will naturally rebuild on the next saveState
        clonedProject.totalParts = 0; 
        clonedProject.totalCost = 0;
        appState.projects.splice(appState.projects.findIndex(p => p.id === projectId) + 1, 0, clonedProject);

        // 2. Clone Groups and Build Relationship Map
        const groupMap = {}; // oldGrpId -> newGrpId
        if (appState.groups) {
            const projectGroups = appState.groups.filter(g => g.projectId === projectId);
            projectGroups.forEach((g, index) => {
                const newGrpId = 'GRP-' + Date.now() + index + Math.floor(Math.random() * 1000);
                groupMap[g.id] = newGrpId;
                const clonedGroup = JSON.parse(JSON.stringify(g));
                clonedGroup.id = newGrpId;
                clonedGroup.projectId = newProjId;
                appState.groups.push(clonedGroup);
            });
        }

        // 3. Clone Parts & Re-link them
        if (appState.parts) {
            const projectParts = appState.parts.filter(p => p.projectId === projectId);
            projectParts.forEach((p, index) => {
                const clonedPart = JSON.parse(JSON.stringify(p));
                clonedPart.id = 'PART-' + Date.now() + index + Math.floor(Math.random() * 1000);
                clonedPart.projectId = newProjId; // Re-link to new project
                if (clonedPart.groupId && groupMap[clonedPart.groupId]) {
                    clonedPart.groupId = groupMap[clonedPart.groupId]; // Re-link to new group!
                }
                appState.parts.push(clonedPart); 
            });
        }

        saveState();
        if (typeof renderDictionaries === 'function') renderDictionaries();
        showToast(t('msg_project_duplicated'));
    }

    // The Global 'Enter' Key Listener
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const modalEl = document.getElementById('modal-universal-delete');
            if (modalEl && modalEl.classList.contains('show')) {
                event.preventDefault(); // Stop Enter from triggering anything else
                executeConfirm();
            }
        }
    });
</script>
