<script>
    // --- TEMPORARY STATE VARIABLES ---
    let rawCsvHeaders = [];
    let rawCsvRows = [];
    let targetProjectId = '';
    let cachedFileName = '';
    
    // Workflow tracking
    let currentImportStep = 1;
    let isImportActive = false;
    let isMappingDirty = true; // Tracks if we need to recalculate Step 3

    // This is the quarantine tank before they go into appState.parts
    if (!appState.stagingParts) appState.stagingParts = [];

    // --- INITIALIZATION & NAVIGATION ---
    
    // Called when clicking the Import button (or Resume Import)
    function renderImportView() {
        populateImportProjectDropdown();
        
        if (isImportActive) {
            // 🪄 TRAP 4 FIX: Re-render the table to pull in new Setup data
            if (currentImportStep === 3) {
                renderStagingTable(); 
            }
        } else {
            // Fresh start
            resetImport();
            toggleResumeButton(true); // 🪄 Turn the yellow button ON immediately!
        }
    }
    function populateImportProjectDropdown() {
        const projSelect = document.getElementById('import-project-select');
        const currentVal = projSelect.value || targetProjectId; // Remember selection
        
        projSelect.innerHTML = `<option value="" disabled selected>${t('opt_select_project')}</option>`;
        if (appState.projects) {
            appState.projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                projSelect.appendChild(opt);
            });
        }
        if (currentVal) projSelect.value = currentVal;
    }
    function toggleResumeButton(show) {
        isImportActive = show;
        const btn = document.getElementById('nav-btn-resume-import');
        if (btn) {
            if (show) btn.classList.remove('d-none');
            else btn.classList.add('d-none');
        }
    }

    // 🪄 THE VISUAL STEPPER ENGINE
    function goToImportStep(step) {
        currentImportStep = step;
        
        // Hide all
        document.getElementById('import-step-1').classList.add('d-none');
        document.getElementById('import-step-2').classList.add('d-none');
        document.getElementById('import-step-3').classList.add('d-none');
        
        // Show target
        document.getElementById(`import-step-${step}`).classList.remove('d-none');
        
        // Paint the Progress Bar
        for (let i = 1; i <= 3; i++) {
            const indicator = document.getElementById(`step-indicator-${i}`);
            const text = indicator.querySelector('span');
            
            if (i === step) {
                indicator.className = 'col-4 border-bottom border-3 border-primary pb-2 transition-all';
                text.className = 'fw-bold text-primary';
            } else if (i < step) {
                indicator.className = 'col-4 border-bottom border-3 border-success pb-2 transition-all';
                text.className = 'fw-bold text-success';
            } else {
                indicator.className = 'col-4 border-bottom border-3 border-secondary pb-2 opacity-50 transition-all';
                text.className = 'fw-bold text-secondary';
            }
        }
    }
    // Completely annihilates the cache and hides the resume button
    function resetImport() {
        rawCsvHeaders = [];
        rawCsvRows = [];
        targetProjectId = '';
        appState.stagingParts = [];
        cachedFileName = '';
        isMappingDirty = true;
        
        document.getElementById('import-project-select').value = '';
        clearCachedFile();
        
        toggleResumeButton(false);
        goToImportStep(1);
    }
    function cancelImportProcess() {
        resetImport();
        navigateTo('view-parts');
        showToast(t('msg_import_cancelled'), true);
    }
    // --- STEP 1: READ FILE & EXTRACT HEADERS ---
    
    // Called when Project Dropdown changes
    function markImportDirty() {
        isMappingDirty = true;
        targetProjectId = document.getElementById('import-project-select').value;
    }
    function handleCsvUpload() {
        const projSelect = document.getElementById('import-project-select');
        const fileInput = document.getElementById('import-file-input');

        if (!projSelect.value) {
            showToast(t('msg_select_target_project'), true);
            return;
        }
        targetProjectId = projSelect.value;

        // 🪄 TRAP 1 FIX: If file is already cached, bypass the upload entirely
        if (rawCsvRows.length > 0) {
            toggleResumeButton(true);
            goToImportStep(2);
            return;
        }

        if (!fileInput.files.length) {
            showToast(t('msg_select_csv_file'), true);
            return;
        }

        const file = fileInput.files[0];
        cachedFileName = file.name;
        const reader = new FileReader();

        reader.onload = function(e) {
            const text = e.target.result;
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
            
            if (lines.length < 2) {
                showToast(t('msg_csv_empty_invalid'), true);
                return;
            }

            window.csvDelimiter = lines[0].includes(';') ? ';' : ',';
            rawCsvHeaders = lines[0].split(window.csvDelimiter).map(h => h.replace(/^"|"$/g, '').trim());
            rawCsvRows = lines.slice(1); 

            // Switch UI to "Loaded" state
            document.getElementById('import-upload-ui').classList.add('d-none');
            document.getElementById('import-loaded-ui').classList.remove('d-none');
            document.getElementById('import-loaded-ui').classList.add('d-flex');
            document.getElementById('cached-file-name').innerText = cachedFileName;

            isMappingDirty = true; 
            toggleResumeButton(true);
            renderMappingUI();
            goToImportStep(2);
        };

        reader.readAsText(file);
    }
    function clearCachedFile() {
        rawCsvRows = [];
        rawCsvHeaders = [];
        cachedFileName = '';
        document.getElementById('import-file-input').value = '';
        document.getElementById('file-name-display').value = '';
        
        document.getElementById('import-upload-ui').classList.remove('d-none');
        document.getElementById('import-loaded-ui').classList.add('d-none');
        document.getElementById('import-loaded-ui').classList.remove('d-flex');
        isMappingDirty = true;
    }
    function updateFileNameDisplay() {
        const fileInput = document.getElementById('import-file-input');
        const display = document.getElementById('file-name-display');
        display.value = fileInput.files.length > 0 ? fileInput.files[0].name : t('msg_no_file_selected');
    }
    // --- STEP 2: BUILD THE MAPPING UI ---
    function renderMappingUI() {
        const container = document.getElementById('mapping-dropdowns-container');
        container.innerHTML = '';

        const requiredFields = [
            { id: 'map-name', label: t('lbl_part_name'), defaultIndex: 3 },           // 3 = Designation
            { id: 'map-group', label: t('lbl_group_path'), defaultIndex: 1 },       // 1 = Path
            { id: 'map-length', label: t('lbl_length_raw'), defaultIndex: 4 },      // 4 = Length - raw
            { id: 'map-width', label: t('lbl_width_raw'), defaultIndex: 5 },        // 5 = Width - raw
            { id: 'map-thickness', label: t('lbl_thickness_raw'), defaultIndex: 6 },// 6 = Thickness - raw
            { id: 'map-material', label: t('lbl_material_optional'), defaultIndex: 12 } // 12 = Material
        ];

        requiredFields.forEach(field => {
            let optionsHtml = `<option value="" disabled selected>${t('opt_select_column')}</option>`;

            rawCsvHeaders.forEach((header, index) => {
                const isSelected = (index === field.defaultIndex) ? 'selected' : '';
                optionsHtml += `<option value="${index}" ${isSelected}>${t('lbl_col')} ${index + 1}: ${header}</option>`;
            });

            const colDiv = document.createElement('div');
            colDiv.className = 'col-md-4 col-sm-6 mb-3';
            
            // 🪄 ADDED: The Preview Box and the onchange trigger
            colDiv.innerHTML = `
                <div class="p-2 border rounded shadow-sm h-100 d-flex flex-column">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">${field.label}</label>
                    <select class="form-select form-select-sm border-warning mb-2" id="${field.id}" onchange="isMappingDirty = true; updateColumnPreview('${field.id}')" required>
                        ${optionsHtml}
                    </select>
                    <div class="flex-grow-1 border rounded p-2" style="min-height: 150px; max-height: 150px; overflow-y: auto;">
                        <ul class="list-unstyled mb-0 small text-muted" id="preview-${field.id}">
                            </ul>
                    </div>
                </div>
            `;
            container.appendChild(colDiv);
        });

        // 🪄 THE INITIALIZER: Force all dropdowns to render their previews instantly on load
        requiredFields.forEach(field => {
            updateColumnPreview(field.id);
        });
    }
    // 🪄 THE PREVIEW ENGINE
    function updateColumnPreview(selectId) {
        const selectEl = document.getElementById(selectId);
        const previewUl = document.getElementById(`preview-${selectId}`);
        if (!selectEl || !previewUl) return;

        previewUl.innerHTML = ''; // Clear previous data

        const colIndex = parseInt(selectEl.value);

        // 🛡️ Unselected State
        if (isNaN(colIndex) || colIndex === -1) {
            previewUl.innerHTML = `<li class="fst-italic opacity-50">[ ${t('msg_waiting_for_selection')} ]</li>`;
            return;
        }

        const validPreviews = [];
        
        // 🪄 FIXED: Clean loop that just grabs preview data without crashing
        for (let i = 1; i < rawCsvRows.length; i++) {
            const rowStr = rawCsvRows[i];
            if (!rowStr.trim()) continue;

            const delimiter = window.csvDelimiter || ';';
            const cols = rowStr.split(delimiter).map(c => c.replace(/^"|"$/g, '').trim());
            const cellData = cols[colIndex];

            // Only grab it if it actually contains text
            if (cellData !== undefined && cellData !== null && String(cellData).trim() !== '') {
                validPreviews.push(String(cellData).trim());
            }

            // Stop digging once we have 100 valid examples
            if (validPreviews.length >= 100) break; 
        }

        if (validPreviews.length === 0) {
            previewUl.innerHTML = `<li class="fst-italic text-warning opacity-75">(${t('msg_column_empty')})</li>`;
        } else {
            validPreviews.forEach(text => {
                const li = document.createElement('li');
                li.className = 'text-truncate mb-1'; 
                li.style.maxWidth = '100%';
                li.innerText = '• ' + text;
                li.title = text; // Tooltip shows the full string on hover
                previewUl.appendChild(li);
            });
        }
    }
    // --- STEP 3: PROCESS & MATCH DATA ---
    function processMapping() {
        if (!isMappingDirty && appState.stagingParts.length > 0) {
            goToImportStep(3);
            return;
        }

        const mapName = document.getElementById('map-name');
        const mapGroup = document.getElementById('map-group'); // 🪄 Now grabbing group mapping
        const mapLength = document.getElementById('map-length');
        const mapWidth = document.getElementById('map-width');
        const mapThickness = document.getElementById('map-thickness');
        const mapMaterial = document.getElementById('map-material');

        const colMap = {
            name: parseInt(mapName.value),
            group: parseInt(mapGroup.value),
            length: parseInt(mapLength.value),
            width: parseInt(mapWidth.value),
            thickness: parseInt(mapThickness.value),
            material: parseInt(mapMaterial.value)
        };

        [mapName, mapGroup, mapLength, mapWidth, mapThickness].forEach(el => el.classList.remove('is-invalid', 'border-danger'));

        let hasError = false;
        if (isNaN(colMap.name)) { mapName.classList.add('is-invalid', 'border-danger'); hasError = true; }
        if (isNaN(colMap.group)) { mapGroup.classList.add('is-invalid', 'border-danger'); hasError = true; }
        if (isNaN(colMap.length)) { mapLength.classList.add('is-invalid', 'border-danger'); hasError = true; }
        if (isNaN(colMap.width)) { mapWidth.classList.add('is-invalid', 'border-danger'); hasError = true; }
        if (isNaN(colMap.thickness)) { mapThickness.classList.add('is-invalid', 'border-danger'); hasError = true; }

        if (hasError) {
            showToast(t('msg_map_required_columns'), true);
            return;
        }

        appState.stagingParts = [];
        let detectedCsvUnit = 'unknown';

        // 🪄 THE REAL AUTO-MERGE ENGINE
        const mergeMap = {};
        const safeMaterials = appState.materials || [];
        const safeProfiles = appState.profiles || [];

        for (let i = 1; i < rawCsvRows.length; i++) {
            const rowStr = rawCsvRows[i];
            if (!rowStr.trim()) continue;

            const delimiter = window.csvDelimiter || ';';
            const cols = rowStr.split(delimiter).map(c => c.replace(/^"|"$/g, '').trim());

            const rawName = cols[colMap.name] || `Part ${i}`;
            const rawPath = (!isNaN(colMap.group) && cols[colMap.group]) ? String(cols[colMap.group]) : '';
            const rawMaterial = isNaN(colMap.material) ? '' : (cols[colMap.material] || '');
            
            // Slice the group down to just the parent
            let topLevelGroup = rawPath.split('>')[0].trim();

            if (detectedCsvUnit === 'unknown' && cols[colMap.length]) {
                const rawL = String(cols[colMap.length]).toLowerCase();
                if (rawL.indexOf('mm') > -1 || rawL.indexOf('cm') > -1 || rawL.indexOf(' m') > -1) {
                    detectedCsvUnit = 'mm';
                } else if (rawL.indexOf('"') > -1 || rawL.indexOf('in') > -1 || rawL.indexOf("'") > -1) {
                    detectedCsvUnit = 'in';
                }
            }

            const cleanDim = (str) => {
                if (!str) return 0;
                let cleaned = str.replace(/[^0-9\.\/ ]/g, '').trim();
                return parseToBaseUnit(cleaned) || 0;
            };

            const tBase = cleanDim(cols[colMap.thickness]);
            const wBase = cleanDim(cols[colMap.width]);
            const lBase = cleanDim(cols[colMap.length]);

            if (tBase === 0 || lBase === 0) continue;

            // 🪄 BUILD THE MERGE KEY (Identical instances get merged automatically!)
            const mergeKey = `${rawName}_${lBase}_${wBase}_${tBase}_${rawMaterial}_${topLevelGroup}`;

            if (mergeMap[mergeKey]) {
                mergeMap[mergeKey].qty += 1; // Bump quantity for identical parts
            } else {
                let matchedMatId = '';
                let matchedProfId = '';
                let inferredCategory = '';

                if (rawMaterial) {
                    const mat = safeMaterials.find(m => m.name.toLowerCase() === rawMaterial.toLowerCase());
                    if (mat) matchedMatId = mat.id;
                }

                const tolerance = 1.5; 
                const lumberMatch = safeProfiles.find(p => p.type === 'lumber' && Math.abs(p.thickness - tBase) <= tolerance && Math.abs(p.width - wBase) <= tolerance);
                const sheetMatch = safeProfiles.find(p => p.type === 'sheet' && Math.abs(p.thickness - tBase) <= tolerance);

                if (lumberMatch) {
                    matchedProfId = lumberMatch.id;
                    inferredCategory = 'lumber';
                } else if (sheetMatch) {
                    matchedProfId = sheetMatch.id;
                    inferredCategory = 'sheet';
                }

                const status = (inferredCategory !== '' && matchedMatId && matchedProfId) ? 'ready' : 'needs_mapping';

                mergeMap[mergeKey] = {
                    id: 'STG-' + Date.now() + '-' + i,
                    projectId: targetProjectId,
                    name: rawName,
                    qty: 1, // Start at 1 for each new unique instance
                    length: lBase,
                    width: wBase,
                    thickness: tBase, 
                    category: inferredCategory,
                    extractedGroup: topLevelGroup,
                    extractedMaterial: rawMaterial,
                    materialId: matchedMatId,
                    profileId: matchedProfId,
                    groupId: undefined,
                    status: status
                };
            }
        }

        // Output the cleanly merged staging table
        appState.stagingParts = Object.values(mergeMap);

        const warningBanner = document.getElementById('import-unit-warning');
        const safeSettings = appState.settings || {};
        const shopUnit = safeSettings.displayUnit || 'unknown_shop_setting'; 
        const isShopMetric = (shopUnit === 'mm');
        const isCsvMetric = (detectedCsvUnit === 'mm');

        if (detectedCsvUnit !== 'unknown' && isShopMetric !== isCsvMetric) {
            document.getElementById('csv-unit-label').innerText = isCsvMetric ? 'Metric' : 'Imperial';
            document.getElementById('shop-unit-label').innerText = isShopMetric ? 'Metric' : 'Imperial';
            warningBanner.classList.remove('d-none');
        } else {
            warningBanner.classList.add('d-none');
        }

        isMappingDirty = false; 
        goToImportStep(3);
        renderStagingTable();
    }
    // --- STEP 4: RENDER THE STAGING TABLE ---
    function renderStagingTable() {
        const tbody = document.getElementById('table-staging-body');
        tbody.innerHTML = '';
        
        let allGreen = true; 
        
        // 🪄 SILENT CRASH SHIELD: Local safe arrays
        const safeProfiles = appState.profiles || [];
        const safeMaterials = appState.materials || [];

        appState.stagingParts.forEach(part => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(part, 'stagingParts')) return;

            // 🪄 CONTINUOUS AUTO-MATCHING ENGINE
            const activeProjId = part.projectId;
            const projGroups = appState.groups ? appState.groups.filter(g => g.projectId === activeProjId) : [];
            
            // 1. Re-evaluate Group (If empty)
            if (part.groupId === undefined || part.groupId === '') {
                if (!part.extractedGroup) {
                    part.groupId = 'none'; 
                } else {
                    const matchedGroup = projGroups.find(g => g.name.toLowerCase() === part.extractedGroup.toLowerCase());
                    part.groupId = matchedGroup ? matchedGroup.id : ''; 
                }
            }

            // 2. Re-evaluate Material (If empty)
            if (part.materialId === '' && part.extractedMaterial) {
                const matchedMat = safeMaterials.find(m => m.name.toLowerCase() === part.extractedMaterial.toLowerCase());
                if (matchedMat) part.materialId = matchedMat.id;
            }

            // 3. Re-evaluate Profile & Category (If empty)
            if (part.profileId === '') {
                const tolerance = 1.5; 
                const lumberMatch = safeProfiles.find(p => p.type === 'lumber' && Math.abs(p.thickness - part.thickness) <= tolerance && Math.abs(p.width - part.width) <= tolerance);
                const sheetMatch = safeProfiles.find(p => p.type === 'sheet' && Math.abs(p.thickness - part.thickness) <= tolerance);

                if (part.category === 'lumber' && lumberMatch) {
                    part.profileId = lumberMatch.id;
                } else if (part.category === 'sheet' && sheetMatch) {
                    part.profileId = sheetMatch.id;
                } else if (!part.category) {
                    if (lumberMatch) {
                        part.profileId = lumberMatch.id;
                        part.category = 'lumber';
                    } else if (sheetMatch) {
                        part.profileId = sheetMatch.id;
                        part.category = 'sheet';
                    }
                }
            }

            // 🛡️ Final Verification: Ensure assigned IDs still exist (in case user deleted them in Setup)
            const profExists = safeProfiles.find(p => p.id === part.profileId);
            const matExists = safeMaterials.find(m => m.id === part.materialId);
            
            if (!profExists) part.profileId = '';
            if (!matExists) part.materialId = '';
            
            part.status = (part.category && part.profileId && part.materialId && part.groupId !== '') ? 'ready' : 'needs_mapping';

            const tr = document.createElement('tr');
            if (part.status === 'needs_mapping') {
                tr.classList.add('table-warning');
                allGreen = false;
            }

            let badgeClass = part.category ? getCategoryBadgeClass(part.category) : 'bg-warning text-dark fw-bold border border-warning';
            const unitText = appState.settings.displayUnit === 'mm' ? 'mm' : 'in';
            const dimDisplay = `${formatForDisplay(part.thickness)} x ${formatForDisplay(part.width)} x ${formatForDisplay(part.length)}`;
            
            // 🪄 BUILD GROUP DROPDOWN
            let groupBadgeClass = part.groupId !== '' ? 'text-reset' : 'bg-warning fw-bold border border-warning';
            
            let groupOptions = '';
            
            // 🪄 FIXED: Only inject the warning and quick-create options if the group is actually unassigned
            if (part.groupId === '') {
                let missingText = part.extractedGroup ? `⚠️ ${safeHTML(part.extractedGroup)} ${t('msg_missing')}...` : `⚠️ ${t('opt_select')}...`;
                groupOptions += `<option value="" disabled selected>${missingText}</option>`;
                
                if (part.extractedGroup) {
                    groupOptions += `<option value="CREATE_GROUP" class="fw-bold text-success">✨ + ${t('opt_create')} "${safeHTML(part.extractedGroup)}"</option>`;
                }
            }
            
            groupOptions += `<option value="none" ${part.groupId === 'none' ? 'selected' : ''}>-</option>`;
            
            projGroups.forEach(g => {
                groupOptions += `<option value="${g.id}" ${part.groupId === g.id ? 'selected' : ''}>${safeHTML(g.name)}</option>`;
            });

            let profOptions = part.profileId === '' ? `<option value="" disabled selected>⚠️ ${t('opt_assign_profile')}...</option>` : '';
            const filteredProfiles = safeProfiles.filter(p => p.type === part.category);
            filteredProfiles.forEach(p => {
                const label = `${safeHTML(p.name)}`;
                profOptions += `<option value="${p.id}" ${p.id === part.profileId ? 'selected' : ''}>${label}</option>`;
            });

            let matOptions = part.materialId === '' ? `<option value="" disabled selected>⚠️ ${t('opt_assign_material')}...</option>` : '';
            const filteredMaterials = safeMaterials.filter(m => m.category === part.category);
            filteredMaterials.forEach(m => {
                matOptions += `<option value="${m.id}" ${m.id === part.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`;
            });

            tr.innerHTML = `
                <td class="fw-bold px-2 text-reset align-middle w-100" style="max-width: 0;">
                    <div class="text-truncate" title="${safeHTML(part.name)}">
                        <small class="text-reset">${safeHTML(part.name)}</small>
                    </div>
                </td>
                <td>
                    <select class="form-select form-select-sm border-0 bg-transparent" 
                            onchange="updateStagingPart('${part.id}', 'groupId', this.value)">
                        ${groupOptions}
                    </select>
                </td>
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 80px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" 
                                onchange="updateStagingCategory('${part.id}', this.value)" title="${t('title_tap_to_change_category')}">
                            ${!part.category ? `<option value="" disabled selected>⚠️ ${t('opt_select')}</option>` : ''}
                            <option value="lumber" class="bg-light text-dark" ${part.category === 'lumber' ? 'selected' : ''}>${t('opt_lumber')}</option>
                            <option value="sheet" class="bg-light text-dark" ${part.category === 'sheet' ? 'selected' : ''}>${t('opt_sheet')}</option>
                            <option value="fastener" class="bg-light text-dark" ${part.category === 'fastener' ? 'selected' : ''}>${t('opt_fastener')}</option>
                        </select>
                    </div>
                </td>
                <td class="text-center"><small>${part.qty}</small></td>
                <td class="text-center"><small>${dimDisplay}</small></td>
                <td>
                    <select class="form-select form-select-sm border-0 text-center align-middle bg-transparent" onchange="updateStagingPart('${part.id}', 'profileId', this.value)">
                        ${profOptions}
                    </select>
                </td>
                <td class="text-center align-middle">
                    ${(function() {
                        if (!part.category) return '<span class="text-muted small">---</span>';
                        if (part.category === 'lumber') return `<span class="small">${formatForDisplay(part.length)}</span>`;
                        if (part.category === 'sheet') return `<span class="small">${formatForDisplay(part.width)} x ${formatForDisplay(part.length)}</span>`;
                        if (part.category === 'fastener') return `<span class="text-muted small">${t('lbl_qty_only')}</span>`;
                        return '';
                    })()}
                </td>
                <td>
                    <select class="text-center form-select form-select-sm border-0 bg-transparent" onchange="updateStagingPart('${part.id}', 'materialId', this.value)">
                        ${matOptions}
                    </select>
                </td>
                <td class="text-end pe-2">
                    <button class="btn btn-sm py-0 px-2 bg-transparent border-0" onclick="deleteStagingPart('${part.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('btn-commit-import').disabled = !allGreen;

        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        const filterColumns = ['name', 'groupId', 'category', 'profileId', 'materialId'];
        updateFilterUI('stagingParts', filterColumns);

        // 🪄 CALCULATE AND UPDATE THE STICKY FOOTER
        const totalRows = appState.stagingParts.length;
        const totalQty = appState.stagingParts.reduce((sum, part) => sum + (parseInt(part.qty) || 0), 0);
        
        const tfootTotals = document.getElementById('tfoot-import-totals');
        if (tfootTotals) {
            tfootTotals.innerText = `${totalRows} ${t('lbl_rows')}, ${totalQty} ${t('lbl_parts')}`;
        }
    }
    function updateStagingPart(id, field, value) {
        const part = appState.stagingParts.find(p => p.id === id);
        if (part) {
            
            // 🪄 THE QUICK-CREATE INTERCEPTOR
            if (field === 'groupId' && value === 'CREATE_GROUP') {
                const newGroupId = 'GRP-' + Date.now();
                if (!appState.groups) appState.groups = [];
                
                // Inject the new group into the global database
                appState.groups.push({
                    id: newGroupId,
                    projectId: part.projectId,
                    name: part.extractedGroup // Use the exact name extracted from the CSV
                });
                
                saveState(); // Commit to memory instantly
                
                value = newGroupId; // Swap the fake command for the real ID so the part saves correctly
                showToast(t('msg_group_created', { name: part.extractedGroup }));
            }

            part[field] = value;
            
            // Re-evaluate status
            if (part.profileId && part.materialId) part.status = 'ready';
            else part.status = 'needs_mapping';
            
            renderStagingTable(); 
        }
    }
    function updateStagingCategory(id, newCategory) {
        const part = appState.stagingParts.find(p => p.id === id);
        if (part) {
            part.category = newCategory;
            part.profileId = '';
            part.materialId = '';
            part.status = 'needs_mapping'; 
            renderStagingTable(); 
            showToast(t('msg_category_changed_remap'), true);
        }
    }
    function deleteStagingPart(id, isConfirmed = false) {
        // 🪄 The Safety Shield (Exact match to js_parts.html)
        if (!isConfirmed) {
            requestConfirm(t('confirm_remove_part_import'), () => deleteStagingPart(id, true));
            return; 
        }

        appState.stagingParts = appState.stagingParts.filter(p => p.id !== id);
        renderStagingTable(); 
        showToast(t('msg_part_removed_import'), true);
    }
    function commitImport() {
        const unmapped = appState.stagingParts.filter(p => p.status !== 'ready');
        if (unmapped.length > 0) {
            showToast(t('msg_assign_profile_material'), true);
            return;
        }

        if (!appState.parts) appState.parts = [];

        appState.stagingParts.forEach((stg, index) => {
            appState.parts.push({
                id: 'PART-' + Date.now() + '-' + index,
                projectId: stg.projectId,
                category: stg.category,
                name: stg.name,
                qty: stg.qty,
                width: stg.width,   
                length: stg.length, 
                profileId: stg.profileId,
                materialId: stg.materialId
            });
        });

        const importCount = appState.stagingParts.length;

        saveState();
        
        // 🪄 TRAP 5 FIX: Ruthless wipe!
        resetImport();

        navigateTo('view-parts');
        renderPartsView(); 
        showToast(t('msg_import_success', { count: importCount }));
    }
</script>
