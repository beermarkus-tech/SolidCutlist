<script>
    /**
     * Frontend/JS/js_optimizer.html
     * 1D/2D Bin Packing Engine - Two-Stage Siphon (Stock + Store)
     */

    // ==========================================
    // PHASE A: DATA PREP (THE TRIAGE)
    // ==========================================
    function prepOptimizerData(projectIds) {
        if (!appState.parts || appState.parts.length === 0) return [];

        const validParts = appState.parts.filter(p => 
            projectIds.includes(p.projectId) && 
            p.status === 'ready' && 
            (p.category === 'lumber' || p.category === 'sheet')
        );

        const groupedSKUs = {};

        validParts.forEach(part => {
            const skuKey = part.profileId + '|' + part.materialId;
            if (!groupedSKUs[skuKey]) {
                groupedSKUs[skuKey] = {
                    profileId: part.profileId,
                    materialId: part.materialId,
                    category: part.category,
                    partsToCut: []
                };
            }
            for (let i = 0; i < part.qty; i++) {
                groupedSKUs[skuKey].partsToCut.push({
                    partId: part.id,
                    name: part.name,
                    length: part.length,
                    width: part.width || 0,
                    grain: part.grain || 'none'
                });
            }
        });

        const batches = Object.values(groupedSKUs);
        batches.forEach(batch => {
            if (batch.category === 'sheet') {
                batch.partsToCut.sort((a, b) => (b.length * b.width) - (a.length * a.width));
            } else {
                batch.partsToCut.sort((a, b) => b.length - a.length);
            }
        });

        return batches;
    }

    // ==========================================
    // PHASE B: THE TWO-STAGE PACKING ENGINE
    // ==========================================
    function runPackingEngine(projectIds, allowedStoreIds) {
        const batches = prepOptimizerData(projectIds);
        
        const k1D = appState.settings.bladeKerf !== undefined ? appState.settings.bladeKerf : 3.175;
        const t1D = appState.settings.factoryEdgeTrim !== undefined ? appState.settings.factoryEdgeTrim : 6.35;
        const k2D = appState.settings.sheetBladeKerf !== undefined ? appState.settings.sheetBladeKerf : 3.175;
        const t2D = appState.settings.sheetFactoryTrim !== undefined ? appState.settings.sheetFactoryTrim : 6.35;
        const pref2D = appState.settings.optimizer.sheetCutPreference || 'auto';
        const useStock = appState.settings.optimizer.useStock;
        
        const finalCutlist = [];

        batches.forEach(batch => {
            const isSheet = batch.category === 'sheet';
            let currentParts = [...batch.partsToCut]; // The rolling list of parts we still need to cut
            
            // 🪄 STAGE 1: THE SCAVENGER (Shop Stock)
            if (useStock && appState.stock && currentParts.length > 0) {
                // Find matching stock
                const matchingStock = appState.stock.filter(s => 
                    s.profileId === batch.profileId && 
                    s.materialId === batch.materialId && 
                    s.categoryId === batch.category
                );
                
                // Explode quantities into individual boards
                let explodedStock = [];
                matchingStock.forEach(s => {
                    for(let i=0; i<s.qty; i++) explodedStock.push({...s});
                });
                
                // 🪄 PRIORITY: Scraps first, then smallest size first
                explodedStock.sort((a, b) => {
                    if (a.isCutoff !== b.isCutoff) return a.isCutoff ? -1 : 1; 
                    let sizeA = a.length * (a.width || 1);
                    let sizeB = b.length * (b.width || 1);
                    return sizeA - sizeB; 
                });
                
                let usedStockGroups = {}; 
                
                for (let i = 0; i < explodedStock.length; i++) {
                    if (currentParts.length === 0) break; 
                    
                    let stockPiece = explodedStock[i];
                    let packRes;
                    
                    if (isSheet) {
                        let resRip = packSingle2D(currentParts, stockPiece.length, stockPiece.width, stockPiece.grain, k2D, t2D, 'rip');
                        let resCross = packSingle2D(currentParts, stockPiece.length, stockPiece.width, stockPiece.grain, k2D, t2D, 'cross');
                        
                        if (pref2D === 'auto') {
                            let ripPacked = currentParts.length - resRip.unmapped.length;
                            let crossPacked = currentParts.length - resCross.unmapped.length;
                            if (ripPacked > crossPacked) packRes = resRip;
                            else if (crossPacked > ripPacked) packRes = resCross;
                            else packRes = (resRip.totalWaste <= resCross.totalWaste) ? resRip : resCross;
                        } else {
                            packRes = (pref2D === 'rip') ? resRip : resCross;
                        }
                    } else {
                        packRes = packSingle1D(currentParts, stockPiece.length, k1D, t1D);
                    }
                    
                    // If we successfully placed at least one part on this stock piece
                    if (packRes.board.cuts.length > 0) {
                        let key = `${stockPiece.length}|${stockPiece.width || 0}|${stockPiece.grain || 'none'}`;
                        if (!usedStockGroups[key]) {
                            usedStockGroups[key] = {
                                catalogItem: { storeId: 'shop_stock', length: stockPiece.length, width: stockPiece.width || 0, grain: stockPiece.grain || 'none', price: 0 },
                                totalCost: 0,
                                boardsNeeded: 0,
                                layout: [],
                                waste: 0
                            };
                        }
                        usedStockGroups[key].boardsNeeded++;
                        usedStockGroups[key].layout.push(packRes.board);
                        usedStockGroups[key].waste += packRes.totalWaste;
                        
                        currentParts = packRes.unmapped; // Carry over only what didn't fit
                    }
                }
                
                // Log the consumed stock into the final output
                Object.values(usedStockGroups).forEach(group => {
                    finalCutlist.push({ sku: batch, success: true, purchase: group });
                });
            }

            // 🪄 STAGE 2: THE STORE RUN (Infinite Supply)
            if (currentParts.length > 0) {
                const vendorOptions = appState.catalog.filter(c => 
                    c.profileId === batch.profileId && 
                    c.materialId === batch.materialId &&
                    c.categoryId === batch.category &&
                    allowedStoreIds.includes(c.storeId)
                );

                if (vendorOptions.length === 0) {
                    finalCutlist.push({ sku: batch, error: `Missing store inventory for remaining ${currentParts.length} parts.` });
                    return; 
                }

                let bestOption = null;
                let lowestCost = Infinity;

                vendorOptions.forEach(option => {
                    const boardCost = (typeof calculateCostPerPiece === 'function') ? calculateCostPerPiece(option) : option.price;
                    let packResult;

                    if (isSheet) {
                        if (pref2D === 'auto') {
                            let resRip = pack2D(currentParts, option.length, option.width, option.grain, k2D, t2D, 'rip');
                            let resCross = pack2D(currentParts, option.length, option.width, option.grain, k2D, t2D, 'cross');
                            if (resRip.unmapped.length > 0 && resCross.unmapped.length > 0) return; 
                            if (resRip.unmapped.length > 0) packResult = resCross;
                            else if (resCross.unmapped.length > 0) packResult = resRip;
                            else {
                                if (resRip.boards.length < resCross.boards.length) packResult = resRip;
                                else if (resCross.boards.length < resRip.boards.length) packResult = resCross;
                                else packResult = (resRip.totalWaste <= resCross.totalWaste) ? resRip : resCross;
                            }
                        } else {
                            packResult = pack2D(currentParts, option.length, option.width, option.grain, k2D, t2D, pref2D);
                        }
                    } else {
                        packResult = pack1D(currentParts, option.length, k1D, t1D);
                    }
                    
                    if (packResult && packResult.unmapped.length === 0) {
                        const totalCost = packResult.boards.length * boardCost;
                        if (totalCost < lowestCost) {
                            lowestCost = totalCost;
                            bestOption = {
                                catalogItem: option,
                                totalCost: totalCost,
                                boardsNeeded: packResult.boards.length,
                                layout: packResult.boards,
                                waste: packResult.totalWaste
                            };
                        }
                    }
                });

                if (bestOption) {
                    finalCutlist.push({ sku: batch, success: true, purchase: bestOption });
                } else {
                    finalCutlist.push({ sku: batch, error: `Remaining ${currentParts.length} parts are too large for any store boards.` });
                }
            }
        });

        return finalCutlist;
    }

    // --- ALGORITHM HELPERS ---
    
    // Evaluates 2D constraints and Grain
    function checkFit(part, rect, sheetGrain) {
        let fitsNormal = (part.width <= rect.w && part.length <= rect.l);
        let fitsRotated = (part.length <= rect.w && part.width <= rect.l);
        let normalLegal = true;
        let rotatedLegal = true;
        
        if (part.grain !== 'none' && sheetGrain !== 'none') {
            if (part.grain === sheetGrain) rotatedLegal = false; 
            else normalLegal = false; 
        }
        
        let canNormal = fitsNormal && normalLegal;
        let canRotated = fitsRotated && rotatedLegal;

        if (!canNormal && !canRotated) return { fits: false };
        if (canNormal && !canRotated) return { fits: true, rotated: false };
        if (canRotated && !canNormal) return { fits: true, rotated: true };

        // 🪄 TIER 1: MAX TILING CAPACITY (The Grid Saver)
        // Which orientation theoretically fits the most identical parts in this specific rectangle?
        let normalCapacity = Math.floor(rect.w / part.width) * Math.floor(rect.l / part.length);
        let rotatedCapacity = Math.floor(rect.w / part.length) * Math.floor(rect.l / part.width);

        if (normalCapacity !== rotatedCapacity) {
            return { fits: true, rotated: rotatedCapacity > normalCapacity };
        }

        // 🪄 TIER 2: EXACT FIT BONUS (Zero-Waste Edge)
        // If capacity is tied, does one orientation perfectly close out an axis with zero remainder?
        let normalExact = (rect.w % part.width === 0 ? 1 : 0) + (rect.l % part.length === 0 ? 1 : 0);
        let rotatedExact = (rect.w % part.length === 0 ? 1 : 0) + (rect.l % part.width === 0 ? 1 : 0);

        if (normalExact !== rotatedExact) {
            return { fits: true, rotated: rotatedExact > normalExact };
        }

        // 🪄 TIER 3: SLE HEURISTIC (The Fallback)
        // If everything is perfectly tied, fall back to leaving the tightest possible gap.
        let normalMinEdge = Math.min(rect.w - part.width, rect.l - part.length);
        let rotatedMinEdge = Math.min(rect.w - part.length, rect.l - part.width);

        if (normalMinEdge === rotatedMinEdge) {
            // Tie-breaker: Maximize the Longest Leftover Edge to keep scrap chunky
            let normalMaxEdge = Math.max(rect.w - part.width, rect.l - part.length);
            let rotatedMaxEdge = Math.max(rect.w - part.length, rect.l - part.width);
            return { fits: true, rotated: rotatedMaxEdge > normalMaxEdge };
        }

        return { fits: true, rotated: rotatedMinEdge < normalMinEdge };
    }

    function place2DPart(board, rectIndex, part, rotated, kerf, pref) {
        let rect = board.freeRects.splice(rectIndex, 1)[0]; 
        let pw = rotated ? part.length : part.width;
        let pl = rotated ? part.width : part.length;
        
        board.cuts.push({ partId: part.partId, name: part.name, x: rect.x, y: rect.y, w: pw, l: pl, rotated: rotated });
        
        let rect1, rect2;
        // 🪄 FIXED: Rip cut travels along the Length (l). It leaves a full-length strip.
        if (pref === 'rip') { 
            rect1 = { x: rect.x + pw + kerf, y: rect.y, w: Math.max(0, rect.w - pw - kerf), l: rect.l };
            rect2 = { x: rect.x, y: rect.y + pl + kerf, w: pw, l: Math.max(0, rect.l - pl - kerf) };
        } else {
        // 🪄 FIXED: Cross cut travels along the Width (w). It leaves a full-width strip.
            rect1 = { x: rect.x, y: rect.y + pl + kerf, w: rect.w, l: Math.max(0, rect.l - pl - kerf) };
            rect2 = { x: rect.x + pw + kerf, y: rect.y, w: Math.max(0, rect.w - pw - kerf), l: pl };
        }
        
        if (rect1.w > 0 && rect1.l > 0) board.freeRects.push(rect1);
        if (rect2.w > 0 && rect2.l > 0) board.freeRects.push(rect2);
    }

    // --- INFINITE SUPPLY ENGINES (Store Loop) ---
    function pack1D(parts, boardLength, kerf, trim) {
        let boards = [];
        let unmapped = [];
        let totalWaste = 0;
        parts.forEach(part => {
            let placed = false;
            for (let i = 0; i < boards.length; i++) {
                // 🪄 NEW LOGIC: If it fits, instantly subtract the part AND the kerf needed to sever it
                if (boards[i].remaining >= part.length) {
                    boards[i].cuts.push(part);
                    boards[i].remaining = Math.max(0, boards[i].remaining - part.length - kerf);
                    placed = true;
                    break;
                }
            }
            if (!placed) {
                let usableLength = boardLength - trim;
                if (usableLength >= part.length) {
                    // 🪄 First cut also eats a kerf to separate it from the remaining scrap
                    boards.push({ 
                        cuts: [part], 
                        remaining: Math.max(0, usableLength - part.length - kerf) 
                    });
                } else unmapped.push(part);
            }
        });
        boards.forEach(b => totalWaste += b.remaining);
        return { boards, unmapped, totalWaste };
    }

    function pack2D(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, pref) {
        let boards = [];
        let unmapped = [];
        let totalWaste = 0;
        parts.forEach(part => {
            let placed = false;
            for (let b of boards) {
                b.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
                for (let i = 0; i < b.freeRects.length; i++) {
                    let fit = checkFit(part, b.freeRects[i], sheetGrain);
                    if (fit.fits) {
                        place2DPart(b, i, part, fit.rotated, kerf, pref);
                        placed = true;
                        break;
                    }
                }
                if (placed) break;
            }
            if (!placed) {
                let wUsable = Math.max(0, sheetWidth - trim);
                let lUsable = Math.max(0, sheetLength - trim);
                let newBoard = { cuts: [], freeRects: [{ x: trim, y: trim, w: wUsable, l: lUsable }] };
                let fit = checkFit(part, newBoard.freeRects[0], sheetGrain);
                if (fit.fits) {
                    place2DPart(newBoard, 0, part, fit.rotated, kerf, pref);
                    boards.push(newBoard);
                } else unmapped.push(part); 
            }
        });
        boards.forEach(b => b.freeRects.forEach(r => totalWaste += (r.w * r.l)));
        return { boards, unmapped, totalWaste };
    }

    // --- FINITE SUPPLY ENGINES (Stock Loop) ---
    function packSingle1D(parts, length, kerf, trim) {
        let usableLength = length - trim;
        let board = { cuts: [], remaining: usableLength };
        let unmapped = [];
        parts.forEach(part => {
            // 🪄 NEW LOGIC: Ensure the kerf is taken out of the remaining scrap
            if (board.remaining >= part.length) {
                board.cuts.push(part);
                board.remaining = Math.max(0, board.remaining - part.length - kerf);
            } else {
                unmapped.push(part);
            }
        });
        return { board, unmapped, totalWaste: board.remaining };
    }

    function packSingle2D(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, pref) {
        let wUsable = Math.max(0, sheetWidth - trim);
        let lUsable = Math.max(0, sheetLength - trim);
        let board = { cuts: [], freeRects: [{ x: trim, y: trim, w: wUsable, l: lUsable }] };
        let unmapped = [];
        let totalWaste = 0;
        parts.forEach(part => {
            let placed = false;
            board.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
            for (let i = 0; i < board.freeRects.length; i++) {
                let fit = checkFit(part, board.freeRects[i], sheetGrain);
                if (fit.fits) {
                    place2DPart(board, i, part, fit.rotated, kerf, pref);
                    placed = true;
                    break;
                }
            }
            if (!placed) unmapped.push(part);
        });
        board.freeRects.forEach(r => totalWaste += (r.w * r.l));
        return { board, unmapped, totalWaste };
    }

    // ==========================================
    // PHASE C: OPTIMIZER UI & CONFIG STATE
    // ==========================================
    function renderOptimizerConfig() {
        if (!appState.settings.optimizer) {
            appState.settings.optimizer = { useStock: true, sheetCutPreference: 'auto', selectedProjects: [], selectedStores: [] };
        }
        if (!appState.settings.optimizer.sheetCutPreference) appState.settings.optimizer.sheetCutPreference = 'auto'; 
        if (!Array.isArray(appState.settings.optimizer.selectedProjects)) appState.settings.optimizer.selectedProjects = [];
        if (!Array.isArray(appState.settings.optimizer.selectedStores)) appState.settings.optimizer.selectedStores = [];
        
        const optState = appState.settings.optimizer;
        
        let html = `
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="opt-use-stock" ${optState.useStock ? 'checked' : ''} onchange="saveOptConfig()">
                <label class="form-check-label fw-bold text-secondary" for="opt-use-stock">Use Shop Stock</label>
            </div>
            <div class="mb-4 p-2 rounded border">
                <label class="form-label fw-bold text-secondary mb-1" style="font-size: 0.85rem;">Sheet Cut Preference</label>
                <select class="form-select form-select-sm" id="opt-sheet-cut" onchange="saveOptConfig()">
                    <option value="auto" ${optState.sheetCutPreference === 'auto' ? 'selected' : ''}>Automatic (Least Waste)</option>
                    <option value="rip" ${optState.sheetCutPreference === 'rip' ? 'selected' : ''}>Rip Cut First (Length)</option>
                    <option value="cross" ${optState.sheetCutPreference === 'cross' ? 'selected' : ''}>Cross Cut First (Width)</option>
                </select>
            </div>
            <h6 class="fw-bold text-secondary border-bottom pb-1 mb-2 mt-3">Projects to Cut</h6>
            <div id="opt-project-list" class="mb-3">`;
            
        if (appState.projects && appState.projects.length > 0) {
            appState.projects.forEach(p => {
                const isChecked = optState.selectedProjects.includes(p.id) ? 'checked' : '';
                html += `
                <div class="form-check">
                    <input class="form-check-input opt-project-checkbox" type="checkbox" value="${p.id}" id="chk-proj-${p.id}" ${isChecked} onchange="saveOptConfig()">
                    <label class="form-check-label" for="chk-proj-${p.id}">${safeHTML(p.name)}</label>
                </div>`;
            });
        } else {
            html += `<small class="text-danger">No projects available.</small>`;
        }
        
        html += `</div><h6 class="fw-bold text-secondary border-bottom pb-1 mb-2 mt-3">Allowed Stores</h6><div id="opt-store-list">`;
            
        if (appState.stores && appState.stores.length > 0) {
            appState.stores.forEach(s => {
                const isChecked = optState.selectedStores.includes(s.id) ? 'checked' : '';
                html += `
                <div class="form-check">
                    <input class="form-check-input opt-store-checkbox" type="checkbox" value="${s.id}" id="chk-store-${s.id}" ${isChecked} onchange="saveOptConfig()">
                    <label class="form-check-label" for="chk-store-${s.id}">${safeHTML(s.name)}</label>
                </div>`;
            });
        } else {
             html += `<small class="text-danger">No stores configured.</small>`;
        }
        html += `</div>`;
        document.getElementById('optimizer-config-form').innerHTML = html;
        validateOptConfig();
    }
    
    function saveOptConfig() {
        appState.settings.optimizer.useStock = document.getElementById('opt-use-stock').checked;
        appState.settings.optimizer.sheetCutPreference = document.getElementById('opt-sheet-cut').value;
        const projChecks = document.querySelectorAll('.opt-project-checkbox:checked');
        appState.settings.optimizer.selectedProjects = Array.from(projChecks).map(cb => cb.value);
        const storeChecks = document.querySelectorAll('.opt-store-checkbox:checked');
        appState.settings.optimizer.selectedStores = Array.from(storeChecks).map(cb => cb.value);
        saveState();
        validateOptConfig();
    }
    
    function validateOptConfig() {
        const btn = document.getElementById('btn-calculate-cutlist');
        const optState = appState.settings.optimizer;
        if (optState.selectedProjects.length === 0) {
            btn.disabled = true;
            btn.innerText = "Select a Project";
        } else if (optState.selectedStores.length === 0 && !optState.useStock) {
            btn.disabled = true;
            btn.innerText = "Select a Store or Stock";
        } else {
            btn.disabled = false;
            btn.innerText = "Calculate Cutlist";
        }
    }

    // ==========================================
    // PHASE D: EXECUTION & RENDERING
    // ==========================================
    function triggerCalculation() {
        const optState = appState.settings.optimizer;
        const results = runPackingEngine(optState.selectedProjects, optState.selectedStores);
        document.getElementById('optimizer-empty-state').classList.add('d-none');
        document.getElementById('optimizer-tab-content').classList.remove('d-none');
        appState.latestResults = results;

        // 🪄 1. Reveal the Shopping Controls, ensure Diagrams are hidden
        const shopCtrl = document.getElementById('shopping-controls');
        const diagCtrl = document.getElementById('diagram-controls');
        if (shopCtrl) shopCtrl.classList.remove('d-none');
        if (diagCtrl) diagCtrl.classList.add('d-none');

        // 🪄 2. Force the Bootstrap tab back to "Shopping" so the UI matches the buttons
        const defaultTabBtn = document.getElementById('tab-shopping');
        if (defaultTabBtn) {
            const tabInstance = new bootstrap.Tab(defaultTabBtn);
            tabInstance.show();
        }
        
        renderShoppingListTab(results);
        if (typeof renderDiagramsTab === 'function') renderDiagramsTab(results);
        if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(results);
    }

    function renderShoppingListTab(results) {
        const container = document.getElementById('pane-shopping');
        let totalCost = 0;
        let totalWeightKg = 0;
        let html = '';
        const isMetric = appState.settings.displayUnit === 'mm';
        const weightUnit = isMetric ? 'kg' : 'lbs';
        const currency = appState.settings.currency || '$';

        const storeBuckets = {};
        
        results.forEach(res => {
            if (res.error) return; 
            
            const purchase = res.purchase;
            const storeId = purchase.catalogItem.storeId;
            
            // 🪄 NEW: Gracefully handle the Pseudo-Store
            const storeName = (storeId === 'shop_stock') 
                ? '🏪 My Shop Stock' 
                : (appState.stores.find(s => s.id === storeId)?.name || 'Unknown Store');
            
            if (!storeBuckets[storeName]) storeBuckets[storeName] = [];
            
            const prof = appState.profiles.find(p => p.id === res.sku.profileId);
            const mat = appState.materials.find(m => m.id === res.sku.materialId);
            
            let batchWeight = 0;
            if (prof && mat) {
                let volumeM3 = 0;
                if (res.sku.category === 'sheet') {
                    volumeM3 = (purchase.catalogItem.length * purchase.catalogItem.width * prof.thickness) / 1000000000;
                } else {
                    volumeM3 = (purchase.catalogItem.length * prof.width * prof.thickness) / 1000000000;
                }
                batchWeight = volumeM3 * mat.density * purchase.boardsNeeded;
            }
            
            totalCost += purchase.totalCost;
            totalWeightKg += batchWeight;

            const lengthDisplay = res.sku.category === 'sheet' 
                ? `${formatForDisplay(purchase.catalogItem.length)} x ${formatForDisplay(purchase.catalogItem.width)}`
                : formatForDisplay(purchase.catalogItem.length);

            storeBuckets[storeName].push({
                qty: purchase.boardsNeeded,
                profName: prof?.name || 'Unknown',
                matName: mat?.name || 'Unknown',
                lengthDisplay: lengthDisplay,
                cost: purchase.totalCost,
                weight: batchWeight,
                url: purchase.catalogItem.url || purchase.catalogItem.link || ''
            });
        });

        const totalWeightDisplay = isMetric ? totalWeightKg : (totalWeightKg * 2.20462);

        html += `
            <div class="alert alert-info d-flex justify-content-between align-items-center mb-4 shadow-sm border-info">
                <div>
                    <h5 class="mb-0 fw-bold">Grand Total</h5>
                    <small class="text-muted">Combined across all selected stores</small>
                </div>
                <div class="text-end">
                    <h4 class="mb-0 fw-bold text-success">${currency}${totalCost.toFixed(2)}</h4>
                    <span class="badge bg-secondary">⚖️ ${totalWeightDisplay.toFixed(2)} ${weightUnit}</span>
                </div>
            </div>
        `;

        // 🪄 NEW: Push Shop Stock to the very top of the list if it exists
        const sortedStores = Object.keys(storeBuckets).sort((a, b) => {
            if (a === '🏪 My Shop Stock') return -1;
            if (b === '🏪 My Shop Stock') return 1;
            return a.localeCompare(b);
        });

        for (const storeName of sortedStores) {
            const items = storeBuckets[storeName];
            const headerClass = storeName === '🏪 My Shop Stock' ? 'bg-success' : 'bg-dark';

            html += `
                <div class="card mb-3 border-0 shadow-sm">
                    <div class="card-header ${headerClass} text-white py-2">
                        <h6 class="mb-0">${safeHTML(storeName)}</h6>
                    </div>
                    <ul class="list-group list-group-flush">
            `;
            
            items.forEach(item => {
                const wDisplay = isMetric ? item.weight : (item.weight * 2.20462);

                const linkIcon = (item.url && storeName !== '🏪 My Shop Stock') 
                    ? `<a href="${item.url}" target="_blank" class="text-decoration-none ms-2 fs-5" title="Open in Store">🔗</a>` 
                    : '';

                html += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary rounded-pill me-2 fs-6">${item.qty} x</span>
                            <span class="fw-bold">${safeHTML(item.profName)}</span>
                            <span class="text-muted"> - ${safeHTML(item.matName)}</span>
                            ${linkIcon} <br><small class="text-muted ms-5">Size: ${item.lengthDisplay} <span class="display-unit-label"></span></small>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold text-success">${currency}${item.cost.toFixed(2)}</div>
                            <small class="text-muted">⚖️ ${wDisplay.toFixed(2)} ${weightUnit}</small>
                        </div>
                    </li>
                `;
            });
            html += `</ul></div>`;
        }
        
        const errors = results.filter(r => r.error);
        if (errors.length > 0) {
            html += `<h6 class="text-danger fw-bold mt-4 border-bottom pb-1">⚠️ Sourcing Errors</h6><ul class="list-group">`;
            errors.forEach(err => {
                const pName = appState.profiles.find(p=>p.id === err.sku.profileId)?.name || '?';
                const mName = appState.materials.find(m=>m.id === err.sku.materialId)?.name || '?';
                html += `<li class="list-group-item list-group-item-danger"><small><strong>${pName} (${mName}):</strong> ${err.error}</small></li>`;
            });
            html += `</ul>`;
        }
        container.innerHTML = html;
        updateUnitLabels(); 
    }

    // ==========================================
    // PHASE E: ANALYTICS & OFFCUTS
    // ==========================================
    function renderAnalyticsTab(results) {
        const container = document.getElementById('pane-analytics');
        const threshold = appState.settings.cutoffThreshold !== undefined ? appState.settings.cutoffThreshold : 200.0; 
        const minW = appState.settings.sheetScrapMinWidth !== undefined ? appState.settings.sheetScrapMinWidth : 50.0;   
        const minL = appState.settings.sheetScrapMinLength !== undefined ? appState.settings.sheetScrapMinLength : 400.0;
        const isMetric = appState.settings.displayUnit === 'mm';
        
        let totalRawVolume = 0;
        let totalPartVolume = 0;
        let totalOffcutVolume = 0;
        let totalWasteVolume = 0; 
        const usableOffcuts = []; 

        results.forEach(res => {
            if (res.error) return;
            
            const purchase = res.purchase;
            const isSheet = res.sku.category === 'sheet';
            const prof = appState.profiles.find(p => p.id === res.sku.profileId);
            const mat = appState.materials.find(m => m.id === res.sku.materialId);
            if (!prof || !mat) return;
            
            const thick = prof.thickness || 0;
            const sheetW = isSheet ? purchase.catalogItem.width : (prof.width || 0);
            const sheetL = purchase.catalogItem.length;
            
            purchase.layout.forEach(board => {
                const boardVol = sheetL * sheetW * thick;
                totalRawVolume += boardVol;
                let boardPartsVol = 0;
                let boardOffcutVol = 0;

                board.cuts.forEach((cut) => {
                    const cutVol = isSheet ? (cut.l * cut.w * thick) : (cut.length * sheetW * thick);
                    boardPartsVol += cutVol;
                    totalPartVolume += cutVol;
                });

                if (isSheet) {
                    board.freeRects.forEach(rect => {
                        const rectVol = rect.l * rect.w * thick;
                        const shortestEdge = Math.min(rect.l, rect.w);
                        const longestEdge = Math.max(rect.l, rect.w);
                        
                        if (shortestEdge >= minW && longestEdge >= minL) {
                            boardOffcutVol += rectVol;
                            
                            // 🪄 DYNAMIC GRAIN MAPPING
                            let originalGrain = purchase.catalogItem.grain || 'none';
                            let offcutGrain = 'none';

                            if (originalGrain !== 'none') {
                                // Find if the grain runs along the physically shorter edge
                                let grainOnShortEdge = false;
                                if (originalGrain === 'length' && shortestEdge === rect.l) grainOnShortEdge = true;
                                if (originalGrain === 'width' && shortestEdge === rect.w) grainOnShortEdge = true;
                                
                                // Since we force 'width' to be the short edge, map the grain appropriately
                                offcutGrain = grainOnShortEdge ? 'width' : 'length';
                            }

                            usableOffcuts.push({ 
                                category: 'sheet',
                                profileId: prof.id,
                                materialId: mat.id,
                                profName: prof.name, 
                                matName: mat.name, 
                                grain: offcutGrain,
                                length: longestEdge, // 🪄 FORCE Length = Longest Edge
                                width: shortestEdge  // 🪄 FORCE Width = Shortest Edge
                            });
                        }
                    });
                } else {
                    if (board.remaining >= threshold) {
                        boardOffcutVol += (board.remaining * sheetW * thick);
                        usableOffcuts.push({ 
                            category: 'lumber',
                            profileId: prof.id,
                            materialId: mat.id,
                            profName: prof.name, 
                            matName: mat.name, 
                            grain: 'none',
                            length: board.remaining 
                        });
                    }
                }
                
                totalOffcutVolume += boardOffcutVol;
                totalWasteVolume += (boardVol - boardPartsVol - boardOffcutVol);
            });
        });

        // 🪄 THE STACKER: Group identical offcuts and count their quantity
        const groupedOffcutsMap = {};
        usableOffcuts.forEach(off => {
            // Create a unique fingerprint for this exact piece of scrap
            const key = `${off.category}|${off.profName}|${off.matName}|${off.grain}|${off.length}|${off.width || 0}`;
            
            if (!groupedOffcutsMap[key]) {
                groupedOffcutsMap[key] = { ...off, qty: 0 };
            }
            groupedOffcutsMap[key].qty += 1;
        });
        const stackedOffcuts = Object.values(groupedOffcutsMap);

        let pctYield = 0, pctOffcut = 0, pctWaste = 0;
        if (totalRawVolume > 0) {
            pctYield = (totalPartVolume / totalRawVolume) * 100;
            pctOffcut = (totalOffcutVolume / totalRawVolume) * 100;
            pctWaste = (totalWasteVolume / totalRawVolume) * 100;
        }

        let html = `
            <div class="row mt-3 g-3">
                <div class="col-md-4">
                    <div class="card bg-success text-white shadow-sm h-100 border-0">
                        <div class="card-body text-center py-3">
                            <h6 class="text-uppercase mb-1 opacity-75">Yield (Actual Parts)</h6>
                            <h2 class="mb-0 fw-bold">${pctYield.toFixed(1)}%</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-primary text-white shadow-sm h-100 border-0">
                        <div class="card-body text-center py-3">
                            <h6 class="text-uppercase mb-1 opacity-75">Usable Offcut</h6>
                            <h2 class="mb-0 fw-bold">${pctOffcut.toFixed(1)}%</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-danger text-white shadow-sm h-100 border-0">
                        <div class="card-body text-center py-3">
                            <h6 class="text-uppercase mb-1 opacity-75">True Waste (Scrap & Sawdust)</h6>
                            <h2 class="mb-0 fw-bold">${pctWaste.toFixed(1)}%</h2>
                        </div>
                    </div>
                </div>
            </div>
            <div class="progress mt-4 mb-4 shadow-sm" style="height: 25px;">
                <div class="progress-bar bg-success fw-bold" role="progressbar" style="width: ${pctYield}%" title="Yield: ${pctYield.toFixed(1)}%">Yield</div>
                <div class="progress-bar bg-primary fw-bold" role="progressbar" style="width: ${pctOffcut}%" title="Offcut: ${pctOffcut.toFixed(1)}%">Offcut</div>
                <div class="progress-bar bg-danger fw-bold" role="progressbar" style="width: ${pctWaste}%" title="Waste: ${pctWaste.toFixed(1)}%">Waste</div>
            </div>
            <div class="card shadow-sm border-secondary mt-4">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <h6 class="card-title mb-0 fw-bold">📦 Usable Offcuts Generated</h6>
                    <button class="btn btn-warning btn-sm py-0" onclick="openCommitModal()"><b>📥 Commit to Stock</b></button>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover mb-0">
                        <thead>
                            <tr>
                                <th class="col-category text-center text-nowrap" onclick="sortOffcuts('category')" style="cursor: pointer;">Category ⇅</th>
                                <th class="col-qty text-center" onclick="sortOffcuts('qty')" style="cursor: pointer;">Qty ⇅</th>
                                <th class="col-profile text-center text-nowrap" onclick="sortOffcuts('profName')" style="cursor: pointer;">Profile ⇅</th>
                                <th class="col-size text-center text-nowrap" onclick="sortOffcuts('length')" style="cursor: pointer;">Size ⇅</th>
                                <th class="col-material text-center text-nowrap" onclick="sortOffcuts('matName')" style="cursor: pointer;">Material ⇅</th>
                                <th class="col-grain text-center text-nowrap" onclick="sortOffcuts('grain')" style="cursor: pointer;">Grain ⇅</th>
                            </tr>
                        </thead>
                        <tbody id="table-offcuts-body">
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        container.innerHTML = html;
        window.currentOffcuts = stackedOffcuts;
        window.currentOffcutSort = { field: 'length', asc: false };
        sortOffcuts('length'); 
    }

    function sortOffcuts(field) {
        if (window.currentOffcutSort.field === field) {
            window.currentOffcutSort.asc = !window.currentOffcutSort.asc;
        } else {
            window.currentOffcutSort.field = field;
            window.currentOffcutSort.asc = true;
        }
        window.currentOffcuts.sort((a, b) => {
            let valA = a[field];
            let valB = b[field];
            if (field === 'length') { 
                valA = a.length * (a.width || 1);
                valB = b.length * (b.width || 1);
            }
            if (valA < valB) return window.currentOffcutSort.asc ? -1 : 1;
            if (valA > valB) return window.currentOffcutSort.asc ? 1 : -1;
            return 0;
        });
        
        const tbody = document.getElementById('table-offcuts-body');
        let html = '';
        if (window.currentOffcuts.length > 0) {
            window.currentOffcuts.forEach(off => {
                const sizeStr = off.width ? `${formatForDisplay(off.width)} x ${formatForDisplay(off.length)}` : formatForDisplay(off.length);
                
                const badgeClass = getCategoryBadgeClass(off.category);
                const grainStr = off.grain === 'none' ? '-' : (off.grain.charAt(0).toUpperCase() + off.grain.slice(1));

                // 🪄 THE UNIFORM CATEGORY BADGE
                const categoryBadgeHtml = `
                    <div class="d-flex justify-content-center px-1">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${off.category === 'lumber' ? 'selected' : ''}>Lumber</option>
                            <option value="sheet" class="bg-light text-dark" ${off.category === 'sheet' ? 'selected' : ''}>Sheet</option>
                            <option value="fastener" class="bg-light text-dark" ${off.category === 'fastener' ? 'selected' : ''}>Fastener</option>
                        </select>
                    </div>
                `;

                html += `<tr>
                            <td class="text-center align-middle">${categoryBadgeHtml}</td>
                            <td class="text-center align-middle">${off.qty}</td>
                            <td class="text-center align-middle">${safeHTML(off.profName)}</td>
                            <td class="text-center align-middle fw-bold text-primary">${sizeStr} <span class="display-unit-label"></span></td>
                            <td class="text-center align-middle">${safeHTML(off.matName)}</td>
                            <td class="text-center align-middle">${grainStr}</td>
                         </tr>`;
            });
        } else {
            html += `<tr><td colspan="5" class="text-center text-muted py-3">No usable offcuts generated in this run.</td></tr>`;
        }
        tbody.innerHTML = html;
        updateUnitLabels();
    }

    // ==========================================
    // PHASE F: COMMIT TO STOCK ENGINE
    // ==========================================
    let commitModalInstance = null;

    function openCommitModal() {
        if (!window.currentOffcuts || window.currentOffcuts.length === 0) {
            showToast('No offcuts available to commit.', true);
            return;
        }
        
        if (!commitModalInstance) {
            commitModalInstance = new bootstrap.Modal(document.getElementById('modal-commit-offcuts'));
        }
        
        const tbody = document.getElementById('table-commit-body');
        let html = '';
        
        window.currentOffcuts.forEach((off, index) => {
            // Track if it was already committed to prevent duplicates
            const isCommitted = off.committed === true;
            const rowClass = isCommitted ? 'opacity-50 bg-light' : '';
            const disableAttr = isCommitted ? 'disabled' : '';
            
            const badgeClass = getCategoryBadgeClass(off.category);
            const sizeStr = off.width ? `${formatForDisplay(off.width)} x ${formatForDisplay(off.length)}` : formatForDisplay(off.length);
            const catStr = off.category === 'sheet' ? 'Sheet' : 'Lumber';

            html += `
                <tr class="${rowClass}">
                    <td class="align-middle">
                        <div class="d-flex justify-content-center px-1">
                            <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                    style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                                <option value="lumber" class="bg-light text-dark" ${off.category === 'lumber' ? 'selected' : ''}>Lumber</option>
                                <option value="sheet" class="bg-light text-dark" ${off.category === 'sheet' ? 'selected' : ''}>Sheet</option>
                                <option value="fastener" class="bg-light text-dark" ${off.category === 'fastener' ? 'selected' : ''}>Fastener</option>
                            </select>
                        </div>
                    </td>
                    <td class="text-center align-middle">${safeHTML(off.profName)}</td>
                    <td class="text-center align-middle">${safeHTML(off.matName)}</td>
                    <td class="text-center align-middle fw-bold text-primary">${sizeStr} <span class="display-unit-label"></span></td>
                    <td class="text-center align-middle">
                        <input type="number" id="commit-qty-${index}" class="form-control form-control-sm text-center fw-bold" value="${off.qty}" min="1" max="${off.qty}" ${disableAttr}>
                    </td>
                    <td class="ps-3 align-middle text-center">
                        <input class="form-check-input commit-checkbox" type="checkbox" value="${index}" ${disableAttr} onchange="toggleCommitQty(${index}, this.checked)">
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
        updateUnitLabels();
        commitModalInstance.show();
    }

    function toggleCommitCheckboxes(checkStatus) {
        const checkboxes = document.querySelectorAll('.commit-checkbox:not(:disabled)');
        checkboxes.forEach(cb => {
            cb.checked = checkStatus;
        });
    }

    function executeCommitToStock() {
        const checkboxes = document.querySelectorAll('.commit-checkbox:checked:not(:disabled)');
        if (checkboxes.length === 0) {
            showToast('No items selected.', true);
            return;
        }

        if (!appState.stock) appState.stock = [];
        let itemsAdded = 0;

        checkboxes.forEach(cb => {
            const index = parseInt(cb.value);
            const off = window.currentOffcuts[index];
            const saveQty = parseInt(document.getElementById(`commit-qty-${index}`).value) || 1;

            // 1. Create the new Stock Database Object
            const newStockItem = {
                id: 'STK-' + Date.now() + Math.floor(Math.random() * 1000), // Ensure unique IDs in fast loops
                categoryId: off.category,
                profileId: off.profileId,
                materialId: off.materialId,
                qty: saveQty,
                length: off.length,
                width: off.width || 0,
                grain: off.grain || 'none',
                isCutoff: true // 🪄 Automatically tags it as scrap!
            };

            // 2. Push to global inventory
            appState.stock.unshift(newStockItem);
            
            // 3. Mark the local optimizer memory so it can't be double-clicked
            off.committed = true; 
            
            // 4. If they only saved a partial quantity, update the remaining visual number
            off.qty = off.qty - saveQty;
            if (off.qty > 0) off.committed = false; // Allow them to commit the rest later!

            itemsAdded += saveQty;
        });

        saveState();
        if (typeof renderStockTable === 'function') renderStockTable(); // Update the UI in the background
        
        commitModalInstance.hide();
        showToast(`Successfully moved ${itemsAdded} scrap(s) to Shop Stock!`);
        
        // Redraw the analytics table to reflect the new remaining quantities
        sortOffcuts(window.currentOffcutSort.field); 

        setTimeout(() => {
            // 1. Switch the main app view
            if (typeof navigateTo === 'function') {
                navigateTo('view-dictionaries');
            }
            
            // 2. Programmatically click the "My Stock" tab to activate it
            const stockTab = document.getElementById('tab-stock');
            if (stockTab) {
                stockTab.click();
            }
        }, 300); // 300ms delay allows the Bootstrap modal to fade out smoothly before the screen jumps
    }

    // ==========================================
    // TAB BEHAVIOR LOGIC
    // ==========================================
    
    // 🪄 Listen for Bootstrap tab changes to conditionally show the respective control buttons
    document.addEventListener('DOMContentLoaded', () => {
        const resultsTabs = document.getElementById('resultsTabs');
        if (resultsTabs) {
            resultsTabs.addEventListener('shown.bs.tab', function (event) {
                const diagramControls = document.getElementById('diagram-controls');
                const shoppingControls = document.getElementById('shopping-controls');
                
                if (!diagramControls || !shoppingControls) return;

                // 1. Hide everything first
                diagramControls.classList.add('d-none');
                shoppingControls.classList.add('d-none');

                // 2. Reveal only the controls for the active tab
                if (event.target.id === 'tab-diagrams') {
                    diagramControls.classList.remove('d-none');
                } else if (event.target.id === 'tab-shopping') {
                    shoppingControls.classList.remove('d-none');
                }
                // (If they click the Analytics tab, both will remain hidden!)
            });
        }
    });

</script>
