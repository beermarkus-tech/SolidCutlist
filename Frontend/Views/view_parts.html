<div class="row mt-3">
    <div class="col-12">
        <h2 class="border-bottom pb-2">Partlist</h2>
        <p class="text-muted">Select a project, define the category, and enter your parts.
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">
        <h6 class="card-title mb-0">🧩 Current Partlist</h6>
    </div>
    <div class="card-body bg-light">
        <form id="form-add-part" onsubmit="handleAddPart(event)">
            <div class="row g-2 align-items-end">
                
                <div class="col-sm">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Project</label>
                    <select class="form-select form-select-sm" id="part-project" onchange="handleProjectChange()" required>
                    </select>
                </div>
                <div class="col-sm">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Group</label>
                    <div class="input-group input-group-sm">
                        <select class="form-select form-select-sm border-warning" id="part-group">
                            <option value="">No Group</option>
                        </select>
                        <button type="button" class="btn btn-outline-secondary px-2" onclick="openGroupModalFromParts()" title="Manage Groups">⚙️</button>
                    </div>
                </div>
                <div class="col-sm-2">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Part Name</label>
                    <input type="text" class="form-control form-control-sm" id="part-name" required>
                </div>
                <div class="col-sm">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Category</label>
                    <select class="form-select form-select-sm border-warning" id="part-category" onchange="handleCategoryChange()" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="lumber">Lumber</option>
                        <option value="sheet">Sheet</option>
                        <option value="fastener">Fastener</option>
                    </select>
                </div>
                <div class="col-sm-1" style="max-width: 80px;">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Qty</label>
                    <input type="number" class="form-control form-control-sm text-center" id="part-qty" value="1" min="1" required>
                </div>
                <div class="col-sm-1">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Width</label>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control form-control-sm" id="part-width" disabled>
                        <span class="input-group-text display-unit-label">mm</span>
                    </div>
                </div>
                <div class="col-sm-1">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Length</label>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control form-control-sm" id="part-length" required disabled>
                        <span class="input-group-text display-unit-label">mm</span>
                    </div>
                </div>

                <div class="col-sm">
                    <label id="label-part-profile" class="form-label form-label-sm fw-bold text-secondary mb-1">Profile</label>
                    <select class="form-select form-select-sm" id="part-profile" required disabled></select>
                </div>
                <div class="col-sm">
                    <label class="form-label form-label-sm fw-bold text-secondary mb-1">Material</label>
                    <select class="form-select form-select-sm" id="part-material" required disabled></select>
                </div>

                <div class="col-sm-1">
                    <button type="submit" class="btn btn-primary btn-sm w-100" id="btn-add-part" disabled>Add</button>
                </div>
                
            </div>
        </form>
        <hr>
        <div class="table-responsive">
            <table class="table table-sm table-hover table-striped align-middle">
                <thead class="table-light">
                    <tr>
                        <th onclick="handleSort('parts', 'projectId', 'string')">Project ⇅</th>
                        <th onclick="handleSort('parts', 'groupId', 'string')">Group ⇅</th>
                        <th onclick="handleSort('parts', 'name', 'string')">Part Name ⇅</th>
                        <th onclick="handleSort('parts', 'category', 'string')" class="col-2 text-center">Category ⇅</th>
                        <th onclick="handleSort('parts', 'qty', 'number')" class="text-center">Qty ⇅</th>
                        <th onclick="handleSort('parts', 'length', 'number')" class="text-center">Size (<span class="display-unit-label">mm</span>) ⇅</th>
                        <th onclick="handleSort('parts', 'profileId', 'string')">Profile (<span class="display-unit-label">mm</span>) ⇅</th>
                        <th onclick="handleSort('parts', 'materialId', 'string')">Material ⇅</th>
                        <th onclick="handleSort('parts', 'weight', 'number')" class="text-center text-nowrap">Weight ⇅</th>
                        <th onclick="handleSort('parts', 'status', 'string')" class="text-center">Status ⇅</th>
                        <th class="text-end"></th>
                    </tr>
                </thead>
                <tbody id="table-parts-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>
