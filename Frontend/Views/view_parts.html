<div class="row mt-3">
    <div class="col-12">
        <h2 class="border-bottom pb-2">Partlist</h2>
        <p class="text-muted">Select a project, define the category, and enter your parts.
    </div>
</div>

<div class="card shadow-sm border-primary mb-4">
    <div class="card-header bg-primary text-white py-2">
        <h6 class="card-title mb-0">➕ Add New Part</h6>
    </div>
    <div class="card-body bg-light">
        <form id="form-add-part" onsubmit="handleAddPart(event)">
            <div class="row g-2 align-items-end">
                
                <div class="col-6 col-md-2">
                    <label class="form-label form-label-sm fw-bold mb-1">Project</label>
                    <select class="form-select form-select-sm" id="part-project" required>
                        </select>
                </div>
                <div class="col-6 col-md-auto">
                    <label class="form-label form-label-sm fw-bold mb-1">Category</label>
                    <select class="form-select form-select-sm border-warning" id="part-category" onchange="handleCategoryChange()" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="lumber">Lumber</option>
                        <option value="sheet">Sheet</option>
                        <option value="fastener">Fastener</option>
                    </select>
                </div>

                <div class="col-8 col-md-2">
                    <label class="form-label form-label-sm mb-1">Part Name</label>
                    <input type="text" class="form-control form-control-sm" id="part-name" placeholder="e.g., Left Leg" required>
                </div>
                <div class="col-4 col-md-auto" style="max-width: 80px;">
                    <label class="form-label form-label-sm mb-1">Qty</label>
                    <input type="number" class="form-control form-control-sm text-center" id="part-qty" value="1" min="1" required>
                </div>

                <div class="col-6 col-md-1">
                    <label class="form-label form-label-sm mb-1">Width (<span class="display-unit-label">mm</span>)</label>
                    <input type="text" class="form-control form-control-sm" id="part-width" onchange="calculateWeight()" disabled>
                </div>
                <div class="col-6 col-md-1">
                    <label class="form-label form-label-sm mb-1">Length (<span class="display-unit-label">mm</span>)</label>
                    <input type="text" class="form-control form-control-sm" id="part-length" onchange="calculateWeight()" required disabled>
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label form-label-sm mb-1" id="label-profile">Profile / Thickness (<span class="display-unit-label">mm</span>)</label>
                    <select class="form-select form-select-sm" id="part-profile" onchange="calculateWeight()" required disabled>
                        <option value="" disabled selected>Select Category First</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label class="form-label form-label-sm mb-1">Material</label>
                    <select class="form-select form-select-sm" id="part-material" onchange="calculateWeight()" required disabled>
                        <option value="" disabled selected>Select Category First</option>
                    </select>
                </div>

                <div class="col-8 col-md-auto">
                    <label class="form-label form-label-sm text-muted mb-1">Est. Weight</label>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control bg-transparent border-0 text-end px-1" id="part-weight" value="0.00" readonly style="width: 60px;">
                        <span class="input-group-text bg-transparent border-0 px-1 density-weight-label">kg</span>
                    </div>
                </div>
                <div class="col-4 col-md-auto">
                    <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold" id="btn-add-part" disabled>Add</button>
                </div>
                
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-secondary text-white py-2 d-flex justify-content-between align-items-center">
        <h6 class="card-title mb-0">📋 Parts List</h6>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-sm table-hover table-striped align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Project</th>
                        <th>Name</th>
                        <th class="col-2 text-center">Category</th>
                        <th>Qty</th>
                        <th class="text-center">W x L (<span class="display-unit-label">mm</span>)</th>
                        <th>Profile</th>
                        <th>Material</th>
                        <th>Weight</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody id="table-parts-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>
