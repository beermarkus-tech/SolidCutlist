<script>
    // ==========================================
    // MOBILE EXECUTION ENGINE (JOBS)
    // ==========================================

    /** Generates a new isolated Job sandbox from selected projects/groups. */
    function createJobSandbox(jobName, selections) {
        if (!jobName || !selections || selections.length === 0) {
            console.error("Job Generator: Cannot create job without a name and selections.");
            if (typeof showToast === 'function') showToast(t('msg_select_items_to_build'), "warning");
            return null;
        }

        let clonedParts = [];
        let partCounter = 1;

        // 1. THE EXTRACTOR & CLONER
        selections.forEach(sel => {
            let targetParts = [];

            // Find the parts based on what the user selected (Project vs. Group)
            if (sel.type === 'project') {
                targetParts = appState.parts.filter(p => p.projectId === sel.id);
                // NEW: Filter out any groups the user explicitly unchecked
                if (sel.excludedGroups && sel.excludedGroups.length > 0) {
                    targetParts = targetParts.filter(p => !sel.excludedGroups.includes(p.groupId));
                }
            } else if (sel.type === 'group') {
                targetParts = appState.parts.filter(p => p.groupId === sel.id);
            }

            // Clone the parts and apply the multiplier
            targetParts.forEach(originalPart => {
                // Create a deep, disconnected copy of the part
                let newPart = JSON.parse(JSON.stringify(originalPart));
                
                // Assign a temporary execution ID so it never overwrites master parts
                newPart.id = 'JOB-PART-' + Date.now() + '-' + partCounter++;
                
                // Keep a breadcrumb to the original part (useful for future UI)
                newPart.originalPartId = originalPart.id;

                // Multiply the quantity (e.g., "Build 4 of this chair")
                let multi = parseInt(sel.multiplier) || 1;
                newPart.qty = (parseInt(originalPart.qty) || 1) * multi;

                clonedParts.push(newPart);
            });
        });

        if (clonedParts.length === 0) {
            if (typeof showToast === 'function') showToast(t('msg_no_parts_in_selection'), "warning");
            return null;
        }

        // 2. MINT THE JOB OBJECT (The Sandbox Capsule)
        // Lean catalog: only catalog items for SKUs present in this job's parts.
        // No need to copy the entire price database.
        const _sandboxSKUs = new Set(clonedParts.map(p => `${p.profileId}|${p.materialId}|${p.category || ''}`));
        const _sandboxCatalog = (appState.catalog || []).filter(c =>
            _sandboxSKUs.has(`${c.profileId}|${c.materialId}|${c.categoryId || ''}`)
        );
        const _sandboxStock = (appState.stock || []).filter(s =>
            _sandboxSKUs.has(`${s.profileId}|${s.materialId}|${s.categoryId || ''}`)
        );

        const newJob = {
            id: 'JOB-' + Date.now() + Math.floor(Math.random() * 1000),
            name: jobName,
            status: 'draft',
            timestamp: Date.now(),
            parts: clonedParts,  // was: partsToOptimize (undefined in this scope — bug fix)
            catalog: JSON.parse(JSON.stringify(_sandboxCatalog)),
            stock: JSON.parse(JSON.stringify(_sandboxStock)),
            settings: JSON.parse(JSON.stringify(appState.settings)),
            selections: selections // 🪄 MAKE SURE THIS LINE EXISTS!
        };

        // 3. PUSH & SYNC
        appState.jobs.push(newJob);
        saveState(); // Instantly triggers local storage and debounces the Google Sheet sync
        
        console.log(`🪵 Job Sandbox '${jobName}' minted successfully with ${clonedParts.length} execution parts.`);
        if (typeof showToast === 'function') showToast(t('msg_job_created', { name: jobName }), "success");
        
        return newJob;
    }

    // ==========================================
    // PHASE 3: LOAD JOB & SANDBOX EXECUTION
    // ==========================================
    function renderLoadJobList() {
        const listContainer = document.getElementById('job-load-list');
        listContainer.innerHTML = '';

        if (!appState.jobs || appState.jobs.length === 0) {
            listContainer.innerHTML = `<div class="text-center text-muted p-4"><em>${t('msg_no_saved_jobs')}</em></div>`;
            return;
        } 
        
        const sortedJobs = [...appState.jobs].sort((a, b) => b.timestamp - a.timestamp);

        sortedJobs.forEach(job => {
            const dateStr = new Date(job.timestamp).toLocaleDateString();
            const partsCount = job.parts ? job.parts.length : 0;

            listContainer.innerHTML += `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0 fw-bold">${safeHTML(job.name)}</h6>
                        <small class="text-muted">Created: ${dateStr} &nbsp;•&nbsp; ${partsCount} Parts</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-danger" title="${t('title_delete_job')}" onclick="deleteJobSandbox('${job.id}')">🗑️</button>
                        <button class="btn btn-sm btn-primary fw-bold" onclick="executeLoadJob('${job.id}')">Load</button>
                    </div>
                </div>
            `;
        });
    }
    function openLoadJobModal() {
        // 1. Draw the fresh list
        renderLoadJobList();
        
        // 2. 🪄 FIX: Use getOrCreateInstance to prevent stacking multiple backdrops
        const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('loadJobModal'));
        modal.show();
    }
    function deleteJobSandbox(jobId) {
        requestConfirm(t('confirm_delete_job'), () => {
            const jobIndex = appState.jobs.findIndex(j => j.id === jobId);
            if (jobIndex === -1) return;
            
            appState.jobs.splice(jobIndex, 1);
            saveState();
            
            if (typeof showToast === 'function') showToast(t('msg_job_deleted'), "success");
            
            // 🪄 FIX: Only redraw the HTML list. Do not spawn a new modal!
            renderLoadJobList();
            
        }, 'danger', 'Delete');
    }
    function executeLoadJob(jobId) {
        const job = appState.jobs.find(j => j.id === jobId);
        if (!job) {
            if (typeof showToast === 'function') showToast(t('msg_error_job_not_found'), true);
            return;
        }

        // 1. Hide the modal
        const modalEl = document.getElementById('loadJobModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();

        if (typeof showToast === 'function') showToast(t('msg_loading_job', { name: job.name }), "info");

        // 🪄 2. RECONSTRUCT THE UI STATE BEFORE LOCKING
        // Replace the master tree with the Read-Only Sandbox Tree
        if (typeof renderSavedJobTree === 'function') {
            renderSavedJobTree(job);
        }

        // Restore Settings Inputs (Bulletproofed & Formatted)
        if (job.settings) {
            const setVal = (id, val, fallback) => {
                const el = document.getElementById(id);
                if (el) el.value = formatForDisplay(val !== undefined ? val : fallback);
            };

            setVal('setting-kerf', job.settings.bladeKerf, 3.175);
            setVal('setting-sheet-kerf', job.settings.sheetBladeKerf, 3.175);
            setVal('setting-factory-trim', job.settings.factoryEdgeTrim, 6.35);
            setVal('setting-sheet-trim', job.settings.sheetFactoryTrim, 6.35);
            setVal('setting-cutoff', job.settings.cutoffThreshold, 200.0);
            setVal('setting-sheet-scrap-width', job.settings.sheetScrapMinWidth, 50.0);
            setVal('setting-sheet-scrap-length', job.settings.sheetScrapMinLength, 400.0);
            
            const stockInput = document.getElementById('opt-use-stock');
            if (stockInput) {
                stockInput.checked = (job.settings.optimizer && job.settings.optimizer.useStock !== undefined)
                    ? job.settings.optimizer.useStock
                    : true;
            }

            // Transport settings
            const transport = job.settings.optimizer && job.settings.optimizer.transport;
            const transportToggle = document.getElementById('opt-transport-enable');
            const transportPanel = document.getElementById('transport-settings-panel');
            const transportEnabled = transport && transport.enabled;
            if (transportToggle) transportToggle.checked = !!transportEnabled;
            if (transportPanel) transportPanel.style.display = transportEnabled ? '' : 'none';
            if (transport) {
                setVal('setting-transport-board-lmax',  transport.boardLmax,   0);
                setVal('setting-transport-board-margin', transport.boardMargin, 20);
                setVal('setting-transport-sheet-lmax',  transport.sheetLmax,   0);
                setVal('setting-transport-sheet-margin', transport.sheetMargin, 10);
            }

            // Sheet cut preference
            const sheetCutEl = document.getElementById('opt-sheet-cut');
            if (sheetCutEl && job.settings.optimizer && job.settings.optimizer.sheetCutPreference) {
                sheetCutEl.value = job.settings.optimizer.sheetCutPreference;
            }
        }

        // 3. Lock the UI into the "Saved" state and display the badge
        if (typeof toggleConfiguratorState === 'function') toggleConfiguratorState(true, true);
        if (typeof setCurrentJobLabel === 'function') setCurrentJobLabel(job.name);

        // 4. 🪄 THE MAGIC TRICK: Temporarily shadow master data with Sandbox data
        const masterCatalog = appState.catalog;
        const masterSettings = appState.settings;
        const masterStock = appState.stock;

        appState.catalog = job.catalog;
        appState.settings = job.settings;
        // Use the job's frozen stock snapshot. Older jobs without job.stock fall back to live stock.
        appState.stock = job.stock !== undefined ? job.stock : appState.stock;

        // 5. Run the packing engine using the frozen parts array
        let allowedStores = appState.stores ? appState.stores.map(s => s.id) : [];
        let results;
        try {
            results = runPackingEngine(job.parts, allowedStores);
        } finally {
            // 6. Instantly restore master data to protect the database!
            // try-finally guarantees restore even if the engine throws an exception.
            appState.catalog = masterCatalog;
            appState.settings = masterSettings;
            appState.stock = masterStock;
        }

        // 7. Track the active job in AppState (Single Source of Truth) + RAM cache + Mobile backup
        if (!appState.ui) appState.ui = {};
        appState.ui.activeJobId = job.id;
        window.activeJobId = job.id; // RAM cache for synchronous checks
        localStorage.setItem('activeJobBackup', JSON.stringify(job));

        // 8. Render the UI exactly like a normal calculation
        document.getElementById('optimizer-empty-state').classList.add('d-none');
        document.getElementById('optimizer-tab-content').classList.remove('d-none');
        appState.latestResults = results;

        const shopCtrl = document.getElementById('shopping-controls');
        const diagCtrl = document.getElementById('diagram-controls');
        if (shopCtrl) shopCtrl.classList.remove('d-none');
        if (diagCtrl) diagCtrl.classList.add('d-none');

        const defaultTabBtn = document.getElementById('tab-shopping');
        if (defaultTabBtn) {
            const tabInstance = new bootstrap.Tab(defaultTabBtn);
            tabInstance.show();
        }

        if (typeof renderShoppingListTab === 'function') renderShoppingListTab(results);
        if (typeof renderDiagramsTab === 'function') renderDiagramsTab(results);
        if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(results);
        if (typeof renderSandboxPartlistTab === 'function') renderSandboxPartlistTab(job.parts); // 🪄 Render 4th Tab
        
        if (typeof setUnsavedChangesState === 'function') setUnsavedChangesState('clean'); // 🪄 FORCE CLEAN STATE
    }

    // ==========================================
    // JOB CONFIGURATOR UI BRIDGES
    // ==========================================
    function openSaveJobModal() {
        document.getElementById('new-job-name').value = '';
        const modal = new bootstrap.Modal(document.getElementById('saveJobModal'));
        modal.show();
    }
    function executeSaveJob() {
        const jobName = document.getElementById('new-job-name').value.trim();
        if (!jobName) {
            if (typeof showToast === 'function') showToast(t('msg_enter_job_name'), "warning");
            return;
        }

        let selections = [];
        let partsToOptimize = [];

        // 1. RECORD UI SELECTIONS (Used by the Load Modal to re-check the boxes)
        document.querySelectorAll('.proj-check:checked').forEach(chk => {
            const projId = chk.id.replace('chk-', '');
            const multi = parseInt(document.getElementById('multi-' + projId).value) || 1;
            
            let excludedGroupIds = [];
            // Find manually unchecked groups (this includes our 'Ungrouped Parts' pseudo-group)
            document.querySelectorAll(`.grp-of-${projId}:not(:checked)`).forEach(unChk => {
                excludedGroupIds.push(unChk.id.replace('chk-', ''));
            });

            selections.push({ type: 'project', id: projId, multiplier: multi, excludedGroups: excludedGroupIds });
        });

        // 2. EXTRACT PARTS EXACTLY LIKE RUNOPTIMIZATION() (Bulletproof Math Sync)
        if (!appState.parts || appState.parts.length === 0) {
            if (typeof showToast === 'function') showToast(t('msg_no_parts_in_db'), "warning");
            return;
        }

        let partCounter = 1;

        appState.parts.forEach(originalPart => {
            const projCheckbox = document.getElementById('chk-' + originalPart.projectId);
            if (!projCheckbox || !projCheckbox.checked) return; 
            
            const projMulti = parseInt(document.getElementById('multi-' + originalPart.projectId).value) || 1;
            let finalMulti = projMulti;

            if (!originalPart.groupId || originalPart.groupId.trim() === '') {
                const noGroupCheckbox = document.getElementById('chk-nogroup-' + originalPart.projectId);
                if (!noGroupCheckbox || !noGroupCheckbox.checked) return;
                const grpMulti = parseInt(document.getElementById('multi-nogroup-' + originalPart.projectId).value) || 1;
                finalMulti = projMulti * grpMulti;
            } else {
                const grpCheckbox = document.getElementById('chk-' + originalPart.groupId);
                if (!grpCheckbox || !grpCheckbox.checked) return;
                const grpMulti = parseInt(document.getElementById('multi-' + originalPart.groupId).value) || 1;
                finalMulti = projMulti * grpMulti;
            }

            // Clone and stamp the execution parts
            let newPart = JSON.parse(JSON.stringify(originalPart));
            newPart.id = 'JOB-PART-' + Date.now() + '-' + partCounter++;
            newPart.originalPartId = originalPart.id;
            newPart.qty = (parseInt(originalPart.qty) || 1) * finalMulti;
            partsToOptimize.push(newPart);
        });

        if (partsToOptimize.length === 0) {
            if (typeof showToast === 'function') showToast(t('msg_select_project_or_group'), "warning");
            return;
        }

        // 3. MINT THE JOB SANDBOX
        // Lean catalog: only the specific boards the optimizer chose or failed on.
        // Never copy the entire price database into a job.
        const _catalogMap = new Map();
        (appState.latestResults || []).forEach(res => {
            // Winning vendor board
            if (res.purchase?.catalogItem && res.purchase.catalogItem.storeId !== 'shop_stock') {
                const c = res.purchase.catalogItem;
                if (!_catalogMap.has(c.id)) _catalogMap.set(c.id, c);
            }
            // Failed vendor boards (user can edit these to fix the error)
            (res.failedCatalogItems || []).forEach(c => {
                if (c.id && !_catalogMap.has(c.id)) _catalogMap.set(c.id, c);
            });
        });

        // Lean stock: only stock items for the SKUs the optimizer drew from shop stock.
        const _stockItems = [];
        const _usedStockSKUs = new Set();
        const _seenStockIds = new Set();
        (appState.latestResults || []).forEach(res => {
            if (res.purchase?.catalogItem?.storeId === 'shop_stock' && res.sku) {
                const key = `${res.sku.profileId}|${res.sku.materialId}|${res.sku.category}`;
                if (!_usedStockSKUs.has(key)) {
                    _usedStockSKUs.add(key);
                    (appState.stock || [])
                        .filter(s => s.profileId === res.sku.profileId &&
                                     s.materialId === res.sku.materialId &&
                                     s.categoryId === res.sku.category)
                        .forEach(s => {
                            const sid = s.id || `${key}|${s.length}`;
                            if (!_seenStockIds.has(sid)) {
                                _seenStockIds.add(sid);
                                _stockItems.push(s);
                            }
                        });
                }
            }
        });

        const newJob = {
            id: 'JOB-' + Date.now() + Math.floor(Math.random() * 1000),
            name: jobName,
            status: 'draft',
            timestamp: Date.now(),
            parts: partsToOptimize,
            catalog: JSON.parse(JSON.stringify([..._catalogMap.values()])),
            stock: JSON.parse(JSON.stringify(_stockItems)),
            settings: JSON.parse(JSON.stringify(appState.settings)),
            selections: selections,
            purchasedItems: Object.keys(window._transientPurchasedItems || {}).length
                ? { ...window._transientPurchasedItems }
                : undefined
        };

        // 4. PUSH TO STATE & CLEANUP
        window._transientPurchasedItems = {}; // consumed — clear transient
        appState.jobs.push(newJob);
        saveState();

        const modalEl = document.getElementById('saveJobModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
        
        if (!appState.ui) appState.ui = {};
        appState.ui.activeJobId = newJob.id;
        window.activeJobId = newJob.id; // RAM cache for synchronous checks
        localStorage.setItem('activeJobBackup', JSON.stringify(newJob)); // 🪄 CREATE THE PERSISTENT BACKUP
        
        if (typeof setCurrentJobLabel === 'function') setCurrentJobLabel(newJob.name);
        if (typeof toggleConfiguratorState === 'function') toggleConfiguratorState(true, true); 
        if (typeof setUnsavedChangesState === 'function') setUnsavedChangesState('clean');

        // 🪄 CHANGE: Re-render the shopping list right now so it instantly becomes editable!
        if (typeof renderShoppingListTab === 'function' && appState.latestResults) {
            renderShoppingListTab(appState.latestResults);
        }

        if (typeof showToast === 'function') showToast(t('msg_job_created', { name: jobName }), "success");
    }

    // ==========================================
    // PHASE 4: SMART RE-OPTIMIZATION
    // ==========================================
    // ==========================================
    // MOBILE ACTION BAR
    // ==========================================
    // 'load'        — no active job: Load button only
    // 'clean'       — job active, no changes: Load button + gear
    // 'recalculate' — job active, settings changed: Recalculate + gear
    // 'dirty'       — job active, recalculated: Undo + Save + gear
    function setMobileBarState(state) {
        const barLoad   = document.getElementById('mobile-bar-load');
        const barRecalc = document.getElementById('mobile-bar-recalculate');
        const barActions= document.getElementById('mobile-bar-actions');
        const gearLoad  = document.getElementById('mob-settings-btn-load');
        if (!barLoad) return;
        barLoad.style.display    = 'none';
        if (barRecalc)  barRecalc.style.display  = 'none';
        if (barActions) barActions.style.display = 'none';
        const mobLabel = document.getElementById('mobile-current-job-label');
        if (mobLabel) mobLabel.classList.toggle('d-none', state === 'load');
        if (state === 'load') {
            barLoad.style.display = 'flex';
            if (gearLoad) gearLoad.classList.add('d-none');
        } else if (state === 'clean') {
            barLoad.style.display = 'flex';
            if (gearLoad) gearLoad.classList.remove('d-none');
        } else if (state === 'recalculate') {
            if (barRecalc) barRecalc.style.display = 'flex';
        } else if (state === 'dirty') {
            if (barActions) barActions.style.display = 'flex';
        }
    }
    // Kept for any call sites not yet migrated
    function setMobileDirty(dirty) {
        setMobileBarState(dirty ? 'dirty' : (window.activeJobId ? 'clean' : 'load'));
    }

    function openMobileSettings() {
        const activeJob = window.activeJobId && appState.jobs
            ? appState.jobs.find(j => j.id === window.activeJobId)
            : null;
        if (!activeJob || !activeJob.settings) return;
        const s = activeJob.settings;
        const tr = s.optimizer && s.optimizer.transport;
        const setMobVal = (id, val, fallback) => {
            const el = document.getElementById(id);
            if (el) el.value = formatForDisplay(val !== undefined ? val : fallback);
        };
        // Transport toggle + panel
        const trToggle = document.getElementById('mob-transport-enable');
        const trPanel  = document.getElementById('mob-transport-settings-panel');
        const trEnabled = tr && tr.enabled;
        if (trToggle) trToggle.checked = !!trEnabled;
        if (trPanel)  trPanel.style.display = trEnabled ? '' : 'none';
        if (tr) {
            setMobVal('mob-transport-board-lmax',   tr.boardLmax,   0);
            setMobVal('mob-transport-board-margin', tr.boardMargin, 20);
            setMobVal('mob-transport-sheet-lmax',   tr.sheetLmax,   0);
            setMobVal('mob-transport-sheet-margin', tr.sheetMargin, 10);
        }
        // Sheet cut preference
        const sheetCutEl = document.getElementById('mob-sheet-cut');
        if (sheetCutEl) sheetCutEl.value = (s.optimizer && s.optimizer.sheetCutPreference) || 'auto';
        // Kerf
        setMobVal('mob-kerf',         s.bladeKerf,        3.175);
        setMobVal('mob-sheet-kerf',   s.sheetBladeKerf,   3.175);
        // Trim
        setMobVal('mob-factory-trim', s.factoryEdgeTrim,  6.35);
        setMobVal('mob-sheet-trim',   s.sheetFactoryTrim, 6.35);
        // Scrap
        setMobVal('mob-cutoff',              s.cutoffThreshold,    200.0);
        setMobVal('mob-sheet-scrap-width',   s.sheetScrapMinWidth,  50.0);
        setMobVal('mob-sheet-scrap-length',  s.sheetScrapMinLength, 400.0);
    }

    function handleMobileSettingsValueChange() {
        const activeJob = window.activeJobId && appState.jobs
            ? appState.jobs.find(j => j.id === window.activeJobId)
            : null;
        if (!activeJob) return;
        // Show/hide mob transport panel
        const trToggle = document.getElementById('mob-transport-enable');
        const trPanel  = document.getElementById('mob-transport-settings-panel');
        if (trToggle && trPanel) trPanel.style.display = trToggle.checked ? '' : 'none';
        // Read helpers
        const getVal = id => { const el = document.getElementById(id); return el ? parseToBaseUnit(el.value) : 0; };
        const getChk = id => { const el = document.getElementById(id); return el ? el.checked : false; };
        const getSel = id => { const el = document.getElementById(id); return el ? el.value : ''; };
        // Write directly to job.settings — never touch master appState.settings
        if (!activeJob.settings) activeJob.settings = {};
        activeJob.settings.bladeKerf           = getVal('mob-kerf');
        activeJob.settings.sheetBladeKerf      = getVal('mob-sheet-kerf');
        activeJob.settings.cutoffThreshold     = getVal('mob-cutoff');
        activeJob.settings.sheetScrapMinWidth  = getVal('mob-sheet-scrap-width');
        activeJob.settings.sheetScrapMinLength = getVal('mob-sheet-scrap-length');
        activeJob.settings.factoryEdgeTrim     = getVal('mob-factory-trim');
        activeJob.settings.sheetFactoryTrim    = getVal('mob-sheet-trim');
        if (!activeJob.settings.optimizer) activeJob.settings.optimizer = {};
        if (!activeJob.settings.optimizer.transport) activeJob.settings.optimizer.transport = {};
        activeJob.settings.optimizer.transport.enabled     = getChk('mob-transport-enable');
        activeJob.settings.optimizer.transport.boardLmax   = getVal('mob-transport-board-lmax');
        activeJob.settings.optimizer.transport.boardMargin = getVal('mob-transport-board-margin');
        activeJob.settings.optimizer.transport.sheetLmax   = getVal('mob-transport-sheet-lmax');
        activeJob.settings.optimizer.transport.sheetMargin = getVal('mob-transport-sheet-margin');
        activeJob.settings.optimizer.sheetCutPreference    = getSel('mob-sheet-cut');
        // Mark dirty — requires manual Recalculate
        if (typeof setUnsavedChangesState === 'function') setUnsavedChangesState('dirty_input');
    }

    function mobilePressUndo() {
        executeUndoChanges();
    }

    function mobilePresseSave() {
        requestConfirm(
            t('confirm_save_job_changes'),
            executeSaveChanges,
            'warning',
            t('btn_save_changes')
        );
    }

    function setUnsavedChangesState(state) {
        // 🪄 FIX: Targeting exactly by ID so it never fails!
        const btnAction1 = document.getElementById('btn-active-action1');
        const btnSave = document.getElementById('btn-active-save');
        const btnLoad = document.getElementById('btn-active-load');
        
        if (!btnAction1 || !btnSave || !btnLoad) return;

        if (state === 'clean') {
            btnAction1.innerText = t('btn_restart');
            btnAction1.dataset.state = 'restart';
            btnAction1.className = 'btn btn-primary flex-grow-1';
            btnAction1.onclick = resetConfigurator;

            // Explicitly repair the Save button back to defaults before hiding
            btnSave.innerText = t('btn_save_job');
            btnSave.className = 'btn btn-success flex-grow-1 fw-bold';
            btnSave.onclick = openSaveJobModal;
            btnSave.classList.add('d-none'); // Hide Save

            btnLoad.innerText = t('btn_load_job');
            btnLoad.className = 'btn btn-outline-secondary flex-grow-1';
            btnLoad.onclick = openLoadJobModal;
            btnLoad.classList.remove('d-none'); // Show Load

            setMobileBarState(window.activeJobId ? 'clean' : 'load');
        }
        else if (state === 'dirty_input') {
            btnAction1.innerText = t('btn_recalculate');
            btnAction1.dataset.state = 'recalculate';
            btnAction1.className = 'btn btn-info flex-grow-1';
            btnAction1.onclick = executeRecalculate;

            btnSave.classList.add('d-none'); // Hide Save

            btnLoad.innerText = t('btn_load_job');
            btnLoad.className = 'btn btn-outline-secondary flex-grow-1';
            btnLoad.onclick = openLoadJobModal;
            btnLoad.classList.remove('d-none'); // Show Load

            setMobileBarState('recalculate');
        }
        else if (state === 'dirty_recalculated') {
            btnAction1.innerText = t('btn_undo_changes');
            btnAction1.dataset.state = 'undo';
            btnAction1.className = 'btn btn-danger flex-grow-1';
            btnAction1.onclick = executeUndoChanges;

            btnSave.innerText = t('btn_save_changes');
            btnSave.className = 'btn btn-success flex-grow-1';
            btnSave.onclick = executeSaveChanges;
            btnSave.classList.remove('d-none'); // Show Save Changes

            btnLoad.classList.add('d-none'); // Hide Load

            setMobileDirty(true);
        }
    }
    function executeUndoChanges() {
        // Pull from RAM or fallback to LocalStorage if the browser purged the RAM
        const activeJobId = window.activeJobId || localStorage.getItem('activeJobId');
        const activeJobBackup = localStorage.getItem('activeJobBackup');
        
        if (!activeJobId || !activeJobBackup) return;
        
        const jobIndex = appState.jobs.findIndex(j => j.id === activeJobId);
        if (jobIndex === -1) return;
        
        // 1. Overwrite the dirty RAM job with our pristine hard-drive photograph
        appState.jobs[jobIndex] = JSON.parse(activeJobBackup);
        
        // 2. Run the load sequence to revert the math and redraw the UI
        executeLoadJob(activeJobId);
        
        if (typeof showToast === 'function') showToast(t('msg_changes_undone'), "info");
    }
    function executeRecalculate() {
        if (!window.activeJobId) return;
        const job = appState.jobs.find(j => j.id === window.activeJobId);
        if (!job) return;

        if (typeof showToast === 'function') showToast(t('msg_recalculating'), "info");

        // 🪄 THE MAGIC TRICK: Temporarily shadow master data with Sandbox data
        const masterCatalog = appState.catalog;
        const masterSettings = appState.settings;
        const masterStock = appState.stock;

        appState.catalog = job.catalog;
        appState.settings = job.settings;
        // Use the job's frozen stock snapshot. Older jobs without job.stock fall back to live stock.
        appState.stock = job.stock !== undefined ? job.stock : appState.stock;

        // Run the packing engine using the frozen parts array
        let allowedStores = appState.stores ? appState.stores.map(s => s.id) : [];
        let results;
        try {
            results = runPackingEngine(job.parts, allowedStores);
        } finally {
            // Instantly restore master data to protect the database!
            // try-finally guarantees restore even if the engine throws an exception.
            appState.catalog = masterCatalog;
            appState.settings = masterSettings;
            appState.stock = masterStock;
        }

        // Render the UI
        appState.latestResults = results;
        if (typeof renderShoppingListTab === 'function') renderShoppingListTab(results);
        if (typeof renderDiagramsTab === 'function') renderDiagramsTab(results);
        if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(results);
        if (typeof renderSandboxPartlistTab === 'function') renderSandboxPartlistTab(job.parts); // 🪄 Render 4th Tab

        // Shift UI state to allow saving
        setUnsavedChangesState('dirty_recalculated');
    }
    function executeSaveChanges() {
        const activeJobId = window.activeJobId || localStorage.getItem('activeJobId');
        if (!activeJobId) return;
        
        // Push everything to persistent storage
        saveState(); 
        
        // 🪄 Update our pristine photograph so future Undos revert to THIS new save!
        const job = appState.jobs.find(j => j.id === activeJobId);
        if (job) {
            localStorage.setItem('activeJobBackup', JSON.stringify(job));
        }
        
        setUnsavedChangesState('clean');
        
        if (typeof toggleConfiguratorState === 'function') {
            toggleConfiguratorState(true, true);
        }
        
        if (typeof showToast === 'function') showToast(t('msg_job_changes_saved'), "success");
    }
</script>
