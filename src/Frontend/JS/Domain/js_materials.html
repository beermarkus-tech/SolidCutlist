<script>
    // ==========================================
    // STARTER PACK
    // ==========================================

    function _isStarterPackAvailable() {
        return (appState.materials || []).length === 0 &&
               (appState.profiles  || []).length === 0 &&
               (appState.projects  || []).length === 0 &&
               (appState.parts     || []).length === 0 &&
               (appState.groups    || []).length === 0 &&
               (appState.catalog   || []).length === 0 &&
               (appState.stores    || []).length === 0;
    }

    function _navigateToPM() {
        if (typeof navigateTo === 'function') navigateTo('view-setup');
        setTimeout(() => {
            const btn = document.getElementById('tab-dictionaries');
            if (btn) btn.click();
        }, 50);
    }

    /** Returns a full-width empty-state tbody row, or '' if the pack is already loaded. */
    function _starterPackEmptyRow(colSpan) {
        if (!_isStarterPackAvailable()) return '';
        return `<tr class="starter-pack-cta-row"><td colspan="${colSpan}" class="text-center py-5">
            <p class="fw-bold mb-2">${t('msg_starter_pack_title')}</p>
            <p class="text-muted small mb-3">${t('msg_starter_pack_body')}</p>
            <div class="d-flex flex-column align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm px-4" onclick="_navigateToPM()">${t('btn_enter_manually')}</button>
                <span class="text-muted small">${t('msg_empty_state_or')}</span>
                <button class="btn btn-primary btn-sm px-4" onclick="loadStarterPack()">${t('btn_load_starter_pack')}</button>
            </div>
        </td></tr>`;
    }

    /** Called after every saveState — removes CTA rows the moment any data exists. */
    function _clearStarterPackCTAs() {
        if (_isStarterPackAvailable()) return;
        document.querySelectorAll('.starter-pack-cta-row').forEach(el => el.remove());
    }

    /** No-op kept for call-site compatibility — banner approach removed. */
    function _updateDictionariesEmptyState() {}

    function _showPackSpinner() {
        let el = document.getElementById('starter-pack-spinner');
        if (!el) {
            el = document.createElement('div');
            el.id = 'starter-pack-spinner';
            el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
            el.innerHTML = '<div class="spinner-border text-light" style="width:3rem;height:3rem;" role="status"><span class="visually-hidden">Loading…</span></div>';
            document.body.appendChild(el);
        }
        el.style.display = 'flex';
    }
    function _hidePackSpinner() {
        const el = document.getElementById('starter-pack-spinner');
        if (el) el.style.display = 'none';
    }

    function loadStarterPack() {
        if (!_isStarterPackAvailable()) {
            showToast(t('msg_starter_pack_not_empty'), true);
            return;
        }
        const displayUnit = (appState.settings || {}).displayUnit || 'mm';
        const region = (displayUnit === 'dec_in' || displayUnit === 'frac_in') ? 'US' : 'EU';

        _showPackSpinner();
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(responseStr) { _hidePackSpinner(); _applyStarterPack(responseStr); })
                .withFailureHandler(function(err) { _hidePackSpinner(); console.error(err); showToast(t('msg_starter_pack_error'), true); })
                .getStarterPack(region);
        } else {
            _hidePackSpinner();
            showToast('Starter pack not available in local dev mode.', true);
        }
    }

    function _applyStarterPack(responseStr) {
        try {
            const response = JSON.parse(responseStr);
            if (response.status !== 'success') throw new Error(response.message);
            const d = response.data;
            appState.materials = d.materials || [];
            appState.profiles  = d.profiles  || [];
            appState.projects  = d.projects  || [];
            appState.groups    = d.groups    || [];
            appState.parts     = d.parts     || [];
            appState.catalog   = d.catalog   || [];
            appState.stores    = d.stores    || [];
            if (!appState.settings) appState.settings = {};
            appState.settings.isProjectCardView  = true;
            appState.settings.starterPackLoaded  = true;
            saveState();
            if (typeof clearAllFiltersForTable === 'function') clearAllFiltersForTable('parts');
            renderDictionaries();

            // Apply thumbnails to RAM immediately so project cards show images right away
            window.projectImages = d.thumbnails || {};

            // Persist thumbnails to the Thumbnails sheet in the background
            if (typeof google !== 'undefined' && google.script && google.script.run && Object.keys(window.projectImages).length > 0) {
                google.script.run
                    .withSuccessHandler(() => {})
                    .withFailureHandler((e) => console.error('Thumbnail import failed:', e))
                    .bulkImportThumbnails(JSON.stringify(window.projectImages));
            }

            if (typeof renderProjectsTable === 'function') renderProjectsTable();
            navigateTo('view-projects');
            document.getElementById('tab-projects')?.click();
            showToast(t('msg_starter_pack_loaded'));
        } catch(e) {
            console.error('Starter pack parse error:', e);
            showToast(t('msg_starter_pack_error'), true);
        }
    }

    // ==========================================
    // MATERIALS TABLE
    // ==========================================

    function renderMaterialsTable() {
        const tbody = document.getElementById('table-materials-body');
        tbody.innerHTML = '';

        if ((appState.materials || []).length === 0) {
            const emptyHtml = _starterPackEmptyRow(4);
            if (emptyHtml) tbody.innerHTML = emptyHtml;
            return;
        }

        appState.materials.forEach(mat => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(mat, 'materials')) return;

            const tr = document.createElement('tr');
           
            let currentCat = mat.category || 'lumber';

            // 🪄 COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(currentCat);

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <span class="badge ${badgeClass} py-1 d-inline-block" 
                              style="width: 85px; text-align: center; font-size: 0.75rem; text-transform: uppercase;">
                              ${t('opt_' + currentCat)}
                        </span>
                    </div>
                </td>
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1 text-center align-middle" 
                           value="${safeHTML(mat.name)}" 
                           onchange="updateMaterial('${mat.id}', 'name', this.value)" title="${t('title_tap_to_edit')}">
                </td>
                <td class="px-1 py-0">
                    <input type="number" step="0.01" class="form-control form-control-sm border-0 bg-transparent text-center" 
                           value="${formatDensityForDisplay(mat.density)}" 
                           onchange="updateMaterial('${mat.id}', 'density', this.value)" title="${t('title_tap_to_edit')}">
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('materials', '${mat.id}')" title="${t('title_duplicate_row')}">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteMaterial('${mat.id}')" title="${t('title_delete_material')}">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('materials', ['name', 'category']);
        }

        _updateDictionariesEmptyState();
    }
    function handleAddMaterial(event) {
        event.preventDefault(); 
        
        const name = document.getElementById('mat-name').value;
        const category = document.getElementById('mat-category').value;
        const densityInput = document.getElementById('mat-density').value;
        
        const newMaterial = {
            id: 'M-' + Date.now() + Math.floor(Math.random() * 1000),
            name: name,
            category: category, // 🪄 Now saving the category
            density: parseDensityToBase(densityInput) 
        };
        
        appState.materials.unshift(newMaterial);
        saveState();
        renderDictionaries();
        showToast(t('msg_material_added'));
        
        document.getElementById('form-add-material').reset();
        document.getElementById('mat-category').value = category;
        document.getElementById('mat-name').focus();
    }
    function updateMaterial(id, field, newValue) {
        const mat = appState.materials.find(m => m.id === id);
        if (mat) {
            // 🪄 If changing density, parse the lb/ft3 back to kg/m3 for the database
            mat[field] = (field === 'density') ? parseDensityToBase(newValue) : newValue;
            saveState();
            renderDictionaries();
            showToast(t('msg_material_updated'));
        }
    }
    function deleteMaterial(id, isConfirmed = false) {
        // 1. The Safety Shield
        if (!isConfirmed) {
            const preCount = (appState.parts || []).filter(p => p.materialId === id).length;
            const sub = preCount > 0 ? t('confirm_delete_material_in_use', { count: preCount }) : '';
            requestConfirm(t('confirm_delete_material'), () => deleteMaterial(id, true), 'danger', 'Delete', sub);
            return;
        }

        // 2. The Cascade Nullify
        let inUseCount = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.materialId === id) {
                    part.materialId = '';
                    part.status = 'needs_mapping';
                    inUseCount++;
                }
            });
        }

        // Store prices and shop stock referencing it are flagged for re-mapping too
        // (left pointing at a deleted id they'd silently feed the optimizer bad data)
        ['catalog', 'stock'].forEach(tab => (appState[tab] || []).forEach(item => {
            if (item.materialId === id) item.materialId = '';
        }));
        if (typeof notifyConfigChanged === 'function') notifyConfigChanged();

        // 3. The Execution
        appState.materials = appState.materials.filter(m => m.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (inUseCount > 0) {
            showToast(t('msg_material_deleted_parts', { count: inUseCount }), true);
        } else {
            showToast(t('msg_material_deleted'));
        }
    }
    function handleUnitChange() {
        // 1. ONLY update the global display preferences. 
        // Lock existing prices to their current unit system BEFORE switching units
        if (typeof stampAllMissingPriceSystems === 'function') stampAllMissingPriceSystems();
        appState.settings.displayUnit = document.getElementById('setting-display-unit').value;
        appState.settings.currency = document.getElementById('setting-currency').value;
        
        saveState();

        // 2. Redraw the ENTIRE UI so tables instantly reflect the new symbols
        renderSettings();
        renderDictionaries();
        if (typeof renderLabelModal === 'function') renderLabelModal();

        // 3. Re-render cutlist result tabs if results exist (display-only, no recalculation)
        if (appState.latestResults && appState.latestResults.length > 0) {
            if (typeof renderShoppingListTab === 'function') renderShoppingListTab(mergeShoppingResults([...appState.latestResults, ...(appState.latestBulkResults || []), ...(appState.latestMarginResults || [])]));
            if (typeof renderDiagramsTab === 'function') renderDiagramsTab(appState.latestResults);
            if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(appState.latestResults);
            if (typeof renderSandboxPartlistTab === 'function' && window.currentSandboxParts) renderSandboxPartlistTab(window.currentSandboxParts);
        }

        showToast(t('msg_display_prefs_updated'));
    }
    function handleProfileCategoryChange() {
        const cat = document.getElementById('prof-category').value;
        const widthInput = document.getElementById('prof-width');
        
        if (cat === 'sheet' || cat === 'fastener') {
            widthInput.value = '';
            widthInput.disabled = true;
        } else {
            widthInput.disabled = false;
        }
    }

    function renderProfilesTable() {
        const tbody = document.getElementById('table-profiles-body');
        tbody.innerHTML = '';

        if ((appState.profiles || []).length === 0) {
            const emptyHtml = _starterPackEmptyRow(4);
            if (emptyHtml) tbody.innerHTML = emptyHtml;
            return;
        }

        appState.profiles.forEach(prof => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(prof, 'profiles')) return;

            const tr = document.createElement('tr');
            
            // 🪄 MAGIC: Convert internal base mm back to UI strings (e.g., 38.1 -> "1 1/2")
            let displayThick = formatForDisplay(prof.thickness);
            let displayWidth = formatForDisplay(prof.width);
            
            // 🪄 COLOR CODED BADGE LOGIC
            let badgeClass = getCategoryBadgeClass(prof.type);

            // 🪄 DYNAMIC DIMENSIONS DISPLAY
            let dimHtml = '';
            if (prof.type === 'sheet') {
                // Sheets only show Thickness
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 60px;"
                           value="${displayThick}" onchange="updateProfile('${prof.id}', 'thickness', this.value)" title="${t('title_tap_to_edit_thickness')}">
                `;
            } else if (prof.type === 'lumber') {
                // Lumber shows Thickness x Width
                dimHtml = `
                    <div class="d-flex align-items-baseline justify-content-center gap-1">
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0 py-0" style="width: 65px;"
                            value="${displayThick}" onchange="updateProfile('${prof.id}', 'thickness', this.value)" title="${t('title_tap_to_edit_thickness')}">
                        <span class="text-muted text-sm">x</span>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-left px-0 py-0" style="width: 65px;"
                            value="${displayWidth}" onchange="updateProfile('${prof.id}', 'width', this.value)" title="${t('title_tap_to_edit_width')}">
                    </div>
                `;
            } else {
                dimHtml = `<span class="text-muted">-</span>`;
            }

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <span class="badge ${badgeClass} py-1 d-inline-block" 
                              style="width: 85px; text-align: center; font-size: 0.75rem; text-transform: uppercase;">
                              ${t('opt_' + prof.type)}
                        </span>
                    </div>
                </td>
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1 text-center align-middle" 
                           value="${safeHTML(prof.name)}"
                           onchange="updateProfile('${prof.id}', 'name', this.value)" title="${t('title_tap_to_edit')}">
                </td>
                <td class="text-center px-1 py-0 align-middle">${dimHtml}</td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('profiles', '${prof.id}')" title="${t('title_duplicate_row')}">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteProfile('${prof.id}')" title="${t('title_delete_profile')}">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('profiles', ['name', 'type']);
        }

        _updateDictionariesEmptyState();
    }
    function handleAddProfile(event) {
        event.preventDefault();
        if (!validateDimensions([['prof-thickness','msg_invalid_thickness'],['prof-width','msg_invalid_width']])) return;
        
        const name = document.getElementById('prof-name').value;
        const category = document.getElementById('prof-category').value;
        const thicknessInput = document.getElementById('prof-thickness').value;
        const widthInput = document.getElementById('prof-width').value;
        
        // 🪄 MAGIC: Convert whatever the user typed into base mm before saving
        const thicknessBase = parseToBaseUnit(thicknessInput);
        const widthBase = parseToBaseUnit(widthInput);
        
        const newId = 'PR-' + Date.now() + Math.floor(Math.random() * 1000);
        
        const newProfile = {
            id: newId,
            name: name,
            type: category, 
            thickness: thicknessBase,
            width: widthBase
        };
        
        appState.profiles.unshift(newProfile);
        saveState();
        renderDictionaries();
        showToast(t('msg_profile_added'));
        
        document.getElementById('form-add-profile').reset();
        document.getElementById('prof-category').value = category;
        document.getElementById('prof-name').focus();
    }
    function updateProfile(id, field, newValue) {
        // Reject text / zero / negative sizes instead of silently storing 0
        if ((field === 'length' || field === 'width' || field === 'thickness') && !(parseToBaseUnit(newValue) > 0)) {
            showToast(t(field === 'width' ? 'msg_invalid_width' : field === 'thickness' ? 'msg_invalid_thickness' : 'msg_invalid_length'), 'warning');
            renderProfilesTable();
            return;
        }
        const prof = appState.profiles.find(p => p.id === id);
        if (prof) {
            if (field === 'thickness' || field === 'width') {
                // Intercept and parse to base unit
                prof[field] = parseToBaseUnit(newValue);
            } else {
                prof[field] = newValue;
                
                // 🪄 PHYSICS AUTO-HEAL: If they change it to a Sheet, zero out the width so it doesn't leave bad data behind
                if (field === 'type' && (newValue === 'sheet' || newValue === 'fastener')) {
                    prof.width = 0;
                }
            }
            
            saveState();
            renderDictionaries();
            showToast(t('msg_profile_updated'));
        }
    }
    function deleteProfile(id, isConfirmed = false) {
        // 1. The Safety Shield
        if (!isConfirmed) {
            const preCount = (appState.parts || []).filter(p => p.profileId === id).length;
            const sub = preCount > 0 ? t('confirm_delete_profile_in_use', { count: preCount }) : '';
            requestConfirm(t('confirm_delete_profile'), () => deleteProfile(id, true), 'danger', 'Delete', sub);
            return;
        }
        
        // 2. The Cascade Nullify
        let inUseCount = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.profileId === id) {
                    part.profileId = ''; // Snap back to "(!) Select..."
                    part.status = 'needs_mapping'; // Turn the row Yellow
                    inUseCount++;
                }
            });
        }

        // Store prices and shop stock referencing it are flagged for re-mapping too
        // (left pointing at a deleted id they'd silently feed the optimizer bad data)
        ['catalog', 'stock'].forEach(tab => (appState[tab] || []).forEach(item => {
            if (item.profileId === id) item.profileId = '';
        }));
        if (typeof notifyConfigChanged === 'function') notifyConfigChanged();

        // 3. The Execution
        appState.profiles = appState.profiles.filter(p => p.id !== id);
        saveState();
        renderDictionaries();

        // 5. The Alarm
        if (inUseCount > 0) {
            showToast(t('msg_profile_deleted_parts', { count: inUseCount }), true);
        } else {
            showToast(t('msg_profile_deleted'));
        }
    }
</script>
