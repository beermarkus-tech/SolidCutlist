<script>
    // ==========================================
    // PROJECT VIEW STATE & IMAGE MEMORY
    // ==========================================
    window.projectImages = {}; // Isolated RAM for images

    // 🪄 Background loader for images (Does not block main app boot)
    function fetchProjectThumbnails() {
        google.script.run
            .withSuccessHandler((responseStr) => {
                try {
                    const response = JSON.parse(responseStr);
                    if (response.status === 'success') {
                        window.projectImages = response.data || {};
                        // If user prefers cards, redraw now that images arrived
                        if (appState.settings && appState.settings.isProjectCardView && typeof renderProjectsTable === 'function') {
                            renderProjectsTable();
                        }
                    } else {
                        console.warn("Thumbnail fetch failed:", response.message);
                    }
                } catch(e) {
                    console.error("Failed to parse thumbnails:", e);
                }
            })
            .withFailureHandler((err) => {
                console.error("Server error fetching thumbnails:", err);
            })
            .getThumbnails();
    }

    // 🪄 Wait 2 seconds for the master data to finish loading before asking for images.
    // This prevents the Google Apps Script concurrent request collision.
    document.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('proj-date');
        if (dateInput) dateInput.value = new Date().toISOString().split('T')[0]; // Set input to YYYY-MM-DD
        setTimeout(fetchProjectThumbnails, 2000); 
    });

    function handleProjectCardSearch(query) {
        if (!appState.ui) appState.ui = {};
        appState.ui.projectCardSearchQuery = query.toLowerCase().trim();
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
    }

    function handleProjectCardFilter(status) {
        if (!appState.ui) appState.ui = {};
        appState.ui.projectCardStatusFilter = status;
        const chips = document.querySelectorAll('#project-card-chips button');
        chips.forEach(chip => {
            if (chip.innerText === status) {
                chip.classList.remove('btn-outline-secondary');
                chip.classList.add('btn-dark');
            } else {
                chip.classList.remove('btn-dark');
                chip.classList.add('btn-outline-secondary');
            }
        });
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
    }

    function handleProjectCardSort(selectEl) {
        const [key, dataType] = selectEl.value.split('|');
        if (typeof handleSort === 'function') handleSort('projects', key, dataType);
    }

    function toggleProjectCardSortDir() {
        const selectEl = document.getElementById('project-card-sort-select');
        if (selectEl) {
            const [key, dataType] = selectEl.value.split('|');
            // 🪄 Master router trick: Calling handleSort with the exact same key automatically flips the direction!
            if (typeof handleSort === 'function') handleSort('projects', key, dataType);
        }
    }

    function toggleProjectViewMode() {
        if (!appState.settings) appState.settings = {};
        
        // 🪄 1. Toggle the setting and SAVE IT to the cloud
        appState.settings.isProjectCardView = !appState.settings.isProjectCardView;
        saveState(); 
        
        // 🪄 2. Trigger the router to update the UI
        renderProjectsTable(); 
    }

    function syncProjectHeaderButtons(activeTab) {
        const btnPrint = document.getElementById('btn-print-parts');
        const btnImport = document.getElementById('btn-inline-import');
        const btnToggleView = document.getElementById('btn-toggle-project-view');

        if (activeTab === 'projects') {
            // In Projects Tab: Hide Parts buttons, Show Card Toggle
            if (btnPrint) btnPrint.classList.add('d-none');
            if (btnToggleView) btnToggleView.classList.remove('d-none');
        } else if (activeTab === 'parts') {
            // In Parts Tab: Show Parts buttons, Hide Card Toggle
            if (btnPrint) btnPrint.classList.remove('d-none');
            if (btnToggleView) btnToggleView.classList.add('d-none');
        }
    }

    // ==========================================
    // PROJECTS (Master Router)
    // ==========================================
    function renderProjectsTable() {
        if (!appState.settings) appState.settings = {};
        const isCardView = appState.settings.isProjectCardView === true;

        if (!appState.projects) appState.projects = [];

        // 🪄 THE FIX: Scrub all dirty dates in RAM so the 'string' sort engine works flawlessly
        appState.projects.forEach(proj => {
            if (proj.date) {
                const cleanDate = formatDateForInput(proj.date);
                if (proj.date !== cleanDate) {
                    proj.date = cleanDate; // Silently fixes the underlying database
                }
            }
        });
        
        // 🪄 Synchronize the physical containers and buttons first
        const tableMode = document.getElementById('view-mode-table');
        const cardMode = document.getElementById('view-mode-cards');
        const toggleBtn = document.getElementById('btn-toggle-project-view');
        
        if (isCardView) {
            if (tableMode) tableMode.classList.add('d-none');
            if (cardMode) cardMode.classList.remove('d-none');
            if (toggleBtn) toggleBtn.innerHTML = '<b>☰</b>'; // Hamburger
            
            // Hijack the data loop to draw cards!
            renderProjectCards();
            return; 
        } else {
            if (tableMode) tableMode.classList.remove('d-none');
            if (cardMode) cardMode.classList.add('d-none');
            if (toggleBtn) toggleBtn.innerHTML = '<b>🗂️</b>'; // Card Icon
        }

        const tbody = document.getElementById('table-projects-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 
        
        if (!appState.projects) appState.projects = [];
        const currency = appState.settings.currency || '$';

        appState.projects.forEach(proj => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(proj, 'projects')) return;
            
            const tr = document.createElement('tr');
            
            // Pull the background-calculated totals
            const partCount = proj.totalParts || 0;
            const displayCost = (proj.totalCost || 0).toFixed(2);
            
            // 🪄 VISUAL ASSETS (The Evolving Avatar)
            const imageData = (typeof window.projectImages !== 'undefined') ? window.projectImages[proj.id] : null;
            let avatarHtml = '';

            if (imageData) {
                // Show photo. Clicking it opens the central Manager.
                avatarHtml = `<img src="${imageData}" class="shadow-sm border d-block mx-auto" style="width: 28px; height: 28px; object-fit: cover; border-radius: 4px; cursor: pointer;" onclick="openIconPicker('${proj.id}')" title="Manage Photo/Icon">`;
            } else {
                // Show Icon. Clicking it opens the central Manager.
                const icon = proj.icon || '🗂️';
                avatarHtml = `<div class="d-flex align-items-center justify-content-center mx-auto" style="width: 28px; height: 28px; cursor: pointer; font-size: 1.2rem; user-select: none;" onclick="openIconPicker('${proj.id}')" title="Manage Photo/Icon">${icon}</div>`;
            }

            // 🪄 PROJECT LINK ENGINE
            let linkHtml = proj.link 
                ? `<a href="${safeHTML(proj.link)}" target="_blank" class="text-decoration-none" title="Open Link">🔗</a>` 
                : `<span class="text-muted" style="opacity: 0.3;">🔗</span>`;

            // 🪄 STATUS DROPDOWN ENGINE (Fixed Width Badges)
            const currentStatus = proj.status || 'Design';
            
            // Default to Design (Yellow background, Black text)
            let statusColor = '#ffc107'; 
            let textColor = '#000000'; 
            
            if (currentStatus === 'Quoting') { statusColor = '#6f42c1'; textColor = '#ffffff'; }
            else if (currentStatus === 'Ready') { statusColor = '#0d6efd'; textColor = '#ffffff'; }
            else if (currentStatus === 'In Progress') { statusColor = '#fd7e14'; textColor = '#ffffff'; }
            else if (currentStatus === 'Completed') { statusColor = '#198754'; textColor = '#ffffff'; }

            let statusHtml = `
                <div class="dropdown">
                    <button class="btn btn-sm dropdown-toggle badge shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 15ch; background-color: ${statusColor}; color: ${textColor}; font-size: 0.85rem; padding: 0.35em 0.65em;">
                        ${safeHTML(currentStatus)}
                    </button>
                    <ul class="dropdown-menu shadow-sm" style="min-width: 12rem;">
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Design')">🟡 Design</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Quoting')">🟣 Quoting</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Ready')">🔵 Ready</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'In Progress')">🟠 In Progress</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Completed')">🟢 Completed</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger fw-bold" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Archive')">🗄️ Archive Project...</a></li>
                    </ul>
                </div>
            `;
            
            tr.innerHTML = `
                <td class="text-center px-1 py-0 align-middle">
                    ${avatarHtml}
                </td>
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(proj.name)}" 
                           onchange="updateProject('${proj.id}', 'name', this.value)"
                           title="${t('title_tap_to_edit')}">
                </td>
                <td class="px-1 py-0 align-middle">
                    <textarea class="form-control form-control-sm border-0 bg-transparent project-comment-box"
                              rows="1" title="${safeHTML(proj.comment || '')}" 
                              onchange="updateProject('${proj.id}', 'comment', this.value)" 
                              placeholder="${t('ph_add_notes')}">${safeHTML(proj.comment || '')}</textarea>
                </td>
                <td class="px-1 py-0 align-middle text-center" style="position: relative;">
                    <span style="cursor: pointer; font-size: 0.875rem;" title="Edit Date">
                        ${formatDateForInput(proj.date)}
                    </span>
                    <input type="date" 
                           style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;"
                           value="${formatDateForInput(proj.date)}" 
                           onchange="updateProject('${proj.id}', 'date', this.value)">
                </td>
                <td class="text-center px-1 py-0 align-middle">
                    <span class="badge bg-primary shadow-sm" style="cursor: pointer;" onclick="jumpToProjectParts('${proj.id}')" title="View Parts for this Project" data-i18n-title="tip_view_project_parts">${partCount}</span>
                </td>
                <td class="text-center px-1 py-0 align-middle fw-bold text-success"><small>${currency}${displayCost}</small></td>
                <td class="text-center align-middle">${statusHtml}</td>
                <td class="text-center px-1 py-0 align-middle" style="width: 40px;">
                    <button class="btn btn-sm border shadow-sm py-0 px-2" onclick="openGroupModal('${proj.id}')" title="${t('tip_manage_groups')}">⚙️</button>
                </td>
                <td class="text-nowrap align-middle">
                    <div class="d-flex justify-content-center align-items-center">
                        ${linkHtml}
                        <button class="btn btn-sm py-0 px-1" onclick="openLinkModal('${proj.id}', '${safeHTML(proj.link || '')}')" title="Edit Link">✏️</button>
                    </div>
                </td>                   
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateProjectWarning('${proj.id}')" title="Duplicate Project">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteProject('${proj.id}')" title="Delete">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('projects', ['name', 'status']);
        }
    }
    function handleAddProject(event) {
        event.preventDefault();
        
        const nameInput = document.getElementById('proj-name');
        const dateInput = document.getElementById('proj-date');
        const newId = 'PROJ-' + Date.now(); // Generates unique ID
        
        const newProject = {
            id: newId,
            name: nameInput.value,
            date: dateInput ? dateInput.value : new Date().toISOString().split('T')[0],
            status: 'Design'
        };
        
        appState.projects.unshift(newProject);
        saveState();
        renderProjectsTable();
        showToast(t('msg_project_created'));
        
        nameInput.value = ''; // Clear the form
        if (dateInput) dateInput.value = new Date().toISOString().split('T')[0]; // Reset date to today for the next entry
    }
    function updateProject(id, field, newValue) {
        const project = appState.projects.find(p => p.id === id);
        if (project) {
            project[field] = newValue;
            saveState();
            renderProjectsTable();
            showToast(t('msg_project_updated'));
        }
    }
    function deleteProject(id, isConfirmed = false) {
        // 1. The Safety Shield (Made extra scary for a destructive action)
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_project'), () => deleteProject(id, true));
            return; 
        }

        // 2. The Cascade Delete (Purge the Parts)
        let deletedPartsCount = 0;
        if (appState.parts) {
            const originalLength = appState.parts.length;
            // Keep only the parts that DO NOT belong to this project
            appState.parts = appState.parts.filter(part => part.projectId !== id);
            deletedPartsCount = originalLength - appState.parts.length;
        }

        // 3. The Execution (Purge the Project)
        appState.projects = appState.projects.filter(p => p.id !== id);
        
        // 🪄 Image Garbage Collection
        delete window.projectImages[id];
        google.script.run.deleteThumbnail(id);
        
        saveState();
        renderProjectsTable();

        // 5. The Alarm
        if (deletedPartsCount > 0) {
            showToast(t('msg_project_deleted_parts', { count: deletedPartsCount }), true);
        } else {
            showToast(t('msg_project_deleted'));
        }
    }
    function editProjectLink(id) {
        const proj = appState.projects.find(p => p.id === id);
        if (!proj) return;
        
        const currentLink = proj.link || "";
        const newLink = prompt("Paste the link to your SketchUp file, Drive folder, or Image:", currentLink);
        
        // If the user clicks 'Cancel', newLink is null. If they click 'OK', save it.
        if (newLink !== null) {
            let formattedLink = newLink.trim();
            // Smart URL Formatter
            if (formattedLink && !/^https?:\/\//i.test(formattedLink)) {
                formattedLink = 'https://' + formattedLink;
            }
            
            proj.link = formattedLink;
            saveState();
            renderProjectsTable();
            showToast("Project link updated.");
        }
    }
    function duplicateProjectWarning(id) {
        requestConfirm(
            t('confirm_duplicate_project'), 
            () => duplicateProject(id), 
            'primary', 
            t('btn_duplicate')
        );
    }

    // ==========================================
    // GROUPS WITHIN PROJECTS
    // ==========================================
    let groupModalInstance = null;
    function openGroupModal(preSelectedProjectId = '') {
        // 1. Initialize Bootstrap Modal if it doesn't exist
        if (!groupModalInstance) {
            groupModalInstance = new bootstrap.Modal(document.getElementById('modal-group-manager'), {
                keyboard: true // Enables ESC to close natively
            });

            // When modal closes, forcefully update the Parts UI so new groups appear
            document.getElementById('modal-group-manager').addEventListener('hidden.bs.modal', function () {
                // Also trigger handleProjectChange to refresh the specific part-group dropdown 
                // without wiping out what the user was currently doing
                if (typeof handleProjectChange === 'function') handleProjectChange();
                if (typeof renderPartsTable === 'function') renderPartsTable();
            });
        }

        // 2. Populate the Project Dropdown
        const projSelect = document.getElementById('modal-group-project-select');
        projSelect.innerHTML = `<option value="" disabled selected>${t('opt_select_project')}</option>`;
        if (appState.projects) {
            [...appState.projects].sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                projSelect.innerHTML += `<option value="${p.id}">${safeHTML(p.name)}</option>`;
            });
        }

        // 3. Set Context (Pre-select or stay blank)
        if (preSelectedProjectId) {
            projSelect.value = preSelectedProjectId;
        } else {
            projSelect.value = ""; // Force it to stay on "Select a Project..."
        }

        renderGroupModalTable();
        groupModalInstance.show();

        // Bonus UX: Auto-focus the text input when modal opens (needs a tiny delay for the animation)
        setTimeout(() => {
            document.getElementById('modal-new-group-name').focus();
        }, 400);
    }
    function renderGroupModalTable() {
        const tbody = document.getElementById('table-modal-groups-body');
        tbody.innerHTML = '';
        
        const activeProjectId = document.getElementById('modal-group-project-select').value;
        if (!activeProjectId) return;

        if (!appState.groups) appState.groups = [];

        // Filter groups for the active project
        const projectGroups = appState.groups.filter(g => g.projectId === activeProjectId);

        if (projectGroups.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="text-center text-muted py-3">${t('msg_no_groups_defined')}</td></tr>`;
            return;
        }

        projectGroups.forEach(grp => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(grp.name)}" 
                           onchange="updateGroupName('${grp.id}', this.value)"
                           title="${t('title_tap_to_edit')}">
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteGroup('${grp.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    function handleAddGroup(event) {
        event.preventDefault();
        const activeProjectId = document.getElementById('modal-group-project-select').value;
        const nameInput = document.getElementById('modal-new-group-name');
        
        if (!activeProjectId) {
            showToast(t('msg_select_project_first'), true);
            return;
        }

        if (!appState.groups) appState.groups = [];
        
        appState.groups.unshift({
            id: 'GRP-' + Date.now(),
            projectId: activeProjectId,
            name: nameInput.value
        });
        
        saveState();
        renderGroupModalTable();
        nameInput.value = ''; // Clear input
        nameInput.focus();
    }
    function updateGroupName(id, newName) {
        const grp = appState.groups.find(g => g.id === id);
        if (grp) {
            grp.name = newName;
            saveState();
            showToast(t('msg_group_renamed'));
        }
    }
    function deleteGroup(id, isConfirmed = false) {
        // 🪄 The Safety Shield (Custom Modal)
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_group'), () => deleteGroup(id, true));
            return;
        }

        // 1. Cascade Nullify: Reset parts using this group
        let affectedParts = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.groupId === id) {
                    part.groupId = ''; // Snap back to 'no group'
                    affectedParts++;
                }
            });
        }

        // 2. Delete the group
        appState.groups = appState.groups.filter(g => g.id !== id);
        saveState();
        renderGroupModalTable();
        
        showToast(t('msg_group_deleted_parts', { count: affectedParts }), true);
    }

    // ==========================================
    // DEEP FREEZE ARCHIVE ENGINE
    // ==========================================
    let archiveModalInstance;
    let currentArchiveData = [];
    let archiveSortCol = 'date';
    let archiveSortAsc = false;
    function changeProjectStatus(projectId, newStatus) {
        if (newStatus === 'Archive') {
            // 🪄 UNIVERSAL CONFIRM MODAL (Warning Theme)
            requestConfirm(
                'Archive this project?\n\nIt will be safely moved to cold storage to keep your workspace fast and clean. You can restore it anytime.', 
                () => {
                    executeDeepFreeze(projectId);
                }, 
                'warning', 
                'Archive'
            );
            return;
        }
        
        const proj = appState.projects.find(p => p.id === projectId);
        if (proj) {
            proj.status = newStatus;
            saveState();
            renderProjectsTable();
        }
    }
    function openArchiveModal() {
        if (!archiveModalInstance) archiveModalInstance = new bootstrap.Modal(document.getElementById('modal-archive'));
        
        // 🪄 ADDED: Spinner to the loading text
        document.getElementById('archive-table-body').innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading cold storage...</td></tr>';
        archiveModalInstance.show();

        google.script.run
            .withSuccessHandler((responseStr) => {
                const response = JSON.parse(responseStr);
                if (response.status === 'success') {
                    currentArchiveData = response.data;
                    renderArchiveTable();
                } else {
                    document.getElementById('archive-table-body').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Error: ${response.message}</td></tr>`;
                }
            })
            .withFailureHandler((err) => {
                document.getElementById('archive-table-body').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Server Error: ${err}</td></tr>`;
            })
            .getArchiveList();
    }
    function renderArchiveTable() {
        const tbody = document.getElementById('archive-table-body');
        if (currentArchiveData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No archived projects found.</td></tr>';
            return;
        }

        // Sort Logic
        currentArchiveData.sort((a, b) => {
            let valA = a[archiveSortCol] || '';
            let valB = b[archiveSortCol] || '';
            if (valA < valB) return archiveSortAsc ? -1 : 1;
            if (valA > valB) return archiveSortAsc ? 1 : -1;
            return 0;
        });

        tbody.innerHTML = currentArchiveData.map(proj => {
            const d = new Date(proj.date);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            const avatarHtml = proj.image
                ? `<img src="${proj.image}" class="shadow-sm border d-block mx-auto" style="width: 28px; height: 28px; object-fit: cover; border-radius: 4px;">`
                : `<div class="d-flex align-items-center justify-content-center mx-auto" style="width: 28px; height: 28px; font-size: 1.2rem;">${proj.icon || '🗂️'}</div>`;

            return `
            <tr>
                <td class="ps-3">${dateStr}</td>
                <td class="text-center px-1">${avatarHtml}</td>
                <td class="fw-bold">${safeHTML(proj.name)}</td>
                <td style="max-width: 180px;">
                    <textarea class="archive-note-cell form-control form-control-sm border-0 bg-transparent text-muted w-100" rows="1" readonly title="Click to expand">${safeHTML(proj.notes)}</textarea>
                </td>
                <td class="text-end pe-3 text-nowrap">
                    <button class="btn btn-sm btn-outline-primary py-0 px-2 me-1" onclick="restoreArchivedProject('${proj.id}', this)" title="Restore to Workspace">Load</button>
                    <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteArchivedProjectUI('${proj.id}')" title="Permanently Delete">🗑️</button>
                </td>
            </tr>
            `;
        }).join('');
    }
    function sortArchive(col) {
        if (archiveSortCol === col) archiveSortAsc = !archiveSortAsc;
        else { archiveSortCol = col; archiveSortAsc = true; }
        renderArchiveTable();
    }
    function executeDeepFreeze(projectId) {
        // 🪄 1. Setup Spinner & Shield
        const confirmBtn = document.getElementById('btn-confirm-delete');
        let originalText = 'Archive';
        if (confirmBtn) {
            originalText = confirmBtn.innerText;
            confirmBtn.innerHTML = `<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Working...`;
        }
        freezeUI();

        const projIndex = appState.projects.findIndex(p => p.id === projectId);
        if (projIndex === -1) {
            unfreezeUI();
            if (confirmBtn) confirmBtn.innerHTML = originalText;
            return;
        }

        const payload = {
            id: projectId,
            project: appState.projects[projIndex],
            groups: (appState.groups || []).filter(g => g.projectId === projectId),
            parts: (appState.parts || []).filter(p => p.projectId === projectId),
            image: (window.projectImages && window.projectImages[projectId]) || null
        };

        google.script.run
            .withSuccessHandler((response) => {
                // 🪄 2. Remove Shield & Restore UI
                unfreezeUI();
                if (confirmBtn) confirmBtn.innerHTML = originalText;

                if (response.status === 'success') {
                    appState.projects.splice(projIndex, 1);
                    if (appState.groups) appState.groups = appState.groups.filter(g => g.projectId !== projectId);
                    if (appState.parts) appState.parts = appState.parts.filter(p => p.projectId !== projectId);
                    
                    // 🪄 Image Garbage Collection
                    delete window.projectImages[projectId];
                    google.script.run.deleteThumbnail(projectId);
                    
                    saveState();
                    renderProjectsTable();
                    showToast('Project archived safely.');
                    
                    // 🪄 NOW we safely hide the modal because the data is saved
                    const confirmModalEl = document.getElementById('modal-universal-delete');
                    if (confirmModalEl) bootstrap.Modal.getInstance(confirmModalEl)?.hide();
                } else {
                    alert('Archiving failed: ' + response.message);
                }
            })
            .withFailureHandler((err) => {
                unfreezeUI();
                if (confirmBtn) confirmBtn.innerHTML = originalText;
                alert('Server error: ' + err);
            })
            .archiveProjectToSheet(JSON.stringify(payload));
    }
    function restoreArchivedProject(id, btnElement) {
        // 🪄 1. Setup Spinner & Shield
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = `<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>`;
        freezeUI();

        google.script.run
            .withSuccessHandler((responseStr) => {
                // 🪄 2. Remove Shield & Restore UI
                unfreezeUI();
                btnElement.innerHTML = originalText;

                const response = typeof responseStr === 'string' ? JSON.parse(responseStr) : responseStr;
                if (response.status === 'success') {
                    appState.projects.unshift(response.project);
                    if(response.groups) appState.groups.push(...response.groups);
                    if(response.parts) appState.parts.push(...response.parts);

                    if (response.image) {
                        if (!window.projectImages) window.projectImages = {};
                        window.projectImages[response.project.id] = response.image;
                        google.script.run.saveThumbnail(JSON.stringify({
                            projectId: response.project.id,
                            base64String: response.image
                        }));
                    }

                    saveState();
                    renderProjectsTable();

                    google.script.run.deleteProjectFromArchive(id);

                    // 🪄 FIXED: Remove the project from the list and redraw, leaving the modal open
                    currentArchiveData = currentArchiveData.filter(p => p.id !== id);
                    renderArchiveTable();
                    
                    showToast('Project restored to workspace.');
                } else {
                    alert('Error restoring: ' + response.message);
                }
            })
            .withFailureHandler((err) => {
                unfreezeUI();
                btnElement.innerHTML = originalText;
                alert('Server Error: ' + err);
            })
            .loadProjectFromArchive(id);
    }
    function deleteArchivedProjectUI(id) {
        requestConfirm(
            '⚠️ Are you sure you want to PERMANENTLY delete this project?\n\nThis will destroy the data forever. This cannot be undone.',
            () => {
                // 🪄 1. Setup Spinner & Shield
                const confirmBtn = document.getElementById('btn-confirm-delete');
                let originalText = 'Delete Forever';
                if (confirmBtn) {
                    originalText = confirmBtn.innerText;
                    confirmBtn.innerHTML = `<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Deleting...`;
                }
                freezeUI();

                google.script.run
                    .withSuccessHandler((responseStr) => {
                        // 🪄 2. Remove Shield & Restore UI
                        unfreezeUI();
                        if (confirmBtn) confirmBtn.innerHTML = originalText;

                        const response = typeof responseStr === 'string' ? JSON.parse(responseStr) : responseStr;
                        if (response.status === 'success') {
                            currentArchiveData = currentArchiveData.filter(p => p.id !== id);
                            renderArchiveTable();
                            showToast('Project permanently deleted.');
                            
                            // Safely hide the confirmation modal
                            const confirmModalEl = document.getElementById('modal-universal-delete');
                            if (confirmModalEl) bootstrap.Modal.getInstance(confirmModalEl)?.hide();
                        } else {
                            alert('Error deleting: ' + response.message);
                        }
                    })
                    .withFailureHandler((err) => {
                        unfreezeUI();
                        if (confirmBtn) confirmBtn.innerHTML = originalText;
                        alert('Server Error: ' + err);
                    })
                    .deleteProjectFromArchive(id);
            },
            'danger',
            'Delete Forever'
        );
    }

    // ==========================================
    // CROSS-TAB NAVIGATION
    // ==========================================
    function jumpToProjectParts(projectId) {
        // 1. Wipe out any existing filters on the parts table to ensure a clean slate
        if (typeof activeFilters !== 'undefined') {
            activeFilters['parts'] = {}; 
            
            // 2. Inject the specific project ID into the filter engine
            activeFilters['parts']['projectId'] = [projectId];
        }

        // 3. Virtually click the "Current Partlist" tab
        const partsTabBtn = document.getElementById('tab-parts');
        if (partsTabBtn) {
            // Because your HTML button has onclick="renderPartsView()", 
            // clicking it will natively trigger Bootstrap's animation AND our render loop!
            partsTabBtn.click(); 
        } else {
            // Fallback (just in case)
            if (typeof renderPartsTable === 'function') renderPartsTable();
        }
    }
    
    // ==========================================
    // CARD RENDERING ENGINE (PHASE 3)
    // ==========================================
    function renderProjectCards() {
        const grid = document.getElementById('project-card-grid');
        if (!grid) return;
        grid.innerHTML = ''; 

        if (!appState.projects || appState.projects.length === 0) {
            grid.innerHTML = `<div class="col-12 text-center text-muted mt-5"><h1>📭</h1><p>No projects yet.</p></div>`;
            return;
        }

        const currency = appState.settings.currency || '$';
        let visibleCount = 0;

        appState.projects.forEach(proj => {
            // 1. Respect Table Filters (if any are active)
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(proj, 'projects')) return;

            // 2. Apply Card Search Filter
            const cardSearchQuery = appState.ui?.projectCardSearchQuery || '';
            if (cardSearchQuery) {
                const searchStr = `${proj.name || ''} ${proj.comment || ''}`.toLowerCase();
                if (!searchStr.includes(cardSearchQuery)) return;
            }

            // 3. Apply Card Status Chip Filter
            const currentStatus = proj.status || 'Design';
            const cardStatusFilter = appState.ui?.projectCardStatusFilter || 'All';
            if (cardStatusFilter && cardStatusFilter !== 'All') {
                if (currentStatus !== cardStatusFilter) return;
            }

            visibleCount++;

            const partCount = proj.totalParts || 0;
            const displayCost = (proj.totalCost || 0).toFixed(2);
            const icon = proj.icon || '🗂️'; // Default icon until Phase 5

            // Status Styling
            let statusColor = '#ffc107'; let textColor = '#000000'; 
            if (currentStatus === 'Quoting') { statusColor = '#6f42c1'; textColor = '#ffffff'; }
            else if (currentStatus === 'Ready') { statusColor = '#0d6efd'; textColor = '#ffffff'; }
            else if (currentStatus === 'In Progress') { statusColor = '#fd7e14'; textColor = '#ffffff'; }
            else if (currentStatus === 'Completed') { statusColor = '#198754'; textColor = '#ffffff'; }

            // 🪄 Top Right Controls (Link + Kebab Menu)
            const topControlsHtml = `
                <div class="d-flex align-items-center flex-shrink-0">
                    ${proj.link ? `<a href="${safeHTML(proj.link)}" target="_blank" class="text-decoration-none me-1 fs-6" title="Open Link">🔗</a>` : `<span class="text-muted me-1 fs-6" style="opacity: 0.3;" title="No Link">🔗</span>`}
                    <div class="dropdown">
                        <button class="btn btn-sm btn-link text-decoration-none px-2 py-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <b style="font-size: 1.2rem;">⋮</b>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li><a class="dropdown-item" href="#" onclick="openLinkModal('${proj.id}', '${safeHTML(proj.link || '')}'); return false;">✏️ Edit Link</a></li>
                            ${proj.link ? `<li><a class="dropdown-item" href="${safeHTML(proj.link)}" target="_blank">🔗 Open Link</a></li>` : ''}
                            <li><a class="dropdown-item" href="#" onclick="duplicateProjectWarning('${proj.id}'); return false;">➕ Clone Project</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger fw-bold" href="#" onclick="changeProjectStatus('${proj.id}', 'Archive'); return false;">🗄️ Archive Project</a></li>
                            <li><a class="dropdown-item text-danger fw-bold" href="#" onclick="deleteProject('${proj.id}'); return false;">🗑️ Delete</a></li>
                        </ul>
                    </div>
                </div>
            `;

            // 🪄 Status Dropdown
            const statusHtml = `
                <div class="dropdown flex-grow-1">
                    <button class="btn btn-sm w-100 dropdown-toggle shadow-sm text-truncate border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="background-color: ${statusColor}; color: ${textColor}; font-weight: 500;">
                        ${safeHTML(currentStatus)}
                    </button>
                    <ul class="dropdown-menu shadow-sm">
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Design')">🟡 Design</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Quoting')">🟣 Quoting</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Ready')">🔵 Ready</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'In Progress')">🟠 In Progress</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Completed')">🟢 Completed</a></li>
                    </ul>
                </div>
            `;

            // 🪄 Check RAM for a saved thumbnail
            const imageData = window.projectImages[proj.id];
            
            // 🪄 Generate Hero Image Area (The Evolving Avatar)
            let heroImageHtml = '';
            if (imageData) {
                // Display Photo. Clicking opens the master manager.
                heroImageHtml = `<img src="${imageData}" class="card-img-top rounded-0" style="aspect-ratio: 3/2; width: 100%; object-fit: cover; cursor: pointer; border-bottom: 1px solid var(--bs-border-color-translucent);" onclick="openIconPicker('${proj.id}')" title="Manage Photo/Icon">`;
            } else {
                // Display upscaled Icon. Clicking opens the master manager.
                heroImageHtml = `
                    <div class="card-img-top d-flex align-items-center justify-content-center rounded-0 text-muted" style="aspect-ratio: 3/2; width: 100%; cursor: pointer; border-bottom: 1px solid var(--bs-border-color-translucent); font-size: 7rem; user-select: none; transition: opacity 0.2s;" onclick="openIconPicker('${proj.id}')" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'" title="Manage Photo/Icon">
                        ${icon}
                    </div>
                `;
            }

            // 🪄 Build the Physical Card
            const col = document.createElement('div');
            col.className = 'col'; 
            col.innerHTML = `
                <div class="card h-100 shadow border overflow-hidden">
                    
                    <div class="card-header border-bottom-0 pt-3 pb-2 px-3 d-flex justify-content-between align-items-start gap-2">
                        <div class="d-flex flex-column flex-grow-1 overflow-hidden">
                            <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold p-0 shadow-none text-truncate w-100" 
                                   style="font-size: 1rem; cursor: text; line-height: 1.1;"
                                   value="${safeHTML(proj.name)}" 
                                   onchange="updateProject('${proj.id}', 'name', this.value)"
                                   title="${t('title_tap_to_edit')}">
                            <div style="position: relative; width: fit-content; margin-top: -8px;">
                                <span class="text-muted" style="display: inline-block; min-width: 75px; font-size: 0.8rem; cursor: pointer; line-height: 1;" title="Edit Date">
                                    ${formatDateForInput(proj.date) || '&nbsp;'}
                                </span>
                                <input type="date" 
                                       style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;"
                                       value="${formatDateForInput(proj.date)}" 
                                       onchange="updateProject('${proj.id}', 'date', this.value)">
                            </div>
                        </div>
                        ${topControlsHtml}
                    </div>

                    ${heroImageHtml}
                    
                    <div class="card-body p-3 d-flex flex-column">
                        <div class="flex-grow-1 mb-3 position-relative" style="min-height: 3em;">
                            <div contenteditable="true" 
                                 class="form-control form-control-sm border-0 bg-transparent text-muted small p-0 w-100 card-comment-box"
                                 style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; outline: none; line-height: 1.5; cursor: text; word-break: break-word;"
                                 onblur="updateProject('${proj.id}', 'comment', this.innerText)"
                                 title="Tap to edit notes"
                                 data-placeholder="Add notes...">${safeHTML(proj.comment || '')}</div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge text-dark border shadow-sm" style="cursor: pointer;" onclick="jumpToProjectParts('${proj.id}')" title="View Parts">🧩 ${partCount} Parts</span>
                            <span class="badge text-success border shadow-sm fw-bold">${currency}${displayCost}</span>
                        </div>
                        
                        <div class="d-flex gap-2 mt-auto">
                            ${statusHtml}
                            <button class="btn btn-sm border shadow-sm px-3 flex-shrink-0" onclick="openGroupModal('${proj.id}')" title="Manage Groups">⚙️</button>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(col);
        });

        // Search Fallback UI
        if (visibleCount === 0) {
            grid.innerHTML = `<div class="col-12 text-center text-muted mt-5"><h5>No projects match your filters.</h5></div>`;
        }
    }

    // ==========================================
    // ICON PICKER ENGINE (PHASE 5)
    // ==========================================
    let iconModalInstance = null;
    function openIconPicker(projectId) {
        if (!iconModalInstance) {
            iconModalInstance = new bootstrap.Modal(document.getElementById('modal-project-icon'));
        }
        document.getElementById('modal-icon-project-id').value = projectId;
        
        // 🪄 Get current project state
        const proj = appState.projects.find(p => p.id === projectId);
        const currentIcon = (proj && proj.icon) ? proj.icon : '🗂️';
        const hasPhoto = window.projectImages && window.projectImages[projectId];
        
        // 1. Show/Hide the "Remove Photo" button
        const removeBtn = document.getElementById('btn-remove-photo');
        if (removeBtn) {
            if (hasPhoto) {
                removeBtn.classList.remove('d-none');
            } else {
                removeBtn.classList.add('d-none');
            }
        }

        // 2. Format the Emoji Grid (Disable if photo exists, Highlight if selected)
        const emojiButtons = document.querySelectorAll('#modal-project-icon .d-grid button');
        emojiButtons.forEach(btn => {
            const btnIcon = btn.innerText.trim();
            
            // Visual Highlight Logic
            if (btnIcon === currentIcon && !hasPhoto) {
                // Active Selected Icon
                btn.classList.add('border-primary', 'border-2');
                btn.classList.remove('border');
            } else {
                // Inactive Icons
                btn.classList.remove('border-primary', 'border-2');
                btn.classList.add('border');
            }

            // Disabled/Grey-out Logic
            if (hasPhoto) {
                btn.disabled = true;
                btn.classList.add('opacity-25');
                btn.classList.remove('shadow-sm');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-25');
                btn.classList.add('shadow-sm');
            }
        });
        
        iconModalInstance.show();
    }

    function triggerImageUploadFromModal() {
        const projectId = document.getElementById('modal-icon-project-id').value;
        if (iconModalInstance) iconModalInstance.hide();
        triggerImageUpload(projectId);
    }

    function removeProjectPhoto() {
        const projectId = document.getElementById('modal-icon-project-id').value;
        if (!projectId) return;
        
        // 🪄 Garbage Collection
        delete window.projectImages[projectId];
        google.script.run.deleteThumbnail(projectId);
        
        // Redraw background UI instantly
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
        showToast("Photo removed.");

        // 🪄 Re-run the modal logic to wake up the emojis and highlight the current icon!
        openIconPicker(projectId);
    }
    function saveProjectIcon(iconString) {
        const projectId = document.getElementById('modal-icon-project-id').value;
        if (!projectId) return;

        const proj = appState.projects.find(p => p.id === projectId);
        if (proj) {
            proj.icon = iconString; // Inject the new Unicode character
            saveState();            // Trigger the background sync to Google Sheets
            
            // Redraw the view. Our Master Router from Phase 4 will ensure 
            // the cards are instantly updated without touching the table!
            if (typeof renderProjectsTable === 'function') renderProjectsTable(); 
        }
        
        if (iconModalInstance) iconModalInstance.hide();
    }

    // ==========================================
    // IMAGE COMPRESSOR ENGINE (PHASE 4)
    // ==========================================
    let currentUploadProjectId = null;
    function triggerImageUpload(projectId) {
        currentUploadProjectId = projectId;
        document.getElementById('hidden-image-upload').click();
    }
    function processImageUpload(event) {
        const file = event.target.files[0];
        if (!file || !currentUploadProjectId) return;

        // Reset the input value so the user can upload the exact same file again if they want
        event.target.value = '';

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // 🪄 1. The Math: Calculate new dimensions (Max 600px width/height)
                const MAX_DIMENSION = 600;
                let width = img.width;
                let height = img.height;

                if (width > height && width > MAX_DIMENSION) {
                    height *= MAX_DIMENSION / width;
                    width = MAX_DIMENSION;
                } else if (height > width && height > MAX_DIMENSION) {
                    width *= MAX_DIMENSION / height;
                    height = MAX_DIMENSION;
                }

                // 🪄 2. The Canvas Crunch: Draw and export as low-quality JPEG
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to JPEG, stepping down quality if base64 exceeds 45k chars
                let quality = 0.8;
                let base64String = canvas.toDataURL('image/jpeg', quality);
                while (base64String.length > 45000 && quality > 0.2) {
                    quality = Math.round((quality - 0.1) * 10) / 10;
                    base64String = canvas.toDataURL('image/jpeg', quality);
                }

                // 🪄 3. RAM Storage & Instant Redraw
                window.projectImages[currentUploadProjectId] = base64String;
                
                // Unconditionally fire the master router so it updates BOTH Table and Card views instantly!
                if (typeof renderProjectsTable === 'function') renderProjectsTable();

                // 🪄 4. Background Cloud Sync (Silent)
                const payload = {
                    projectId: currentUploadProjectId,
                    base64String: base64String
                };

                // Show a temporary saving toast
                showToast("Uploading thumbnail...");

                google.script.run
                    .withSuccessHandler((resStr) => {
                        const res = JSON.parse(resStr);
                        if (res.status === 'success') {
                            showToast("Thumbnail saved to cloud.");
                        } else {
                            showToast("Cloud save failed: " + res.message, true);
                        }
                    })
                    .withFailureHandler((err) => {
                        showToast("Server error saving thumbnail.", true);
                    })
                    .saveThumbnail(JSON.stringify(payload));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    /** 🪄 Ensures the date string is exactly YYYY-MM-DD for HTML inputs */
    function formatDateForInput(dateVal) {
        if (!dateVal) return '';
        
        // If it's already a clean YYYY-MM-DD (10 chars), return it
        if (typeof dateVal === 'string' && dateVal.length === 10 && dateVal.includes('-')) {
            return dateVal;
        }

        // Otherwise, try to force it into the correct format
        try {
            const d = new Date(dateVal);
            if (isNaN(d.getTime())) return ''; // Invalid date
            return d.toISOString().split('T')[0];
        } catch (e) {
            return '';
        }
    }
