<script>
    // ==========================================
    // PROJECT VIEW STATE & IMAGE MEMORY
    // ==========================================
    window.projectImages = {}; // Isolated RAM for images

    // 🪄 Background loader for images (Does not block main app boot)
    function fetchProjectThumbnails() {
        google.script.run
            .withSuccessHandler((responseStr) => {
                try {
                    const response = JSON.parse(responseStr);
                    if (response.status === 'success') {
                        window.projectImages = response.data || {};
                        // If user prefers cards, redraw now that images arrived
                        if (appState.settings && appState.settings.isProjectCardView && typeof renderProjectsTable === 'function') {
                            renderProjectsTable();
                        }
                    } else {
                        console.warn("Thumbnail fetch failed:", response.message);
                    }
                } catch(e) {
                    console.error("Failed to parse thumbnails:", e);
                }
            })
            .withFailureHandler((err) => {
                console.error("Server error fetching thumbnails:", err);
            })
            .getThumbnails();
    }

    // 🪄 Wait 2 seconds for the master data to finish loading before asking for images.
    // This prevents the Google Apps Script concurrent request collision.
    document.addEventListener('DOMContentLoaded', () => {
        const dateInput = document.getElementById('proj-date');
        if (dateInput) dateInput.value = new Date().toISOString().split('T')[0]; // Set input to YYYY-MM-DD
        setTimeout(fetchProjectThumbnails, 2000); 
    });

    function handleProjectCardSearch(query) {
        if (!appState.ui) appState.ui = {};
        appState.ui.projectCardSearchQuery = query.toLowerCase().trim();
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
    }

    function handleProjectCardFilter(status) {
        if (!appState.ui) appState.ui = {};
        appState.ui.projectCardStatusFilter = status;
        const chips = document.querySelectorAll('#project-card-chips button');
        chips.forEach(chip => {
            if (chip.dataset.status === status) {
                chip.classList.remove('btn-outline-secondary');
                chip.classList.add('btn-dark');
            } else {
                chip.classList.remove('btn-dark');
                chip.classList.add('btn-outline-secondary');
            }
        });
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
    }

    function handleProjectCardSort(selectEl) {
        const [key, dataType] = selectEl.value.split('|');
        if (typeof handleSort === 'function') handleSort('projects', key, dataType);
    }

    function toggleProjectCardSortDir() {
        const selectEl = document.getElementById('project-card-sort-select');
        if (selectEl) {
            const [key, dataType] = selectEl.value.split('|');
            // 🪄 Master router trick: Calling handleSort with the exact same key automatically flips the direction!
            if (typeof handleSort === 'function') handleSort('projects', key, dataType);
        }
    }

    function toggleProjectViewMode() {
        if (!appState.settings) appState.settings = {};
        
        // 🪄 1. Toggle the setting and SAVE IT to the cloud
        appState.settings.isProjectCardView = !appState.settings.isProjectCardView;
        saveState(); 
        
        // 🪄 2. Trigger the router to update the UI
        renderProjectsTable(); 
    }

    function syncProjectHeaderButtons(activeTab) {
        const btnPrint = document.getElementById('btn-print-parts');
        const btnImport = document.getElementById('btn-inline-import');
        const btnToggleView = document.getElementById('btn-toggle-project-view');
        const btnExport = document.getElementById('btn-export-parts-csv');
        const btnExportInfo = document.getElementById('btn-export-parts-info');
        const btnArchive = document.getElementById('btn-load-from-archive');
        const btnImportProject = document.getElementById('btn-import-project');

        if (activeTab === 'projects') {
            // In Projects Tab: Hide Parts buttons, Show Card Toggle + Archive/Import Project
            if (btnPrint) btnPrint.classList.add('d-none');
            if (btnImport) btnImport.classList.add('d-none');
            if (btnExport) btnExport.classList.add('d-none');
            if (btnExportInfo) btnExportInfo.classList.add('d-none');
            if (btnToggleView) btnToggleView.classList.remove('d-none');
            if (btnArchive) btnArchive.classList.remove('d-none');
            if (btnImportProject) btnImportProject.classList.remove('d-none');
        } else if (activeTab === 'parts') {
            // In Parts Tab: Show Parts buttons, Hide Card Toggle + Archive/Import Project
            if (btnPrint) btnPrint.classList.remove('d-none');
            if (btnImport) btnImport.classList.remove('d-none');
            if (btnExport) btnExport.classList.remove('d-none');
            if (btnExportInfo) btnExportInfo.classList.remove('d-none');
            if (btnToggleView) btnToggleView.classList.add('d-none');
            if (btnArchive) btnArchive.classList.add('d-none');
            if (btnImportProject) btnImportProject.classList.add('d-none');
        }
    }

    // ==========================================
    // PROJECTS (Master Router)
    // ==========================================
    function renderProjectsTable() {
        if (!appState.settings) appState.settings = {};
        const isCardView = appState.settings.isProjectCardView === true;

        if (!appState.projects) appState.projects = [];

        // 🪄 THE FIX: Scrub all dirty dates in RAM so the 'string' sort engine works flawlessly
        appState.projects.forEach(proj => {
            if (proj.date) {
                const cleanDate = formatDateForInput(proj.date);
                if (proj.date !== cleanDate) {
                    proj.date = cleanDate; // Silently fixes the underlying database
                }
            }
        });
        
        // 🪄 Synchronize the physical containers and buttons first
        const tableMode = document.getElementById('view-mode-table');
        const cardMode = document.getElementById('view-mode-cards');
        const toggleBtn = document.getElementById('btn-toggle-project-view');
        
        if (isCardView) {
            if (tableMode) tableMode.classList.add('d-none');
            if (cardMode) cardMode.classList.remove('d-none');
            if (toggleBtn) toggleBtn.innerHTML = '<b>☰</b>'; // Hamburger
            
            // Hijack the data loop to draw cards!
            renderProjectCards();
            return; 
        } else {
            if (tableMode) tableMode.classList.remove('d-none');
            if (cardMode) cardMode.classList.add('d-none');
            if (toggleBtn) toggleBtn.innerHTML = '<b>🗂️</b>'; // Card Icon
        }

        const tbody = document.getElementById('table-projects-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!appState.projects) appState.projects = [];

        if (appState.projects.length === 0) {
            const emptyHtml = _starterPackEmptyRow(10);
            if (emptyHtml) tbody.innerHTML = emptyHtml;
            return;
        }

        const currency = appState.settings.currency || '$';

        appState.projects.forEach(proj => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(proj, 'projects')) return;
            
            const tr = document.createElement('tr');
            
            // Pull the background-calculated totals
            const partCount = proj.totalParts || 0;
            const displayCost = (proj.totalCost || 0).toFixed(2);
            
            // 🪄 VISUAL ASSETS (The Evolving Avatar)
            const imageData = (typeof window.projectImages !== 'undefined') ? window.projectImages[proj.id] : null;
            let avatarHtml = '';

            if (imageData) {
                // Show photo. Clicking it opens the central Manager.
                avatarHtml = `<img src="${imageData}" class="shadow-sm border d-block mx-auto" style="width: 28px; height: 28px; object-fit: cover; border-radius: 4px; cursor: pointer;" onclick="openIconPicker('${proj.id}')" title="${t('title_manage_photo')}">`;
            } else {
                // Show Icon. Clicking it opens the central Manager.
                const icon = proj.icon || '🗂️';
                avatarHtml = `<div class="d-flex align-items-center justify-content-center mx-auto" style="width: 28px; height: 28px; cursor: pointer; font-size: 1.2rem; user-select: none;" onclick="openIconPicker('${proj.id}')" title="${t('title_manage_photo')}">${icon}</div>`;
            }

            // 🪄 PROJECT LINK ENGINE
            let linkHtml = proj.link 
                ? `<a href="${safeUrl(proj.link)}" target="_blank" class="text-decoration-none" title="${t('title_open_link')}">🔗</a>` 
                : `<span class="text-muted" style="opacity: 0.3;">🔗</span>`;

            // 🪄 STATUS DROPDOWN ENGINE (Fixed Width Badges)
            const currentStatus = proj.status || 'Design';
            
            // Default to Design (Yellow background, Black text)
            let statusColor = '#ffc107'; 
            let textColor = '#000000'; 
            
            if (currentStatus === 'Quoting') { statusColor = '#6f42c1'; textColor = '#ffffff'; }
            else if (currentStatus === 'Ready') { statusColor = '#0d6efd'; textColor = '#ffffff'; }
            else if (currentStatus === 'In Progress') { statusColor = '#fd7e14'; textColor = '#ffffff'; }
            else if (currentStatus === 'Completed') { statusColor = '#198754'; textColor = '#ffffff'; }

            let statusHtml = `
                <div class="dropdown">
                    <button class="btn btn-sm dropdown-toggle badge shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 15ch; background-color: ${statusColor}; color: ${textColor}; font-size: 0.85rem; padding: 0.35em 0.65em;">
                        ${t('status_' + currentStatus.toLowerCase().replace(/ /g, '_'))}
                    </button>
                    <ul class="dropdown-menu shadow-sm" style="min-width: 12rem;">
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Design')">🟡 ${t('status_design')}</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Quoting')">🟣 ${t('status_quoting')}</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Ready')">🔵 ${t('status_ready')}</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'In Progress')">🟠 ${t('status_in_progress')}</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Completed')">🟢 ${t('status_completed')}</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="changeProjectStatus('${proj.id}', 'Archive')">🗄️ ${t('status_archive_project')}</a></li>
                        <li><a class="dropdown-item" style="cursor: pointer;" onclick="exportProject('${proj.id}')" title="${t('title_export_project')}">📤 ${t('btn_export_project')}</a></li>
                    </ul>
                </div>
            `;
            
            tr.innerHTML = `
                <td class="text-center px-1 py-0 align-middle">
                    ${avatarHtml}
                </td>
                <td class="px-1 py-0">
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(proj.name)}" 
                           onchange="updateProject('${proj.id}', 'name', this.value)"
                           title="${t('title_tap_to_edit')}">
                </td>
                <td class="px-1 py-0 align-middle">
                    <textarea class="form-control form-control-sm border-0 bg-transparent project-comment-box"
                              rows="1" title="${safeHTML(proj.comment || '')}" 
                              onchange="updateProject('${proj.id}', 'comment', this.value)" 
                              placeholder="${t('ph_add_notes')}">${safeHTML(proj.comment || '')}</textarea>
                </td>
                <td class="px-1 py-0 align-middle text-center" style="position: relative;">
                    <span style="cursor: pointer; font-size: 0.875rem;" title="${t('title_edit_date')}">
                        ${formatDateForInput(proj.date)}
                    </span>
                    <input type="date" 
                           style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;"
                           value="${formatDateForInput(proj.date)}" 
                           onchange="updateProject('${proj.id}', 'date', this.value)">
                </td>
                <td class="text-center px-1 py-0 align-middle">
                    <span class="badge bg-primary shadow-sm" style="cursor: pointer;" onclick="jumpToProjectParts('${proj.id}')" title="${t('title_view_parts')}">${partCount}</span>
                </td>
                <td class="text-center px-1 py-0 align-middle fw-bold text-success"><small>${currency}${displayCost}</small></td>
                <td class="text-center align-middle">${statusHtml}</td>
                <td class="text-center px-1 py-0 align-middle" style="width: 40px;">
                    <button class="btn btn-sm border shadow-sm py-0 px-2" onclick="openGroupModal('${proj.id}')" title="${t('tip_manage_groups')}">⚙️</button>
                </td>
                <td class="text-nowrap align-middle">
                    <div class="d-flex justify-content-center align-items-center">
                        ${linkHtml}
                        <button class="btn btn-sm py-0 px-1" onclick="openLinkModal('${proj.id}')" title="${t('title_edit_link')}">✏️</button>
                    </div>
                </td>                   
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateProjectWarning('${proj.id}')" title="${t('title_duplicate_project')}">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteProject('${proj.id}')" title="${t('title_delete')}">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('projects', ['name', 'status']);
        }
    }
    function handleAddProject(event) {
        event.preventDefault();
        
        const nameInput = document.getElementById('proj-name');
        const dateInput = document.getElementById('proj-date');
        const newId = 'PROJ-' + Date.now() + Math.floor(Math.random() * 1000);
        
        const newProject = {
            id: newId,
            name: nameInput.value,
            date: dateInput ? dateInput.value : new Date().toISOString().split('T')[0],
            status: 'Design'
        };
        
        appState.projects.unshift(newProject);
        saveState();
        renderProjectsTable();
        showToast(t('msg_project_created'));
        
        nameInput.value = ''; // Clear the form
        if (dateInput) dateInput.value = new Date().toISOString().split('T')[0]; // Reset date to today for the next entry
    }
    function updateProject(id, field, newValue) {
        const project = appState.projects.find(p => p.id === id);
        if (project) {
            project[field] = newValue;
            saveState();
            renderProjectsTable();
            showToast(t('msg_project_updated'));
        }
    }
    function deleteProject(id, isConfirmed = false) {
        // 1. The Safety Shield (Made extra scary for a destructive action)
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_project'), () => deleteProject(id, true));
            return; 
        }

        // 2. The Cascade Delete (Purge the Parts)
        let deletedPartsCount = 0;
        if (appState.parts) {
            const originalLength = appState.parts.length;
            // Keep only the parts that DO NOT belong to this project
            appState.parts = appState.parts.filter(part => part.projectId !== id);
            deletedPartsCount = originalLength - appState.parts.length;
        }

        // 3. The Execution (Purge the Project and its groups — groups are never shared)
        appState.projects = appState.projects.filter(p => p.id !== id);
        if (appState.groups) appState.groups = appState.groups.filter(g => g.projectId !== id);
        
        // 🪄 Image Garbage Collection
        if (window.projectImages) delete window.projectImages[id];
        if (typeof google !== 'undefined' && google.script && google.script.run) google.script.run.deleteThumbnail(id);
        
        saveState();
        renderProjectsTable();
        if (typeof notifyConfigChanged === 'function') notifyConfigChanged();

        // 5. The Alarm
        if (deletedPartsCount > 0) {
            showToast(t('msg_project_deleted_parts', { count: deletedPartsCount }), true);
        } else {
            showToast(t('msg_project_deleted'));
        }
    }
    function duplicateProjectWarning(id) {
        requestConfirm(
            t('confirm_duplicate_project'), 
            () => duplicateProject(id), 
            'primary', 
            t('btn_duplicate')
        );
    }

    // ==========================================
    // GROUPS WITHIN PROJECTS
    // ==========================================
    let groupModalInstance = null;
    function openGroupModal(preSelectedProjectId = '') {
        // 1. Initialize Bootstrap Modal if it doesn't exist
        if (!groupModalInstance) {
            groupModalInstance = new bootstrap.Modal(document.getElementById('modal-group-manager'), {
                keyboard: true // Enables ESC to close natively
            });

            // When modal closes, forcefully update the Parts UI so new groups appear
            document.getElementById('modal-group-manager').addEventListener('hidden.bs.modal', function () {
                // Also trigger handleProjectChange to refresh the specific part-group dropdown 
                // without wiping out what the user was currently doing
                if (typeof handleProjectChange === 'function') handleProjectChange();
                if (typeof renderPartsTable === 'function') renderPartsTable();
            });
        }

        // 2. Populate the Project Dropdown
        const projSelect = document.getElementById('modal-group-project-select');
        projSelect.innerHTML = `<option value="" disabled selected>${t('opt_select_project')}</option>`;
        if (appState.projects) {
            [...appState.projects].sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                projSelect.innerHTML += `<option value="${p.id}">${safeHTML(p.name)}</option>`;
            });
        }

        // 3. Set Context (Pre-select or stay blank)
        if (preSelectedProjectId) {
            projSelect.value = preSelectedProjectId;
        } else {
            projSelect.value = ""; // Force it to stay on "Select a Project..."
        }

        // Sort groups alphabetically by name once, on open only — adding or
        // removing a group afterward must not reshuffle the list underneath the user.
        if (!appState.groups) appState.groups = [];
        appState.groups.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        saveState();

        renderGroupModalTable();
        groupModalInstance.show();

        // Bonus UX: Auto-focus the text input when modal opens (needs a tiny delay for the animation)
        setTimeout(() => {
            document.getElementById('modal-new-group-name').focus();
        }, 400);
    }
    function renderGroupModalTable() {
        const tbody = document.getElementById('table-modal-groups-body');
        tbody.innerHTML = '';
        
        const activeProjectId = document.getElementById('modal-group-project-select').value;
        if (!activeProjectId) return;

        if (!appState.groups) appState.groups = [];

        // Filter groups for the active project
        const projectGroups = appState.groups.filter(g => g.projectId === activeProjectId);

        if (projectGroups.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="text-center text-muted py-3">${t('msg_no_groups_defined')}</td></tr>`;
            return;
        }

        projectGroups.forEach(grp => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(grp.name)}" 
                           onchange="updateGroupName('${grp.id}', this.value)"
                           title="${t('title_tap_to_edit')}">
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteGroup('${grp.id}')" title="${t('title_delete_group')}">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    function handleAddGroup(event) {
        event.preventDefault();
        const activeProjectId = document.getElementById('modal-group-project-select').value;
        const nameInput = document.getElementById('modal-new-group-name');
        
        if (!activeProjectId) {
            showToast(t('msg_select_project_first'), "warning");
            return;
        }

        if (!appState.groups) appState.groups = [];
        
        appState.groups.unshift({
            id: 'GRP-' + Date.now() + Math.floor(Math.random() * 1000),
            projectId: activeProjectId,
            name: nameInput.value
        });
        
        saveState();
        renderGroupModalTable();
        nameInput.value = ''; // Clear input
        nameInput.focus();
    }
    function updateGroupName(id, newName) {
        const grp = appState.groups.find(g => g.id === id);
        if (grp) {
            grp.name = newName;
            saveState();
            showToast(t('msg_group_renamed'));
        }
    }
    function deleteGroup(id, isConfirmed = false) {
        // 🪄 The Safety Shield (Custom Modal)
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_group'), () => deleteGroup(id, true));
            return;
        }

        // 1. Cascade Nullify: Reset parts using this group
        let affectedParts = 0;
        if (appState.parts) {
            appState.parts.forEach(part => {
                if (part.groupId === id) {
                    part.groupId = ''; // Snap back to 'no group'
                    affectedParts++;
                }
            });
        }

        // 2. Delete the group
        appState.groups = appState.groups.filter(g => g.id !== id);
        saveState();
        renderGroupModalTable();
        
        showToast(t('msg_group_deleted_parts', { count: affectedParts }), "warning");
    }

    // ==========================================
    // DEEP FREEZE ARCHIVE ENGINE
    // ==========================================
    let archiveModalInstance;
    let currentArchiveData = [];
    let archiveSortCol = 'date';
    let archiveSortAsc = false;
    function changeProjectStatus(projectId, newStatus) {
        if (newStatus === 'Archive') {
            // 🪄 UNIVERSAL CONFIRM MODAL (Warning Theme)
            requestConfirm(
                t('confirm_archive_project'),
                () => {
                    executeDeepFreeze(projectId);
                },
                'warning',
                t('btn_archive')
            );
            return;
        }
        
        const proj = appState.projects.find(p => p.id === projectId);
        if (proj) {
            proj.status = newStatus;
            saveState();
            renderProjectsTable();
        }
    }
    function openArchiveModal() {
        if (!archiveModalInstance) archiveModalInstance = new bootstrap.Modal(document.getElementById('modal-archive'));
        
        // 🪄 ADDED: Spinner to the loading text
        document.getElementById('archive-table-body').innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>${t('txt_loading_cold_storage')}</td></tr>`;
        archiveModalInstance.show();

        google.script.run
            .withSuccessHandler((responseStr) => {
                const response = JSON.parse(responseStr);
                if (response.status === 'success') {
                    currentArchiveData = response.data;
                    renderArchiveTable();
                } else {
                    document.getElementById('archive-table-body').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${safeHTML(t('msg_server_error', { message: response.message }))}</td></tr>`;
                }
            })
            .withFailureHandler((err) => {
                document.getElementById('archive-table-body').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${safeHTML(t('msg_server_error', { message: String(err) }))}</td></tr>`;
            })
            .getArchiveList();
    }
    function renderArchiveTable() {
        const tbody = document.getElementById('archive-table-body');
        if (currentArchiveData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">${t('msg_no_archived_projects')}</td></tr>`;
            return;
        }

        // Sort Logic
        currentArchiveData.sort((a, b) => {
            let valA = a[archiveSortCol] || '';
            let valB = b[archiveSortCol] || '';
            if (valA < valB) return archiveSortAsc ? -1 : 1;
            if (valA > valB) return archiveSortAsc ? 1 : -1;
            return 0;
        });

        tbody.innerHTML = currentArchiveData.map(proj => {
            const d = new Date(proj.date);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            const avatarHtml = proj.image
                ? `<img src="${proj.image}" class="shadow-sm border d-block mx-auto" style="width: 28px; height: 28px; object-fit: cover; border-radius: 4px;">`
                : `<div class="d-flex align-items-center justify-content-center mx-auto" style="width: 28px; height: 28px; font-size: 1.2rem;">${proj.icon || '🗂️'}</div>`;

            return `
            <tr>
                <td class="ps-3">${dateStr}</td>
                <td class="text-center px-1">${avatarHtml}</td>
                <td class="fw-bold">${safeHTML(proj.name)}</td>
                <td style="max-width: 180px;">
                    <textarea class="archive-note-cell form-control form-control-sm border-0 bg-transparent text-muted w-100" rows="1" readonly title="${t('title_click_to_expand')}">${safeHTML(proj.notes)}</textarea>
                </td>
                <td class="text-end pe-3 text-nowrap">
                    <button class="btn btn-sm btn-outline-primary py-0 px-2 me-1" onclick="requestConfirm(t('confirm_restore_project'), () => restoreArchivedProject('${proj.id}'), 'primary', t('btn_restore'))" title="${t('title_restore_to_workspace')}">${t('btn_restore')}</button>
                    <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deleteArchivedProjectUI('${proj.id}')" title="${t('title_permanently_delete')}">🗑️</button>
                </td>
            </tr>
            `;
        }).join('');
    }
    function sortArchive(col) {
        if (archiveSortCol === col) archiveSortAsc = !archiveSortAsc;
        else { archiveSortCol = col; archiveSortAsc = true; }
        renderArchiveTable();
    }
    function executeDeepFreeze(projectId) {
        // 🪄 1. Setup Spinner & Shield
        const confirmBtn = document.getElementById('btn-confirm-delete');
        let originalText = 'Archive';
        if (confirmBtn) {
            originalText = confirmBtn.innerText;
            confirmBtn.innerHTML = `<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> ${t('lbl_working')}`;
        }
        freezeUI();

        const projIndex = appState.projects.findIndex(p => p.id === projectId);
        if (projIndex === -1) {
            unfreezeUI();
            if (confirmBtn) confirmBtn.innerHTML = originalText;
            return;
        }

        const payload = {
            id: projectId,
            project: appState.projects[projIndex],
            groups: (appState.groups || []).filter(g => g.projectId === projectId),
            parts: (appState.parts || []).filter(p => p.projectId === projectId),
            image: (window.projectImages && window.projectImages[projectId]) || null
        };
        const _partProfileIds  = new Set(payload.parts.map(p => p.profileId).filter(Boolean));
        const _partMaterialIds = new Set(payload.parts.map(p => p.materialId).filter(Boolean));
        payload.usedProfiles  = (appState.profiles  || []).filter(p => _partProfileIds.has(p.id));
        payload.usedMaterials = (appState.materials || []).filter(m => _partMaterialIds.has(m.id));

        google.script.run
            .withSuccessHandler((response) => {
                // 🪄 2. Remove Shield & Restore UI
                unfreezeUI();
                if (confirmBtn) confirmBtn.innerHTML = originalText;

                if (response.status === 'success') {
                    appState.projects.splice(projIndex, 1);
                    if (appState.groups) appState.groups = appState.groups.filter(g => g.projectId !== projectId);
                    if (appState.parts) appState.parts = appState.parts.filter(p => p.projectId !== projectId);
                    
                    // 🪄 Image Garbage Collection
                    delete window.projectImages[projectId];
                    google.script.run.deleteThumbnail(projectId);
                    
                    saveState();
                    renderProjectsTable();
                    showToast(t('msg_project_archived'));
                    
                    // 🪄 NOW we safely hide the modal because the data is saved
                    const confirmModalEl = document.getElementById('modal-universal-delete');
                    if (confirmModalEl) bootstrap.Modal.getInstance(confirmModalEl)?.hide();
                } else {
                    showToast(t('msg_archive_failed', { message: response.message }), 'danger');
                }
            })
            .withFailureHandler((err) => {
                unfreezeUI();
                if (confirmBtn) confirmBtn.innerHTML = originalText;
                showToast(t('msg_server_error', { message: String(err) }), 'danger');
            })
            .archiveProjectToSheet(JSON.stringify(payload));
    }
    function restoreArchivedProject(id) {
        // 🪄 1. Setup Spinner & Shield — spinner goes on the confirm modal button, same as archive
        const confirmBtn = document.getElementById('btn-confirm-delete');
        let originalText = '';
        if (confirmBtn) {
            originalText = confirmBtn.innerText;
            confirmBtn.innerHTML = `<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> ${t('lbl_working')}`;
        }
        freezeUI();

        google.script.run
            .withSuccessHandler((responseStr) => {
                // 🪄 2. Remove Shield & Restore UI
                unfreezeUI();
                if (confirmBtn) confirmBtn.innerHTML = originalText;

                const response = typeof responseStr === 'string' ? JSON.parse(responseStr) : responseStr;
                if (response.status === 'success') {
                    appState.projects.unshift(response.project);
                    if(response.groups) { if (!appState.groups) appState.groups = []; appState.groups.push(...response.groups); }

                    // --- Catalog resolution (Option D) ---
                    // Heal broken profileId/materialId references before parts land in appState.
                    // Step 1: exact ID match → keep as-is.
                    // Step 2: name match in current catalog → remap to existing entry's ID.
                    // Step 3: no match → restore full object from snapshot with original ID.
                    if (!appState.profiles)  appState.profiles  = [];
                    if (!appState.materials) appState.materials = [];
                    const _snapProfs = response.usedProfiles  || [];
                    const _snapMats  = response.usedMaterials || [];
                    let _catalogAdditions = 0;
                    (response.parts || []).forEach(part => {
                        const sProf = _snapProfs.find(p => p.id === part.profileId);
                        const sMat  = _snapMats.find(m => m.id === part.materialId);
                        if (sProf) {
                            const beforeCount = appState.profiles.length;
                            part.profileId = _resolveCatalogRef(part.profileId, sProf.name, appState.profiles, _snapProfs);
                            if (appState.profiles.length > beforeCount) _catalogAdditions++;
                        }
                        if (sMat) {
                            const beforeCount = appState.materials.length;
                            part.materialId = _resolveCatalogRef(part.materialId, sMat.name, appState.materials, _snapMats);
                            if (appState.materials.length > beforeCount) _catalogAdditions++;
                        }
                    });
                    // --- End catalog resolution ---

                    if(response.parts)  { if (!appState.parts)  appState.parts  = []; appState.parts.push(...response.parts); }

                    if (response.image) {
                        if (!window.projectImages) window.projectImages = {};
                        window.projectImages[response.project.id] = response.image;
                        google.script.run.saveThumbnail(JSON.stringify({
                            projectId: response.project.id,
                            base64String: response.image
                        }));
                    }

                    saveState();
                    renderProjectsTable();

                    google.script.run.deleteProjectFromArchive(id);

                    // 🪄 FIXED: Remove the project from the list and redraw, leaving the modal open
                    currentArchiveData = currentArchiveData.filter(p => p.id !== id);
                    renderArchiveTable();

                    if (_catalogAdditions > 0) {
                        if (typeof renderMaterialsTable === 'function') renderMaterialsTable();
                        if (typeof renderProfilesTable  === 'function') renderProfilesTable();
                    }
                    showToast(t('msg_project_restored'));
                    if (_catalogAdditions > 0) showToast(t('msg_catalog_restored', { count: _catalogAdditions }));
                    bootstrap.Modal.getInstance(document.getElementById('modal-universal-delete'))?.hide();
                    archiveModalInstance?.hide();
                } else {
                    showToast(t('msg_restore_failed', { message: response.message }), 'danger');
                }
            })
            .withFailureHandler((err) => {
                unfreezeUI();
                if (confirmBtn) confirmBtn.innerHTML = originalText;
                showToast(t('msg_server_error', { message: String(err) }), 'danger');
            })
            .loadProjectFromArchive(id);
    }

    // ==========================================
    // PROJECT EXPORT / IMPORT (JSON FILE)
    // ==========================================
    // Reuses the exact same payload shape and catalog-healing strategy as the
    // Deep Freeze Archive engine above — the difference is purely where the data
    // lands (a downloadable file vs. the Archive sheet) and, on the way back in,
    // that every ID is minted fresh rather than reused. Archive/Restore is a MOVE
    // (the project leaves appState.projects the instant it's archived, so reusing
    // its original ids on restore is always safe — there's only ever one live
    // copy). Export/Import is a COPY — the project stays fully live after being
    // exported, so re-importing that same file later (including into the very
    // same workspace where the original is still open) must never collide with
    // it. Hence: fresh project id, fresh group ids (with an old->new remap table
    // so parts' groupId still points at the right group), fresh part ids.

    /**
     * Resolves an archived/exported profileId or materialId against the live
     * catalog, healing it if the original no longer exists there:
     *   1. Exact id match in currentItems -> keep as-is.
     *   2. Name match in currentItems -> remap to that existing entry's id.
     *   3. Neither -> reinsert the snapshot object verbatim (original id kept)
     *      so the reference still resolves. Mutates currentItems in place only
     *      in this third case; the caller can detect that by comparing
     *      currentItems.length before/after.
     * Pure otherwise — unit-testable. Shared by restoreArchivedProject() above
     * and importProject() below, so this healing logic only lives in one place.
     */
    function _resolveCatalogRef(archivedId, archivedName, currentItems, snapItems) {
        if (currentItems.some(x => x.id === archivedId)) return archivedId;
        const byName = currentItems.find(x => x.name === archivedName);
        if (byName) return byName.id;
        const snap = snapItems.find(x => x.id === archivedId);
        if (snap) currentItems.unshift(snap);
        return archivedId;
    }

    /**
     * Builds the exported-project JSON payload for one project: the project row
     * itself, its groups/parts (filtered from appState by projectId), its
     * thumbnail (from the passed-in projectImages map, not read from window
     * directly, so this stays testable), and a snapshot of exactly the
     * profiles/materials its parts reference — mirrors executeDeepFreeze()'s
     * payload construction above. stock/catalog are deliberately NOT bundled,
     * matching the Archive feature's existing scope (they're global, not
     * per-project, and Archive never captures them either).
     */
    function _buildProjectExportPayload(projectId, appState, projectImages) {
        const project = (appState.projects || []).find(p => p.id === projectId);
        const groups = (appState.groups || []).filter(g => g.projectId === projectId);
        const parts = (appState.parts || []).filter(p => p.projectId === projectId);
        const image = (projectImages && projectImages[projectId]) || null;

        const _partProfileIds = new Set(parts.map(p => p.profileId).filter(Boolean));
        const _partMaterialIds = new Set(parts.map(p => p.materialId).filter(Boolean));
        const usedProfiles = (appState.profiles || []).filter(p => _partProfileIds.has(p.id));
        const usedMaterials = (appState.materials || []).filter(m => _partMaterialIds.has(m.id));

        return {
            format: 'solidcutlist-project',
            version: 1,
            exportedAt: new Date().toISOString(),
            project,
            groups,
            parts,
            image,
            usedProfiles,
            usedMaterials
        };
    }

    function exportProject(projectId) {
        const payload = _buildProjectExportPayload(projectId, appState, window.projectImages);
        if (!payload.project) return;

        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);

        const safeName = (payload.project.name || 'Project').replace(/[\\/:*?"<>|]/g, '_');
        const dateStamp = new Date().toISOString().slice(0, 10);
        const link = document.createElement('a');
        link.href = url;
        link.download = `SolidCutlist-Project-${safeName}-${dateStamp}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast(t('msg_project_exported'));
    }

    /**
     * Validates a parsed import file before anything touches appState. Requires
     * the versioned envelope produced by _buildProjectExportPayload() and a
     * usable project object; groups/parts default to [] rather than failing
     * outright if missing/malformed, since a project with no parts yet is still
     * a legitimate export. Pure — unit-testable.
     */
    function _validateProjectImportData(parsed) {
        if (!parsed || typeof parsed !== 'object') return { valid: false, error: 'not_an_object' };
        if (parsed.format !== 'solidcutlist-project') return { valid: false, error: 'wrong_format' };
        if (!parsed.project || typeof parsed.project !== 'object' || !parsed.project.id || !parsed.project.name) {
            return { valid: false, error: 'missing_project' };
        }
        if (!Array.isArray(parsed.groups)) parsed.groups = [];
        if (!Array.isArray(parsed.parts)) parsed.parts = [];
        return { valid: true };
    }

    /**
     * Prepares an already-validated import payload for merging into appState:
     * mints a fresh project id, a fresh id for every group (remapping old->new
     * so parts' groupId still resolves), and a fresh id for every part
     * (rewriting projectId/groupId to match), then heals each part's
     * profileId/materialId via _resolveCatalogRef() against the live catalog
     * plus the snapshot — identical healing semantics to restoreArchivedProject().
     * Mutates appState.profiles/appState.materials in place only when a
     * snapshot reinsert is needed. Does not itself touch appState.projects/
     * .groups/.parts or the DOM, so the actual merge stays in the impure
     * caller — this core is fully unit-testable.
     */
    function _prepareImportedProjectForMerge(importData, appState) {
        if (!appState.profiles) appState.profiles = [];
        if (!appState.materials) appState.materials = [];

        const newProjectId = 'PROJ-' + Date.now() + Math.floor(Math.random() * 1000);
        const project = { ...importData.project, id: newProjectId };

        const groupIdMap = {};
        const groups = importData.groups.map((g, index) => {
            const newGroupId = 'GRP-' + Date.now() + index + Math.floor(Math.random() * 1000);
            groupIdMap[g.id] = newGroupId;
            return { ...g, id: newGroupId, projectId: newProjectId };
        });

        const snapProfiles = importData.usedProfiles || [];
        const snapMaterials = importData.usedMaterials || [];
        let catalogAdditions = 0;

        const parts = importData.parts.map((p, index) => {
            const newPartId = 'PART-' + Date.now() + index + Math.floor(Math.random() * 1000);
            const part = {
                ...p,
                id: newPartId,
                projectId: newProjectId,
                groupId: (p.groupId && groupIdMap[p.groupId]) ? groupIdMap[p.groupId] : p.groupId
            };

            const sProf = snapProfiles.find(x => x.id === part.profileId);
            const sMat = snapMaterials.find(x => x.id === part.materialId);
            if (sProf) {
                const beforeCount = appState.profiles.length;
                part.profileId = _resolveCatalogRef(part.profileId, sProf.name, appState.profiles, snapProfiles);
                if (appState.profiles.length > beforeCount) catalogAdditions++;
            }
            if (sMat) {
                const beforeCount = appState.materials.length;
                part.materialId = _resolveCatalogRef(part.materialId, sMat.name, appState.materials, snapMaterials);
                if (appState.materials.length > beforeCount) catalogAdditions++;
            }
            return part;
        });

        return { project, groups, parts, catalogAdditions };
    }

    function triggerImportProjectFilePicker() {
        document.getElementById('input-import-project-file').click();
    }

    function handleImportProjectFile(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = ''; // allow re-selecting the same file next time
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            let parsed;
            try {
                parsed = JSON.parse(e.target.result);
            } catch (err) {
                showToast(t('msg_import_project_invalid_file'), 'warning');
                return;
            }

            const validation = _validateProjectImportData(parsed);
            if (!validation.valid) {
                showToast(t('msg_import_project_invalid_file'), 'warning');
                return;
            }

            const prepared = _prepareImportedProjectForMerge(parsed, appState);

            if (!appState.projects) appState.projects = [];
            if (!appState.groups) appState.groups = [];
            if (!appState.parts) appState.parts = [];
            appState.projects.unshift(prepared.project);
            appState.groups.push(...prepared.groups);
            appState.parts.push(...prepared.parts);

            if (parsed.image) {
                if (!window.projectImages) window.projectImages = {};
                window.projectImages[prepared.project.id] = parsed.image;
                google.script.run.saveThumbnail(JSON.stringify({
                    projectId: prepared.project.id,
                    base64String: parsed.image
                }));
            }

            saveState();
            renderProjectsTable();

            if (prepared.catalogAdditions > 0) {
                if (typeof renderMaterialsTable === 'function') renderMaterialsTable();
                if (typeof renderProfilesTable === 'function') renderProfilesTable();
            }

            showToast(t('msg_project_imported', { name: prepared.project.name }));
            if (prepared.catalogAdditions > 0) showToast(t('msg_catalog_restored', { count: prepared.catalogAdditions }));
        };
        reader.onerror = () => {
            showToast(t('msg_import_project_read_error'), 'warning');
        };
        reader.readAsText(file);
    }

                                   style="font-size: 1rem; cursor: text; line-height: 1.1;"
                                   value="${safeHTML(proj.name)}" 
                                   onchange="updateProject('${proj.id}', 'name', this.value)"
                                   title="${t('title_tap_to_edit')}">
                            <div style="position: relative; width: fit-content; margin-top: -8px;">
                                <span class="text-muted" style="display: inline-block; min-width: 75px; font-size: 0.8rem; cursor: pointer; line-height: 1;" title="${t('title_edit_date')}">
                                    ${formatDateForInput(proj.date) || '&nbsp;'}
                                </span>
                                <input type="date" 
                                       style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;"
                                       value="${formatDateForInput(proj.date)}" 
                                       onchange="updateProject('${proj.id}', 'date', this.value)">
                            </div>
                        </div>
                        ${topControlsHtml}
                    </div>

                    ${heroImageHtml}
                    
                    <div class="card-body p-3 d-flex flex-column">
                        <div class="flex-grow-1 mb-3 position-relative" style="min-height: 3em;">
                            <div contenteditable="true" 
                                 class="form-control form-control-sm border-0 bg-transparent text-muted small p-0 w-100 card-comment-box"
                                 style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; outline: none; line-height: 1.5; cursor: text; word-break: break-word;"
                                 onblur="updateProject('${proj.id}', 'comment', this.innerText)"
                                 title="${t('title_tap_to_edit_notes')}"
                                 data-placeholder="${t('ph_add_notes')}">${safeHTML(proj.comment || '')}</div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge text-dark border shadow-sm" style="cursor: pointer;" onclick="jumpToProjectParts('${proj.id}')" title="${t('title_view_parts')}">🧩 ${t('lbl_n_parts', { count: partCount })}</span>
                            <span>
                                <button type="button" class="info-icon-btn" style="position:static;display:inline-block;vertical-align:middle;" onclick="showInfoTooltip(event, t('tooltip_est_cost'))">ⓘ</button>
                                <span class="badge text-success border shadow-sm fw-bold">${currency}${displayCost}</span>
                            </span>
                        </div>
                        
                        <div class="d-flex gap-2 mt-auto">
                            ${statusHtml}
                            <button class="btn btn-sm border shadow-sm px-3 flex-shrink-0" onclick="openGroupModal('${proj.id}')" title="${t('tip_manage_groups')}">⚙️</button>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(col);
        });

        // Search Fallback UI
        if (visibleCount === 0) {
            grid.innerHTML = `<div class="col-12 text-center text-muted mt-5"><h5>${t('msg_no_projects_match_filter')}</h5></div>`;
        }
    }

    // ==========================================
    // ICON PICKER ENGINE (PHASE 5)
    // ==========================================
    let iconModalInstance = null;
    function openIconPicker(projectId) {
        if (!iconModalInstance) {
            iconModalInstance = new bootstrap.Modal(document.getElementById('modal-project-icon'));
        }
        document.getElementById('modal-icon-project-id').value = projectId;
        
        // 🪄 Get current project state
        const proj = appState.projects.find(p => p.id === projectId);
        const currentIcon = (proj && proj.icon) ? proj.icon : '🗂️';
        const hasPhoto = window.projectImages && window.projectImages[projectId];
        
        // 1. Show/Hide the "Remove Photo" button
        const removeBtn = document.getElementById('btn-remove-photo');
        if (removeBtn) {
            if (hasPhoto) {
                removeBtn.classList.remove('d-none');
            } else {
                removeBtn.classList.add('d-none');
            }
        }

        // 2. Format the Emoji Grid (Disable if photo exists, Highlight if selected)
        const emojiButtons = document.querySelectorAll('#modal-project-icon .d-grid button');
        emojiButtons.forEach(btn => {
            const btnIcon = btn.innerText.trim();
            
            // Visual Highlight Logic
            if (btnIcon === currentIcon && !hasPhoto) {
                // Active Selected Icon
                btn.classList.add('border-primary', 'border-2');
                btn.classList.remove('border');
            } else {
                // Inactive Icons
                btn.classList.remove('border-primary', 'border-2');
                btn.classList.add('border');
            }

            // Disabled/Grey-out Logic
            if (hasPhoto) {
                btn.disabled = true;
                btn.classList.add('opacity-25');
                btn.classList.remove('shadow-sm');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-25');
                btn.classList.add('shadow-sm');
            }
        });
        
        iconModalInstance.show();
    }

    function triggerImageUploadFromModal() {
        const projectId = document.getElementById('modal-icon-project-id').value;
        if (iconModalInstance) iconModalInstance.hide();
        triggerImageUpload(projectId);
    }

    function removeProjectPhoto() {
        const projectId = document.getElementById('modal-icon-project-id').value;
        if (!projectId) return;
        
        // 🪄 Garbage Collection
        delete window.projectImages[projectId];
        google.script.run.deleteThumbnail(projectId);
        
        // Redraw background UI instantly
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
        showToast(t('msg_photo_removed'));

        // 🪄 Re-run the modal logic to wake up the emojis and highlight the current icon!
        openIconPicker(projectId);
    }
    function saveProjectIcon(iconString) {
        const projectId = document.getElementById('modal-icon-project-id').value;
        if (!projectId) return;

        const proj = appState.projects.find(p => p.id === projectId);
        if (proj) {
            proj.icon = iconString; // Inject the new Unicode character
            saveState();            // Trigger the background sync to Google Sheets
            
            // Redraw the view. Our Master Router from Phase 4 will ensure 
            // the cards are instantly updated without touching the table!
            if (typeof renderProjectsTable === 'function') renderProjectsTable(); 
        }
        
        if (iconModalInstance) iconModalInstance.hide();
    }

    // ==========================================
    // IMAGE COMPRESSOR ENGINE (PHASE 4)
    // ==========================================
    let currentUploadProjectId = null;
    function triggerImageUpload(projectId) {
        currentUploadProjectId = projectId;
        document.getElementById('hidden-image-upload').click();
    }
    function processImageUpload(event) {
        const file = event.target.files[0];
        if (!file || !currentUploadProjectId) return;

        // Reset the input value so the user can upload the exact same file again if they want
        event.target.value = '';

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onerror = function() {
                showToast(t('msg_invalid_image_file'), true);
            };
            img.onload = function() {
                // 🪄 1. The Math: Calculate new dimensions (Max 600px width/height)
                const MAX_DIMENSION = 600;
                let width = img.width;
                let height = img.height;

                // Scale the LONGER side down to MAX_DIMENSION (square images included)
                const _longest = Math.max(width, height);
                if (_longest > MAX_DIMENSION) {
                    width  = Math.round(width  * MAX_DIMENSION / _longest);
                    height = Math.round(height * MAX_DIMENSION / _longest);
                }

                // 🪄 2. The Canvas Crunch: Draw and export as low-quality JPEG
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                
                // Compress to JPEG, stepping down quality if base64 exceeds 45k chars
                let quality = 0.8;
                let base64String = canvas.toDataURL('image/jpeg', quality);
                while (base64String.length > 45000 && quality > 0.2) {
                    quality = Math.round((quality - 0.1) * 10) / 10;
                    base64String = canvas.toDataURL('image/jpeg', quality);
                }
                // Still too big for one spreadsheet cell: shrink the picture until it fits
                while (base64String.length > 45000 && canvas.width > 80) {
                    const _shrunk = document.createElement('canvas');
                    _shrunk.width = Math.round(canvas.width * 0.8);
                    _shrunk.height = Math.round(canvas.height * 0.8);
                    _shrunk.getContext('2d').drawImage(canvas, 0, 0, _shrunk.width, _shrunk.height);
                    canvas.width = _shrunk.width; canvas.height = _shrunk.height;
                    canvas.getContext('2d').drawImage(_shrunk, 0, 0);
                    base64String = canvas.toDataURL('image/jpeg', quality);
                }

                // 🪄 3. RAM Storage & Instant Redraw
                window.projectImages[currentUploadProjectId] = base64String;
                
                // Unconditionally fire the master router so it updates BOTH Table and Card views instantly!
                if (typeof renderProjectsTable === 'function') renderProjectsTable();

                // 🪄 4. Background Cloud Sync (Silent)
                const payload = {
                    projectId: currentUploadProjectId,
                    base64String: base64String
                };

                // Show a temporary saving toast
                showToast(t('msg_uploading_thumbnail'));

                google.script.run
                    .withSuccessHandler((resStr) => {
                        const res = JSON.parse(resStr);
                        if (res.status === 'success') {
                            showToast(t('msg_thumbnail_saved'));
                        } else {
                            showToast(t('msg_thumbnail_failed'), true);
                        }
                    })
                    .withFailureHandler((err) => {
                        showToast(t('msg_thumbnail_failed'), true);
                    })
                    .saveThumbnail(JSON.stringify(payload));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    /** 🪄 Ensures the date string is exactly YYYY-MM-DD for HTML inputs */
    function formatDateForInput(dateVal) {
        if (!dateVal) return '';
        
        // If it's already a clean YYYY-MM-DD (10 chars), return it
        if (typeof dateVal === 'string' && dateVal.length === 10 && dateVal.includes('-')) {
            return dateVal;
        }

        // Otherwise, try to force it into the correct format
        try {
            const d = new Date(dateVal);
            if (isNaN(d.getTime())) return ''; // Invalid date
            return d.toISOString().split('T')[0];
        } catch (e) {
            return '';
        }
    }
</script>
