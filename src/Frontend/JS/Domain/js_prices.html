<script>
    // Main UI & Router
    function toggleCatalogView() {
        if (!appState.settings) appState.settings = {};
        appState.settings.compactCatalogView = !appState.settings.compactCatalogView;
        saveState();
        renderCatalogTable();
    }
    function renderCatalogTable() {
        const isCompact = appState.settings?.compactCatalogView;
        const tableEl = document.getElementById('table-catalog');

        // Sync the view-unit dropdown from AppState (single source of truth)
        const viewUnitEl = document.getElementById('table-price-view');
        if (viewUnitEl && appState.settings?.catalogViewUnit) {
            viewUnitEl.value = appState.settings.catalogViewUnit;
        }

        if (tableEl) {
            tableEl.classList.toggle('is-compressed', isCompact);
        }

        // Update Button UI
        const btnIcon = document.getElementById('catalog-view-icon');
        if (btnIcon) {
            btnIcon.innerText = isCompact ? '☰' : '🗜️';
        }

        // 🪄 Hide the Raw Price and Links columns in Compact Mode!
        const thPrice = document.getElementById('th-catalog-price');
        const thLinks = document.getElementById('th-catalog-links');
        if (thPrice) thPrice.style.display = isCompact ? 'none' : '';
        if (thLinks) thLinks.style.display = isCompact ? 'none' : '';

        if (isCompact) {
            renderCompressedCatalogTable();
        } else {
            renderFlatCatalogTable();
        }
    }

    // Compact View Engine (Modal)
    function getCompressedCatalogData() {
        return groupByFingerprint(
            appState.catalog,
            ['categoryId', 'profileId', 'materialId', 'storeId'],
            (item, fingerprint) => ({
                fingerprint,
                categoryId: item.categoryId,
                profileId: item.profileId,
                materialId: item.materialId,
                storeId: item.storeId,
                grains: new Set(),
                oldestVerification: Date.now(),
                pieces: []
            }),
            (group, item) => {
                group.pieces.push(item);
                group.grains.add(item.grain || 'none');
                // Find the weakest link (oldest timestamp) for the freshness badge
                const itemTime = item.lastVerified || 0;
                if (itemTime < group.oldestVerification) {
                    group.oldestVerification = itemTime;
                }
            }
        );
    }
    function renderCompressedCatalogTable() {
        const tbody = document.getElementById('table-catalog-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 

        const groups = getCompressedCatalogData();
        const viewUnit = appState.settings?.catalogViewUnit || 'piece';
        const currency = appState.settings.currency || '$';

        groups.forEach(group => {
            // Mock item for filters
            const mockItem = {
                categoryId: group.categoryId,
                profileId: group.profileId,
                materialId: group.materialId,
                storeId: group.storeId,
                grain: group.grains.size > 1 ? 'multiple' : Array.from(group.grains)[0]
            };
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(mockItem, 'catalog')) return;

            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', (e) => { if (!e.target.closest('button')) showToast(t('msg_switch_to_full_view'), true); });
            const badgeClass = getCategoryBadgeClass(group.categoryId);

            // Safe Lookups
            const profile = appState.profiles.find(p => p.id === group.profileId);
            const material = appState.materials.find(m => m.id === group.materialId);
            const store = appState.stores?.find(s => s.id === group.storeId);
            
            const profName = profile ? profile.name : `⚠️ Missing`;
            const matName = material ? material.name : `⚠️ Missing`;
            const storeName = store ? store.name : `⚠️ Missing`;

            if (!profile || !material || !store) tr.classList.add('table-warning');

            // 🪄 1. SIZE RANGE MATH
            let sizeHtml = '-';
            if (group.pieces.length > 0) {
                if (group.categoryId === 'sheet') {
                    group.pieces.sort((a, b) => (b.length * b.width) - (a.length * a.width));
                    const maxP = group.pieces[0];
                    const minP = group.pieces[group.pieces.length - 1];
                    const minStr = `${formatForDisplay(minP.width)} x ${formatForDisplay(minP.length)}`;
                    const maxStr = `${formatForDisplay(maxP.width)} x ${formatForDisplay(maxP.length)}`;
                    sizeHtml = minStr === maxStr
                        ? `<small><span>${maxStr}</span></small>`
                        : `<small><span>${minStr} <span class="text-muted fw-normal mx-1">...</span> ${maxStr}</span></small>`;
                } else {
                    group.pieces.sort((a, b) => b.length - a.length);
                    const maxP = group.pieces[0];
                    const minP = group.pieces[group.pieces.length - 1];
                    const minStr = formatForDisplay(minP.length);
                    const maxStr = formatForDisplay(maxP.length);
                    sizeHtml = minStr === maxStr
                        ? `<small><span>${maxStr}</span></small>`
                        : `<small><span>${minStr} <span class="text-muted fw-normal mx-1">...</span> ${maxStr}</span></small>`;
                }
            }

            // 🪄 2. NORMALIZED PRICE RANGE MATH
            let priceHtml = '-';
            if (group.pieces.length > 0) {
                // Calculate live normalized price for every piece in the group
                const prices = group.pieces.map(p => parseFloat(getNormalizedPriceDisplay(p, viewUnit)) || 0);
                const minPrice = Math.min(...prices).toFixed(2);
                const maxPrice = Math.max(...prices).toFixed(2);

                priceHtml = minPrice === maxPrice 
                    ? `<small>${currency}${maxPrice}</small>`
                    : `<small>${currency}${minPrice} <span class="text-muted fw-normal mx-1">...</span> ${currency}${maxPrice}</small>`;
            }

            // 🪄 3. GRAIN
            let grainHtml = '-';
            if (group.categoryId === 'sheet') {
                if (group.grains.size > 1) grainHtml = `<span class="fst-italic text-muted"><small>Multiple</small></span>`;
                else grainHtml = `<small>${Array.from(group.grains)[0] === 'none' ? '-' : t('opt_' + Array.from(group.grains)[0])}</small>`;
            }

            // 🪄 4. FRESHNESS BADGE (Based on the oldest verification in the group)
            const daysOld = (Date.now() - group.oldestVerification) / (1000 * 60 * 60 * 24);
            let badgeBg = '#198754'; 
            let badgeColor = '#ffffff';
            if (daysOld >= 28) badgeBg = '#dc3545'; 
            else if (daysOld >= 14) { badgeBg = '#ffc107'; badgeColor = '#000000'; }

            const dateObj = new Date(group.oldestVerification);
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            let freshnessHtml = `
                <span class="badge shadow-sm"
                    style="background-color: ${badgeBg}; color: ${badgeColor}; display: inline-flex; justify-content: center;">
                    ${dd}/${mm}
                </span>`;

            // Paint Row (Raw Price and Links columns are completely omitted!)
            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <span class="badge ${badgeClass} py-1 d-inline-block" 
                              style="width: 85px; text-align: center; font-size: 0.75rem; text-transform: uppercase;">
                              ${t('opt_' + group.categoryId)}
                        </span>
                    </div>
                </td>
                <td class="px-1 py-0 align-middle text-center"><small>${safeHTML(profName)}</small></td>
                <td class="px-1 py-0 align-middle text-center text-nowrap">${sizeHtml}</td>
                <td class="px-1 py-0 align-middle text-center"><small>${safeHTML(matName)}</small></td>
                <td class="text-center text-capitalize px-1 py-0 align-middle">${grainHtml}</td>
                <td class="px-1 py-0 align-middle text-center"><small>${safeHTML(storeName)}</small></td>
                <td class="text-center fw-bold text-success align-middle text-nowrap">${priceHtml}</td>
                <td class="text-center align-middle">${freshnessHtml}</td>
                <td class="text-end align-middle pe-2">
                    <button class="btn btn-sm border shadow-sm py-0 px-2 me-2" onclick="openCatalogModal('${group.fingerprint}')">🔍</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        if (typeof updateFilterUI === 'function') {
            updateFilterUI('catalog', ['categoryId', 'profileId', 'materialId', 'grain', 'storeId']);
        }
    }
    let catalogDetailsModalInstance = null;
    let currentCatalogModalFingerprint = '';
    function openCatalogModal(fingerprint) {
        const modalEl = document.getElementById('modal-catalog-details');
        if (!catalogDetailsModalInstance) {
            catalogDetailsModalInstance = new bootstrap.Modal(modalEl);
            // 🪄 Background Sync
            modalEl.addEventListener('hidden.bs.modal', renderCatalogTable);
        }

        currentCatalogModalFingerprint = fingerprint;
        document.getElementById('modal-catalog-details-fingerprint').value = fingerprint;
        
        const parts = fingerprint.split('_');
        const profile = appState.profiles?.find(p => p.id === parts[1]);
        const material = appState.materials?.find(m => m.id === parts[2]);
        const store = appState.stores?.find(s => s.id === parts[3]);
        
        document.getElementById('modal-catalog-details-title').innerHTML = `🏷️ ${t('ttl_manage_prices')}: <span class="text-primary">${profile?.name || ''} — ${material?.name || ''}</span> @ <span class="text-dark">${store?.name || ''}</span>`;

        const isMetric = appState.settings.displayUnit === 'mm';
        const isSheet = parts[0] === 'sheet';
        
        document.getElementById('modal-catalog-col-width').classList.toggle('d-none', !isSheet);
        document.getElementById('modal-catalog-col-grain').classList.toggle('d-none', !isSheet);
        document.getElementById('modal-catalog-input-width').required = isSheet;
        
        const thGrain = document.getElementById('modal-catalog-th-grain');
        if (thGrain) thGrain.classList.toggle('d-none', !isSheet);

        // 🪄 We only overwrite the input dropdown now! The header keeps its "Cost / X" text.
        const unitHtml = `
            <option value="piece">/${t('opt_pc')}</option>
            <option value="linear">/${isMetric ? 'm' : 'ft'}</option>
            <option value="area">/${isMetric ? 'm²' : 'sqft'}</option>
            <option value="volume">/${isMetric ? 'm³' : 'BF'}</option>
        `;
        document.getElementById('modal-catalog-input-unit').innerHTML = unitHtml;
        
        // Sync the modal header dropdown value from AppState
        const modalViewUnit = document.getElementById('modal-catalog-view-unit');
        if (modalViewUnit) {
            modalViewUnit.value = appState.settings?.catalogViewUnit || 'piece';
        }

        renderCatalogModalTable();
        catalogDetailsModalInstance.show();
    }
    function renderCatalogModalTable() {
        const tbody = document.getElementById('table-modal-catalog-details-body');
        tbody.innerHTML = '';
        
        const fingerprint = currentCatalogModalFingerprint;
        const catId = fingerprint.split('_')[0];
        const viewUnit = document.getElementById('modal-catalog-view-unit').value;
        const currency = appState.settings.currency || '$';
        const isMetric = appState.settings.displayUnit === 'mm';

        // Filter DIRECTLY from appState
        let modalData = appState.catalog.filter(item => `${item.categoryId}_${item.profileId}_${item.materialId}_${item.storeId}` === fingerprint);
        
        // Apply local sorting
        const sortState = modalSortStates.catalog;
        if (sortState.key) {
            modalData.sort((a, b) => {
                let valA, valB;
                if (sortState.key === 'dimensions') {
                    let lenA = a.length || 0; let lenB = b.length || 0;
                    if (lenA !== lenB) return (lenA - lenB) * sortState.dir;
                    let wA = a.width || 0; let wB = b.width || 0;
                    return (wA - wB) * sortState.dir;
                } else if (sortState.key === 'priceUnit') {
                    valA = String(a.priceUnit || ''); valB = String(b.priceUnit || '');
                } else {
                    valA = a[sortState.key]; valB = b[sortState.key];
                }
                if (typeof valA === 'string' && typeof valB === 'string') return valA.localeCompare(valB) * sortState.dir;
                return ((valA || 0) - (valB || 0)) * sortState.dir;
            });
        }

        modalData.forEach(item => {
            const tr = document.createElement('tr');
            const displayL = formatForDisplay(item.length);
            
            let sizeHtml = '';
            if (catId === 'sheet') {
                const displayW = formatForDisplay(item.width);
                sizeHtml = `
                    <div class="d-flex align-items-center justify-content-center gap-1 mx-auto">
                        <input type="text" class="form-control form-control-sm text-end px-0 border-0 bg-transparent" style="width: 50px;" 
                               value="${displayW}" onchange="updateDirectModalCatalog('${item.id}', 'width', this.value)">
                        <span class="text-muted small">x</span>
                        <input type="text" class="form-control form-control-sm text-start px-0 border-0 bg-transparent" style="width: 50px;" 
                               value="${displayL}" onchange="updateDirectModalCatalog('${item.id}', 'length', this.value)">
                    </div>`;
            } else {
                sizeHtml = `
                    <input type="text" class="form-control form-control-sm text-center px-0 border-0 bg-transparent mx-auto" style="width: 60px;"
                           value="${displayL}" onchange="updateDirectModalCatalog('${item.id}', 'length', this.value)">`;
            }

            let grainHtml = '<span class="text-muted">-</span>';
            if (catId === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center" style="width: 75px;"
                            onchange="updateDirectModalCatalog('${item.id}', 'grain', this.value)">
                        <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${item.grain === 'length' ? 'selected' : ''}>${t('opt_length')}</option>
                        <option value="width" ${item.grain === 'width' ? 'selected' : ''}>${t('opt_width')}</option>
                    </select>`;
            }

            const uLin = isMetric ? 'm' : 'ft';
            const uArea = isMetric ? 'm²' : 'sqft'; const uVol = isMetric ? 'm³' : 'BF';
            
            let priceHtml = `
                <div class="d-flex align-items-center justify-content-center text-nowrap mx-auto">
                    <input type="number" step="0.01" class="form-control form-control-sm text-end px-0 border-0 bg-transparent" style="width: 60px;"
                           value="${parseFloat(item.price || 0).toFixed(2)}" onchange="updateDirectModalCatalog('${item.id}', 'price', this.value)">
                    <span class="text-muted px-1">/</span>
                    <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0" style="width: auto; cursor: pointer;"
                            onchange="updateDirectModalCatalog('${item.id}', 'priceUnit', this.value)">
                        <option value="piece" ${item.priceUnit === 'piece' ? 'selected' : ''}>${t('opt_pc')}</option>
                        <option value="linear" ${item.priceUnit === 'linear' ? 'selected' : ''}>${uLin}</option>
                        <option value="area" ${item.priceUnit === 'area' ? 'selected' : ''}>${uArea}</option>
                        <option value="volume" ${item.priceUnit === 'volume' ? 'selected' : ''}>${uVol}</option>
                    </select>
                </div>`;
                
            const displayPrice = getNormalizedPriceDisplay(item, viewUnit);
            let costHtml = `<span id="direct-cost-${item.id}" class="fw-bold text-success">${currency}${displayPrice}</span>`;

            // 🪄 FRESHNESS BADGE ENGINE (Matches Flat View)
            const verifiedTime = item.lastVerified || Date.now();
            const daysOld = (Date.now() - verifiedTime) / (1000 * 60 * 60 * 24);
            let badgeBg = '#198754';
            let badgeColor = '#ffffff';
            if (daysOld >= 28) {
                badgeBg = '#dc3545';
            } else if (daysOld >= 14) {
                badgeBg = '#ffc107';
                badgeColor = '#000000';
            }
            const dateObj = new Date(verifiedTime);
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            let freshnessHtml = `
                <span class="badge shadow-sm" 
                      style="background-color: ${badgeBg}; color: ${badgeColor}; cursor: pointer; display: inline-flex; text-align: center; justify-content: center; align-items: center; user-select: none;"
                      onclick="verifyPrice('${item.id}')" 
                      title="${t('title_click_to_verify') || 'Click to verify price is still accurate'}">
                    ${dd}/${mm}
                </span>
            `;

            let linkHtml = item.link 
                ? `<a href="${safeHTML(item.link)}" target="_blank" class="text-decoration-none" title="${t('title_open_link')}">🔗</a>` 
                : `<span class="text-muted" style="opacity: 0.3;">🔗</span>`;
                
            let actionHtml = `
                <button class="btn btn-sm py-0 px-2" onclick="deleteDirectModalCatalog('${item.id}')" tabindex="-1">🗑️</button>
            `;

            tr.innerHTML = `
                <td class="align-middle py-0 ps-3">${sizeHtml}</td>
                <td class="align-middle text-center py-0 text-capitalize ${catId !== 'sheet' ? 'd-none' : ''}">${grainHtml}</td>
                <td class="align-middle text-center py-0">${priceHtml}</td>
                <td class="align-middle text-center py-0">${costHtml}</td>
                <td class="align-middle text-center py-0">${freshnessHtml}</td>
                <td class="text-nowrap align-middle">
                    <div class="d-flex justify-content-center align-items-center">
                        ${linkHtml}
                        <button class="btn btn-sm py-0 px-1" onclick="openLinkModal('${item.id}', '${safeHTML(item.link || '')}')" title="${t('title_edit_link')}" tabindex="-1">✏️</button>
                    </div>
                </td>
                <td class="align-middle py-1 pe-3 text-end">${actionHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }
    function updateDirectModalCatalog(id, field, newValue) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            if (field === 'length' || field === 'width') item[field] = parseToBaseUnit(newValue) || 0;
            else if (field === 'price') item[field] = parseFloat(newValue) || 0;
            else item[field] = newValue;
            
            item.lastVerified = Date.now();
            saveState(); // Saved instantly!

            // Update live math
            const viewUnit = document.getElementById('modal-catalog-view-unit').value;
            const costSpan = document.getElementById(`direct-cost-${id}`);
            const currency = appState.settings.currency || '$';
            if (costSpan) costSpan.innerText = `${currency}${getNormalizedPriceDisplay(item, viewUnit)}`;
        }
    }
    function promptDirectCatalogLink(id) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            let newLink = prompt(t('title_edit_link') || "Enter URL for this material size:", item.link || "");
            if (newLink !== null) {
                if (newLink && !/^https?:\/\//i.test(newLink)) newLink = 'https://' + newLink;
                item.link = newLink;
                saveState();
                renderCatalogModalTable();
            }
        }
    }
    function deleteDirectModalCatalog(id) {
        requestConfirm(t('confirm_delete_catalog_item') || "Delete this price?", () => {
            appState.catalog = appState.catalog.filter(c => c.id !== id);
            saveState();
            if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
            renderCatalogModalTable(); 
        });
    }
    function handleAddModalCatalog(event) {
        event.preventDefault();
        const parts = currentCatalogModalFingerprint.split('_');
        
        appState.catalog.unshift({
            id: 'CAT-' + Date.now(),
            categoryId: parts[0],
            profileId: parts[1],
            materialId: parts[2],
            storeId: parts[3],
            grain: parts[0] === 'sheet' ? document.getElementById('modal-catalog-input-grain').value : 'none',
            price: parseFloat(document.getElementById('modal-catalog-input-price').value) || 0,
            priceUnit: document.getElementById('modal-catalog-input-unit').value,
            length: parseToBaseUnit(document.getElementById('modal-catalog-input-length').value) || 0,
            width: parts[0] === 'sheet' ? (parseToBaseUnit(document.getElementById('modal-catalog-input-width').value) || 0) : 0,
            link: '',
            lastVerified: Date.now()
        });
        
        saveState();
        if (typeof notifyConfigChanged === 'function') notifyConfigChanged();

        // 🪄 Clear active sorting so the new price lands exactly at the top!
        modalSortStates.catalog.key = '';

        renderCatalogModalTable();
        
        document.getElementById('modal-catalog-input-length').value = '';
        if (parts[0] === 'sheet') {
            document.getElementById('modal-catalog-input-width').value = '';
            document.getElementById('modal-catalog-input-width').focus();
        } else {
            document.getElementById('modal-catalog-input-length').focus();
        }
        document.getElementById('modal-catalog-input-price').value = '0.00';
    }
    
    // Flat View Engine
    function renderFlatCatalogTable() {
        clearEditRowRegistry('catalog');
        const tbody = document.getElementById('table-catalog-body');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (!appState.catalog) appState.catalog = [];

        if (appState.catalog.length === 0) {
            const emptyHtml = _starterPackEmptyRow(11);
            if (emptyHtml) tbody.innerHTML = emptyHtml;
            return;
        }

        appState.catalog.forEach(item => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(item, 'catalog')) return;
            const prof = appState.profiles?.find(p => p.id === item.profileId);
            const mat  = appState.materials?.find(m => m.id === item.materialId);
            const store = appState.stores?.find(s => s.id === item.storeId);
            const isReady = !!(prof && mat && store);
            const tr = document.createElement('tr');
            tr.setAttribute('data-table', 'catalog');
            tr.setAttribute('data-row-id', item.id);
            tr.setAttribute('onclick', `activateEditRow('catalog', '${item.id}')`);
            tr.classList.add('editable-row');
            if (!isReady) tr.classList.add('table-warning');
            tr.innerHTML = buildCatalogReadRowInner(item.id);
            tbody.appendChild(tr);
        });

        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        const filterColumns = ['categoryId', 'length', 'profileId', 'materialId', 'grain', 'storeId'];
        updateFilterUI('catalog', filterColumns);
    }

    function buildCatalogReadRowInner(itemId) {
        const item = appState.catalog?.find(c => c.id === itemId);
        if (!item) return '';
        const prof = appState.profiles?.find(p => p.id === item.profileId);
        const mat  = appState.materials?.find(m => m.id === item.materialId);
        const store = appState.stores?.find(s => s.id === item.storeId);
        const isReady = !!(prof && mat && store);
        const badgeClass = getCategoryBadgeClass(item.categoryId);
        const viewUnit = appState.settings?.catalogViewUnit || 'piece';
        const currency = appState.settings.currency || '$';
        const isMetric = appState.settings.displayUnit === 'mm';
        const displayL = formatForDisplay(item.length);
        let dimText = displayL;
        if (item.categoryId === 'sheet') dimText = `${formatForDisplay(item.width)} × ${displayL}`;
        const grainText = item.categoryId === 'sheet'
            ? (item.grain === 'length' ? t('opt_length') : item.grain === 'width' ? t('opt_width') : '-') : '-';
        const displayPrice = getNormalizedPriceDisplay(item, viewUnit);
        // Freshness badge
        const verifiedTime = item.lastVerified || Date.now();
        const daysOld = (Date.now() - verifiedTime) / (1000 * 60 * 60 * 24);
        let badgeBg = '#198754'; let badgeColor = '#ffffff';
        if (daysOld >= 28) badgeBg = '#dc3545';
        else if (daysOld >= 14) { badgeBg = '#ffc107'; badgeColor = '#000000'; }
        const dateObj = new Date(verifiedTime);
        const dd = String(dateObj.getDate()).padStart(2, '0');
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const freshnessHtml = `<span class="badge shadow-sm" style="background-color:${badgeBg};color:${badgeColor};cursor:pointer;display:inline-flex;justify-content:center;align-items:center;user-select:none;" onclick="event.stopPropagation();verifyPrice('${item.id}')" title="${t('title_click_to_verify')}">${dd}/${mm}</span>`;
        const linkHtml = item.link
            ? `<a href="${safeHTML(item.link)}" target="_blank" class="text-decoration-none" onclick="event.stopPropagation()" title="${t('title_open_link')}">🔗</a>`
            : `<span class="text-muted" style="opacity:0.3;">🔗</span>`;
        return `
            <td><div class="d-flex justify-content-center px-1"><span class="badge ${badgeClass} py-1 d-inline-block" style="width:85px;text-align:center;font-size:0.75rem;text-transform:uppercase;">${t('opt_' + item.categoryId)}</span></div></td>
            <td class="px-1 py-0 align-middle text-center"><small class="${prof ? '' : 'text-warning fw-bold'}">${safeHTML(prof?.name || '⚠️')}</small></td>
            <td class="text-center px-1 py-0 align-middle" style="width:130px"><small>${dimText}</small></td>
            <td class="px-1 py-0 align-middle text-center"><small class="${mat ? '' : 'text-warning fw-bold'}">${safeHTML(mat?.name || '⚠️')}</small></td>
            <td class="text-center px-1 py-0 align-middle"><small>${grainText}</small></td>
            <td class="px-1 py-0 align-middle text-center"><small class="${store ? '' : 'text-warning fw-bold'}">${safeHTML(store?.name || '⚠️')}</small></td>
            <td class="text-center px-1 py-0 align-middle"><small class="text-muted">${currency}${parseFloat(item.price || 0).toFixed(2)} /${{'piece': t('opt_pc'), 'linear': isMetric ? 'm' : 'ft', 'area': isMetric ? 'm²' : 'sqft', 'volume': isMetric ? 'm³' : 'BF'}[item.priceUnit] || item.priceUnit}</small></td>
            <td class="text-center fw-bold text-success align-middle"><small>${currency}${displayPrice}</small></td>
            <td class="text-center align-middle">${freshnessHtml}</td>
            <td class="text-nowrap align-middle">
                <div class="d-flex justify-content-end align-items-center">
                    ${linkHtml}
                    <button class="btn btn-sm py-0 px-1" onclick="event.stopPropagation();openLinkModal('${item.id}', '${safeHTML(item.link || '')}')" title="${t('title_edit_link')}">✏️</button>
                </div>
            </td>
            <td class="text-end">
                <button class="btn btn-sm py-0 px-0" onclick="event.stopPropagation();duplicateRow('catalog', '${item.id}')" title="${t('title_duplicate_row')}">➕</button>
                <button class="btn btn-sm py-0 px-0 me-2" onclick="event.stopPropagation();deleteCatalogItem('${item.id}')">🗑️</button>
            </td>`;
    }

    function buildCatalogEditRowInner(itemId) {
        const item = appState.catalog?.find(c => c.id === itemId);
        if (!item) return '';
        const badgeClass = getCategoryBadgeClass(item.categoryId);
        const viewUnit = appState.settings?.catalogViewUnit || 'piece';
        const currency = appState.settings.currency || '$';
        const isMetric = appState.settings.displayUnit === 'mm';
        // Profile dropdown
        const filteredProfiles = (appState.profiles || []).filter(p => p.type === item.categoryId).sort((a, b) => a.name.localeCompare(b.name));
        const isProfValid = filteredProfiles.some(p => p.id === item.profileId);
        let profOptions = !isProfValid ? `<option value="" disabled selected>⚠️ ${t('opt_select_profile')}</option>` : '';
        filteredProfiles.forEach(p => { profOptions += `<option value="${p.id}" ${p.id === item.profileId ? 'selected' : ''}>${safeHTML(p.name)}</option>`; });
        const profHtml = `<select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 text-center" onchange="updateCatalogItem('${item.id}', 'profileId', this.value)" title="${t('title_tap_to_change_profile')}">${profOptions}</select>`;
        // Material dropdown
        const filteredMaterials = (appState.materials || []).filter(m => m.category === item.categoryId).sort((a, b) => a.name.localeCompare(b.name));
        const isMatValid = filteredMaterials.some(m => m.id === item.materialId);
        let matOptions = !isMatValid ? `<option value="" disabled selected>⚠️ ${t('opt_select_material')}</option>` : '';
        filteredMaterials.forEach(m => { matOptions += `<option value="${m.id}" ${m.id === item.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`; });
        const matHtml = `<select class="text-center form-select form-select-sm border-0 bg-transparent px-0 py-0" onchange="updateCatalogItem('${item.id}', 'materialId', this.value)" title="${t('title_tap_to_change_material')}">${matOptions}</select>`;
        // Dimensions
        const displayL = formatForDisplay(item.length);
        let dimHtml = `<input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width:60px;" value="${displayL}" onchange="updateCatalogItem('${item.id}', 'length', this.value)" title="${t('title_tap_to_edit_length')}">`;
        if (item.categoryId === 'sheet') {
            const displayW = formatForDisplay(item.width);
            dimHtml = `<div class="d-flex align-items-baseline justify-content-center gap-1">
                <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width:48px;" value="${displayW}" onchange="updateCatalogItem('${item.id}', 'width', this.value)" title="${t('title_tap_to_edit_width')}">
                <span class="text-muted px-0">×</span>
                <input type="text" class="form-control form-control-sm border-0 bg-transparent text-start px-0" style="width:48px;" value="${displayL}" onchange="updateCatalogItem('${item.id}', 'length', this.value)" title="${t('title_tap_to_edit_length')}">
            </div>`;
        }
        // Grain
        let grainHtml = '<span class="text-muted">-</span>';
        if (item.categoryId === 'sheet') {
            grainHtml = `<select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 mx-auto text-center" style="width:75px;" onchange="updateCatalogItem('${item.id}', 'grain', this.value)" title="${t('title_change_grain')}">
                <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                <option value="length" ${item.grain === 'length' ? 'selected' : ''}>${t('opt_length')}</option>
                <option value="width" ${item.grain === 'width' ? 'selected' : ''}>${t('opt_width')}</option>
            </select>`;
        }
        // Store dropdown
        const isStoreValid = appState.stores?.some(s => s.id === item.storeId);
        let storeOptions = !isStoreValid ? `<option value="" disabled selected>⚠️ ${t('opt_select_store')}</option>` : '';
        if (appState.stores) {
            [...appState.stores].sort((a, b) => a.name.localeCompare(b.name)).forEach(s => {
                storeOptions += `<option value="${s.id}" ${s.id === item.storeId ? 'selected' : ''}>${safeHTML(s.name)}</option>`;
            });
        }
        const storeHtml = `<select class="text-center form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updateCatalogItem('${item.id}', 'storeId', this.value)" title="${t('title_tap_to_change_store')}">${storeOptions}</select>`;
        // Price input + unit dropdown
        const uLin = isMetric ? 'm' : 'ft'; const uArea = isMetric ? 'm²' : 'sqft'; const uVol = isMetric ? 'm³' : 'BF';
        const priceHtml = `
            <div class="d-flex align-items-center justify-content-center text-nowrap mx-auto" style="width:130px;">
                <input type="number" step="0.01" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width:60px;"
                       value="${parseFloat(item.price || 0).toFixed(2)}" onchange="updateCatalogItem('${item.id}', 'price', this.value)" title="${t('title_tap_to_edit_price')}">
                <span class="text-muted px-1">/</span>
                <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 text-muted" style="width:auto;appearance:none;cursor:pointer;" onchange="updateCatalogItem('${item.id}', 'priceUnit', this.value)" title="${t('title_tap_to_change_unit')}">
                    <option value="piece" ${item.priceUnit === 'piece' ? 'selected' : ''}>${t('opt_pc')}</option>
                    <option value="linear" ${item.priceUnit === 'linear' ? 'selected' : ''}>${uLin}</option>
                    <option value="area" ${item.priceUnit === 'area' ? 'selected' : ''}>${uArea}</option>
                    <option value="volume" ${item.priceUnit === 'volume' ? 'selected' : ''}>${uVol}</option>
                </select>
            </div>`;
        // Normalized price display
        const displayPrice = getNormalizedPriceDisplay(item, viewUnit);
        // Freshness badge
        const verifiedTime = item.lastVerified || Date.now();
        const daysOld = (Date.now() - verifiedTime) / (1000 * 60 * 60 * 24);
        let badgeBg = '#198754'; let badgeColor = '#ffffff';
        if (daysOld >= 28) badgeBg = '#dc3545';
        else if (daysOld >= 14) { badgeBg = '#ffc107'; badgeColor = '#000000'; }
        const dateObj = new Date(verifiedTime);
        const dd = String(dateObj.getDate()).padStart(2, '0');
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const freshnessHtml = `<span class="badge shadow-sm" style="background-color:${badgeBg};color:${badgeColor};cursor:pointer;display:inline-flex;justify-content:center;align-items:center;user-select:none;" onclick="verifyPrice('${item.id}')" title="${t('title_click_to_verify')}">${dd}/${mm}</span>`;
        const linkHtml = item.link
            ? `<a href="${safeHTML(item.link)}" target="_blank" class="text-decoration-none" onclick="event.stopPropagation()" title="${t('title_open_link')}">🔗</a>`
            : `<span class="text-muted" style="opacity:0.3;">🔗</span>`;
        return `
            <td><div class="d-flex justify-content-center px-1"><span class="badge ${badgeClass} py-1 d-inline-block" style="width:85px;text-align:center;font-size:0.75rem;text-transform:uppercase;">${t('opt_' + item.categoryId)}</span></div></td>
            <td class="px-1 py-0 align-middle text-center">${profHtml}</td>
            <td class="text-center px-1 py-0 align-middle" style="width:130px">${dimHtml}</td>
            <td class="px-1 py-0 align-middle text-center">${matHtml}</td>
            <td class="text-center px-1 py-0 align-middle">${grainHtml}</td>
            <td class="px-1 py-0 align-middle">${storeHtml}</td>
            <td class="text-center px-1 py-0 align-middle">${priceHtml}</td>
            <td class="text-center fw-bold text-success align-middle"><small>${currency}${displayPrice}</small></td>
            <td class="text-center align-middle">${freshnessHtml}</td>
            <td class="text-nowrap align-middle">
                <div class="d-flex justify-content-end align-items-center">
                    ${linkHtml}
                    <button class="btn btn-sm py-0 px-1" onclick="openLinkModal('${item.id}', '${safeHTML(item.link || '')}')" title="${t('title_edit_link')}">✏️</button>
                </div>
            </td>
            <td class="text-end">
                <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('catalog', '${item.id}')" title="${t('title_duplicate_row')}">➕</button>
                <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteCatalogItem('${item.id}')">🗑️</button>
            </td>`;
    }
    function handleAddCatalogItem(event) {
        event.preventDefault();
        const category = document.getElementById('cat-category').value;
        
        // 🪄 Smart URL Formatter
        let rawLink = document.getElementById('cat-link').value || '';
        if (rawLink && !/^https?:\/\//i.test(rawLink)) {
            rawLink = 'https://' + rawLink;
        }
        
        if (!appState.catalog) appState.catalog = [];

        appState.catalog.unshift({
            id: 'CAT-' + Date.now(),
            categoryId: category,
            profileId: document.getElementById('cat-profile').value,
            materialId: document.getElementById('cat-material').value,
            storeId: document.getElementById('cat-store').value,
            length: parseToBaseUnit(document.getElementById('cat-length').value),
            width: category === 'sheet' ? parseToBaseUnit(document.getElementById('cat-width').value) : 0,
            grain: document.getElementById('cat-grain').value, // 🪄 NEW
            price: parseFloat(document.getElementById('cat-price').value) || 0,
            priceUnit: document.getElementById('cat-price-unit').value,
            link: rawLink,
            lastVerified: Date.now()
        });
        
        saveState();
        renderCatalogTable();
        if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
        showToast(t('msg_item_added_catalog'));

        // Reset form but keep category to allow rapid entry
        document.getElementById('cat-length').value = '';

        if (category === 'sheet') {
            const widthInput = document.getElementById('cat-width');
            widthInput.value = '';
            widthInput.focus(); // Snap to width for 2D materials
        } else {
            document.getElementById('cat-length').focus(); // Snap to length for 1D materials
        }
    }
    function updateCatalogItem(id, field, newValue) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            let parsed;
            if (field === 'length' || field === 'width') {
                parsed = parseToBaseUnit(newValue) || 0;
            } else if (field === 'price') {
                parsed = parseFloat(newValue) || 0;
            } else {
                parsed = newValue;
            }
            if (parsed === item[field]) return;
            item[field] = parsed;
            if (field === 'price') item.lastVerified = Date.now();
            saveState();
            if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
            // If this row is active in edit mode: refresh it in place, skip full rebuild
            if (_activeEditRow['catalog'] === id) {
                const prof = appState.profiles?.find(p => p.id === item.profileId);
                const mat  = appState.materials?.find(m => m.id === item.materialId);
                const store = appState.stores?.find(s => s.id === item.storeId);
                const tr = document.querySelector(`tr[data-table="catalog"][data-row-id="${id}"]`);
                if (tr) {
                    tr.classList.toggle('table-warning', !(prof && mat && store));
                    tr.innerHTML = buildCatalogEditRowInner(id);
                }
            } else {
                renderCatalogTable();
            }
            showToast(t('msg_catalog_item_updated'));
        }
    }
    function deleteCatalogItem(id, isConfirmed = false) {
        deleteItem('catalog', id, 'confirm_delete_catalog_item', null, renderCatalogTable, 'msg_item_removed', isConfirmed);
    }

    // Store Manager
    let storeModalInstance = null;
    function openStoreModal() {
        const modalEl = document.getElementById('modal-store-manager');
        
        // Failsafe: Check if the HTML actually exists!
        if (!modalEl) {
            alert(t('err_store_modal_html_missing'));
            console.error("Could not find element with ID 'modal-store-manager'.");
            return;
        }

        if (!storeModalInstance) {
            storeModalInstance = new bootstrap.Modal(modalEl);
            modalEl.addEventListener('hidden.bs.modal', function () {
                if (typeof populateCatalogDropdowns === 'function') populateCatalogDropdowns();
            });
        }
        
        renderStoreModalTable();
        storeModalInstance.show();
        setTimeout(() => document.getElementById('modal-new-store-name').focus(), 400);
    }
    function renderStoreModalTable() {
        const tbody = document.getElementById('table-modal-stores-body');
        tbody.innerHTML = '';
        if (!appState.stores) appState.stores = [];

        if (appState.stores.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="text-center text-muted py-3">${t('msg_no_stores_defined')}</td></tr>`;
            return;
        }

        [...appState.stores].sort((a, b) => a.name.localeCompare(b.name)).forEach(store => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(store.name)}" 
                           onchange="updateStoreName('${store.id}', this.value)" title="${t('title_tap_to_edit')}">
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteStore('${store.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    function handleAddStore(event) {
        event.preventDefault();
        const nameInput = document.getElementById('modal-new-store-name');
        if (!appState.stores) appState.stores = [];
        appState.stores.unshift({ id: 'STR-' + Date.now(), name: nameInput.value });
        saveState();
        renderStoreModalTable();
        nameInput.value = ''; 

        renderCatalogTable();
        if (typeof populateCatalogDropdowns === 'function') populateCatalogDropdowns();
        
        nameInput.value = '';
    }
    function updateStoreName(id, newName) {
        const store = appState.stores.find(s => s.id === id);
        if (store) {
            store.name = newName;
            saveState();
            renderCatalogTable(); // Refresh catalog UI to show new name
            showToast(t('msg_store_renamed'));
        }
    }
    function deleteStore(id, isConfirmed = false) {
        // 🪄 The Safety Shield (Custom Modal)
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_store'), () => deleteStore(id, true));
            return;
        }

        let affected = 0;
        if (appState.catalog) {
            appState.catalog.forEach(item => {
                if (item.storeId === id) {
                    item.storeId = '';
                    affected++;
                }
            });
        }
        appState.stores = appState.stores.filter(s => s.id !== id);
        saveState();
        renderStoreModalTable();
        renderCatalogTable();
        showToast(t('msg_store_deleted_items', { count: affected }), true);
    }

    // Helper Functions
    function verifyPrice(id) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            item.lastVerified = Date.now();
            saveState();
            renderCatalogTable();
            
            // 🪄 THE FIX: If the modal is open, redraw it instantly so the freshness badge updates!
            const catalogModalEl = document.getElementById('modal-catalog-details');
            if (catalogModalEl && catalogModalEl.classList.contains('show')) {
                renderCatalogModalTable();
            }
            
            showToast(t('msg_price_verified') || "Price verified!");
        }
    }
    function handleCatalogCategoryChange() {
        const cat = document.getElementById('cat-category').value;
        const profSelect = document.getElementById('cat-profile');
        const matSelect = document.getElementById('cat-material');
        const lengthInput = document.getElementById('cat-length');
        const widthInput = document.getElementById('cat-width');
        const btnAdd = document.getElementById('btn-add-catalog');
        
        profSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        matSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        profSelect.disabled = false;
        matSelect.disabled = false;
        lengthInput.disabled = false;
        btnAdd.disabled = false;
        
        if (appState.profiles) {
            appState.profiles.filter(p => p.type === cat).sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                profSelect.appendChild(opt);
            });
        }
        if (appState.materials) {
            appState.materials.filter(m => m.category === cat).sort((a, b) => a.name.localeCompare(b.name)).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                matSelect.appendChild(opt);
            });
        }
        const grainSelect = document.getElementById('cat-grain'); // 🪄 ADD THIS

        if (cat === 'sheet') {
            widthInput.disabled = false;
            widthInput.required = true;
            grainSelect.disabled = false; // 🪄 ADD THIS
        } else {
            widthInput.disabled = true;
            widthInput.required = false;
            widthInput.value = '';
            grainSelect.disabled = true; // 🪄 ADD THIS
            grainSelect.value = 'none';  // 🪄 ADD THIS
        }
    }
    function populateCatalogDropdowns() {
        const storeSelect = document.getElementById('cat-store');

        if (storeSelect) {
            const currentStoreId = storeSelect.value;
            storeSelect.innerHTML = `<option value="" disabled selected>${t('opt_select_store')}</option>`;
            if (appState.stores) {
                [...appState.stores].sort((a, b) => a.name.localeCompare(b.name)).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.innerText = s.name;
                    storeSelect.appendChild(opt);
                });
            }
            if (currentStoreId) storeSelect.value = currentStoreId;
        }

        // Rebuild profile/material dropdowns for the selected category,
        // then restore whatever the user had selected before the modal opened.
        const catSelect  = document.getElementById('cat-category');
        const profSelect = document.getElementById('cat-profile');
        const matSelect  = document.getElementById('cat-material');

        if (catSelect && catSelect.value) {
            const savedProf = profSelect ? profSelect.value : '';
            const savedMat  = matSelect  ? matSelect.value  : '';

            handleCatalogCategoryChange();

            if (savedProf && profSelect) profSelect.value = savedProf;
            if (savedMat  && matSelect)  matSelect.value  = savedMat;
        }
    }
    function calculateCostPerPiece(item) {
        if (!item.price || item.price === 0) return 0;
        if (item.priceUnit === 'piece') return item.price;
        
        const isMetric = appState.settings.displayUnit === 'mm';
        const prof = appState.profiles.find(p => p.id === item.profileId);
        if (!prof) return 0;

        const l_mm = item.length;
        const w_mm = item.categoryId === 'sheet' ? item.width : (prof.width || 0);
        const t_mm = prof.thickness || 0;

        if (isMetric) {
            if (item.priceUnit === 'linear') return item.price * (l_mm / 1000);
            if (item.priceUnit === 'area') return item.price * ((l_mm / 1000) * (w_mm / 1000));
            if (item.priceUnit === 'volume') return item.price * ((l_mm / 1000) * (w_mm / 1000) * (t_mm / 1000));
        } else {
            if (item.priceUnit === 'linear') return item.price * (l_mm / 304.8);
            if (item.priceUnit === 'area') return item.price * ((l_mm * w_mm) / 92903.04);
            if (item.priceUnit === 'volume') return item.price * ((l_mm * w_mm * t_mm) / 2359737.216); // Board Foot Math
        }
        return 0;
    }
    function getNormalizedPriceDisplay(item, viewUnit) {
        const costPerPiece = calculateCostPerPiece(item);
        if (viewUnit === 'piece') return costPerPiece.toFixed(2);
        
        const isMetric = appState.settings.displayUnit === 'mm';
        const prof = appState.profiles.find(p => p.id === item.profileId);
        if (!prof || item.length === 0) return '0.00';

        const l_mm = item.length;
        const w_mm = item.categoryId === 'sheet' ? item.width : (prof.width || 0);
        const t_mm = prof.thickness || 0;

        let factor = 1;
        if (isMetric) {
            if (viewUnit === 'linear') factor = (l_mm / 1000);
            else if (viewUnit === 'area') factor = ((l_mm / 1000) * (w_mm / 1000));
            else if (viewUnit === 'volume') factor = ((l_mm / 1000) * (w_mm / 1000) * (t_mm / 1000));
        } else {
            if (viewUnit === 'linear') factor = (l_mm / 304.8);
            else if (viewUnit === 'area') factor = ((l_mm * w_mm) / 92903.04);
            else if (viewUnit === 'volume') factor = ((l_mm * w_mm * t_mm) / 2359737.216);
        }

        if (factor === 0) return '0.00';
        return (costPerPiece / factor).toFixed(2);
    }

    // Hyperlink Modal
    let linkModalInstance = null;
    function openLinkModal(itemId, currentLink) {
        if (!linkModalInstance) linkModalInstance = new bootstrap.Modal(document.getElementById('modal-link-editor'));
        document.getElementById('modal-link-item-id').value = itemId;
        document.getElementById('modal-link-url').value = currentLink || '';
        linkModalInstance.show();
        setTimeout(() => document.getElementById('modal-link-url').focus(), 400);
    }
    function saveCatalogLink(event) {
        if (event) event.preventDefault(); 
        
        const id = document.getElementById('modal-link-item-id').value;
        let newLink = document.getElementById('modal-link-url').value || '';
        
        // 🪄 Smart URL Formatter
        if (newLink && !/^https?:\/\//i.test(newLink)) {
            newLink = 'https://' + newLink;
        }

        // 🪄 UNIVERSAL ROUTER: Check the ID prefix to know where to save
        if (id.startsWith('PROJ-')) {
            const proj = appState.projects.find(p => p.id === id);
            if (proj) {
                proj.link = newLink;
                saveState();
                renderProjectsTable(); // Redraw Projects
            }
        } else {
            const item = appState.catalog.find(c => c.id === id);
            if (item) {
                item.link = newLink;
                saveState();
                renderCatalogTable(); // Redraw Main Catalog
                
                // 🪄 THE FIX: Check if the Catalog Modal is currently open, and redraw it instantly!
                const catalogModalEl = document.getElementById('modal-catalog-details');
                if (catalogModalEl && catalogModalEl.classList.contains('show')) {
                    renderCatalogModalTable();
                }
            }
        }
        
        linkModalInstance.hide();
    }

    // Register Catalog table with the central click-to-edit engine
    registerEditableTable('catalog', buildCatalogEditRowInner, buildCatalogReadRowInner);

</script>
