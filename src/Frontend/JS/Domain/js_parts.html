<script>
    function renderPartsView() {
        populateProjectDropdown();
        renderPartsTable();
    }
    function populateProjectDropdown() {
        populateProjectSelect('part-project', 'opt_select_project');
    }
    function refreshPartsDropdowns() {
        populateProjectDropdown();
        
        const cat = document.getElementById('part-category').value;
        if (!cat) return; // If no category is selected yet, do nothing.

        const profSelect = document.getElementById('part-profile');
        const matSelect = document.getElementById('part-material');

        // 🪄 1. MEMORIZE current selections before wiping the HTML
        const currentProfId = profSelect.value;
        const currentMatId = matSelect.value;

        // 🪄 2. REBUILD Profile Dropdown
        profSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        const filteredProfiles = appState.profiles.filter(p => p.type === cat).sort((a, b) => a.name.localeCompare(b.name));
        filteredProfiles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.innerText = p.name;
            profSelect.appendChild(opt);
        });

        // 🪄 3. REBUILD Material Dropdown
        matSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        const filteredMaterials = appState.materials.filter(m => m.category === cat).sort((a, b) => a.name.localeCompare(b.name));
        filteredMaterials.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.innerText = m.name;
            matSelect.appendChild(opt);
        });

        // 🪄 4. RESTORE the memorized selections (so the user doesn't lose their place)
        if (currentProfId) profSelect.value = currentProfId;
        if (currentMatId) matSelect.value = currentMatId;
    }
    function handleCategoryChange() {
        const cat = document.getElementById('part-category').value;
        const widthInput = document.getElementById('part-width');
        const lengthInput = document.getElementById('part-length');
        const profSelect = document.getElementById('part-profile');
        const matSelect = document.getElementById('part-material');
        const profLabel = document.getElementById('label-part-profile');
        const grainSelect = document.getElementById('part-grain');

        // 1. Reset inputs
        widthInput.value = '';
        lengthInput.value = '';
        profSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        matSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        
        // 2. Lock/Unlock based on Category Physics
        if (cat === 'lumber') {
            widthInput.disabled = true;   // Width comes from the profile
            lengthInput.disabled = false;
            profLabel.innerText = t('lbl_profile');
            grainSelect.disabled = true;  // 🪄 ADD THIS
            grainSelect.value = 'none';   // 🪄 ADD THIS
        } else if (cat === 'sheet') {
            widthInput.disabled = false;  // Sheets need both W and L
            lengthInput.disabled = false;
            profLabel.innerText = t('lbl_thickness');
            grainSelect.disabled = false; // 🪄 ADD THIS
        } else if (cat === 'fastener') {
            widthInput.disabled = true;   
            lengthInput.disabled = true;
            profLabel.innerText = t('lbl_type_size');
        }

        // 3. Populate Profile Dropdown (Filtered by Category)
        const filteredProfiles = appState.profiles.filter(p => p.type === cat).sort((a, b) => a.name.localeCompare(b.name));
        const unitText = appState.settings.displayUnit === 'mm' ? 'mm' : 'in'; // Get current global unit

        filteredProfiles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            // 🪄 Dynamically format dimensions and append the correct unit text
            opt.innerText = `${p.name}`;
            profSelect.appendChild(opt);
        });

        // 4. Populate Material Dropdown (Filtered by Category)
        const filteredMaterials = appState.materials.filter(m => m.category === cat).sort((a, b) => a.name.localeCompare(b.name));

        filteredMaterials.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.innerText = m.name;
            matSelect.appendChild(opt);
        });

        // 5. Unlock the rest of the form
        profSelect.disabled = false;
        matSelect.disabled = false;
    }

    // --- CRUD OPERATIONS ---
    function handleAddPart(event) {
        event.preventDefault();

        const projId = document.getElementById('part-project').value;
        const groupId = document.getElementById('part-group').value;
        const cat = document.getElementById('part-category').value;
        const nameInput = document.getElementById('part-name');
        const qtyInput = document.getElementById('part-qty');
        const widthInput = document.getElementById('part-width');
        const lengthInput = document.getElementById('part-length');
        const profId = document.getElementById('part-profile').value;
        const matId = document.getElementById('part-material').value;

        const newPart = {
            id: 'PART-' + Date.now() + Math.floor(Math.random() * 1000),
            projectId: projId,
            groupId: groupId,
            category: cat,
            name: nameInput.value,
            qty: parseInt(qtyInput.value) || 1,
            width: parseToBaseUnit(widthInput.value) || 0,
            length: parseToBaseUnit(lengthInput.value) || 0,
            grain: document.getElementById('part-grain').value, // 🪄 NEW
            profileId: profId,
            materialId: matId
        };

        // Initialize array if it doesn't exist
        if (!appState.parts) appState.parts = [];
        
        appState.parts.unshift(newPart);
        saveState();
        renderPartsTable();
        showToast(t('msg_part_added'));
        setTimeout(() => activateEditRow('parts', newPart.id), 0);

        // BATCH ENTRY LOOP: Clear only what needs to be cleared
        nameInput.value = '';
        lengthInput.value = '';
        if (cat === 'sheet') widthInput.value = '';
        qtyInput.value = 1;
                
        // Snap focus back to name so you can keep typing
        nameInput.focus();
    }
    function updatePartsMetricMode() {
        const mode = document.getElementById('table-parts-metric-view').value;
        if (!appState.settings) appState.settings = {};
        appState.settings.partsMetricMode = mode;
        saveState();
        renderPartsTable();
    }
    function renderPartsTable() {
        clearEditRowRegistry('parts');
        const tbody = document.getElementById('table-parts-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        // Sync metric mode dropdown
        const metricMode = (appState.settings && appState.settings.partsMetricMode) ? appState.settings.partsMetricMode : 'weight';
        const metricDropdown = document.getElementById('table-parts-metric-view');
        if (metricDropdown) metricDropdown.value = metricMode;

        if (!appState.parts || appState.parts.length === 0) {
            tbody.innerHTML = _starterPackEmptyRow(12) ||
                `<tr><td colspan="12" class="text-center py-4 text-muted">${t('msg_no_parts_added')}</td></tr>`;
            return;
        }

        // O(1) indexes — built once, used per row for totals
        const _profileMap = new Map(appState.profiles.map(p => [p.id, p]));
        const _materialMap = new Map(appState.materials.map(m => [m.id, m]));
        const _catalogIndex = {};
        if (appState.catalog) {
            appState.catalog.forEach(c => {
                const k = c.profileId + '|' + c.materialId;
                if (!_catalogIndex[k]) _catalogIndex[k] = [];
                _catalogIndex[k].push(c);
            });
        }

        let totalVisibleQty = 0, totalVisibleWeightKg = 0, totalVisibleCost = 0;

        appState.parts.forEach(part => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(part, 'parts')) return;

            const prof = _profileMap.get(part.profileId);
            const mat  = _materialMap.get(part.materialId);
            const isReady = !!(prof && mat);
            part.status = isReady ? 'ready' : 'needs_mapping';

            // Tally totals — bulk rows aren't a per-piece qty, so they contribute 0 to
            // the piece-count total but still use qty=1 for their own weight/cost math
            // (length is the total run, so ×1 gives the cost/weight of that whole run).
            const rowQty = part.is_bulk ? 1 : (parseInt(part.qty) || 1);
            const qtyForTotal = part.is_bulk ? 0 : rowQty;
            const trueWidth = part.category === 'lumber' ? (prof ? prof.width : 0) : (part.width || 0);
            let rowWeightKg = 0, rowCost = 0;
            if (part.category !== 'fastener' && prof && mat) {
                const vol = ((part.length || 0) * trueWidth * (prof.thickness || 0)) / 1000000000;
                rowWeightKg = vol * (mat.density || 0) * rowQty;
            }
            if (part.category !== 'fastener') {
                const matches = _catalogIndex[part.profileId + '|' + part.materialId] || [];
                if (matches.length > 0) {
                    let norm = 0;
                    matches.forEach(c => {
                        const bc = calculateCostPerPiece(c);
                        if (part.category === 'sheet') { const a = c.length * c.width; if (a > 0) norm += bc / a; }
                        else { if (c.length > 0) norm += bc / c.length; }
                    });
                    const avg = norm / matches.length;
                    rowCost = part.category === 'sheet' ? avg * (part.length * trueWidth) * rowQty : avg * part.length * rowQty;
                }
            }
            totalVisibleQty += qtyForTotal;
            totalVisibleWeightKg += rowWeightKg;
            totalVisibleCost += rowCost;

            // Build read-only TR — text only, no inputs or selects
            const tr = document.createElement('tr');
            tr.setAttribute('data-table', 'parts');
            tr.setAttribute('data-row-id', part.id);
            tr.setAttribute('onclick', `activateEditRow('parts', '${part.id}')`);
            tr.classList.add('editable-row');
            if (!isReady) tr.classList.add('table-warning');
            tr.innerHTML = buildPartsReadRowInner(part.id);
            tbody.appendChild(tr);
        });

        updateFilterUI('parts', ['projectId', 'groupId', 'category', 'profileId', 'materialId', 'grain']);
        _setPartsFooter(totalVisibleQty, totalVisibleWeightKg, totalVisibleCost);
    }

    function _setPartsFooter(qty, weightKg, cost) {
        const metricMode = (appState.settings && appState.settings.partsMetricMode) ? appState.settings.partsMetricMode : 'weight';
        const currencySymbol = (appState.settings && appState.settings.currency) ? appState.settings.currency : '$';
        const tfootQty    = document.getElementById('tfoot-parts-qty');
        const tfootMetric = document.getElementById('tfoot-parts-metric');
        if (tfootQty) tfootQty.innerText = qty;
        if (tfootMetric) {
            if (metricMode === 'cost') {
                tfootMetric.innerText = `${currencySymbol}${cost.toFixed(2)}`;
            } else {
                const isMetric = appState.settings.displayUnit === 'mm';
                tfootMetric.innerText = `${(isMetric ? weightKg : weightKg * 2.20462).toFixed(1)} ${isMetric ? 'kg' : 'lbs'}`;
            }
        }
    }

    function _updatePartsFooterTotals() {
        if (!appState.parts) return;
        const _ci = {};
        if (appState.catalog) {
            appState.catalog.forEach(c => {
                const k = c.profileId + '|' + c.materialId;
                if (!_ci[k]) _ci[k] = [];
                _ci[k].push(c);
            });
        }
        let qty = 0, weightKg = 0, cost = 0;
        appState.parts.forEach(part => {
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(part, 'parts')) return;
            const prof = appState.profiles?.find(p => p.id === part.profileId);
            const mat  = appState.materials?.find(m => m.id === part.materialId);
            const rowQty = part.is_bulk ? 1 : (parseInt(part.qty) || 1);
            const qtyForTotal = part.is_bulk ? 0 : rowQty;
            const trueWidth = part.category === 'lumber' ? (prof ? prof.width : 0) : (part.width || 0);
            qty += qtyForTotal;
            if (part.category !== 'fastener' && prof && mat) {
                const vol = ((part.length || 0) * trueWidth * (prof.thickness || 0)) / 1000000000;
                weightKg += vol * (mat.density || 0) * rowQty;
            }
            if (part.category !== 'fastener') {
                const matches = _ci[part.profileId + '|' + part.materialId] || [];
                if (matches.length > 0) {
                    let norm = 0;
                    matches.forEach(c => {
                        const bc = calculateCostPerPiece(c);
                        if (part.category === 'sheet') { const a = c.length * c.width; if (a > 0) norm += bc / a; }
                        else { if (c.length > 0) norm += bc / c.length; }
                    });
                    const avg = norm / matches.length;
                    cost += part.category === 'sheet' ? avg * (part.length * trueWidth) * rowQty : avg * part.length * rowQty;
                }
            }
        });
        _setPartsFooter(qty, weightKg, cost);
    }

    function _computePartMetric(part, prof, mat, raw = false) {
        const metricMode = (appState.settings && appState.settings.partsMetricMode) ? appState.settings.partsMetricMode : 'weight';
        const currencySymbol = (appState.settings && appState.settings.currency) ? appState.settings.currency : '$';
        // Bulk rows: `length` is the total run, not a per-piece length — the stored qty
        // is irrelevant here (and hidden from the UI), so treat it as 1 for this math
        // without ever touching the stored value itself.
        const rowQty = part.is_bulk ? 1 : (parseInt(part.qty) || 1);
        const trueWidth = part.category === 'lumber' ? (prof ? prof.width : 0) : (part.width || 0);
        let rowWeightKg = 0, rowCost = 0;
        if (part.category !== 'fastener' && prof && mat) {
            const vol = ((part.length || 0) * trueWidth * (prof.thickness || 0)) / 1000000000;
            rowWeightKg = vol * (mat.density || 0) * rowQty;
        }
        if (part.category !== 'fastener' && appState.catalog && appState.catalog.length > 0) {
            const matches = appState.catalog.filter(c => c.profileId === part.profileId && c.materialId === part.materialId);
            if (matches.length > 0) {
                let norm = 0;
                matches.forEach(c => {
                    const bc = calculateCostPerPiece(c);
                    if (part.category === 'sheet') { const a = c.length * c.width; if (a > 0) norm += bc / a; }
                    else { if (c.length > 0) norm += bc / c.length; }
                });
                const avg = norm / matches.length;
                rowCost = part.category === 'sheet' ? avg * (part.length * trueWidth) * rowQty : avg * part.length * rowQty;
            }
        }
        if (raw) return { weightKg: rowWeightKg, cost: rowCost };

        if (metricMode === 'cost') {
            return rowCost > 0 ? `<small>${currencySymbol}${rowCost.toFixed(2)}</small>` : `<small>${t('lbl_no_data')}</small>`;
        }
        if (rowWeightKg > 0) {
            const isMetric = appState.settings.displayUnit === 'mm';
            return `<small>${(isMetric ? rowWeightKg : rowWeightKg * 2.20462).toFixed(2)} ${isMetric ? 'kg' : 'lbs'}</small>`;
        }
        return '-';
    }

    function buildPartsReadRowInner(partId) {
        const part = appState.parts?.find(p => p.id === partId);
        if (!part) return '';
        const proj = appState.projects?.find(p => p.id === part.projectId);
        const grp  = appState.groups?.find(g => g.id === part.groupId);
        const prof = appState.profiles?.find(p => p.id === part.profileId);
        const mat  = appState.materials?.find(m => m.id === part.materialId);
        const isReady = !!(prof && mat);
        const badgeClass = getCategoryBadgeClass(part.category);
        const grainText = part.category === 'sheet'
            ? (part.grain === 'length' ? t('opt_length') : part.grain === 'width' ? t('opt_width') : '-') : '-';
        const displayW = part.category === 'lumber' ? formatForDisplay(prof ? prof.width : 0) : formatForDisplay(part.width);
        const displayL = formatForDisplay(part.length);
        let dimText = '-';
        if (part.category === 'lumber') dimText = displayL;
        else if (part.category === 'sheet') dimText = `${displayW} × ${displayL}`;
        const bulkText = part.category === 'lumber'
            ? (part.is_bulk ? '<span class="text-primary" title="Bulk">✔️</span>' : '<span class="text-muted">-</span>')
            : '<span class="text-muted">-</span>';
        const qtyText = part.is_bulk ? '-' : part.qty;
        return `
            <td class="p-0 px-1"><small class="text-truncate d-block">${safeHTML(proj?.name || '—')}</small></td>
            <td class="p-0 px-1"><small class="text-muted text-truncate d-block">${safeHTML(grp?.name || '-')}</small></td>
            <td class="p-0 px-1"><small class="fw-bold">${safeHTML(part.name)}</small></td>
            <td><div class="d-flex justify-content-center px-1"><span class="badge ${badgeClass} py-1 d-inline-block" style="width:85px;text-align:center;font-size:0.75rem;text-transform:uppercase;">${t('opt_' + part.category)}</span></div></td>
            <td class="text-center text-primary fw-bold"><small>${qtyText}</small></td>
            <td class="text-center"><small>${bulkText}</small></td>
            <td class="p-0 px-1 text-center"><small class="${prof ? '' : 'text-warning fw-bold'}">${safeHTML(prof?.name || '⚠️')}</small></td>
            <td class="text-center p-0 px-1" style="width:130px"><small>${dimText}</small></td>
            <td class="p-0 px-1 text-center"><small class="${mat ? '' : 'text-warning fw-bold'}">${safeHTML(mat?.name || '⚠️')}</small></td>
            <td class="p-0 px-1 align-middle text-center"><small>${grainText}</small></td>
            <td class="p-0 px-1 text-center">${_computePartMetric(part, prof, mat)}</td>
            <td class="text-end">
                <button class="btn btn-sm py-0 px-0" onclick="event.stopPropagation(); duplicateRow('parts', '${part.id}')" title="${t('title_duplicate_row')}">➕</button>
                <button class="btn btn-sm py-0 px-0 me-2" onclick="event.stopPropagation(); deletePart('${part.id}')" title="${t('title_delete_part')}">🗑️</button>
            </td>`;
    }

    function buildPartsEditRowInner(partId) {
        const part = appState.parts?.find(p => p.id === partId);
        if (!part) return '';
        const prof = appState.profiles?.find(p => p.id === part.profileId);
        const mat  = appState.materials?.find(m => m.id === part.materialId);
        const badgeClass = getCategoryBadgeClass(part.category);
        let projOptions = `<option value="" disabled>${t('opt_select')}</option>`;
        [...(appState.projects || [])].sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
            projOptions += `<option value="${p.id}" ${p.id === part.projectId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
        });
        let groupOptions = '<option value="">-</option>';
        (appState.groups || []).filter(g => g.projectId === part.projectId).sort((a, b) => a.name.localeCompare(b.name)).forEach(g => {
            groupOptions += `<option value="${g.id}" ${g.id === part.groupId ? 'selected' : ''}>${safeHTML(g.name)}</option>`;
        });
        let profOptions = !prof ? `<option value="" disabled selected>⚠️ ${t('opt_select_profile')}</option>` : '';
        (appState.profiles || []).filter(p => p.type === part.category).sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
            profOptions += `<option value="${p.id}" ${p.id === part.profileId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
        });
        let matOptions = !mat ? `<option value="" disabled selected>⚠️ ${t('opt_select_material')}</option>` : '';
        (appState.materials || []).filter(m => m.category === part.category).sort((a, b) => a.name.localeCompare(b.name)).forEach(m => {
            matOptions += `<option value="${m.id}" ${m.id === part.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`;
        });
        const displayW = part.category === 'lumber' ? formatForDisplay(prof ? prof.width : 0) : formatForDisplay(part.width);
        const displayL = formatForDisplay(part.length);
        let dimHtml = '<span class="text-muted">-</span>';
        if (part.category === 'lumber') {
            dimHtml = `<input type="text" class="form-control form-control-sm border-0 bg-transparent text-center mx-auto py-0" style="width:55px;" value="${displayL}" onchange="updatePart('${part.id}', 'length', this.value)" title="${t('title_tap_to_edit_length')}">`;
        } else if (part.category === 'sheet') {
            dimHtml = `<div class="d-flex align-items-baseline justify-content-center gap-1">
                <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0 py-0" style="width:48px;" value="${displayW}" onchange="updatePart('${part.id}', 'width', this.value)" title="${t('title_tap_to_edit_width')}">
                <span class="text-muted px-0">×</span>
                <input type="text" class="form-control form-control-sm border-0 bg-transparent text-left px-0 py-0" style="width:48px;" value="${displayL}" onchange="updatePart('${part.id}', 'length', this.value)" title="${t('title_tap_to_edit_length')}">
            </div>`;
        }
        let grainHtml = '<span class="text-muted">-</span>';
        if (part.category === 'sheet') {
            grainHtml = `<select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center" style="width:75px;" onchange="updatePart('${part.id}', 'grain', this.value)" title="${t('title_change_grain')}">
                <option value="none" ${part.grain === 'none' ? 'selected' : ''}>-</option>
                <option value="length" ${part.grain === 'length' ? 'selected' : ''}>${t('opt_length')}</option>
                <option value="width" ${part.grain === 'width' ? 'selected' : ''}>${t('opt_width')}</option>
            </select>`;
        }
        // Bulk is only meaningful for lumber — qty is hidden entirely when checked (not
        // just greyed out), since `length` is repurposed as the total requirement. The
        // stored qty value itself is left untouched (see updatePart's is_bulk branch),
        // so it's back exactly as entered if bulk gets unchecked.
        const qtyHtml = part.is_bulk
            ? '<span class="text-muted">-</span>'
            : `<input type="number" class="form-control form-control-sm border-0 bg-transparent text-center text-primary fw-bold px-0" style="width:40px;" value="${part.qty}" min="1" onchange="updatePart('${part.id}', 'qty', this.value)" title="${t('title_tap_to_edit')}">`;
        const bulkHtml = part.category === 'lumber'
            ? `<input type="checkbox" class="form-check-input" ${part.is_bulk ? 'checked' : ''} onchange="updatePart('${part.id}', 'is_bulk', this.checked)" title="${t('title_bulk_checkbox')}">`
            : '<span class="text-muted">-</span>';
        return `
            <td class="p-0 px-1"><select class="form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updatePart('${part.id}', 'projectId', this.value)">${projOptions}</select></td>
            <td class="p-0 px-1"><select class="form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updatePart('${part.id}', 'groupId', this.value)">${groupOptions}</select></td>
            <td class="p-0 px-1"><input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold px-1" value="${safeHTML(part.name)}" onchange="updatePart('${part.id}', 'name', this.value)" title="${t('title_tap_to_edit')}"></td>
            <td><div class="d-flex justify-content-center px-1"><span class="badge ${badgeClass} py-1 d-inline-block" style="width:85px;text-align:center;font-size:0.75rem;text-transform:uppercase;">${t('opt_' + part.category)}</span></div></td>
            <td class="p-0 px-1"><div class="d-flex justify-content-center">${qtyHtml}</div></td>
            <td class="p-0 px-1 text-center">${bulkHtml}</td>
            <td class="p-0 px-1"><select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 align-middle text-center" onchange="updatePart('${part.id}', 'profileId', this.value)" title="${t('title_tap_to_edit_profile')}">${profOptions}</select></td>
            <td class="text-center p-0 px-1 align-middle" style="width:130px">${dimHtml}</td>
            <td class="p-0 px-1"><select class="text-center form-select form-select-sm border-0 bg-transparent px-0 py-0" onchange="updatePart('${part.id}', 'materialId', this.value)" title="${t('title_tap_to_edit_material')}">${matOptions}</select></td>
            <td class="p-0 px-1 align-middle text-center">${grainHtml}</td>
            <td class="p-0 px-1 text-center">${_computePartMetric(part, prof, mat)}</td>
            <td class="text-end">
                <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('parts', '${part.id}')" title="${t('title_duplicate_row')}">➕</button>
                <button class="btn btn-sm py-0 px-0 me-2" onclick="deletePart('${part.id}')" title="${t('title_delete_part')}">🗑️</button>
            </td>`;
    }
    function updatePartCategory(partId, newCategory) {
        const part = appState.parts.find(p => p.id === partId);
        if (part) {
            part.category = newCategory;
            // 🪄 WIPE invalid profiles, materials, and width when physics change
            part.profileId = '';
            part.materialId = '';
            part.width = 0;
            // is_bulk is only valid for lumber — clear it if switching away
            if (newCategory !== 'lumber') part.is_bulk = false;
            
            saveState();
            if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
            renderPartsTable();
            showToast(t('msg_category_changed'));
        }
    }
    function updatePart(partId, field, newValue) {
        const part = appState.parts.find(p => p.id === partId);
        if (part) {
            if (field === 'width' || field === 'length') {
                part[field] = parseToBaseUnit(newValue) || 0;
            } else if (field === 'qty') {
                part[field] = parseInt(newValue) || 1;
            } else if (field === 'is_bulk') {
                // 🪄 Bulk rows repurpose `length` as a total-length requirement; qty is
                // irrelevant while bulk is on and hidden from the UI (see buildPartsEditRowInner),
                // but deliberately left untouched in storage so the originally entered qty
                // comes back unharmed if bulk is unchecked (e.g. hit by mistake).
                part.is_bulk = !!newValue;
            } else if (field === 'projectId') {
                if (part.projectId === newValue) return;
                part.projectId = newValue;
                part.groupId = '';
                showToast(t('msg_project_changed'));
            } else {
                part[field] = newValue;
            }
            saveState();
            if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
            // If this row is active in edit mode: refresh it in place, skip full rebuild
            if (_activeEditRow['parts'] === partId) {
                const prof = appState.profiles?.find(p => p.id === part.profileId);
                const mat  = appState.materials?.find(m => m.id === part.materialId);
                const tr = document.querySelector(`tr[data-table="parts"][data-row-id="${partId}"]`);
                if (tr) {
                    tr.classList.toggle('table-warning', !(prof && mat));
                    tr.innerHTML = buildPartsEditRowInner(partId);
                }
                _updatePartsFooterTotals();
            } else {
                renderPartsTable();
            }
            showToast(t('msg_part_updated'));
        }
    }
    function deletePart(id, isConfirmed = false) {
        // The Safety Shield
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_part'), () => deletePart(id, true));
            return; 
        }

        appState.parts = appState.parts.filter(p => p.id !== id);
        saveState();
        if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
        renderPartsTable();
        showToast(t('msg_part_removed'), "warning");
    }
    function handleProjectChange() {
        const projId = document.getElementById('part-project').value;
        const groupSelect = document.getElementById('part-group');
        
        // 🪄 1. MEMORIZE the current selection
        const currentGroupId = groupSelect.value;
        
        // 2. Reset to default
        groupSelect.innerHTML = '<option value="">-</option>';
        
        // 3. Populate filtered groups
        if (projId && appState.groups) {
            // 🪄 FIX: Chain the alphabetical sort right after filtering for the project!
            const projectGroups = appState.groups.filter(g => g.projectId === projId).sort((a, b) => a.name.localeCompare(b.name));
            
            projectGroups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.innerText = g.name;
                groupSelect.appendChild(opt);
            });
        }
        
        // 🪄 4. RESTORE the selection so the user doesn't lose their place
        if (currentGroupId) {
            groupSelect.value = currentGroupId;
        }
    }
    function openGroupModalFromParts() {
        const currentProjId = document.getElementById('part-project').value;
        // Pass the ID if one is selected, otherwise pass the empty string
        if (typeof openGroupModal === 'function') openGroupModal(currentProjId);
    }

    // Register Parts table with the central click-to-edit engine
    registerEditableTable('parts', buildPartsEditRowInner, buildPartsReadRowInner);
</script>
