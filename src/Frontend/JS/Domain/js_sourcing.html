<script>
    // ==========================================
    // PHASE 1: THE ROUTER & TOGGLE
    // ==========================================
    function toggleStockView() {
        if (!appState.settings) appState.settings = {};
        appState.settings.compactStockView = !appState.settings.compactStockView;
        saveState();
        renderStockTable();
    }

    // 🪄 The Traffic Cop: Decides which table to draw based on settings
    function renderStockTable() {
        const isCompact = appState.settings?.compactStockView;
        
        // Update the Toggle Button UI
        const btnText = document.getElementById('stock-view-text');
        const btnIcon = document.getElementById('stock-view-icon');
        if (btnText && btnIcon) {
            btnText.innerText = isCompact ? 'Flat Table' : 'Compact Table';
            btnIcon.innerText = isCompact ? '📄' : '🗜️';
        }

        if (isCompact) {
            renderCompressedStockTable();
        } else {
            renderFlatStockTable();
        }
    }

    // ==========================================
    // PHASE 2: THE COMPRESSED ENGINE
    // ==========================================
    function getCompressedStockData() {
        if (!appState.stock) return [];
        const map = {};

        appState.stock.forEach(item => {
            // Fingerprint strictly groups by Cat + Prof + Mat
            const fingerprint = `${item.categoryId}_${item.profileId}_${item.materialId}`;

            if (!map[fingerprint]) {
                map[fingerprint] = {
                    fingerprint: fingerprint,
                    categoryId: item.categoryId,
                    profileId: item.profileId,
                    materialId: item.materialId,
                    totalQty: 0,
                    totalLength_mm: 0,
                    totalArea_mm2: 0,
                    grains: new Set(),
                    types: new Set(),
                    pieces: []
                };
            }

            const group = map[fingerprint];
            const q = item.qty || 1;
            const l = item.length || 0;
            const w = item.categoryId === 'sheet' ? (item.width || 0) : 0;

            group.totalQty += q;
            group.pieces.push({ id: item.id, length: l, width: w, qty: q, grain: item.grain, isCutoff: item.isCutoff });
            
            // Collect unique grains and types
            group.grains.add(item.grain || 'none');
            group.types.add(item.isCutoff ? 'scrap' : 'new');

            // Accumulate math
            if (item.categoryId === 'sheet') {
                group.totalArea_mm2 += (l * w * q);
            } else {
                group.totalLength_mm += (l * q);
            }
        });

        return Object.values(map);
    }
    function renderCompressedStockTable() {
        const tbody = document.getElementById('table-stock-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 

        const groups = getCompressedStockData();
        const isMetric = appState.settings.displayUnit === 'mm';

        groups.forEach(group => {
            // MOCK ITEM for global filters
            const mockItem = {
                categoryId: group.categoryId,
                profileId: group.profileId,
                materialId: group.materialId,
                grain: group.grains.size > 1 ? 'multiple' : Array.from(group.grains)[0],
                isCutoff: group.types.size > 1 ? 'multiple' : (Array.from(group.types)[0] === 'scrap')
            };
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(mockItem, 'stock')) return;

            const tr = document.createElement('tr');
            const badgeClass = getCategoryBadgeClass(group.categoryId);

            // Safe Profile/Material lookups
            const profile = appState.profiles.find(p => p.id === group.profileId);
            const profName = profile ? profile.name : `⚠️ Missing`;
            const material = appState.materials.find(m => m.id === group.materialId);
            const matName = material ? material.name : `⚠️ Missing`;

            if (!profile || !material) tr.classList.add('table-warning');

            // 🪄 MIN/MAX & TOTAL MATH
            let sizeHtml = '-';
            if (group.pieces.length > 0) {
                if (group.categoryId === 'sheet') {
                    // Sort by Area
                    group.pieces.sort((a, b) => (b.length * b.width) - (a.length * a.width));
                    const maxP = group.pieces[0];
                    const minP = group.pieces[group.pieces.length - 1];
                    const minStr = `${formatForDisplay(minP.width)}x${formatForDisplay(minP.length)}`;
                    const maxStr = `${formatForDisplay(maxP.width)}x${formatForDisplay(maxP.length)}`;
                    
                    const totalArea = isMetric ? (group.totalArea_mm2 / 1000000).toFixed(2) + ' m²' : (group.totalArea_mm2 / 92903.04).toFixed(2) + ' sqft';
                    
                    sizeHtml = minStr === maxStr 
                        ? `<span class="fw-bold">${maxStr}</span> <span class="text-muted small">(= ${totalArea})</span>`
                        : `<span class="fw-bold">${minStr} <span class="text-muted fw-normal mx-1">...</span> ${maxStr}</span> <span class="text-muted small">(= ${totalArea})</span>`;
                } else {
                    // Sort by Length
                    group.pieces.sort((a, b) => b.length - a.length);
                    const maxP = group.pieces[0];
                    const minP = group.pieces[group.pieces.length - 1];
                    const minStr = formatForDisplay(minP.length);
                    const maxStr = formatForDisplay(maxP.length);

                    const totalLen = isMetric ? (group.totalLength_mm / 1000).toFixed(2) + ' m' : (group.totalLength_mm / 304.8).toFixed(2) + ' ft';

                    sizeHtml = minStr === maxStr 
                        ? `<span class="fw-bold">${maxStr}</span> <span class="text-muted small">(= ${totalLen})</span>`
                        : `<span class="fw-bold">${minStr} <span class="text-muted fw-normal mx-1">...</span> ${maxStr}</span> <span class="text-muted small">(= ${totalLen})</span>`;
                }
            }

            // 🪄 GRAIN & TYPE LOGIC
            let grainHtml = '-';
            if (group.categoryId === 'sheet') {
                if (group.grains.size > 1) grainHtml = `<span class="fst-italic text-muted">Multiple</span>`;
                else grainHtml = Array.from(group.grains)[0] === 'none' ? '-' : t('opt_' + Array.from(group.grains)[0]);
            }

            let typeHtml = '';
            if (group.types.size > 1) {
                typeHtml = `<span class="badge bg-secondary w-100">Multiple</span>`;
            } else {
                const tVal = Array.from(group.types)[0];
                typeHtml = tVal === 'scrap' 
                    ? `<span class="badge bg-warning text-dark w-100">${t('opt_scrap')}</span>` 
                    : `<span class="badge bg-success w-100">${t('opt_new')}</span>`;
            }

            // Paint Row
            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <span class="badge ${badgeClass} w-100 py-1" style="font-size: 0.75rem; text-transform: uppercase;">${t('opt_' + group.categoryId)}</span>
                    </div>
                </td>
                <td class="text-center align-middle fw-bold fs-6 text-primary px-1">${group.totalQty}</td>
                <td class="px-1 py-0 align-middle text-center fw-bold text-dark">${safeHTML(profName)}</td>
                <td class="px-1 py-0 align-middle text-center text-nowrap">${sizeHtml}</td>
                <td class="px-1 py-0 align-middle text-center text-dark">${safeHTML(matName)}</td>
                <td class="text-center text-capitalize px-1 py-0 align-middle text-muted">${grainHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${typeHtml}</td>
                <td class="text-end align-middle pe-2">
                    <button class="btn btn-outline-primary btn-sm py-0 px-2 fw-bold shadow-sm" onclick="openStockModal('${group.fingerprint}')">
                        📝 Details
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        if (typeof updateFilterUI === 'function') {
            updateFilterUI('stock', ['categoryId', 'profileId', 'materialId', 'grain', 'isCutoff']);
        }
        updateUnitLabels();
    }

    // ==========================================
    // PHASE 3 & 4: COMPACT MODAL & STAGING BUFFER
    // ==========================================
    let stockDetailsModalInstance = null;
    let modalStagingBuffer = []; // 🪄 The Safe Clone
    function openStockModal(fingerprint) {
        const modalEl = document.getElementById('modal-stock-details');
        if (!stockDetailsModalInstance) {
            stockDetailsModalInstance = new bootstrap.Modal(modalEl);
            
            // 🪄 KEYBOARD UX: Listen for Enter/Tab traversing inside the modal
            const tbody = document.getElementById('table-modal-stock-details-body');
            tbody.addEventListener('keydown', handleModalKeyboardNav);
        }

        // 1. Set Header & Fingerprint
        document.getElementById('modal-stock-details-fingerprint').value = fingerprint;
        const parts = fingerprint.split('_');
        const profile = appState.profiles?.find(p => p.id === parts[1]);
        const material = appState.materials?.find(m => m.id === parts[2]);
        document.getElementById('modal-stock-details-title').innerHTML = `📦 Manage: <span class="text-primary">${profile?.name || ''} — ${material?.name || ''}</span>`;

        // 2. Load data into Staging Buffer (CLONE IT!)
        const matchingStock = appState.stock.filter(item => {
            return `${item.categoryId}_${item.profileId}_${item.materialId}` === fingerprint;
        });
        
        // Deep clone so changes don't accidentally leak into appState if Cancel is pressed
        modalStagingBuffer = JSON.parse(JSON.stringify(matchingStock));
        
        // Sort longest to shortest for the UI
        modalStagingBuffer.sort((a, b) => (b.length || 0) - (a.length || 0));

        // 3. Paint the Modal
        renderStockModalTable();
        stockDetailsModalInstance.show();
    }
    function renderStockModalTable() {
        const tbody = document.getElementById('table-modal-stock-details-body');
        tbody.innerHTML = '';
        
        const fingerprint = document.getElementById('modal-stock-details-fingerprint').value;
        const catId = fingerprint.split('_')[0];

        modalStagingBuffer.forEach((item, index) => {
            const tr = document.createElement('tr');
            
            // 🪄 1. SIZE INPUTS
            let sizeHtml = '';
            const displayL = formatForDisplay(item.length);
            if (catId === 'sheet') {
                const displayW = formatForDisplay(item.width);
                sizeHtml = `
                    <div class="d-flex align-items-center justify-content-center gap-1 mx-auto" style="width: 140px;">
                        <input type="text" class="form-control form-control-sm text-end px-1 border-secondary shadow-sm modal-nav-input" style="width: 60px;" 
                               value="${displayW}" onchange="updateStagingBuffer('${item.id}', 'width', this.value)">
                        <span class="text-muted small">x</span>
                        <input type="text" class="form-control form-control-sm text-start px-1 border-secondary shadow-sm modal-nav-input" style="width: 60px;" 
                               value="${displayL}" onchange="updateStagingBuffer('${item.id}', 'length', this.value)">
                    </div>`;
            } else {
                sizeHtml = `
                    <input type="text" class="form-control form-control-sm text-center px-1 border-secondary shadow-sm mx-auto modal-nav-input" style="width: 80px;" 
                           value="${displayL}" onchange="updateStagingBuffer('${item.id}', 'length', this.value)">`;
            }

            // 🪄 2. GRAIN DROPDOWN
            let grainHtml = '<span class="text-muted">-</span>';
            if (catId === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-secondary shadow-sm mx-auto text-center modal-nav-input" style="width: 90px;" onchange="updateStagingBuffer('${item.id}', 'grain', this.value)">
                        <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${item.grain === 'length' ? 'selected' : ''}>${t('opt_length')}</option>
                        <option value="width" ${item.grain === 'width' ? 'selected' : ''}>${t('opt_width')}</option>
                    </select>
                `;
            }

            // 🪄 3. TYPE DROPDOWN
            let typeHtml = `
                <select class="form-select form-select-sm border-secondary shadow-sm mx-auto text-center modal-nav-input ${item.isCutoff ? 'text-warning fw-bold' : 'text-success fw-bold'}" style="width: 90px;" onchange="updateStagingBuffer('${item.id}', 'isCutoff', this.value === 'true')">
                    <option value="false" ${!item.isCutoff ? 'selected' : ''} class="text-success">${t('opt_new')}</option>
                    <option value="true" ${item.isCutoff ? 'selected' : ''} class="text-warning">${t('opt_scrap')}</option>
                </select>
            `;

            tr.innerHTML = `
                <td class="align-middle py-2 ps-3">${sizeHtml}</td>
                <td class="align-middle text-center py-2">
                    <input type="number" class="form-control form-control-sm text-center mx-auto border-secondary shadow-sm modal-nav-input" style="width: 65px;" 
                           value="${item.qty}" onchange="updateStagingBuffer('${item.id}', 'qty', this.value)">
                </td>
                <td class="align-middle text-center py-2">${grainHtml}</td>
                <td class="align-middle text-center py-2">${typeHtml}</td>
                <td class="align-middle text-end py-2 pe-3">
                    <button class="btn btn-sm btn-outline-danger py-0 px-2 shadow-sm" onclick="deleteStagingBufferItem('${item.id}')" tabindex="-1">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    function updateStagingBuffer(id, field, newValue) {
        const item = modalStagingBuffer.find(s => s.id === id);
        if (item) {
            if (field === 'qty') item[field] = parseInt(newValue, 10) || 1;
            else if (field === 'length' || field === 'width') item[field] = parseToBaseUnit(newValue) || 0;
            else item[field] = newValue;
        }
    }
    function deleteStagingBufferItem(id) {
        // Universial Confirmation Shield!
        requestConfirm(t('confirm_delete_stock') || "Delete this size?", () => {
            modalStagingBuffer = modalStagingBuffer.filter(s => s.id !== id);
            renderStockModalTable(); 
        });
    }
    function addNewStagingRow() {
        const fingerprint = document.getElementById('modal-stock-details-fingerprint').value;
        const parts = fingerprint.split('_');
        
        modalStagingBuffer.unshift({
            id: 'STK-' + Date.now() + Math.floor(Math.random() * 1000),
            categoryId: parts[0],
            profileId: parts[1],
            materialId: parts[2],
            grain: 'none',
            isCutoff: false,
            qty: 1,
            length: 0,
            width: 0
        });
        
        renderStockModalTable();
        
        // Focus the first input of the new row instantly
        setTimeout(() => {
            const firstInput = document.querySelector('#table-modal-stock-details-body .modal-nav-input');
            if (firstInput) firstInput.focus();
        }, 50);
    }
    function saveStockDetails() {
        const fingerprint = document.getElementById('modal-stock-details-fingerprint').value;
        
        // 1. Erase all original items matching this fingerprint from the main database
        appState.stock = appState.stock.filter(item => {
            return `${item.categoryId}_${item.profileId}_${item.materialId}` !== fingerprint;
        });

        // 2. Inject the modified Staging Buffer back into the database
        appState.stock = [...appState.stock, ...modalStagingBuffer];

        // 3. Save, Render, and Close
        saveState();
        renderStockTable(); 
        stockDetailsModalInstance.hide();
        showToast("Stock details updated successfully!");
    }
    function handleModalKeyboardNav(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // Stop default form submission
            const inputs = Array.from(document.querySelectorAll('#table-modal-stock-details-body .modal-nav-input'));
            const currentIndex = inputs.indexOf(e.target);
            
            if (currentIndex > -1) {
                // If there's a next input, jump to it
                if (currentIndex < inputs.length - 1) {
                    inputs[currentIndex + 1].focus();
                } else {
                    // If it's the very last input in the table, spawn a new row!
                    e.target.blur(); // Force change event to save current value
                    addNewStagingRow();
                }
            }
        }
    }

    function renderFlatStockTable() {
        const tbody = document.getElementById('table-stock-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 
        
        if (!appState.stock) appState.stock = [];

        appState.stock.forEach(item => {

            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(item, 'stock')) return;

            const tr = document.createElement('tr');
            const badgeClass = getCategoryBadgeClass(item.categoryId);
            
            // 🪄 0. VALIDATE REALITY & DYNAMIC DROPDOWNS FOR PROFILE/MATERIAL
            const filteredProfiles = appState.profiles.filter(p => p.type === item.categoryId).sort((a, b) => a.name.localeCompare(b.name));
            const isProfValid = filteredProfiles.some(p => p.id === item.profileId);
            
            let profOptions = !isProfValid ? `<option value="" disabled selected>⚠️ ${t('opt_select_profile')}</option>` : '';
            filteredProfiles.forEach(p => {
                profOptions += `<option value="${p.id}" ${p.id === item.profileId ? 'selected' : ''}>${safeHTML(p.name)}</option>`;
            });
            let profHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 align-middle text-center" margin: 0 auto;" onchange="updateStock('${item.id}', 'profileId', this.value)" title="${t('title_tap_to_change_profile')}">
                    ${profOptions}
                </select>`;

            const filteredMaterials = appState.materials.filter(m => m.category === item.categoryId).sort((a, b) => a.name.localeCompare(b.name));
            const isMatValid = filteredMaterials.some(m => m.id === item.materialId);

            let matOptions = !isMatValid ? `<option value="" disabled selected>⚠️ ${t('opt_select_material')}</option>` : '';
            filteredMaterials.forEach(m => {
                matOptions += `<option value="${m.id}" ${m.id === item.materialId ? 'selected' : ''}>${safeHTML(m.name)}</option>`;
            });
            let matHtml = `
                <select class="text-center form-select form-select-sm border-0 bg-transparent px-0 py-0" margin: 0 auto;" onchange="updateStock('${item.id}', 'materialId', this.value)" title="${t('title_tap_to_change_material')}">
                    ${matOptions}
                </select>`;

            // 🪄 0.5 APPLY ROW HIGHLIGHT IF INVALID
            if (!isProfValid || !isMatValid) {
                tr.classList.add('table-warning');
            }

            // 🪄 1. DYNAMIC SIZE INPUTS
            let dimHtml = '';
            const displayL = formatForDisplay(item.length);
            if (item.categoryId === 'sheet') {
                const displayW = formatForDisplay(item.width);
                dimHtml = `
                    <div class="d-flex align-items-center justify-content-center gap-1">
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width: 50px;" 
                               value="${displayW}" onchange="updateStock('${item.id}', 'width', this.value)" title="${t('title_tap_to_edit_width')}">
                        <span class="text-muted text-sm">x</span>
                        <input type="text" class="form-control form-control-sm border-0 bg-transparent text-start px-0" style="width: 50px;" 
                               value="${displayL}" onchange="updateStock('${item.id}', 'length', this.value)" title="${t('title_tap_to_edit_length')}">
                    </div>`;
            } else {
                dimHtml = `
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 60px;" 
                           value="${displayL}" onchange="updateStock('${item.id}', 'length', this.value)" title="${t('title_tap_to_edit_length')}">`;
            }

            // 🪄 2. INLINE GRAIN DROPDOWN
            let grainHtml = '<span class="text-muted">-</span>';
            if (item.categoryId === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center" style="width: 75px;" onchange="updateStock('${item.id}', 'grain', this.value)" title="${t('title_change_grain')}">
                        <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${item.grain === 'length' ? 'selected' : ''}>${t('opt_length')}</option>
                        <option value="width" ${item.grain === 'width' ? 'selected' : ''}>${t('opt_width')}</option>
                    </select>
                `;
            }

            // 🪄 3. INLINE TYPE DROPDOWN
            let typeHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-0 py-0 mx-auto text-center ${item.isCutoff ? 'text-warning fw-bold' : 'text-success fw-bold'}" style="width: 75px;" onchange="updateStock('${item.id}', 'isCutoff', this.value === 'true')" title="${t('title_change_type')}">
                    <option value="false" ${!item.isCutoff ? 'selected' : ''} class="text-success">${t('opt_new')}</option>
                    <option value="true" ${item.isCutoff ? 'selected' : ''} class="text-warning">${t('opt_scrap')}</option>
                </select>
            `;

            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center px-1">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${item.categoryId === 'lumber' ? 'selected' : ''}>${t('opt_lumber')}</option>
                            <option value="sheet" class="bg-light text-dark" ${item.categoryId === 'sheet' ? 'selected' : ''}>${t('opt_sheet')}</option>
                            <option value="fastener" class="bg-light text-dark" ${item.categoryId === 'fastener' ? 'selected' : ''}>${t('opt_fastener')}</option>
                        </select>
                    </div>
                </td>
                <td class="text-center px-1 py-0 align-middle"><small>
                    <input type="number" class="form-control form-control-sm border-0 bg-transparent text-center px-0 mx-auto" style="width: 50px;"
                           value="${item.qty}" onchange="updateStock('${item.id}', 'qty', this.value)" title="${t('title_tap_to_edit_qty')}">
                </small></td>
                <td class="px-1 py-0 align-middle text-center">${profHtml}</td>
                <td class="text-center text-nowrap px-1 py-0 align-middle">${dimHtml}</td>
                <td class="px-1 py-0 align-middle text-center">${matHtml}</td>
                <td class="text-center text-capitalize px-1 py-0 align-middle">${grainHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${typeHtml}</td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('stock', '${item.id}')" title="${t('title_duplicate_row')}">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteStock('${item.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        if (typeof updateFilterUI === 'function') {
            updateFilterUI('stock', ['categoryId', 'length', 'profileId', 'materialId', 'grain', 'isCutoff']);
        }

        updateUnitLabels();
    }
    function handleAddStock(event) {
        event.preventDefault();
        
        const category = document.getElementById('stock-category').value;
        const lengthInput = parseToBaseUnit(document.getElementById('stock-length').value);
        const widthInput = category === 'sheet' ? parseToBaseUnit(document.getElementById('stock-width').value) : 0;
        
        if (!appState.stock) appState.stock = [];

        appState.stock.unshift({
            id: 'STK-' + Date.now(),
            categoryId: category,
            profileId: document.getElementById('stock-profile').value,
            materialId: document.getElementById('stock-material').value,
            qty: parseInt(document.getElementById('stock-qty').value, 10),
            length: lengthInput,
            width: widthInput,
            grain: document.getElementById('stock-grain').value,
            isCutoff: document.getElementById('stock-is-cutoff').checked
        });
        
        saveState();
        renderStockTable();
        showToast(t('msg_item_added_stock'));
        
        // Reset form but keep category to allow rapid entry
        document.getElementById('stock-length').value = '';
        document.getElementById('stock-width').value = '';
        document.getElementById('stock-qty').value = '1';
    }
    function updateStock(id, field, newValue) {
        const item = appState.stock.find(s => s.id === id);
        if (item) {
            if (field === 'qty') {
                item[field] = parseInt(newValue, 10) || 1;
            } else if (field === 'length' || field === 'width') {
                item[field] = parseToBaseUnit(newValue) || 0;
            } else {
                item[field] = newValue; // Handles grain strings and boolean drop-downs
            }
            saveState();
            renderStockTable();
            showToast(t('msg_stock_updated'));
        }
    }
    function deleteStock(id, isConfirmed = false) {
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_stock'), () => deleteStock(id, true));
            return; 
        }

        appState.stock = appState.stock.filter(s => s.id !== id);
        saveState();
        renderStockTable();
        showToast(t('msg_item_removed_stock'));
    }
    function handleStockCategoryChange() {
        const cat = document.getElementById('stock-category').value;
        const profSelect = document.getElementById('stock-profile');
        const matSelect = document.getElementById('stock-material');
        const lengthInput = document.getElementById('stock-length');
        const widthInput = document.getElementById('stock-width');
        const grainSelect = document.getElementById('stock-grain');
        
        // Reset and enable
        profSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        matSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        profSelect.disabled = false;
        matSelect.disabled = false;
        lengthInput.disabled = false;
        
        /// Filter and Populate Profile Dropdown
        if (appState.profiles) {
            appState.profiles.filter(p => p.type === cat).sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                profSelect.appendChild(opt);
            });
        }
        
        // Filter and Populate Material Dropdown
        if (appState.materials) {
            appState.materials.filter(m => m.category === cat).sort((a, b) => a.name.localeCompare(b.name)).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                matSelect.appendChild(opt);
            });
        }

        // Toggle Width and Grain based on category physics
        if (cat === 'sheet') {
            widthInput.disabled = false;
            widthInput.required = true;
            grainSelect.disabled = false;
        } else {
            widthInput.disabled = true;
            widthInput.required = false;
            widthInput.value = '';
            grainSelect.disabled = true;
            grainSelect.value = 'none';
        }
    }
    function populateStockDropdowns() {
        // Only refresh if a category is already selected
        if (document.getElementById('stock-category').value) {
            handleStockCategoryChange();
        }
    }

    // ==========================================
    // PHASE 2: CATALOG COMPRESSED ENGINE
    // ==========================================
    function getCompressedCatalogData() {
        if (!appState.catalog) return [];
        const map = {};

        appState.catalog.forEach(item => {
            // Group by Category + Profile + Material + Store
            const fingerprint = `${item.categoryId}_${item.profileId}_${item.materialId}_${item.storeId}`;

            if (!map[fingerprint]) {
                map[fingerprint] = {
                    fingerprint: fingerprint,
                    categoryId: item.categoryId,
                    profileId: item.profileId,
                    materialId: item.materialId,
                    storeId: item.storeId,
                    grains: new Set(),
                    oldestVerification: Date.now(),
                    pieces: []
                };
            }

            const group = map[fingerprint];
            group.pieces.push(item);
            group.grains.add(item.grain || 'none');
            
            // Find the weakest link (oldest timestamp) for the freshness badge
            const itemTime = item.lastVerified || 0;
            if (itemTime < group.oldestVerification) {
                group.oldestVerification = itemTime;
            }
        });

        return Object.values(map);
    }
    function renderCompressedCatalogTable() {
        const tbody = document.getElementById('table-catalog-body');
        if (!tbody) return;
        tbody.innerHTML = ''; 

        const groups = getCompressedCatalogData();
        const viewUnit = document.getElementById('table-price-view').value;
        const currency = appState.settings.currency || '$';

        groups.forEach(group => {
            // Mock item for filters
            const mockItem = {
                categoryId: group.categoryId,
                profileId: group.profileId,
                materialId: group.materialId,
                storeId: group.storeId,
                grain: group.grains.size > 1 ? 'multiple' : Array.from(group.grains)[0]
            };
            if (typeof rowPassesFilters === 'function' && !rowPassesFilters(mockItem, 'catalog')) return;

            const tr = document.createElement('tr');
            const badgeClass = getCategoryBadgeClass(group.categoryId);

            // Safe Lookups
            const profile = appState.profiles.find(p => p.id === group.profileId);
            const material = appState.materials.find(m => m.id === group.materialId);
            const store = appState.stores?.find(s => s.id === group.storeId);
            
            const profName = profile ? profile.name : `⚠️ Missing`;
            const matName = material ? material.name : `⚠️ Missing`;
            const storeName = store ? store.name : `⚠️ Missing`;

            if (!profile || !material || !store) tr.classList.add('table-warning');

            // 🪄 1. SIZE RANGE MATH
            let sizeHtml = '-';
            if (group.pieces.length > 0) {
                if (group.categoryId === 'sheet') {
                    group.pieces.sort((a, b) => (b.length * b.width) - (a.length * a.width));
                    const maxP = group.pieces[0];
                    const minP = group.pieces[group.pieces.length - 1];
                    const minStr = `${formatForDisplay(minP.width)}x${formatForDisplay(minP.length)}`;
                    const maxStr = `${formatForDisplay(maxP.width)}x${formatForDisplay(maxP.length)}`;
                    sizeHtml = minStr === maxStr ? `<span class="fw-bold">${maxStr}</span>` : `<span class="fw-bold">${minStr} <span class="text-muted fw-normal mx-1">...</span> ${maxStr}</span>`;
                } else {
                    group.pieces.sort((a, b) => b.length - a.length);
                    const maxP = group.pieces[0];
                    const minP = group.pieces[group.pieces.length - 1];
                    const minStr = formatForDisplay(minP.length);
                    const maxStr = formatForDisplay(maxP.length);
                    sizeHtml = minStr === maxStr ? `<span class="fw-bold">${maxStr}</span>` : `<span class="fw-bold">${minStr} <span class="text-muted fw-normal mx-1">...</span> ${maxStr}</span>`;
                }
            }

            // 🪄 2. NORMALIZED PRICE RANGE MATH
            let priceHtml = '-';
            if (group.pieces.length > 0) {
                // Calculate live normalized price for every piece in the group
                const prices = group.pieces.map(p => parseFloat(getNormalizedPriceDisplay(p, viewUnit)) || 0);
                const minPrice = Math.min(...prices).toFixed(2);
                const maxPrice = Math.max(...prices).toFixed(2);

                priceHtml = minPrice === maxPrice 
                    ? `${currency}${maxPrice}`
                    : `${currency}${minPrice} <span class="text-muted fw-normal mx-1">...</span> ${currency}${maxPrice}`;
            }

            // 🪄 3. GRAIN
            let grainHtml = '-';
            if (group.categoryId === 'sheet') {
                if (group.grains.size > 1) grainHtml = `<span class="fst-italic text-muted">Multiple</span>`;
                else grainHtml = Array.from(group.grains)[0] === 'none' ? '-' : t('opt_' + Array.from(group.grains)[0]);
            }

            // 🪄 4. FRESHNESS BADGE (Based on the oldest verification in the group)
            const daysOld = (Date.now() - group.oldestVerification) / (1000 * 60 * 60 * 24);
            let badgeBg = '#198754'; 
            let badgeColor = '#ffffff';
            if (daysOld >= 28) badgeBg = '#dc3545'; 
            else if (daysOld >= 14) { badgeBg = '#ffc107'; badgeColor = '#000000'; }

            const dateObj = new Date(group.oldestVerification);
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            let freshnessHtml = `
                <span class="badge shadow-sm" style="background-color: ${badgeBg}; color: ${badgeColor}; width: 6ch; display: inline-flex; justify-content: center;">
                    ${dd}/${mm}
                </span>`;

            // Paint Row (Raw Price and Links columns are completely omitted!)
            tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center">
                        <span class="badge ${badgeClass} w-100 py-1" style="font-size: 0.75rem; text-transform: uppercase;">${t('opt_' + group.categoryId)}</span>
                    </div>
                </td>
                <td class="px-1 py-0 align-middle text-center fw-bold text-dark">${safeHTML(profName)}</td>
                <td class="px-1 py-0 align-middle text-center text-nowrap">${sizeHtml}</td>
                <td class="px-1 py-0 align-middle text-center text-dark">${safeHTML(matName)}</td>
                <td class="text-center text-capitalize px-1 py-0 align-middle text-muted">${grainHtml}</td>
                <td class="px-1 py-0 align-middle text-center text-dark fw-bold">${safeHTML(storeName)}</td>
                <td class="text-center fw-bold text-success align-middle text-nowrap">${priceHtml}</td>
                <td class="text-center align-middle">${freshnessHtml}</td>
                <td class="text-end align-middle pe-2">
                    <button class="btn btn-outline-primary btn-sm py-0 px-2 fw-bold shadow-sm" onclick="openCatalogModal('${group.fingerprint}')">
                        📝 Details
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        if (typeof updateFilterUI === 'function') {
            updateFilterUI('catalog', ['categoryId', 'profileId', 'materialId', 'grain', 'storeId']);
        }
    }

    // ==========================================
    // PHASE 3 & 4: CATALOG MODAL & STAGING BUFFER
    // ==========================================
    let catalogDetailsModalInstance = null;
    let modalCatalogStagingBuffer = [];
    function openCatalogModal(fingerprint) {
        const modalEl = document.getElementById('modal-catalog-details');
        if (!catalogDetailsModalInstance) {
            catalogDetailsModalInstance = new bootstrap.Modal(modalEl);
            
            const tbody = document.getElementById('table-modal-catalog-details-body');
            tbody.addEventListener('keydown', handleCatalogModalKeyboardNav);
        }

        // 1. Set Header & Fingerprint
        document.getElementById('modal-catalog-details-fingerprint').value = fingerprint;
        const parts = fingerprint.split('_');
        const profile = appState.profiles?.find(p => p.id === parts[1]);
        const material = appState.materials?.find(m => m.id === parts[2]);
        const store = appState.stores?.find(s => s.id === parts[3]);
        
        document.getElementById('modal-catalog-details-title').innerHTML = `🏷️ Manage Prices: <span class="text-primary">${profile?.name || ''} — ${material?.name || ''}</span> @ <span class="text-dark">${store?.name || ''}</span>`;

        // 2. Populate the Unit Dropdown based on Global Settings
        const isMetric = appState.settings.displayUnit === 'mm';
        const unitSelect = document.getElementById('modal-catalog-view-unit');
        unitSelect.innerHTML = `
            <option value="piece">/${t('opt_pc')}</option>
            <option value="linear">/${isMetric ? 'm' : 'ft'}</option>
            <option value="area" selected>/${isMetric ? 'm²' : 'sqft'}</option>
            <option value="volume">/${isMetric ? 'm³' : 'BF'}</option>
        `;

        // 3. Load data into Staging Buffer (CLONE IT)
        const matchingCatalog = appState.catalog.filter(item => {
            return `${item.categoryId}_${item.profileId}_${item.materialId}_${item.storeId}` === fingerprint;
        });
        
        modalCatalogStagingBuffer = JSON.parse(JSON.stringify(matchingCatalog));
        
        // Sort longest to shortest
        modalCatalogStagingBuffer.sort((a, b) => (b.length || 0) - (a.length || 0));

        // 4. Paint
        renderCatalogModalTable();
        catalogDetailsModalInstance.show();
    }

    function updateCatalogStagingBuffer(id, field, newValue) {
        const item = modalCatalogStagingBuffer.find(c => c.id === id);
        if (item) {
            if (field === 'length' || field === 'width') {
                item[field] = parseToBaseUnit(newValue) || 0;
            } else if (field === 'price') {
                item[field] = parseFloat(newValue) || 0;
            } else {
                item[field] = newValue;
            }
            
            // Instantly flag as freshly verified
            item.lastVerified = Date.now();

            // 🪄 LIVE MATH UPDATE: Update the Unit Cost text without losing input focus!
            const viewUnit = document.getElementById('modal-catalog-view-unit').value;
            const costSpan = document.getElementById(`staging-cost-${id}`);
            const currency = appState.settings.currency || '$';
            if (costSpan) {
                costSpan.innerText = `${currency}${getNormalizedPriceDisplay(item, viewUnit)}`;
            }
        }
    }
    function promptCatalogLink(id) {
        const item = modalCatalogStagingBuffer.find(c => c.id === id);
        if (item) {
            let newLink = prompt(t('title_edit_link') || "Enter URL for this material size:", item.link || "");
            if (newLink !== null) { // If they didn't hit cancel
                if (newLink && !/^https?:\/\//i.test(newLink)) newLink = 'https://' + newLink;
                item.link = newLink;
                renderCatalogModalTable(); // Redraw just to update the link icon color
            }
        }
    }
    function deleteCatalogStagingBufferItem(id) {
        requestConfirm(t('confirm_delete_catalog_item') || "Delete this price?", () => {
            modalCatalogStagingBuffer = modalCatalogStagingBuffer.filter(c => c.id !== id);
            renderCatalogModalTable(); 
        });
    }
    function addNewCatalogStagingRow() {
        const fingerprint = document.getElementById('modal-catalog-details-fingerprint').value;
        const parts = fingerprint.split('_');
        
        modalCatalogStagingBuffer.unshift({
            id: 'CAT-' + Date.now() + Math.floor(Math.random() * 1000),
            categoryId: parts[0],
            profileId: parts[1],
            materialId: parts[2],
            storeId: parts[3],
            grain: 'none',
            price: 0,
            priceUnit: 'piece',
            length: 0,
            width: 0,
            link: '',
            lastVerified: Date.now()
        });
        
        renderCatalogModalTable();
        
        // Focus the first input of the new row instantly
        setTimeout(() => {
            const firstInput = document.querySelector('#table-modal-catalog-details-body .catalog-nav-input');
            if (firstInput) firstInput.focus();
        }, 50);
    }
    function saveCatalogDetails() {
        const fingerprint = document.getElementById('modal-catalog-details-fingerprint').value;
        
        // 1. Erase all original items matching this fingerprint
        appState.catalog = appState.catalog.filter(item => {
            return `${item.categoryId}_${item.profileId}_${item.materialId}_${item.storeId}` !== fingerprint;
        });

        // 2. Inject the modified Staging Buffer back into the database
        appState.catalog = [...appState.catalog, ...modalCatalogStagingBuffer];

        // 3. Save, Render, and Close
        saveState();
        renderCatalogTable(); 
        catalogDetailsModalInstance.hide();
        showToast("Price details updated successfully!");
    }
    function handleCatalogModalKeyboardNav(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); 
            const inputs = Array.from(document.querySelectorAll('#table-modal-catalog-details-body .catalog-nav-input'));
            const currentIndex = inputs.indexOf(e.target);
            
            if (currentIndex > -1) {
                if (currentIndex < inputs.length - 1) {
                    inputs[currentIndex + 1].focus();
                } else {
                    e.target.blur(); // Force change event to save current value
                    addNewCatalogStagingRow();
                }
            }
        }
    }

            }

            // 🪄 2. INLINE STORE DROPDOWN
            let storeOptions = !isStoreValid ? `<option value="" disabled selected>⚠️ ${t('opt_select_store')}</option>` : '';
            
            if (appState.stores) {
                [...appState.stores].sort((a, b) => a.name.localeCompare(b.name)).forEach(s => {
                    storeOptions += `<option value="${s.id}" ${s.id === item.storeId ? 'selected' : ''}>${safeHTML(s.name)}</option>`;
                });
            }
            let storeHtml = `
                <select class="text-center form-select form-select-sm border-0 bg-transparent px-1 py-0" onchange="updateCatalogItem('${item.id}', 'storeId', this.value)" title="${t('title_tap_to_change_store')}">
                    ${storeOptions}
                </select>`;

            // 🪄 3. DYNAMIC PRICE INPUT & INLINE UNIT DROPDOWN
            const uLin = isMetric ? 'm' : 'ft';
            const uArea = isMetric ? 'm²' : 'sqft';
            const uVol = isMetric ? 'm³' : 'BF';

            let unitSelectHtml = `
                <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 text-muted" 
                        style="width: auto; appearance: none; cursor: pointer; text-align: left;" 
                        onchange="updateCatalogItem('${item.id}', 'priceUnit', this.value)" title="${t('title_tap_to_change_unit')}">
                    <option value="piece" ${item.priceUnit === 'piece' ? 'selected' : ''}>${t('opt_pc')}</option>
                    <option value="linear" ${item.priceUnit === 'linear' ? 'selected' : ''}>${uLin}</option>
                    <option value="area" ${item.priceUnit === 'area' ? 'selected' : ''}>${uArea}</option>
                    <option value="volume" ${item.priceUnit === 'volume' ? 'selected' : ''}>${uVol}</option>
                </select>
            `;

            let priceHtml = `
                <div class="d-flex align-items-center justify-content-center text-nowrap mx-auto" style="width: 130px;">
                    <input type="number" step="0.01" class="form-control form-control-sm border-0 bg-transparent text-end px-0" style="width: 60px;" 
                           value="${parseFloat(item.price).toFixed(2)}" onchange="updateCatalogItem('${item.id}', 'price', this.value)" title="${t('title_tap_to_edit_price')}">
                    <span class="text-muted px-1">/</span>
                    ${unitSelectHtml}
                </div>`;

            let grainHtml = '<span class="text-muted">-</span>';
            if (item.categoryId === 'sheet') {
                grainHtml = `
                    <select class="form-select form-select-sm border-0 bg-transparent px-1 py-0 mx-auto text-center" style="width: 75px;" onchange="updateCatalogItem('${item.id}', 'grain', this.value)" title="${t('title_change_grain')}">
                        <option value="none" ${item.grain === 'none' ? 'selected' : ''}>-</option>
                        <option value="length" ${item.grain === 'length' ? 'selected' : ''}>${t('opt_length')}</option>
                        <option value="width" ${item.grain === 'width' ? 'selected' : ''}>${t('opt_width')}</option>
                    </select>
                `;
            }

            // Calculate normalized comparison price
            const displayPrice = getNormalizedPriceDisplay(item, viewUnit);

            // 🪄 FRESHNESS BADGE ENGINE
            const verifiedTime = item.lastVerified || Date.now(); // Fallback to today for old data
            const daysOld = (Date.now() - verifiedTime) / (1000 * 60 * 60 * 24);
            
            // Custom Signal Colors (Bypasses Bootstrap variables)
            let badgeBg = '#198754'; // Solid Green (< 14 days)
            let badgeColor = '#ffffff';
            if (daysOld >= 28) {
                badgeBg = '#dc3545'; // Solid Red (> 4 weeks)
            } else if (daysOld >= 14) {
                badgeBg = '#ffc107'; // Solid Amber (> 2 weeks)
                badgeColor = '#000000'; // Black text for readability on yellow
            }

            // Universal dd/mm formatting
            const dateObj = new Date(verifiedTime);
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            
            // fixed width: 6ch guarantees it won't warp the table columns
            let freshnessHtml = `
                <span class="badge shadow-sm" 
                      style="background-color: ${badgeBg}; color: ${badgeColor}; cursor: pointer; width: 6ch; display: inline-flex; text-align: center; justify-content: center; align-items: center; user-select: none;" 
                      onclick="verifyPrice('${item.id}')" 
                      title="${t('title_click_to_verify')}">
                    ${dd}/${mm}
                </span>
            `;

            let linkHtml = item.link 
                ? `<a href="${safeHTML(item.link)}" target="_blank" class="text-decoration-none" title="${t('title_open_link')}">🔗</a>` 
                : `<span class="text-muted" style="opacity: 0.3;">🔗</span>`;

                tr.innerHTML = `
                <td>
                    <div class="d-flex justify-content-center">
                        <select class="form-select form-select-sm border-0 badge ${badgeClass}" 
                                style="width: 85px; appearance: none; background-image: none; text-align: center; cursor: pointer; font-size: 0.75rem; text-transform: uppercase;" disabled>
                            <option value="lumber" class="bg-light text-dark" ${item.categoryId === 'lumber' ? 'selected' : ''}>${t('opt_lumber')}</option>
                            <option value="sheet" class="bg-light text-dark" ${item.categoryId === 'sheet' ? 'selected' : ''}>${t('opt_sheet')}</option>
                            <option value="fastener" class="bg-light text-dark" ${item.categoryId === 'fastener' ? 'selected' : ''}>${t('opt_fastener')}</option>
                        </select>
                    </div>
                </td>
                <td class="px-1 py-0 align-middle text-center">${profHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${dimHtml}</td>
                <td class="px-1 py-0 align-middle text-center">${matHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${grainHtml}</td>
                <td class="px-1 py-0 align-middle">${storeHtml}</td>
                <td class="text-center px-1 py-0 align-middle">${priceHtml}</td>
                <td class="text-center fw-bold text-success align-middle">${currency}${displayPrice}</td>
                <td class="text-center align-middle">${freshnessHtml}</td>
                <td class="text-nowrap align-middle">
                    <div class="d-flex justify-content-end align-items-center">
                        ${linkHtml}
                        <button class="btn btn-sm py-0 px-1" onclick="openLinkModal('${item.id}', '${safeHTML(item.link || '')}')" title="${t('title_edit_link')}">✏️</button>
                    </div>
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-0" onclick="duplicateRow('catalog', '${item.id}')" title="${t('title_duplicate_row')}">➕</button>
                    <button class="btn btn-sm py-0 px-0 me-2" onclick="deleteCatalogItem('${item.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        // 🪄 COLORIZE ACTIVE FILTERS (Powered by Central Engine)
        const filterColumns = ['categoryId', 'length', 'profileId', 'materialId', 'grain', 'storeId'];
        const hasAnyFilter = updateFilterUI('catalog', filterColumns);
    }
    function handleAddCatalogItem(event) {
        event.preventDefault();
        const category = document.getElementById('cat-category').value;
        
        // 🪄 Smart URL Formatter
        let rawLink = document.getElementById('cat-link').value || '';
        if (rawLink && !/^https?:\/\//i.test(rawLink)) {
            rawLink = 'https://' + rawLink;
        }
        
        if (!appState.catalog) appState.catalog = [];

        appState.catalog.unshift({
            id: 'CAT-' + Date.now(),
            categoryId: category,
            profileId: document.getElementById('cat-profile').value,
            materialId: document.getElementById('cat-material').value,
            storeId: document.getElementById('cat-store').value,
            length: parseToBaseUnit(document.getElementById('cat-length').value),
            width: category === 'sheet' ? parseToBaseUnit(document.getElementById('cat-width').value) : 0,
            grain: document.getElementById('cat-grain').value, // 🪄 NEW
            price: parseFloat(document.getElementById('cat-price').value) || 0,
            priceUnit: document.getElementById('cat-price-unit').value,
            link: rawLink,
            lastVerified: Date.now()
        });
        
        saveState();
        renderCatalogTable();
        showToast(t('msg_item_added_catalog'));

        // Reset form but keep category to allow rapid entry
        document.getElementById('cat-length').value = '';

        if (category === 'sheet') {
            const widthInput = document.getElementById('cat-width');
            widthInput.value = '';
            widthInput.focus(); // Snap to width for 2D materials
        } else {
            document.getElementById('cat-length').focus(); // Snap to length for 1D materials
        }
    }
    function updateCatalogItem(id, field, newValue) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            if (field === 'length' || field === 'width') {
                // Safely convert fractional UI input to base mm
                item[field] = parseToBaseUnit(newValue) || 0;
            } else if (field === 'price') {
                // Ensure price is a clean float
                item[field] = parseFloat(newValue) || 0;
                item.lastVerified = Date.now(); // 🪄 AUTO-TAGGING: Instantly reset freshness
            } else {
                // For storeId or generic text
                item[field] = newValue;
            }
            
            saveState();
            renderCatalogTable();
            showToast(t('msg_catalog_item_updated'));
        }
    }
    function deleteCatalogItem(id, isConfirmed = false) {
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_catalog_item'), () => deleteCatalogItem(id, true));
            return; 
        }
        appState.catalog = appState.catalog.filter(c => c.id !== id);
        saveState();
        renderCatalogTable();
        showToast(t('msg_item_removed'));
    }
    function verifyPrice(id) {
        const item = appState.catalog.find(c => c.id === id);
        if (item) {
            item.lastVerified = Date.now();
            saveState();
            renderCatalogTable();
            showToast(t('msg_price_verified'));
        }
    }
    function cyclePriceUnit() {
        const units = ['piece', 'linear', 'area', 'volume'];
        const hiddenUnit = document.getElementById('cat-price-unit');
        
        // Find where we are in the array and grab the next one
        let currentIndex = units.indexOf(hiddenUnit.value);
        let nextIndex = (currentIndex + 1) % units.length;
        hiddenUnit.value = units[nextIndex];
        
        // Let the global translation engine instantly format the button text
        updateUnitLabels(); 
    }
    function handleCatalogCategoryChange() {
        const cat = document.getElementById('cat-category').value;
        const profSelect = document.getElementById('cat-profile');
        const matSelect = document.getElementById('cat-material');
        const lengthInput = document.getElementById('cat-length');
        const widthInput = document.getElementById('cat-width');
        const btnAdd = document.getElementById('btn-add-catalog');
        
        profSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        matSelect.innerHTML = `<option value="" disabled selected>${t('opt_select')}</option>`;
        profSelect.disabled = false;
        matSelect.disabled = false;
        lengthInput.disabled = false;
        btnAdd.disabled = false;
        
        if (appState.profiles) {
            appState.profiles.filter(p => p.type === cat).sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                profSelect.appendChild(opt);
            });
        }
        if (appState.materials) {
            appState.materials.filter(m => m.category === cat).sort((a, b) => a.name.localeCompare(b.name)).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                matSelect.appendChild(opt);
            });
        }
        const grainSelect = document.getElementById('cat-grain'); // 🪄 ADD THIS

        if (cat === 'sheet') {
            widthInput.disabled = false;
            widthInput.required = true;
            grainSelect.disabled = false; // 🪄 ADD THIS
        } else {
            widthInput.disabled = true;
            widthInput.required = false;
            widthInput.value = '';
            grainSelect.disabled = true; // 🪄 ADD THIS
            grainSelect.value = 'none';  // 🪄 ADD THIS
        }
    }
    function populateCatalogDropdowns() {
        const storeSelect = document.getElementById('cat-store');
        
        if (storeSelect) {
            // 🪄 1. MEMORIZE the current selection before wiping the list
            const currentStoreId = storeSelect.value;
            
            // 🪄 2. REBUILD the list safely
            storeSelect.innerHTML = `<option value="" disabled selected>${t('opt_select_store')}</option>`;
            if (appState.stores) {
                [...appState.stores].sort((a, b) => a.name.localeCompare(b.name)).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.innerText = s.name;
                    storeSelect.appendChild(opt);
                });
            }
            
            // 🪄 3. RESTORE the selection
            if (currentStoreId) {
                storeSelect.value = currentStoreId;
            }
        }

        // 🪄 4. RESTORE the Category dropdown trigger (fixes the missing Profile/Material bug)
        const catSelect = document.getElementById('cat-category');
        if (catSelect && catSelect.value) {
            handleCatalogCategoryChange();
        }
    }
    function calculateCostPerPiece(item) {
        if (!item.price || item.price === 0) return 0;
        if (item.priceUnit === 'piece') return item.price;
        
        const isMetric = appState.settings.displayUnit === 'mm';
        const prof = appState.profiles.find(p => p.id === item.profileId);
        if (!prof) return 0;

        const l_mm = item.length;
        const w_mm = item.categoryId === 'sheet' ? item.width : (prof.width || 0);
        const t_mm = prof.thickness || 0;

        if (isMetric) {
            if (item.priceUnit === 'linear') return item.price * (l_mm / 1000);
            if (item.priceUnit === 'area') return item.price * ((l_mm / 1000) * (w_mm / 1000));
            if (item.priceUnit === 'volume') return item.price * ((l_mm / 1000) * (w_mm / 1000) * (t_mm / 1000));
        } else {
            if (item.priceUnit === 'linear') return item.price * (l_mm / 304.8);
            if (item.priceUnit === 'area') return item.price * ((l_mm * w_mm) / 92903.04);
            if (item.priceUnit === 'volume') return item.price * ((l_mm * w_mm * t_mm) / 2359737.216); // Board Foot Math
        }
        return 0;
    }
    function getNormalizedPriceDisplay(item, viewUnit) {
        const costPerPiece = calculateCostPerPiece(item);
        if (viewUnit === 'piece') return costPerPiece.toFixed(2);
        
        const isMetric = appState.settings.displayUnit === 'mm';
        const prof = appState.profiles.find(p => p.id === item.profileId);
        if (!prof || item.length === 0) return '0.00';

        const l_mm = item.length;
        const w_mm = item.categoryId === 'sheet' ? item.width : (prof.width || 0);
        const t_mm = prof.thickness || 0;

        let factor = 1;
        if (isMetric) {
            if (viewUnit === 'linear') factor = (l_mm / 1000);
            else if (viewUnit === 'area') factor = ((l_mm / 1000) * (w_mm / 1000));
            else if (viewUnit === 'volume') factor = ((l_mm / 1000) * (w_mm / 1000) * (t_mm / 1000));
        } else {
            if (viewUnit === 'linear') factor = (l_mm / 304.8);
            else if (viewUnit === 'area') factor = ((l_mm * w_mm) / 92903.04);
            else if (viewUnit === 'volume') factor = ((l_mm * w_mm * t_mm) / 2359737.216);
        }

        if (factor === 0) return '0.00';
        return (costPerPiece / factor).toFixed(2);
    }

    let linkModalInstance = null;
    function openLinkModal(itemId, currentLink) {
        if (!linkModalInstance) linkModalInstance = new bootstrap.Modal(document.getElementById('modal-link-editor'));
        document.getElementById('modal-link-item-id').value = itemId;
        document.getElementById('modal-link-url').value = currentLink || '';
        linkModalInstance.show();
        setTimeout(() => document.getElementById('modal-link-url').focus(), 400);
    }
    function saveCatalogLink(event) {
        if (event) event.preventDefault(); 
        
        const id = document.getElementById('modal-link-item-id').value;
        let newLink = document.getElementById('modal-link-url').value || '';
        
        // 🪄 Smart URL Formatter
        if (newLink && !/^https?:\/\//i.test(newLink)) {
            newLink = 'https://' + newLink;
        }

        // 🪄 UNIVERSAL ROUTER: Check the ID prefix to know where to save
        if (id.startsWith('PROJ-')) {
            const proj = appState.projects.find(p => p.id === id);
            if (proj) {
                proj.link = newLink;
                saveState();
                renderProjectsTable(); // Redraw Projects
            }
        } else {
            const item = appState.catalog.find(c => c.id === id);
            if (item) {
                item.link = newLink;
                saveState();
                renderCatalogTable(); // Redraw Catalog
            }
        }
        
        linkModalInstance.hide();
    }  

    let storeModalInstance = null;
    function openStoreModal() {
        const modalEl = document.getElementById('modal-store-manager');
        
        // Failsafe: Check if the HTML actually exists!
        if (!modalEl) {
            alert(t('err_store_modal_html_missing'));
            console.error("Could not find element with ID 'modal-store-manager'.");
            return;
        }

        if (!storeModalInstance) {
            storeModalInstance = new bootstrap.Modal(modalEl);
            modalEl.addEventListener('hidden.bs.modal', function () {
                if (typeof populateCatalogDropdowns === 'function') populateCatalogDropdowns();
            });
        }
        
        renderStoreModalTable();
        storeModalInstance.show();
        setTimeout(() => document.getElementById('modal-new-store-name').focus(), 400);
    }
    function renderStoreModalTable() {
        const tbody = document.getElementById('table-modal-stores-body');
        tbody.innerHTML = '';
        if (!appState.stores) appState.stores = [];

        if (appState.stores.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" class="text-center text-muted py-3">${t('msg_no_stores_defined')}</td></tr>`;
            return;
        }

        [...appState.stores].sort((a, b) => a.name.localeCompare(b.name)).forEach(store => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" 
                           value="${safeHTML(store.name)}" 
                           onchange="updateStoreName('${store.id}', this.value)" title="${t('title_tap_to_edit')}">
                </td>
                <td class="text-end">
                    <button class="btn btn-sm py-0 px-2" onclick="deleteStore('${store.id}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
    function handleAddStore(event) {
        event.preventDefault();
        const nameInput = document.getElementById('modal-new-store-name');
        if (!appState.stores) appState.stores = [];
        appState.stores.unshift({ id: 'STR-' + Date.now(), name: nameInput.value });
        saveState();
        renderStoreModalTable();
        nameInput.value = ''; 

        renderCatalogTable();
        if (typeof populateCatalogDropdowns === 'function') populateCatalogDropdowns();
        
        nameInput.value = '';
    }
    function updateStoreName(id, newName) {
        const store = appState.stores.find(s => s.id === id);
        if (store) {
            store.name = newName;
            saveState();
            renderCatalogTable(); // Refresh catalog UI to show new name
            showToast(t('msg_store_renamed'));
        }
    }
    function deleteStore(id, isConfirmed = false) {
        // 🪄 The Safety Shield (Custom Modal)
        if (!isConfirmed) {
            requestConfirm(t('confirm_delete_store'), () => deleteStore(id, true));
            return;
        }

        let affected = 0;
        if (appState.catalog) {
            appState.catalog.forEach(item => {
                if (item.storeId === id) {
                    item.storeId = '';
                    affected++;
                }
            });
        }
        appState.stores = appState.stores.filter(s => s.id !== id);
        saveState();
        renderStoreModalTable();
        renderCatalogTable();
        showToast(t('msg_store_deleted_items', { count: affected }), true);
    }
</script>
