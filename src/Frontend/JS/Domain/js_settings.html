<script>
    function renderDictionaries() {
        renderProjectsTable(); 
        renderStockTable();
        renderCatalogTable();
        renderMaterialsTable();
        renderProfilesTable();
        renderPartsTable();
        
        // 🪄 Tell the Parts view to instantly update its dropdowns
        if (typeof refreshPartsDropdowns === 'function') refreshPartsDropdowns();
    }

    function renderSettings() {
        if (!appState.settings) appState.settings = {};
        if (!appState.settings.displayUnit) appState.settings.displayUnit = 'mm';
        if (appState.settings.bladeKerf === undefined) appState.settings.bladeKerf = 3.175;
        if (appState.settings.sheetBladeKerf === undefined) appState.settings.sheetBladeKerf = 3.175; // 🪄 NEW
        if (appState.settings.cutoffThreshold === undefined) appState.settings.cutoffThreshold = 200.0;
        if (appState.settings.sheetScrapMinWidth === undefined) appState.settings.sheetScrapMinWidth = 50.0; // 🪄 NEW
        if (appState.settings.sheetScrapMinLength === undefined) appState.settings.sheetScrapMinLength = 400.0; // 🪄 NEW
        if (appState.settings.factoryEdgeTrim === undefined) appState.settings.factoryEdgeTrim = 6.35;
        if (appState.settings.sheetFactoryTrim === undefined) appState.settings.sheetFactoryTrim = 6.35; // 🪄 NEW
        if (!appState.settings.currency) appState.settings.currency = '€';
        
        document.getElementById('setting-display-unit').value = appState.settings.displayUnit;
        document.getElementById('setting-kerf').value = formatForDisplay(appState.settings.bladeKerf);
        document.getElementById('setting-sheet-kerf').value = formatForDisplay(appState.settings.sheetBladeKerf); // 🪄 NEW
        document.getElementById('setting-cutoff').value = formatForDisplay(appState.settings.cutoffThreshold);
        document.getElementById('setting-sheet-scrap-width').value = formatForDisplay(appState.settings.sheetScrapMinWidth); // 🪄 NEW
        document.getElementById('setting-sheet-scrap-length').value = formatForDisplay(appState.settings.sheetScrapMinLength); // 🪄 NEW
        document.getElementById('setting-factory-trim').value = formatForDisplay(appState.settings.factoryEdgeTrim);
        document.getElementById('setting-sheet-trim').value = formatForDisplay(appState.settings.sheetFactoryTrim); // 🪄 NEW
        document.getElementById('setting-currency').value = appState.settings.currency; // 🪄 NEW

        // Transport settings
        if (!appState.settings.optimizer) appState.settings.optimizer = {};
        if (!appState.settings.optimizer.transport) appState.settings.optimizer.transport = {};
        const transport = appState.settings.optimizer.transport;
        if (transport.boardMargin === undefined) transport.boardMargin = 20;
        if (transport.boardLmax === undefined) transport.boardLmax = 0;
        if (transport.sheetMargin === undefined) transport.sheetMargin = 10;
        if (transport.sheetLmax === undefined) transport.sheetLmax = 0;
        document.getElementById('setting-transport-board-lmax').value = formatForDisplay(transport.boardLmax);
        document.getElementById('setting-transport-board-margin').value = formatForDisplay(transport.boardMargin);
        document.getElementById('setting-transport-sheet-lmax').value = formatForDisplay(transport.sheetLmax);
        document.getElementById('setting-transport-sheet-margin').value = formatForDisplay(transport.sheetMargin);
        const transportToggle = document.getElementById('opt-transport-enable');
        const transportPanel = document.getElementById('transport-settings-panel');
        if (transportToggle) transportToggle.checked = !!transport.enabled;
        if (transportPanel) transportPanel.style.display = transport.enabled ? '' : 'none';
        const useStockInput = document.getElementById('opt-use-stock');
        if (useStockInput) useStockInput.checked = !!appState.settings.optimizer?.useStock;

        const langDropdown = document.getElementById('setting-language');
        if (langDropdown) langDropdown.value = appState.settings.language;

        updateUnitLabels();
    }
    function handleSettingsValueChange() {
        appState.settings.bladeKerf = parseToBaseUnit(document.getElementById('setting-kerf').value);
        appState.settings.sheetBladeKerf = parseToBaseUnit(document.getElementById('setting-sheet-kerf').value); // 🪄 NEW
        appState.settings.cutoffThreshold = parseToBaseUnit(document.getElementById('setting-cutoff').value);
        appState.settings.sheetScrapMinWidth = parseToBaseUnit(document.getElementById('setting-sheet-scrap-width').value); // 🪄 NEW
        appState.settings.sheetScrapMinLength = parseToBaseUnit(document.getElementById('setting-sheet-scrap-length').value); // 🪄 NEW
        appState.settings.factoryEdgeTrim = parseToBaseUnit(document.getElementById('setting-factory-trim').value);
        appState.settings.sheetFactoryTrim = parseToBaseUnit(document.getElementById('setting-sheet-trim').value); // 🪄 NEW

        if (!appState.settings.optimizer) appState.settings.optimizer = {};
        if (!appState.settings.optimizer.transport) appState.settings.optimizer.transport = {};
        appState.settings.optimizer.transport.boardLmax = parseToBaseUnit(document.getElementById('setting-transport-board-lmax').value) || 0;
        appState.settings.optimizer.transport.boardMargin = parseToBaseUnit(document.getElementById('setting-transport-board-margin').value) || 20;
        appState.settings.optimizer.transport.sheetLmax = parseToBaseUnit(document.getElementById('setting-transport-sheet-lmax').value) || 0;
        const _smRaw = document.getElementById('setting-transport-sheet-margin').value.trim();
        appState.settings.optimizer.transport.sheetMargin = _smRaw === '' ? 10 : (parseToBaseUnit(_smRaw) || 0);

        // When a saved job is active, sync the changed settings into job.settings so
        // executeRecalculate uses the new values. Don't auto-save — user must click Save Changes.
        const _activeJob = window.activeJobId && appState.jobs
            ? appState.jobs.find(j => j.id === window.activeJobId)
            : null;
        if (_activeJob) {
            if (!_activeJob.settings) _activeJob.settings = {};
            _activeJob.settings.bladeKerf          = appState.settings.bladeKerf;
            _activeJob.settings.sheetBladeKerf      = appState.settings.sheetBladeKerf;
            _activeJob.settings.cutoffThreshold     = appState.settings.cutoffThreshold;
            _activeJob.settings.sheetScrapMinWidth  = appState.settings.sheetScrapMinWidth;
            _activeJob.settings.sheetScrapMinLength = appState.settings.sheetScrapMinLength;
            _activeJob.settings.factoryEdgeTrim     = appState.settings.factoryEdgeTrim;
            _activeJob.settings.sheetFactoryTrim    = appState.settings.sheetFactoryTrim;
            if (appState.settings.optimizer) {
                if (!_activeJob.settings.optimizer) _activeJob.settings.optimizer = {};
                _activeJob.settings.optimizer.transport = Object.assign({}, appState.settings.optimizer.transport);
            }
            if (typeof setUnsavedChangesState === 'function') setUnsavedChangesState('dirty_input');
        } else {
            saveState();
            renderSettings();
            showToast(t('msg_settings_saved'));
            if (typeof notifyConfigChanged === 'function') notifyConfigChanged();
        }
    }
    function updateUnitLabels() {
        const isMetric = appState.settings.displayUnit === 'mm';
        const currencyText = appState.settings.currency || '$';
        const unitText = isMetric ? 'mm' : 'in';
        const densityText = isMetric ? 'kg/m³' : 'lb/ft³';
        const weightText = isMetric ? 'kg' : 'lbs';
        const linearText = isMetric ? 'm' : 'ft';
        const areaText = isMetric ? 'm²' : 'sqft';
        const volText = isMetric ? 'm³' : 'BF';

        // Update basic global labels
        document.querySelectorAll('.display-unit-label').forEach(label => label.innerText = unitText);
        document.querySelectorAll('.density-unit-label').forEach(label => label.innerText = densityText);
        document.querySelectorAll('.density-weight-label').forEach(label => label.innerText = weightText);
        document.querySelectorAll('.currency-label').forEach(label => label.innerText = currencyText);

        // Update the Unit Dropdown in the Input Section
        const catPriceUnit = document.getElementById('cat-price-unit');
        if (catPriceUnit && catPriceUnit.options.length >= 4) {
            catPriceUnit.options[1].text = `/ ${linearText}`;
            catPriceUnit.options[2].text = `/ ${areaText}`;   
            catPriceUnit.options[3].text = `/ ${volText}`;    
        }
        
        // 🪄 Dynamically fetch the translated word for "Cost"
        const costLabel = typeof t === 'function' ? (t('opt_cost') || 'Cost') : 'Cost';

        // Update the Base Table Header
        const tableViewSelect = document.getElementById('table-price-view');
        if (tableViewSelect && tableViewSelect.options && tableViewSelect.options.length > 3) {
            tableViewSelect.options[1].text = `${costLabel}/${linearText}`;
            tableViewSelect.options[2].text = `${costLabel}/${areaText}`;
            tableViewSelect.options[3].text = `${costLabel}/${volText}`;
        }

        // Update the Modal Table Header
        const modalViewSelect = document.getElementById('modal-catalog-view-unit');
        if (modalViewSelect && modalViewSelect.options && modalViewSelect.options.length > 3) {
            modalViewSelect.options[1].text = `${costLabel}/${linearText}`;
            modalViewSelect.options[2].text = `${costLabel}/${areaText}`;
            modalViewSelect.options[3].text = `${costLabel}/${volText}`;
        }

        if (typeof checkUnitMismatch === 'function') checkUnitMismatch();
    }
</script>
