<script>
    // ==========================================
    // GLOBAL APP STATE
    // ==========================================

    const initialAppState = {
    // ==========================================
    // TIER 1: THE DICTIONARIES (Design Building Blocks)
    // ==========================================
    
    // 1. Materials (Wood species, treatments)
    materials: [
        // { id: 'M-001', name: 'Pine (Untreated)', density: 0.45, category: 'lumber' },
        // { id: 'M-002', name: 'Oak (White)', density: 0.77, category: 'lumber' },
        // { id: 'M-003', name: 'Birch Plywood', density: 0.68, category: 'sheet' }
    ],
    // 2. Profiles (Cross-sections and sheet thicknesses. NO LENGTHS HERE)
    profiles: [
        // { id: 'PR-001', name: '2x4 Nominal', thickness: 38.0, width: 89.0, type: 'lumber' },
        // { id: 'PR-002', name: '3/4" Sheet', thickness: 19.05, width: 1220.0, type: 'sheet' }
    ],
    // ==========================================
    // TIER 2: SOURCING & INVENTORY (Physical Reality)
    // ==========================================

    // 3. Catalog (What stores sell, lengths, and prices)
    catalog: [
        // { id: 'CAT-001', store: 'Local Big Box', materialId: 'M-001', profileId: 'PR-001', length: 2438.4, price: 4.50 },
        // { id: 'CAT-002', store: 'Local Big Box', materialId: 'M-001', profileId: 'PR-001', length: 3048.0, price: 6.00 }
    ],
    // 4. Stock (What is actually sitting in your shop right now)
    stock: [
        // { id: 'STK-001', materialId: 'M-002', profileId: 'PR-001', length: 950.0, qty: 2, isCutoff: true }
    ],
    // ==========================================
    // TIER 3: THE WORK (Projects & Cutlists)
    // ==========================================

    // 0. Projects
    projects: [
        // { id: 'PROJ-001', name: 'Workbench', status: 'Design' }
    ],
    // 0.5 Groups (Sub-assemblies attached to Projects)
    groups: [
        // { id: 'GRP-001', projectId: 'PROJ-001', name: 'South Wall' }
    ],
    // 5. Parts (The Master Cutlist - every piece of wood to be cut)
    parts: [
        // { id: 'PART-001', projectId: 'PROJ-001', name: 'Front Left Leg', materialId: 'M-001', profileId: 'PR-001', length: 850.0, qty: 1 }
    ],
    // 6. Jobs (Mobile Execution Sandboxes)
    jobs: [],
    // Settings
    settings: {
        baseUnit: 'mm',           // The immutable backend unit
        displayUnit: 'frac_in',   // The UI mask: 'mm', 'dec_in', or 'frac_in'
        bladeKerf: 3.175,         // mm (Default to 1/8" standard blade)
        cutoffThreshold: 200.0,    // mm. Anything smaller goes in the trash.
        factoryEdgeTrim: 6.35,    // mm. Amount to chop off a new board to square it up.
        currency: '$'
    }
    };
    let appState = {}; 

    // ==========================================
    // STATE MANAGEMENT ENGINE (Local Storage)
    // ==========================================

    /** BOOT LOADER: Negotiates between Cloud Data and Local Storage */
    function loadState() {
        // 1. Show the loader (it should be visible by default, but just in case)
        const loader = document.getElementById('boot-loader');
        if (loader) loader.classList.remove('d-none');

        // 2. Fetch the offline backup (just in case the cloud fails or is older)
        const localSaved = localStorage.getItem('lumberLogicState');
        let localData = null;
        if (localSaved) {
            try { localData = JSON.parse(localSaved); } catch(e) { console.warn("Local data corrupted."); }
        }

        // 3. Call Google Scripts (The Cloud)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(responseStr) {
                    handleCloudDataResponse(responseStr, localData);
                })
                .withFailureHandler(function(error) {
                    console.error("Failed to fetch from cloud. Falling back to local.", error);
                    finalizeBoot(localData ? localData : initialAppState);
                })
                .getAppStateFromSheet();
        } else {
            // Failsafe for Local Desktop Testing (outside of Google's environment)
            console.warn("Google Script context not found. Booting from local memory.");
            finalizeBoot(localData ? localData : initialAppState);
        }
    }

    /** Records a successful direct save (reset / restore) so the next boot sees local == cloud. */
    function _recordSyncSuccess(response) {
        if (response && response.status === 'success') {
            _writeSyncMarker('lumberLogicLastSynced', response.cloud_timestamp);
            _writeSyncMarker('lumberLogicUnsynced', '0');
        }
    }
    function _readSyncMarker(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function _writeSyncMarker(key, value) {
        try {
            if (value === null) localStorage.removeItem(key);
            else localStorage.setItem(key, String(value));
        } catch (e) { /* storage unavailable — markers are best-effort */ }
    }

    /**
     * Pure: decides which copy to boot from.
     *  - 'cloud'    : nothing unsynced locally (or no local copy)
     *  - 'local'    : local has unsynced edits and the Sheet hasn't changed since our last
     *                 successful sync (or the Sheet is empty) — safe to keep local and upload
     *  - 'conflict' : local has unsynced edits AND the Sheet was written by someone else since
     * Legacy installs without sync markers fall back to the old "local >10 s newer" rule.
     */
    function decideBootSource({ hasLocal, localTime, cloudTime, unsyncedFlag, lastSyncedCloudTime }) {
        if (!hasLocal) return 'cloud';
        if (unsyncedFlag === null || unsyncedFlag === undefined) {
            // No marker yet (first run of this version): previous behaviour
            if (lastSyncedCloudTime === null || lastSyncedCloudTime === undefined) {
                return localTime > cloudTime + 10000 ? 'conflict' : 'cloud';
            }
            return 'cloud';
        }
        if (unsyncedFlag !== '1') return 'cloud';
        if (!cloudTime) return 'local';
        if (lastSyncedCloudTime !== null && lastSyncedCloudTime !== undefined &&
            String(cloudTime) === String(lastSyncedCloudTime)) return 'local';
        return 'conflict';
    }

    /** The Handshake: Compares timestamps and resolves conflicts */
    function handleCloudDataResponse(responseStr, localData) {
        try {
            // If we just did a factory reset, always trust local — the cloud write
            // may not have landed yet but localStorage is already clean.
            if (sessionStorage.getItem('resetInProgress')) {
                sessionStorage.removeItem('resetInProgress');
                finalizeBoot(localData || initialAppState);
                return;
            }

            const response = JSON.parse(responseStr);
            if (response.status === 'error') throw new Error(response.message);

            const cloudData = response.appState;
            const cloudTime = response.cloud_timestamp || 0;
            const localTime = localData ? (localData.local_timestamp || 0) : 0;
            const decision = decideBootSource({
                hasLocal: !!localData,
                localTime,
                cloudTime,
                unsyncedFlag: _readSyncMarker('lumberLogicUnsynced'),
                lastSyncedCloudTime: _readSyncMarker('lumberLogicLastSynced')
            });

            if (decision === 'conflict') {
                showConflictModal(localData, cloudData, localTime, cloudTime);
            } else if (decision === 'local') {
                // Local edits never reached the Sheet and nobody else wrote since: keep them and upload.
                finalizeBoot(localData);
                triggerCloudSync();
            } else {
                // Booting from the Sheet: local now mirrors it
                _writeSyncMarker('lumberLogicLastSynced', cloudTime);
                _writeSyncMarker('lumberLogicUnsynced', '0');
                finalizeBoot(cloudData);
            }
        } catch(e) {
            console.error("Cloud data parsing error:", e);
            alert(t('err_cloud_parse'));
            finalizeBoot(localData ? localData : initialAppState);
        }
    }
    let _conflictLocalData = null;
    let _conflictCloudData = null;

    let _conflictCloudTime = 0;
    function showConflictModal(localData, cloudData, localTime, cloudTime) {
        _conflictLocalData = localData;
        _conflictCloudData = cloudData;
        _conflictCloudTime = cloudTime;

        const loader = document.getElementById('boot-loader');
        if (loader) loader.classList.add('d-none');

        const diffSec = Math.round((localTime - cloudTime) / 1000);
        const diffText = diffSec < 60 ? `${diffSec}s` : `${Math.round(diffSec / 60)}m`;

        document.getElementById('conflict-modal-title').innerText = `☁️ ${t('hdr_data_conflict')}`;
        document.getElementById('conflict-main-msg').innerText    = t('msg_conflict_main');
        document.getElementById('conflict-diff-msg').innerText    = `(${diffText} newer)`;
        document.getElementById('conflict-sub-msg').innerText     = t('msg_conflict_sub');
        document.getElementById('btn-conflict-cloud').innerText   = `☁️ ${t('btn_use_cloud')}`;
        document.getElementById('btn-conflict-local').innerText   = `💾 ${t('btn_use_local')}`;

        new bootstrap.Modal(document.getElementById('modal-data-conflict')).show();
    }

    function resolveConflict(useLocal) {
        const modalEl = document.getElementById('modal-data-conflict');
        const instance = bootstrap.Modal.getInstance(modalEl);
        if (instance) instance.hide();
        if (!useLocal) {
            // User chose the Sheet's copy: discard the local edits for good
            _writeSyncMarker('lumberLogicLastSynced', _conflictCloudTime);
            _writeSyncMarker('lumberLogicUnsynced', '0');
        }
        finalizeBoot(useLocal ? _conflictLocalData : _conflictCloudData);
        _conflictLocalData = null;
        _conflictCloudData = null;
        if (useLocal) triggerCloudSync();
    }

    /** Executes the final render sequence and hides the loading screen */
    function finalizeBoot(dataToLoad) {
        // 1. Assign the Master State safely
        appState = dataToLoad || {};
        
        // 🪄 TIER 1 SANITIZER: Ensure all master tables exist
        const TABS = ['projects', 'groups', 'parts', 'stock', 'catalog', 'materials', 'profiles', 'stores', 'jobs'];
        TABS.forEach(tab => {
            if (!appState[tab] || !Array.isArray(appState[tab])) appState[tab] = [];
        });

        // 🪄 UI STATE SANITIZER: Ensure ephemeral UI state bucket exists
        if (!appState.ui) appState.ui = {};

        // 🪄 TIER 2 SANITIZER: Deep JSON parsing & corruption repair
        if (!appState.settings) appState.settings = {};
        for (let key in appState.settings) {
            let val = appState.settings[key];
            if (typeof val === 'string') {
                if (val === 'TRUE') appState.settings[key] = true;
                else if (val === 'FALSE') appState.settings[key] = false;
                else if (val.startsWith('[')) {
                    try { appState.settings[key] = JSON.parse(val); } catch(e) { appState.settings[key] = []; }
                }
                else if (val.startsWith('{')) {
                    try { appState.settings[key] = JSON.parse(val); } catch(e) { appState.settings[key] = {}; }
                }
            }
        }

        // 2. The Auto-Heal Engine
        autoHealMissingIDs();

        // Freeze the price-unit system of legacy catalog prices (see js_prices.html)
        if (typeof stampAllMissingPriceSystems === 'function') stampAllMissingPriceSystems();

        // 3. Run theme and renders
        if (typeof applyTheme === 'function') applyTheme();
        if (typeof renderSettings === 'function') renderSettings();
        if (typeof renderDictionaries === 'function') renderDictionaries();
        if (typeof renderPartsView === 'function') renderPartsView();
        
        // 4. Safely apply translations only after data is fully loaded
        if (typeof applyTranslations === 'function') applyTranslations(); 

        // 🪄 5. PROGRAMMED MOBILE ROUTER
        // Set the initial view based on device size strictly before the loader vanishes
        const isMobile = window.innerWidth < 768;
        const initialViewId = isMobile ? 'view-cutlist' : 'view-projects';
        
        if (typeof navigateTo === 'function') {
            navigateTo(initialViewId);
        }

        // 6. Hide loader
        const loader = document.getElementById('boot-loader');
        if (loader) loader.classList.add('d-none');

        // 7. Welcome tour (desktop only) or checklist
        if (!isMobile) {
            if (!appState.settings.tourComplete && typeof showWelcomeTour === 'function') {
                showWelcomeTour(false);
            } else if (typeof renderChecklist === 'function') {
                renderChecklist();
            }
        }

        console.log(`🪵 SolidCutlist successfully booted into ${isMobile ? 'MOBILE' : 'DESKTOP'} mode.`);
        updateSyncUI('success');
    }
    function autoHealMissingIDs() {
        // 🪄 FIX: Added 'stores' here as well
        const TABS = ['projects', 'groups', 'parts', 'stock', 'catalog', 'materials', 'profiles', 'stores', 'jobs'];
        let healedCount = 0;
        TABS.forEach(tab => {
            appState[tab].forEach((item, index) => {
                if (!item.id) {
                    let prefix = 'ID';
                    if (tab === 'projects') prefix = 'PROJ';
                    if (tab === 'parts') prefix = 'PART';
                    if (tab === 'materials') prefix = 'M';
                    if (tab === 'profiles') prefix = 'PR';
                    if (tab === 'catalog') prefix = 'CAT';
                    if (tab === 'stock') prefix = 'STK';
                    if (tab === 'stores') prefix = 'STR';
                    if (tab === 'jobs') prefix = 'JOB';
                    item.id = prefix + '-' + Date.now() + '-' + index;
                    healedCount++;
                }
            });
        });
        if (healedCount > 0) saveState(); 
    }

    /** Full factory reset: wipes all user data, clears thumbnails, reloads. */
    function resetApp() {
        // 1. Close the confirm modal cleanly
        const modal = bootstrap.Modal.getInstance(document.getElementById('resetConfirmModal'));
        if (modal) modal.hide();

        // 2. Build a clean state with hardcoded defaults (preserve saved jobs and printer config)
        const _savedJobs             = appState.jobs     || [];
        const _savedLabelTemplates   = appState.settings?.labelTemplates    || [];
        const _savedLabelConfig      = appState.settings?.currentLabelConfig || null;
        const _savedLanguage         = appState.settings?.language || 'en';
        const _savedTheme            = appState.settings?.theme || 'light';
        appState = {
            projects: [], groups: [], parts: [],
            stock: [], catalog: [], materials: [],
            profiles: [], stores: [], jobs: _savedJobs,
            ui: {},
            settings: {
                baseUnit:           'mm',
                displayUnit:        'frac_in',
                bladeKerf:          3.175,
                cutoffThreshold:    200.0,
                factoryEdgeTrim:    6.35,
                theme:              _savedTheme,
                language:           _savedLanguage,
                currency:             '$',
                tourComplete:         false,
                checklistDismissed:   false,
                isProjectCardView:    false,
                compactStockView:     false,
                compactCatalogView:   false,
                labelTemplates:       _savedLabelTemplates,
                ...(_savedLabelConfig && { currentLabelConfig: _savedLabelConfig })
            }
        };

        // 3. Purge optimizer runtime state (window globals, localStorage job keys, cutlist DOM)
        if (typeof clearOptimizerState  === 'function') clearOptimizerState();
        if (typeof resetConfigurator    === 'function') resetConfigurator();

        // 4. Clear all input section forms
        document.querySelectorAll('[id^="input-section-"] form').forEach(f => f.reset());

        // Zero parts footer immediately so stale values don't show during reboot
        const _tfootQty    = document.getElementById('tfoot-parts-qty');
        const _tfootMetric = document.getElementById('tfoot-parts-metric');
        if (_tfootQty)    _tfootQty.innerText    = '0';
        if (_tfootMetric) _tfootMetric.innerText = '0';

        // 5. Save to localStorage immediately (bypass the debounce)
        appState.local_timestamp = Date.now();
        writeLocalBackup();
        if (syncTimeout) { clearTimeout(syncTimeout); syncTimeout = null; }

        // 5. SessionStorage flag: tells handleCloudDataResponse to skip the
        //    confirm dialog and use local data if the cloud write hasn't landed yet.
        sessionStorage.setItem('resetInProgress', '1');

        _showPackSpinner();

        // Navigation-based reloads blank the page in GAS callbacks.
        // Instead, re-run the boot sequence directly within the same page.
        const _reboot = () => {
            _hidePackSpinner();
            const loader = document.getElementById('boot-loader');
            if (loader) loader.classList.remove('d-none');
            loadState();
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            // Fire both GAS calls in parallel; reboot when both are done.
            let syncDone = false, thumbsDone = false;
            const tryReboot = () => { if (syncDone && thumbsDone) _reboot(); };

            google.script.run
                .withSuccessHandler((r) => { _recordSyncSuccess(r); syncDone = true; tryReboot(); })
                .withFailureHandler(_reboot)
                .saveAppStateToSheet(JSON.stringify({ appState, timestamp: appState.local_timestamp }));

            google.script.run
                .withSuccessHandler(() => { thumbsDone = true; tryReboot(); })
                .withFailureHandler(() => { thumbsDone = true; tryReboot(); })
                .clearAllThumbnails();
        } else {
            _reboot();
        }
    }

    // ==========================================
    // FULL APP BACKUP (EXPORT / RESTORE EVERYTHING)
    // ==========================================
    // Covers exactly the same scope as the normal cloud sync (saveAppStateToSheet /
    // getAppStateFromSheet): projects, groups, parts, stock, catalog, materials,
    // profiles, stores, jobs, settings -- plus live thumbnails. It never touches
    // Archive, starter-pack (pck_*), or Metadata content, because none of those are
    // ever read into appState/window to begin with -- there's nothing to exclude,
    // this feature simply never looks at them.
    const FULL_BACKUP_TABS = ['projects', 'groups', 'parts', 'stock', 'catalog', 'materials', 'profiles', 'stores', 'jobs'];

    /** The canonical current-shape defaults, mirroring resetApp()'s hardcoded object.
     *  Used as the merge base so an older/incomplete backup still produces a
     *  structurally complete appState after restore. */
    function _getDefaultAppStateSkeleton() {
        return {
            projects: [], groups: [], parts: [],
            stock: [], catalog: [], materials: [],
            profiles: [], stores: [], jobs: [],
            ui: {},
            settings: {
                baseUnit:           'mm',
                displayUnit:        'frac_in',
                bladeKerf:          3.175,
                cutoffThreshold:    200.0,
                factoryEdgeTrim:    6.35,
                theme:              'light',
                language:           'en',
                currency:             '$',
                tourComplete:         false,
                checklistDismissed:   false,
                isProjectCardView:    false,
                compactStockView:     false,
                compactCatalogView:   false,
                labelTemplates:       []
            }
        };
    }

    /** Pure: builds the full-backup envelope from a live appState + thumbnail map. */
    function _buildFullBackupPayload(sourceAppState, thumbnails, appVersionLabel) {
        const snapshot = {};
        FULL_BACKUP_TABS.forEach(tab => { snapshot[tab] = sourceAppState[tab] || []; });
        snapshot.settings = sourceAppState.settings || {};
        return {
            format: 'solidcutlist-full-backup',
            schemaVersion: 1,
            appVersion: appVersionLabel || '',
            exportedAt: new Date().toISOString(),
            appState: snapshot,
            images: thumbnails || {}
        };
    }

    /** Pure: structural validation only -- run before anything is mutated, so an
     *  invalid file is caught while the app is still untouched. */
    function _validateFullBackupData(parsed) {
        if (!parsed || typeof parsed !== 'object') return { valid: false, error: 'not_object' };
        if (parsed.format !== 'solidcutlist-full-backup') return { valid: false, error: 'bad_format' };
        if (typeof parsed.schemaVersion !== 'number' || parsed.schemaVersion < 1) return { valid: false, error: 'bad_schema_version' };
        if (!parsed.appState || typeof parsed.appState !== 'object') return { valid: false, error: 'bad_app_state' };
        return { valid: true };
    }

    /** Pure: scaffold for future schema migrations. schemaVersion 1 is the current
     *  shape and needs no transform yet. */
    function _migrateFullBackupData(parsed) {
        let data = parsed;
        // if (data.schemaVersion < 2) { data = migrateV1toV2(data); }
        return data;
    }

    /** Pure: overlays the backup's appState onto a complete defaults skeleton, so a
     *  backup missing a tab/setting added since it was taken still produces a
     *  structurally complete appState instead of crashing on undefined. A value the
     *  backup does provide always wins over the default. */
    function _mergeFullBackupOntoDefaults(backupAppState, defaults) {
        const base = defaults || _getDefaultAppStateSkeleton();
        const src = backupAppState || {};
        const merged = {};
        FULL_BACKUP_TABS.forEach(tab => {
            merged[tab] = Array.isArray(src[tab]) ? src[tab] : (base[tab] || []);
        });
        merged.ui = (src.ui && typeof src.ui === 'object') ? src.ui : (base.ui || {});
        merged.settings = Object.assign({}, base.settings, src.settings || {});
        return merged;
    }

    /** Reads the build label shown in the settings-modal footer, for the export envelope. */
    function _getAppVersionLabel() {
        const el = document.getElementById('app-build-label');
        return el ? el.innerText.trim() : '';
    }

    /** Downloads a full-app backup JSON. */
    function exportFullBackup() {
        const finish = (thumbnails) => {
            const payload = _buildFullBackupPayload(appState, thumbnails, _getAppVersionLabel());
            const jsonStr = JSON.stringify(payload, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = localISODate();
            a.href = url;
            a.download = `SolidCutlist-FullBackup-${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(t('msg_full_backup_exported'));
        };

        // Fetch a fresh, complete thumbnail map rather than trusting window.projectImages,
        // which can still be empty during the ~2s post-boot thumbnail-loading race.
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((responseStr) => {
                    try {
                        const response = JSON.parse(responseStr);
                        finish(response.status === 'success' ? response.data : (window.projectImages || {}));
                    } catch (e) {
                        finish(window.projectImages || {});
                    }
                })
                .withFailureHandler(() => finish(window.projectImages || {}))
                .getThumbnails();
        } else {
            finish(window.projectImages || {});
        }
    }

    let _pendingFullBackupData = null;

    function triggerImportFullBackupFilePicker() {
        document.getElementById('hidden-full-backup-upload').click();
    }

    function handleFullBackupFileSelected(event) {
        const file = event.target.files && event.target.files[0];
        event.target.value = ''; // allow re-selecting the same file next time
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            let parsed;
            try {
                parsed = JSON.parse(e.target.result);
            } catch (err) {
                showToast(t('msg_full_backup_invalid_file'), true);
                return;
            }

            const validation = _validateFullBackupData(parsed);
            if (!validation.valid) {
                showToast(t('msg_full_backup_invalid_file'), true);
                return;
            }

            // Nothing has been mutated yet -- only now, with a structurally valid
            // file in hand, do we stage it and ask for confirmation.
            _pendingFullBackupData = parsed;

            const projectCount = Array.isArray(parsed.appState.projects) ? parsed.appState.projects.length : 0;
            const exportedDate = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleDateString() : '?';
            const summaryEl = document.getElementById('restore-backup-summary');
            if (summaryEl) {
                summaryEl.innerText = t('msg_restore_backup_summary', { count: projectCount, date: exportedDate });
            }

            const modalEl = document.getElementById('restoreBackupConfirmModal');
            if (modalEl) new bootstrap.Modal(modalEl).show();
        };
        reader.onerror = () => {
            showToast(t('msg_full_backup_read_error'), true);
        };
        reader.readAsText(file);
    }

    function cancelFullBackupRestore() {
        _pendingFullBackupData = null;
    }

    /** Full destructive restore: replaces the live app with the staged backup file's
     *  contents, then persists and reboots exactly like resetApp() does. */
    function executeFullBackupRestore() {
        if (!_pendingFullBackupData) return;
        const parsed = _pendingFullBackupData;
        _pendingFullBackupData = null;

        const modal = bootstrap.Modal.getInstance(document.getElementById('restoreBackupConfirmModal'));
        if (modal) modal.hide();

        const migrated = _migrateFullBackupData(parsed);
        const mergedAppState = _mergeFullBackupOntoDefaults(migrated.appState, _getDefaultAppStateSkeleton());
        const images = (migrated.images && typeof migrated.images === 'object') ? migrated.images : {};

        appState = mergedAppState;
        window.projectImages = images;

        // Purge optimizer runtime state (window globals, localStorage job keys, cutlist DOM)
        if (typeof clearOptimizerState  === 'function') clearOptimizerState();
        if (typeof resetConfigurator    === 'function') resetConfigurator();
        document.querySelectorAll('[id^="input-section-"] form').forEach(f => f.reset());

        // Persist locally immediately, bypassing the debounce -- same pattern as resetApp()
        appState.local_timestamp = Date.now();
        writeLocalBackup();
        if (syncTimeout) { clearTimeout(syncTimeout); syncTimeout = null; }
        sessionStorage.setItem('resetInProgress', '1');

        _showPackSpinner();

        const _reboot = () => {
            _hidePackSpinner();
            const loader = document.getElementById('boot-loader');
            if (loader) loader.classList.remove('d-none');
            loadState();
            showToast(t('msg_full_backup_restored'));
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            let syncDone = false, thumbsDone = false;
            const tryReboot = () => { if (syncDone && thumbsDone) _reboot(); };

            google.script.run
                .withSuccessHandler((r) => { _recordSyncSuccess(r); syncDone = true; tryReboot(); })
                .withFailureHandler(() => { syncDone = true; tryReboot(); })
                .saveAppStateToSheet(JSON.stringify({ appState, timestamp: appState.local_timestamp }));

            google.script.run
                .withSuccessHandler(() => {
                    const imageIds = Object.keys(images);
                    if (imageIds.length === 0) { thumbsDone = true; tryReboot(); return; }
                    let remaining = imageIds.length;
                    imageIds.forEach(projectId => {
                        google.script.run
                            .withSuccessHandler(() => { remaining--; if (remaining === 0) { thumbsDone = true; tryReboot(); } })
                            .withFailureHandler(() => { remaining--; if (remaining === 0) { thumbsDone = true; tryReboot(); } })
                            .saveThumbnail(JSON.stringify({ projectId, base64String: images[projectId] }));
                    });
                })
                .withFailureHandler(() => { thumbsDone = true; tryReboot(); })
                .clearAllThumbnails();
        } else {
            _reboot();
        }
    }

    // ==========================================
    // CLOUD SYNC ENGINE (Debounced 1-Way Sync)
    // ==========================================
    let syncTimeout = null;
    let lastCloudSyncTime = 0; // Tracks the last successful Google Sheet write

    function updateSyncUI(status) {
        const icon = document.getElementById('sync-icon');
        const text = document.getElementById('sync-text');
        if (!icon || !text) return;

        const spinner = '<span class="spinner-border spinner-border-sm text-warning" role="status" style="width: 0.8rem; height: 0.8rem; border-width: 0.15em;"></span>';
        if (status === 'local') {
            icon.innerHTML = '<span style="color: #9ca3af;">✓</span>';
            text.innerText = t('msg_saved_locally');
        }
        else if (status === 'syncing') {
            icon.innerHTML = spinner;
            text.innerText = t('msg_saving');
        }
        else if (status === 'success') {
            icon.innerHTML = '<span style="color: #22c55e; font-weight: bold;">✓</span>';
            text.innerText = t('msg_saved');
        }
        else if (status === 'error') {
            icon.innerHTML = '⚠️';
            text.innerText = t('msg_sync_failed');
        }
    }
    // Keys that are rebuilt at runtime and never need to be stored or uploaded
    const TRANSIENT_STATE_KEYS = ['latestResults', 'stagingParts'];

    function _stripTransient(state) {
        const copy = Object.assign({}, state);
        TRANSIENT_STATE_KEYS.forEach(k => delete copy[k]);
        return copy;
    }

    let _syncInFlight = false;
    let _syncQueued = false;
    let _storageWarningShown = false;

    function triggerCloudSync() {
        // One save at a time: a second request waits and re-sends the LATEST state, so an
        // older payload can never land after (and overwrite) a newer one.
        if (_syncInFlight) { _syncQueued = true; return; }
        if (syncTimeout) { clearTimeout(syncTimeout); syncTimeout = null; }

        updateSyncUI('syncing');

        const currentTimestamp = Date.now();
        const stateVersionSent = appState.local_timestamp || 0;
        const payload = {
            appState: _stripTransient(appState),
            timestamp: currentTimestamp
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            _syncInFlight = true;
            const done = () => {
                _syncInFlight = false;
                if (_syncQueued) { _syncQueued = false; triggerCloudSync(); }
            };
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response && response.status === 'success') {
                        lastCloudSyncTime = response.cloud_timestamp;
                        _writeSyncMarker('lumberLogicLastSynced', response.cloud_timestamp);
                        // Only clear "unsynced" if nothing changed while this save was in flight
                        if ((appState.local_timestamp || 0) <= stateVersionSent && !_syncQueued) {
                            _writeSyncMarker('lumberLogicUnsynced', '0');
                        }
                        updateSyncUI('success');
                    } else {
                        console.error('Cloud Sync Error:', response && response.message);
                        updateSyncUI('error');
                    }
                    done();
                })
                .withFailureHandler(function(error) {
                    console.error('Cloud Sync Network Failure:', error);
                    updateSyncUI('error');
                    done();
                })
                .saveAppStateToSheet(JSON.stringify(payload));
        } else {
            console.warn('Google Script context not found. Cloud sync skipped (Local Dev Mode).');
            updateSyncUI('error');
        }
    }

    /**
     * Writes the local backup. Never throws: if storage is full it retries without
     * transient data and, failing that, warns the user once — the cloud save still runs.
     */
    function writeLocalBackup() {
        try {
            localStorage.setItem('lumberLogicState', JSON.stringify(_stripTransient(appState)));
            return true;
        } catch (e) {
            console.error('Local backup failed:', e);
            if (!_storageWarningShown && typeof showToast === 'function') {
                _storageWarningShown = true;
                showToast(t('msg_local_backup_failed'), 'warning');
            }
            return false;
        }
    }

    function saveState() {
        // Any catalog item added without a price system (imports, restores) gets the current one
        if (typeof stampAllMissingPriceSystems === 'function') stampAllMissingPriceSystems();
        // 1. Recalculate totals (from our Project Dashboard update)
        if (typeof recalculateAllProjectTotals === 'function') recalculateAllProjectTotals();

        // Remove starter pack CTAs the moment any data exists
        if (typeof _clearStarterPackCTAs === 'function') _clearStarterPackCTAs();

        // Update getting-started checklist immediately on every save
        if (typeof renderChecklist === 'function') renderChecklist();

        // 2. Stamp the change and mark it as not yet in the Sheet
        appState.local_timestamp = Date.now();
        _writeSyncMarker('lumberLogicUnsynced', '1');

        // 3. Save to browser storage instantly (never throws)
        writeLocalBackup();

        // 4. Update UI to show local save
        updateSyncUI('local');

        // 5. Debounce the cloud save (3 seconds of silence)
        if (syncTimeout) clearTimeout(syncTimeout);
        syncTimeout = setTimeout(() => {
            syncTimeout = null;
            triggerCloudSync();
        }, 3000);
    }

    // Leaving the page with a save still waiting in the debounce: send it now.
    if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') window.addEventListener('pagehide', () => {
        if (syncTimeout) { clearTimeout(syncTimeout); syncTimeout = null; triggerCloudSync(); }
    });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden' && syncTimeout) {
            clearTimeout(syncTimeout); syncTimeout = null; triggerCloudSync();
        }
    });

    // ==========================================
    // APP IGNITION SWITCH
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log("Ignition switch fired! Triggering loadState()...");
        if (typeof loadState === 'function') {
            loadState();
        } else {
            console.error("FATAL: loadState() function is missing!");
        }
    });

</script>
