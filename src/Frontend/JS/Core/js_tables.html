<script>
    // ==========================================
    // SORTING ENGINE
    // ==========================================

    // Tracks current sort directions (Ascending/Descending)
    const sortTracker = {};
    function handleSort(arrayName, key, type) {
        // Toggle sort direction
        const sortId = arrayName + '_' + key;
        sortTracker[sortId] = !sortTracker[sortId]; 
        const dir = sortTracker[sortId] ? 1 : -1;

        // 🪄 1. THE UNIVERSAL LIVE RAM INTERCEPTOR
        let targetArray = appState[arrayName];
        if (arrayName === 'sandbox_parts') {
            targetArray = window.currentSandboxParts;
            if (!targetArray) {
                console.warn("Sort Failed: No sandbox parts found in memory.");
                return;
            }
        }

        if (!targetArray) return;

        targetArray.sort((a, b) => {
            let valA = a[key];
            let valB = b[key];

            // 🪄 2. THE VALIDATION BYPASS 
            const isPartList = (arrayName === 'parts' || arrayName === 'sandbox_parts');

            // 🪄 Smart Lookups for Relational IDs and Dynamic Math
            if (isPartList || arrayName === 'stock' || arrayName === 'catalog' || arrayName === 'profiles' || arrayName === 'stagingParts' || arrayName === 'commitStock') {
                if (key === 'storeId') {
                    valA = appState.stores?.find(s => s.id === a.storeId)?.name || '';
                    valB = appState.stores?.find(s => s.id === b.storeId)?.name || '';
                } else if (key === 'calculatedPrice' && arrayName === 'catalog') {
                    const viewUnit = document.getElementById('table-price-view')?.value || 'weight';
                    valA = parseFloat(getNormalizedPriceDisplay(a, viewUnit)) || 0;
                    valB = parseFloat(getNormalizedPriceDisplay(b, viewUnit)) || 0;
                } else if (key === 'projectId' && isPartList) {         // 🪄 FIXED VALIDATION
                    valA = appState.projects?.find(p => p.id === a.projectId)?.name || '';
                    valB = appState.projects?.find(p => p.id === b.projectId)?.name || '';
                } else if (key === 'groupId' && isPartList) {           // 🪄 ADDED GROUP VALIDATION
                    valA = appState.groups?.find(g => g.id === a.groupId)?.name || '';
                    valB = appState.groups?.find(g => g.id === b.groupId)?.name || '';
                } else if (key === 'profileId') {
                    const profA = appState.profiles?.find(p => p.id === a.profileId);
                    const profB = appState.profiles?.find(p => p.id === b.profileId);
                    const catA = String(a.category || a.categoryId || profA?.type || '').toLowerCase();
                    const catB = String(b.category || b.categoryId || profB?.type || '').toLowerCase();
                    if (catA !== catB) return catA.localeCompare(catB) * dir;
                    valA = profA?.name || '';
                    valB = profB?.name || '';
                } else if (key === 'materialId') {
                    valA = appState.materials?.find(m => m.id === a.materialId)?.name || '';
                    valB = appState.materials?.find(m => m.id === b.materialId)?.name || '';
                } else if (key === 'weight' && isPartList) {            // 🪄 FIXED VALIDATION
                    const getWeight = (p) => {
                        if (p.category === 'fastener') return 0;
                        const prof = appState.profiles?.find(pr => pr.id === p.profileId);
                        const mat = appState.materials?.find(m => m.id === p.materialId);
                        if (!prof || !mat) return 0;
                        const safeThick = prof.thickness || 0;
                        const trueWidth = p.category === 'lumber' ? (prof.width || 0) : p.width;
                        const volumeM3 = (p.length * trueWidth * safeThick) / 1000000000;
                        return volumeM3 * (mat.density || 0) * p.qty;
                    };
                    valA = getWeight(a);
                    valB = getWeight(b);
                } else if (key === 'name' && arrayName === 'profiles') {
                    let catA = String(a.category || a.categoryId || (a.width > 0 ? 'lumber' : 'sheet')).toLowerCase();
                    let catB = String(b.category || b.categoryId || (b.width > 0 ? 'lumber' : 'sheet')).toLowerCase();
                    if (catA !== catB) return catA.localeCompare(catB) * dir;
                    let nameA = String(a.name || '').toLowerCase();
                    let nameB = String(b.name || '').toLowerCase();
                    return nameA.localeCompare(nameB) * dir;
                } else if (key === 'dimensions') {
                    if (arrayName === 'profiles') {
                        let widthA = a.width || 0;
                        let widthB = b.width || 0;
                        if (widthA === widthB) {
                            valA = a.thickness || 0;
                            valB = b.thickness || 0;
                        } else {
                            valA = widthA;
                            valB = widthB;
                        }
                    } else {
                        let catA = String(a.category || a.categoryId || '').toLowerCase();
                        let catB = String(b.category || b.categoryId || '').toLowerCase();
                        if (catA !== catB) return catA.localeCompare(catB) * dir;

                        let lenA = a.length || 0;
                        let lenB = b.length || 0;
                        if (lenA !== lenB) return (lenA - lenB) * dir;
                        
                        let trueWidthA = a.width || 0;
                        let trueWidthB = b.width || 0;
                        if (catA === 'lumber' && appState.profiles) {
                            trueWidthA = appState.profiles.find(pr => pr.id === a.profileId)?.width || trueWidthA;
                        }
                        if (catB === 'lumber' && appState.profiles) {
                            trueWidthB = appState.profiles.find(pr => pr.id === b.profileId)?.width || trueWidthB;
                        }
                        if (trueWidthA !== trueWidthB) return (trueWidthA - trueWidthB) * dir;

                        let thickA = a.thickness || 0;
                        let thickB = b.thickness || 0;
                        if (appState.profiles) {
                            thickA = appState.profiles.find(pr => pr.id === a.profileId)?.thickness || thickA;
                            thickB = appState.profiles.find(pr => pr.id === b.profileId)?.thickness || thickB;
                        }
                        if (thickA !== thickB) return (thickA - thickB) * dir;
                        
                        return 0;
                    }
                } else if (key === 'extracted_dimensions') {
                    let catA = String(a.category || '').toLowerCase();
                    let catB = String(b.category || '').toLowerCase();
                    if (catA !== catB) return catA.localeCompare(catB) * dir;
                    let rawA = String(a.extracted_dimensions || '').toLowerCase().trim();
                    let rawB = String(b.extracted_dimensions || '').toLowerCase().trim();
                    return rawA.localeCompare(rawB, undefined, { numeric: true }) * dir;
                } else if (key === 'weight_cost' && isPartList) {       // 🪄 FIXED VALIDATION
                    let wA = a.width || 0;
                    let wB = b.width || 0;

                    let dimA = wA > 0 ? 2 : 1;
                    let dimB = wB > 0 ? 2 : 1;
                    if (dimA !== dimB) return (dimA - dimB) * dir;

                    let lenA = a.length || 0;
                    let lenB = b.length || 0;
                    if (lenA !== lenB) return (lenA - lenB) * dir;

                    if (wA !== wB) return (wA - wB) * dir;

                    let tA = a.thickness || 0;
                    let tB = b.thickness || 0;
                    if (tA !== tB) return (tA - tB) * dir;

                    return 0; 
                }
            }
            
            if (type === 'number') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
            } else {
                valA = String(valA || '').toLowerCase();
                valB = String(valB || '').toLowerCase();
            }

            if (valA < valB) return -1 * dir;
            if (valA > valB) return 1 * dir;
            return 0;
        });

        if (typeof saveState === 'function') saveState();

        if (arrayName === 'projects' && typeof renderProjectsTable === 'function') renderProjectsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'profiles' && typeof renderProfilesTable === 'function') renderProfilesTable();
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stagingParts' && typeof renderStagingTable === 'function') renderStagingTable();
        if (arrayName === 'groups' && typeof renderGroupModalTable === 'function') renderGroupModalTable();
        if (arrayName === 'stores' && typeof renderStoreModalTable === 'function') renderStoreModalTable();
        
        // 🪄 Universal Sandbox Redraw
        if (arrayName === 'sandbox_parts' && typeof renderSandboxPartlistTab === 'function') {
            renderSandboxPartlistTab(window.currentSandboxParts);
        }
    }

    // ==========================================
    // FILTER ENGINE
    // ==========================================

    let activeFilters = {};

    function openFilterModal(event, arrayName, columnKey, displayTitle) {
        event.stopPropagation();

        if (!activeFilters[arrayName]) activeFilters[arrayName] = {};

        document.getElementById('filter-array-name').value = arrayName;
        document.getElementById('filter-column-key').value = columnKey;
        
        const titleEl = document.getElementById('filterModalTitle');
        if (titleEl && typeof t === 'function') titleEl.innerText = `${t('hdr_filter')}: ${displayTitle}`;
        else if (titleEl) titleEl.innerText = `Filter: ${displayTitle}`;

        const uniqueValues = new Map(); 

        // 🪄 THE UNIVERSAL LIVE RAM INTERCEPTOR
        let targetArray = appState[arrayName];
        if (arrayName === 'sandbox_parts') {
            targetArray = window.currentSandboxParts;
        }

        if (!targetArray) return;

        targetArray.filter(row => rowPassesFiltersExcept(row, arrayName, columnKey)).forEach(row => {
            let rawValue = row[columnKey];
            let displayText = rawValue;

            if (rawValue === '' || rawValue === null || rawValue === undefined) {
                rawValue = '___EMPTY___';
                displayText = typeof t === 'function' ? t('lbl_blank') : 'Blank';
            } else {
                if (columnKey === 'projectId') displayText = appState.projects?.find(p => p.id === rawValue)?.name || 'Unknown Project';
                else if (columnKey === 'groupId') displayText = appState.groups?.find(g => g.id === rawValue)?.name || 'Unknown Group';
                else if (columnKey === 'profileId') displayText = appState.profiles?.find(p => p.id === rawValue)?.name || 'Unknown Profile';
                else if (columnKey === 'materialId') displayText = appState.materials?.find(m => m.id === rawValue)?.name || 'Unknown Material';
                else if (columnKey === 'storeId') displayText = appState.stores?.find(s => s.id === rawValue)?.name || 'Unknown Store';
            }

            uniqueValues.set(rawValue, displayText);
        });

        const sortedEntries = Array.from(uniqueValues.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1])));

        const listContainer = document.getElementById('filter-checkbox-list');
        listContainer.innerHTML = '';

        const currentActive = activeFilters[arrayName][columnKey] || [];

        sortedEntries.forEach(([rawVal, displayTxt]) => {
            const isChecked = currentActive.length === 0 || currentActive.includes(rawVal);
            
            const div = document.createElement('div');
            div.className = 'form-check mb-1';
            div.innerHTML = `
                <input class="form-check-input filter-option-cb" type="checkbox" value="${typeof safeHTML === 'function' ? safeHTML(rawVal) : rawVal}" id="flt-${typeof safeHTML === 'function' ? safeHTML(rawVal) : rawVal}" ${isChecked ? 'checked' : ''}>
                <label class="form-check-label w-100" for="flt-${typeof safeHTML === 'function' ? safeHTML(rawVal) : rawVal}" style="cursor:pointer;">
                    ${typeof safeHTML === 'function' ? safeHTML(displayTxt) : displayTxt}
                </label>
            `;
            listContainer.appendChild(div);
        });

        const filterModal = document.getElementById('universalFilterModal');
        if (filterModal && typeof bootstrap !== 'undefined') {
            const modal = new bootstrap.Modal(filterModal);
            modal.show();
        }
        // Reset toggle button to "Select All"
        const toggleBtn = document.getElementById('filter-toggle-all-btn');
        if (toggleBtn) { toggleBtn.textContent = toggleBtn.getAttribute('data-i18n-select') || 'Select All'; toggleBtn.dataset.state = 'selectAll'; }
    }

    function toggleAllFilters(checkThem) {
        document.querySelectorAll('.filter-option-cb').forEach(cb => cb.checked = checkThem);
    }

    function toggleAllFiltersToggle() {
        const btn = document.getElementById('filter-toggle-all-btn');
        const isSelectAll = !btn || btn.dataset.state !== 'clear';
        toggleAllFilters(isSelectAll);
        if (btn) {
            btn.dataset.state = isSelectAll ? 'clear' : 'selectAll';
            btn.textContent = isSelectAll ? (btn.getAttribute('data-i18n-clear') || 'Clear') : (btn.getAttribute('data-i18n-select') || 'Select All');
        }
    }
    
    function clearCurrentFilter() {
        toggleAllFilters(true); 
        applyFilter(); 
    }

    function applyFilter() {
        const arrayName = document.getElementById('filter-array-name').value;
        const columnKey = document.getElementById('filter-column-key').value;
        
        const checkboxes = document.querySelectorAll('.filter-option-cb');
        const checkedValues = [];
        let allChecked = true;

        checkboxes.forEach(cb => {
            if (cb.checked) checkedValues.push(cb.value);
            else allChecked = false;
        });

        if (!activeFilters[arrayName]) activeFilters[arrayName] = {};

        if (allChecked) {
            delete activeFilters[arrayName][columnKey];
        } else {
            activeFilters[arrayName][columnKey] = checkedValues;
        }

        const filterModal = document.getElementById('universalFilterModal');
        if (filterModal && typeof bootstrap !== 'undefined') {
            const modalInst = bootstrap.Modal.getInstance(filterModal);
            if (modalInst) modalInst.hide();
        }

        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'projects' && typeof renderProjectsTable === 'function') renderProjectsTable();
        if (arrayName === 'profiles' && typeof renderProfilesTable === 'function') renderProfilesTable();
        
        // 🪄 UNIVERSAL SANDBOX REDRAW
        if (arrayName === 'sandbox_parts' && typeof renderSandboxPartlistTab === 'function') {
            if (window.currentSandboxParts) renderSandboxPartlistTab(window.currentSandboxParts);
        }
    }

    function rowPassesFiltersExcept(row, arrayName, excludeKey) {
        if (!activeFilters[arrayName]) return true;
        for (const [columnKey, allowedValues] of Object.entries(activeFilters[arrayName])) {
            if (columnKey === excludeKey) continue;
            let cellValue = row[columnKey];
            if (cellValue === '' || cellValue === null || cellValue === undefined) cellValue = '___EMPTY___';
            if (!allowedValues.includes(String(cellValue))) return false;
        }
        return true;
    }

    function rowPassesFilters(row, arrayName) {
        if (!activeFilters[arrayName]) return true; 

        for (const [columnKey, allowedValues] of Object.entries(activeFilters[arrayName])) {
            let cellValue = row[columnKey];
            if (cellValue === '' || cellValue === null || cellValue === undefined) cellValue = '___EMPTY___';
            
            if (!allowedValues.includes(String(cellValue))) {
                return false; 
            }
        }
        return true; 
    }

    function clearAllFiltersForTable(arrayName) {
        if (activeFilters[arrayName]) {
            activeFilters[arrayName] = {}; 
        }
        
        if (arrayName === 'parts' && typeof renderPartsTable === 'function') renderPartsTable();
        if (arrayName === 'materials' && typeof renderMaterialsTable === 'function') renderMaterialsTable();
        if (arrayName === 'catalog' && typeof renderCatalogTable === 'function') renderCatalogTable();
        if (arrayName === 'stock' && typeof renderStockTable === 'function') renderStockTable();
        if (arrayName === 'projects' && typeof renderProjectsTable === 'function') renderProjectsTable();
        if (arrayName === 'profiles' && typeof renderProfilesTable === 'function') renderProfilesTable();
        if (arrayName === 'stagingParts' && typeof renderStagingTable === 'function') renderStagingTable();

        // 🪄 UNIVERSAL SANDBOX REDRAW: Forces the Sandbox table to repaint using the cached array
        if (arrayName === 'sandbox_parts' && typeof renderSandboxPartlistTab === 'function') {
            if (window.currentSandboxParts) {
                renderSandboxPartlistTab(window.currentSandboxParts);
            } else {
                console.warn("Clear Filters Failed: No sandbox parts found in memory to redraw.");
            }
        }
    }

    function updateFilterUI(arrayName, filterableColumns) {
        const clearBtn = document.getElementById(`flt-clear-${arrayName}`);
        let hasAnyFilter = false;

        filterableColumns.forEach(col => {
            const icon = document.getElementById(`flt-icon-${arrayName}-${col}`);
            if (icon) {
                if (activeFilters[arrayName] && activeFilters[arrayName][col] && activeFilters[arrayName][col].length > 0) {
                    icon.classList.remove('text-muted');
                    icon.classList.add('text-primary'); 
                    hasAnyFilter = true;
                } else {
                    icon.classList.add('text-muted');
                    icon.classList.remove('text-primary');
                }
            }
        });

        if (clearBtn) {
            if (hasAnyFilter) {
                clearBtn.classList.remove('text-secondary', 'opacity-25');
                clearBtn.classList.add('text-danger', 'fw-bold');
            } else {
                clearBtn.classList.add('text-secondary', 'opacity-25');
                clearBtn.classList.remove('text-danger', 'fw-bold');
            }
        }

        return hasAnyFilter; 
    }

    // ==========================================
    // CLICK-TO-EDIT ROW ENGINE
    // ==========================================

    const _activeEditRow  = {};   // { tableId: rowId } — at most one active row per table
    const _editRowBuilders = {};  // { tableId: { edit: fn(rowId)→html, read: fn(rowId)→html } }

    function registerEditableTable(tableId, editFn, readFn) {
        _editRowBuilders[tableId] = { edit: editFn, read: readFn };
    }

    // Activate a row (switch to edit inputs). No-op if already active.
    function activateEditRow(tableId, rowId) {
        if (_activeEditRow[tableId] === rowId) return;
        deactivateEditRow(tableId);
        const builders = _editRowBuilders[tableId];
        if (!builders) return;
        const tr = document.querySelector(`tr[data-table="${tableId}"][data-row-id="${rowId}"]`);
        if (!tr) return;
        tr.innerHTML = builders.edit(rowId);
        tr.classList.add('edit-row-active');
        _activeEditRow[tableId] = rowId;
        const first = tr.querySelector('input, select, textarea');
        if (first) setTimeout(() => first.focus(), 0);
    }

    // Deactivate the currently active row for a table (switch back to read text).
    function deactivateEditRow(tableId) {
        const rowId = _activeEditRow[tableId];
        if (!rowId) return;
        const builders = _editRowBuilders[tableId];
        const tr = document.querySelector(`tr[data-table="${tableId}"][data-row-id="${rowId}"]`);
        if (tr && builders) {
            const focused = document.activeElement;
            if (focused && tr.contains(focused)) focused.dispatchEvent(new Event('change', { bubbles: true }));
            tr.innerHTML = builders.read(rowId);
            tr.classList.remove('edit-row-active');
        }
        delete _activeEditRow[tableId];
    }

    // Called at the start of a full table re-render — clears the registry without touching DOM
    // (the DOM is about to be rebuilt anyway).
    function clearEditRowRegistry(tableId) {
        delete _activeEditRow[tableId];
    }

    // Outside-click / outside-tap: deactivate if the interaction lands outside the active row
    document.addEventListener('mousedown', function(e) {
        Object.keys(_activeEditRow).forEach(tableId => {
            const rowId = _activeEditRow[tableId];
            if (!rowId) return;
            const tr = document.querySelector(`tr[data-table="${tableId}"][data-row-id="${rowId}"]`);
            if (tr && !tr.contains(e.target)) deactivateEditRow(tableId);
        });
    });
    document.addEventListener('touchstart', function(e) {
        Object.keys(_activeEditRow).forEach(tableId => {
            const rowId = _activeEditRow[tableId];
            if (!rowId) return;
            const tr = document.querySelector(`tr[data-table="${tableId}"][data-row-id="${rowId}"]`);
            if (tr && !tr.contains(e.target)) deactivateEditRow(tableId);
        });
    }, { passive: true });

    // Escape key: deactivate all active rows
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') Object.keys(_activeEditRow).forEach(id => deactivateEditRow(id));
    });

    let modalSortStates = { stock: { key: '', dir: 1 }, catalog: { key: '', dir: 1 } };
    function handleModalSort(type, key) {
        let state = modalSortStates[type];
        
        if (state.key === key) {
            state.dir *= -1;
        } else {
            state.key = key;
            state.dir = 1;
        }

        if (type === 'stock') {
            if (typeof renderStockModalTable === 'function') renderStockModalTable();
        } else {
            if (typeof renderCatalogModalTable === 'function') renderCatalogModalTable();
        }
    }
</script>
