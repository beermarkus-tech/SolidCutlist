            "tooltip_trim": "Vor dem Zuschnitt kürzt der Optimierer ein Ende jedes neuen Bretts, um eine saubere rechtwinklige Referenzkante zu schaffen. Bei Platten werden zwei angrenzende Kanten getrimmt. Standard: 6mm (¼\"). Auf 0 setzen, um diesen Schritt zu überspringen.",
            "tooltip_scrap_threshold": "Nach jedem Schnitt werden verbleibende Abschnitte gegen diese Mindestmaße gemessen. Darüber — als verwendbaren Rest für das nächste Teil im selben Auftrag behalten. Darunter — als Abfall gezählt. Erhöhe diese Werte, wenn du kleine Stücke nicht verfolgen möchtest.",
            "tooltip_grain": "Nur für Plattenwerkstoffe. Längs = Faserrichtung verläuft entlang der langen Kante. Quer = Faserrichtung verläuft über die Breite. Der Optimierer dreht ein Plattenteil nicht so, dass die Faserrichtung verletzt wird. Leer lassen, wenn die Faserrichtung keine Rolle spielt.",
            "tooltip_scrap_stock": "Markiere ein Brett als Rest, wenn es ein Abschnitt aus einem früheren Auftrag ist. Wenn Lager verwenden aktiv ist, verwendet der Optimierer Reste vor vollen Brettern — so wächst dein Restestapel nicht weiter.",
            "tooltip_profile": "Ein Profil ist der Querschnitt eines Bretts — Dicke und Breite, ohne Länge. Für Schnittholz beide Maße angeben (z.B. 38×89mm für ein 2×4). Für Platten nur die Dicke (z.B. 18mm). Die erhältlichen Längen werden separat in den Ladenpreisen eingestellt.",

            "ph_project_name": "Nome del progetto...",
            "tooltip_use_shop_stock": "Se attivo, l'ottimizzatore controlla lo stock dell'officina prima di acquistare — scarti e ritagli vengono usati per primi. Questa opzione è bloccata all'interno di un Lavoro salvato per mantenere il lavoro completamente isolato dall'inventario dell'officina.",
            "tooltip_transport": "Usalo se il tuo fornitore di legname pre-taglierà le tavole per farle stare nel tuo veicolo. Imposta la lunghezza massima trasportabile e l'ottimizzatore pianificherà i tagli in modo che nessun segmento la superi, indicando i pre-tagli necessari in negozio.",
            "tooltip_store_margin": "Il ritaglio minimo che il negozio deve mantenere per fare un taglio pulito. Se la tua auto porta 2400mm e il margine è 20mm, l'ottimizzatore richiede pezzi fino a 2380mm. Chiedi al tuo negozio la loro politica di taglio minimo — la maggior parte ne ha bisogno di almeno 50–100mm.",
            "tooltip_kerf": "Il kerf è la larghezza di legno rimossa dalla lama della sega ad ogni taglio. Una lama standard rimuove circa 3,2mm (⅛\"). L'ottimizzatore deduce questo valore per ogni taglio — con 5 tagli perdi 5 × kerf di materiale. Misura un taglio di prova o consulta la scheda tecnica della tua lama.",
            "tooltip_trim": "Prima di tagliare i pezzi, l'ottimizzatore squadra un'estremità di ogni nuova tavola per creare un bordo di riferimento retto e perpendicolare. Per i pannelli, vengono squadrati due bordi adiacenti. Standard: 6mm (¼\"). Imposta a 0 per saltare questo passaggio.",
            "tooltip_scrap_threshold": "Dopo ogni taglio, i ritagli rimanenti vengono misurati rispetto a questi minimi. Sopra la soglia — mantenuti come scarto utilizzabile per il pezzo successivo nello stesso lavoro. Sotto — conteggiati come rifiuto. Aumenta questi valori se preferisci non tenere traccia dei pezzi piccoli.",
            "tooltip_grain": "Solo per pannelli. Lunghezza = la venatura della faccia scorre lungo il bordo lungo del pannello. Larghezza = la venatura scorre in senso trasversale. L'ottimizzatore non ruoterà un pezzo di pannello in modo da violare la sua impostazione di venatura. Lascia su Nessuna se la direzione della venatura non è importante.",
            "tooltip_scrap_stock": "Segna una tavola come scarto se è un ritaglio di un lavoro precedente. Quando Usa Stock Officina è attivo, l'ottimizzatore usa gli scarti prima delle tavole intere — evitando che la tua pila di ritagli cresca.",
            "tooltip_profile": "Un profilo è la sezione trasversale di una tavola — spessore e larghezza, senza lunghezza. Per il legname, inserisci entrambe le dimensioni (es. 38×89mm per un 2×4). Per i pannelli, inserisci solo lo spessore (es. 18mm). Le lunghezze disponibili in negozio si configurano separatamente in Prezzi Negozio.",
            "tooltip_material": "Un materiale è la specie di legno o il tipo di pannello (es. Pino, MDF). È sempre abbinato a un profilo per descrivere completamente una tavola. La densità viene usata per le stime di peso nella lista di taglio — lascia a 0 se non hai bisogno di questa funzione.",

    function applyTranslations() {
        const lang = (appState.settings && appState.settings.language) ? appState.settings.language : 'en';
        const dict = translations[lang] || translations['en'];

        // 1. data-i18n → text content (or placeholder for plain inputs)
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) {
                if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
                    el.setAttribute('placeholder', dict[key]);
                } else {
                    el.innerHTML = dict[key];
                }
            }
        });

        // 2. data-i18n-title → title attribute (separate key, never collides with data-i18n)
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (dict[key]) el.setAttribute('title', dict[key]);
        });

        // 3. data-i18n-placeholder → placeholder attribute
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (dict[key]) el.setAttribute('placeholder', dict[key]);
        });
    }
    function t(key, replacements = {}) {
        const lang = (appState.settings && appState.settings.language) ? appState.settings.language : 'en';
        const dict = translations[lang] || translations['en'];
        let text = dict[key] || key;

        // Handle pluralization and variable replacement
        for (const placeholder in replacements) {
            text = text.replaceAll(`{${placeholder}}`, replacements[placeholder]);
        }

        return text;
    }
    function handleLanguageChange(newLang) {
        if (!appState.settings) appState.settings = {};
        appState.settings.language = newLang;
        saveState();
        applyTranslations();
        if (typeof renderSettings === 'function') renderSettings();

        // Re-render the currently visible view so JS-injected content updates too
        const activeView = document.querySelector('.app-view:not(.d-none)');
        if (activeView) {
            const id = activeView.id;
            if (id === 'view-projects') {
                if (typeof renderProjectsTable === 'function') renderProjectsTable();
                if (typeof renderPartsTable === 'function') renderPartsTable();
            } else if (id === 'view-setup') {
                if (typeof renderStockTable === 'function') renderStockTable();
                if (typeof renderCatalogTable === 'function') renderCatalogTable();
                if (typeof renderDictionaries === 'function') renderDictionaries();
            } else if (id === 'view-import') {
                const sel = document.getElementById('import-unit-select');
                if (sel && typeof applyImportScale === 'function') applyImportScale(sel.value);
            } else if (id === 'view-cutlist') {
                if (typeof populateCatalogDropdowns === 'function') populateCatalogDropdowns();
                if (typeof populateStockDropdowns === 'function') populateStockDropdowns();
                if (appState.latestResults) {
                    if (typeof renderShoppingListTab === 'function') renderShoppingListTab(appState.latestResults);
                    if (typeof renderDiagramsTab === 'function') renderDiagramsTab(appState.latestResults);
                    if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(appState.latestResults);
                }
                if (window.currentSandboxParts && typeof renderSandboxPartlistTab === 'function') {
                    renderSandboxPartlistTab(window.currentSandboxParts);
                }
            }
        }

        showToast( t('msg_lang_changed') );
    }
</script>
