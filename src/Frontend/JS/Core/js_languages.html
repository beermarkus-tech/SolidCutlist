            "hdr_before_import": "Vor dem Import",
            "txt_before_import_intro": "Für ein optimales Ergebnis sollten dein SketchUp-Modell und deine SolidCutlist-Bibliothek vor dem Fortfahren aufeinander abgestimmt sein:",
            "txt_before_import_li1": "<strong>Materialnamen</strong> in SketchUp sollten mit denen in deiner SolidCutlist-Bibliothek übereinstimmen",

            "txt_before_import_additive": "Der Import ist immer <strong>additiv</strong> — nichts in deiner bestehenden Teileliste wird überschrieben.",
            "txt_before_import_guide": "Eine vollständige Anleitung zum Arbeitsablauf SketchUp → OpenCutList → SolidCutlist findest du in deiner PDF-Installationsanleitung.",
            "tooltip_optimizer_how": "So funktioniert der Optimierer\n\nBalken & Profile — Teile werden der Länge nach auf Bretter gepackt, eines nach dem anderen.\nPlattenmaterial — mehrere Sortierreihenfolgen und Schnittrichtungen werden automatisch ausprobiert; das Layout mit den wenigsten Platten und dem größten Reststück gewinnt.\nNicht global optimal — identische Teile werden nicht immer zusammengefasst; Platzierungen minimieren lokalen Verschnitt, nicht die Komplexität der Schnittfolge.\nFür bessere Ausbeute — Faserrichtung deaktivieren, wenn nicht konstruktiv erforderlich, und Transportmodus deaktivieren, wenn keine Lieferlängenbeschränkung besteht.",
            "tooltip_select_to_build": "Zum Bauen auswählen\n\nHake ein Projekt an, um alle seine Teile einzuschließen. Klappe es auf, um die Gruppen zu sehen — deaktiviere einzelne Gruppen, um sie auszuschließen, oder wähle eine einzelne Gruppe aus, um nur diese zu berechnen (das übergeordnete Projekt wird automatisch ausgewählt).\n\nWähle mehrere Projekte aus, um sie in einer einzigen Optimierung zu kombinieren.\n\nMultiplikator (×) — multipliziert die Teileanzahl jeder Zeile. Projekt- und Gruppen-Multiplikatoren werden kombiniert: Projekt ×2 mit einer Stuhlgruppe ×4 ergibt 8 Stühle. Nutze dies, um aus einem einzigen Design einen vollständigen Satz zu erstellen.",
            "tooltip_price_freshness": "Preisaktualität\n\nDas farbige Datumsabzeichen zeigt an, wann ein Rohmaterialpreis zuletzt beim Holzhändler bestätigt wurde:\n\nGrün — in den letzten 2 Wochen bestätigt. Preis ist aktuell.\nGelb — 2 bis 4 Wochen seit der letzten Bestätigung. Lohnt sich zu prüfen.\nRot — mehr als 4 Wochen alt. Der Preis ist möglicherweise nicht mehr aktuell.\n\nTippe auf ein Datumsabzeichen, um zu bestätigen, dass der Preis heute noch gültig ist. Dies setzt die Aktualitätsuhr zurück, ohne den Preis zu ändern.\n\nNutze das 🔗-Symbol in jeder Zeile, um einen direkten Link zur Seite dieses Artikels beim Lieferanten zu speichern — ein Tipp bringt dich direkt zum aktuellen Preis.",

            "tooltip_use_shop_stock": "Wenn aktiv, prüft der Optimierer zunächst das Lager, bevor neues Material eingekauft wird — Reste und Abschnitte werden zuerst verwendet. Diese Option ist innerhalb eines gespeicherten Auftrags deaktiviert, um den Auftrag vollständig vom aktuellen Lagerbestand zu trennen.",
            "tooltip_transport": "Verwende diese Option, wenn dein Holzhandel Bretter auf Transportmaß vorzuschneiden soll. Gib die maximale Länge an, die du transportieren kannst — der Optimierer plant die Schnitte so, dass kein Segment dieses Maß überschreitet, und markiert die benötigten Ladenschnitte.",
            "tooltip_store_margin": "Der minimale Abschnitt, den der Laden für einen sauberen Schnitt behalten muss. Wenn dein Auto 2400mm fasst und die Marge 20mm beträgt, fordert der Optimierer Stücke bis zu 2380mm an. Frag deinen Laden nach der Mindestabschnittsrichtlinie — meist sind 50–100mm nötig.",
            "tooltip_kerf": "Der Schnittspalt ist die Holzbreite, die jede Säge pro Schnitt entfernt. Ein Standardblatt entfernt ca. 3,2mm (⅛\"). Der Optimierer zieht diesen Betrag für jeden Schnitt ab — bei 5 Schnitten gehen also 5 × Schnittspalt verloren. Miss einen Probeschnitt oder prüfe das Datenblatt deines Blatts.",
            "tooltip_trim": "Vor dem Zuschnitt kürzt der Optimierer ein Ende jedes neuen Bretts, um eine saubere rechtwinklige Referenzkante zu schaffen. Bei Platten werden zwei angrenzende Kanten getrimmt. Standard: 6mm (¼\"). Auf 0 setzen, um diesen Schritt zu überspringen.",
            "tooltip_scrap_threshold": "Nach jedem Schnitt werden verbleibende Abschnitte gegen diese Mindestmaße gemessen. Darüber — als verwendbaren Rest für das nächste Teil im selben Auftrag behalten. Darunter — als Abfall gezählt. Erhöhe diese Werte, wenn du kleine Stücke nicht verfolgen möchtest.",
            "tooltip_bulk_material": "Für Meterware, die vor Ort angepasst und zugeschnitten wird (Verschalung, Dielen, Latten), statt auf eine vorab festgelegte Länge zugeschnitten zu werden. Markiere eine Teilzeile als Meterware, und ihre Länge wird zur gesamten benötigten Lauflänge. Sie wird vom Zuschnitt ausgeschlossen und erscheint nie in den Zeichnungen — nur eine Stückzahl auf der Einkaufsliste. Die Mindestlänge hier legt fest, welche Reststücke aus dem Lagerbestand auf diese Summe angerechnet werden dürfen.",
            "tooltip_margin_percent": "Ein Sicherheitspuffer, der für Kanthölzer ohne Meterware der Einkaufsliste hinzugefügt wird. Nachdem der Optimierer deine Bretter verschachtelt hat: Wenn der tatsächliche Verschnitt diesen Prozentsatz des Bedarfs noch nicht abdeckt, werden zusätzliche Bretter nur der Einkaufsliste hinzugefügt — nie in die Zuschnittzeichnungen eingefügt.",
            "tooltip_grain": "Nur für Plattenwerkstoffe. Längs = Faserrichtung verläuft entlang der langen Kante. Quer = Faserrichtung verläuft über die Breite. Der Optimierer dreht ein Plattenteil nicht so, dass die Faserrichtung verletzt wird. Leer lassen, wenn die Faserrichtung keine Rolle spielt.",
            "tooltip_scrap_stock": "Markiere ein Brett als Rest, wenn es ein Abschnitt aus einem früheren Auftrag ist. Wenn Lager verwenden aktiv ist, verwendet der Optimierer Reste vor vollen Brettern — so wächst dein Restestapel nicht weiter.",
            "tooltip_profile": "Ein Profil ist der Querschnitt eines Bretts — Dicke und Breite, ohne Länge. Für Schnittholz beide Maße angeben (z.B. 38×89mm für ein 2×4). Für Platten nur die Dicke (z.B. 18mm). Die erhältlichen Längen werden separat in den Ladenpreisen eingestellt.",
            "tooltip_material": "Ein Material ist die Holzart oder der Plattentyp (z.B. Kiefer, MDF). Es wird immer mit einem Profil kombiniert, um ein Brett vollständig zu beschreiben. Die Dichte wird für Gewichtsschätzungen in der Schnittliste verwendet — auf 0 lassen, wenn diese Funktion nicht benötigt wird.",

            "tooltip_imported_unit": "Importierte Einheit\n\nWähle die Einheit aus, die du beim Modellieren in SketchUp verwendet hast. SolidCutlist skaliert alle Maße automatisch.\n\nHast du in Zentimetern oder Metern modelliert, wähle die entsprechende Einheit — ein Teil mit 72 cm wird als 720 mm importiert.\n\nHast du in Zoll modelliert, wähle Zoll — ein Teil mit 28 Zoll wird korrekt importiert.\n\nEnthält deine CSV bereits Werte in Millimetern, lasse die Einstellung auf mm.\n\nDie minimalen und maximalen Längen und Dicken neben dem Selektor aktualisieren sich live — nutze sie, um zu prüfen, ob die Werte für deine Teile plausibel sind.",
            "tooltip_commit_offcuts": "Reststücke in Lager übernehmen\n\nFügt die ausgewählten Reststücke als Verschnitt zu deinem Lagerbestand hinzu. Beim nächsten Optimierungslauf werden sie zuerst berücksichtigt, damit Restmaterial vor neuen Brettern verbraucht wird.\n\n⚠️ Hinweis bei erneutem Lauf: Wenn du denselben Job nochmals optimierst und erneut überträgst, werden dieselben Reststücke ein zweites Mal ins Lager aufgenommen. Prüfe deinen Lagerbestand auf Duplikate, wenn du denselben Job erneut berechnest.",
            "tooltip_est_cost": "Geschätzte Kosten\n\nDieser Wert ist eine grobe Schätzung auf Basis der Durchschnittspreise der Rohmaterialien (Bretter, Platten, Profile), die aktuell in deinen Lagern hinterlegt sind – er berücksichtigt weder Zuschnittpläne noch Brettgrößen oder welche konkreten Artikel tatsächlich gekauft würden.\n\nFür die tatsächlichen Kosten starte den Optimierer: Er ermittelt genau, welche Rohmaterialien für dieses Projekt benötigt werden, und kalkuliert sie anhand deines echten Katalogs und Lagerbestands.",

            "txt_before_import_intro": "Pour un résultat optimal, votre modèle SketchUp et votre bibliothèque SolidCutlist doivent être cohérents avant de continuer :",

            "txt_before_import_guide": "Pour une présentation complète du flux SketchUp → OpenCutList → SolidCutlist, consultez votre guide d'installation PDF.",
            "tooltip_optimizer_how": "Comment fonctionne l'optimiseur\n\nBois & profils — les pièces sont placées par ordre de longueur décroissante, une à la fois.\nPanneaux — plusieurs ordres de tri et directions de coupe sont essayés automatiquement ; le plan avec le moins de panneaux et le plus grand chute utile l'emporte.\nPas globalement optimal — des pièces identiques peuvent ne pas toujours être regroupées ensemble ; les placements minimisent le gaspillage local, pas la complexité de la séquence de coupe.\nPour améliorer le rendement — désactivez la direction du fil si elle n'est pas requise structurellement, et désactivez le mode transport si la longueur de livraison n'est pas une contrainte.",
            "tooltip_select_to_build": "Sélection pour la construction\n\nCoche un projet pour inclure toutes ses pièces. Développe-le pour voir ses groupes — décoche des groupes individuels pour les exclure, ou coche un seul groupe pour le calculer seul (le projet parent est sélectionné automatiquement).\n\nCoche plusieurs projets pour les combiner en un seul calcul d'optimisation.\n\nMultiplicateur (×) — multiplie la quantité de chaque pièce dans cette ligne. Les multiplicateurs de projet et de groupe s'appliquent en cascade : projet ×2 avec un groupe chaise ×4 donne 8 chaises. Utilise cela pour fabriquer un ensemble complet à partir d'un seul modèle.",
            "tooltip_price_freshness": "Fraîcheur du prix\n\nLe badge de date coloré indique quand le prix d'une matière première a été confirmé pour la dernière fois chez le fournisseur de bois :\n\nVert — confirmé au cours des 2 dernières semaines. Le prix est à jour.\nJaune — 2 à 4 semaines depuis la dernière confirmation. Vaut la peine de vérifier.\nRouge — plus de 4 semaines. Le prix n'est peut-être plus exact.\n\nAppuie sur un badge de date pour confirmer que le prix est toujours valide aujourd'hui. Cela remet le compteur de fraîcheur à zéro sans modifier le prix.\n\nUtilise l'icône 🔗 sur chaque ligne pour enregistrer un lien direct vers cet article sur le site de ton fournisseur — un seul appui t'amène directement au prix actuel.",

            "ph_project_name": "Nom du projet...",
            "tooltip_use_shop_stock": "Lorsqu\'activé, l\'optimiseur consulte d\'abord le stock de l\'atelier avant d\'acheter — les chutes et les restes sont utilisés en priorité. Cette option est désactivée à l\'intérieur d\'un Job enregistré pour garder le job totalement isolé du stock en cours.",
            "tooltip_transport": "Utilisez cette option si votre fournisseur peut pré-couper les planches aux dimensions de transport. Définissez la longueur maximale transportable — l\'optimiseur planifiera les coupes pour qu\'aucun segment ne la dépasse, en signalant les coupes à faire en magasin.",
            "tooltip_store_margin": "Le minimum que le magasin doit conserver pour effectuer une coupe propre. Si votre voiture accepte 2400mm et la marge est de 20mm, l\'optimiseur demande des pièces jusqu\'à 2380mm. Renseignez-vous auprès de votre fournisseur — la plupart exigent au moins 50–100mm.",
            "tooltip_kerf": "Le trait de scie est la largeur de bois retirée par chaque coupe. Une lame standard enlève environ 3,2mm (⅛\"). L\'optimiseur déduit ce montant pour chaque coupe — 5 coupes = 5 × trait de scie de perdu. Mesurez une coupe test ou consultez la fiche technique de votre lame.",
            "tooltip_trim": "Avant de couper les pièces, l\'optimiseur dresse une extrémité de chaque nouvelle planche pour créer un bord de référence carré. Pour les panneaux, deux bords adjacents sont dressés. Standard : 6mm (¼\"). Mettez 0 pour ignorer cette étape.",
            "tooltip_scrap_threshold": "Après chaque coupe, les chutes restantes sont mesurées par rapport à ces minimums. Au-dessus du seuil — conservées comme chute utilisable pour la prochaine pièce du même job. En dessous — comptées comme déchet. Augmentez ces valeurs si vous ne souhaitez pas gérer les petits morceaux.",
            "tooltip_bulk_material": "Pour le bois ajusté et coupé sur place (bardage, lames de terrasse, tasseaux) plutôt que coupé à une longueur prédéterminée. Marquez une ligne de pièce comme vrac et sa longueur devient la longueur totale nécessaire. Elle est exclue du débit et n'apparaît jamais sur les diagrammes — seulement un nombre de planches sur la liste d'achats. La longueur minimale ici détermine quelles chutes de stock en atelier peuvent compter dans ce total.",
            "tooltip_margin_percent": "Une marge de sécurité ajoutée à la liste d'achats pour le bois hors vrac. Une fois que l'optimiseur a débité vos planches, si la chute réelle ne couvre pas encore ce pourcentage du besoin, des planches supplémentaires sont ajoutées à la liste d'achats uniquement — jamais imbriquées sur les diagrammes de coupe.",
            "tooltip_grain": "Panneaux uniquement. Sens long = le fil du bois suit le long bord du panneau. Sens large = le fil court dans la largeur. L\'optimiseur ne fera pas pivoter une pièce de panneau d\'une façon qui violerait son sens de fil. Laisser à Aucun si le sens du fil n\'a pas d\'importance.",
            "tooltip_scrap_stock": "Marquez une planche comme chute si c\'est un résidu d\'un travail précédent. Lorsque Utiliser le stock atelier est activé, l\'optimiseur utilise les chutes avant les planches entières — pour que votre pile de restes ne grossisse pas.",
            "tooltip_profile": "Un profilé est la section transversale d\'une planche — épaisseur et largeur, sans longueur. Pour le bois massif, entrez les deux dimensions (ex. 38×89mm pour un 2×4). Pour les panneaux, entrez l\'épaisseur uniquement (ex. 18mm). Les longueurs disponibles à l\'achat sont définies séparément dans les Prix magasin.",

            "tooltip_optimizer_how": "Cómo funciona el optimizador\n\nMadera & perfiles — las piezas se colocan de mayor a menor longitud, una a la vez.\nTableros — se prueban automáticamente varios órdenes de clasificación y direcciones de corte; gana el diseño con menos tableros y el mayor retazo útil.\nNo globalmente óptimo — las piezas idénticas pueden no agruparse siempre juntas; las colocaciones minimizan el desperdicio local, no la complejidad de la secuencia de corte.\nPara mejorar el rendimiento — desactiva la dirección de veta si no es estructuralmente necesaria, y desactiva el modo transporte si la longitud de entrega no es una restricción.",
            "tooltip_select_to_build": "Selección para construir\n\nMarca un proyecto para incluir todas sus piezas. Expándelo para ver sus grupos — desmarca grupos individuales para excluirlos, o marca un solo grupo para calcularlo solo (el proyecto padre se selecciona automáticamente).\n\nMarca varios proyectos para combinarlos en una sola optimización.\n\nMultiplicador (×) — multiplica la cantidad de cada pieza en esa fila. Los multiplicadores de proyecto y grupo se acumulan: proyecto ×2 con un grupo silla ×4 produce 8 sillas. Úsalo para fabricar un conjunto completo a partir de un solo diseño.",

            "tooltip_use_shop_stock": "Cuando está activo, el optimizador revisa el stock del taller antes de comprar — los restos y recortes se usan primero. Esta opción está bloqueada dentro de un Trabajo guardado para mantenerlo completamente aislado del inventario del taller.",
            "tooltip_transport": "Úsalo si tu maderería va a pre-cortar las tablas para que quepan en tu vehículo. Define la longitud máxima que puedes transportar y el optimizador planificará los cortes para que ningún segmento la supere, indicando los pre-cortes necesarios en tienda.",

            "tooltip_kerf": "La sangría es el ancho de madera que elimina tu hoja de sierra en cada corte. Una hoja estándar elimina unos 3,2mm (⅛\"). El optimizador deduce esta cantidad por cada corte — con 5 cortes pierdes 5 × sangría de material. Mide un corte de prueba o consulta la ficha técnica de tu hoja.",
            "tooltip_trim": "Antes de cortar las piezas, el optimizador despunta un extremo de cada tabla nueva para crear un borde de referencia recto y cuadrado. En tableros se despuntan dos bordes adyacentes. Estándar: 6mm (¼\"). Pon 0 para omitir este paso.",
            "tooltip_scrap_threshold": "Tras cada corte, los recortes sobrantes se miden contra estos mínimos. Por encima del umbral — se conservan como resto útil para la siguiente pieza del mismo trabajo. Por debajo — se cuentan como desperdicio. Sube estos valores si prefieres no hacer seguimiento de piezas pequeñas.",
            "tooltip_bulk_material": "Para madera que se ajusta y corta in situ (revestimiento, entablado, listones) en lugar de cortarse a una longitud predeterminada. Marca una fila de pieza como a granel y su longitud pasa a ser la carrera total necesaria. Se excluye del optimizador de corte y nunca aparece en los diagramas — solo una cantidad de tablas en la lista de compras. La longitud mínima aquí determina qué recortes de stock del taller son elegibles para contar en ese total.",
            "tooltip_margin_percent": "Un margen de seguridad añadido a la lista de compras para madera que no es a granel. Después de que el optimizador empaqueta tus tablas, si el sobrante real aún no cubre este porcentaje de lo necesario, se añaden tablas adicionales solo a la lista de compras — nunca se anidan en los diagramas de corte.",
            "tooltip_grain": "Solo para tableros. Longitud = la veta de la cara discurre a lo largo del borde largo del tablero. Ancho = la veta discurre en sentido transversal. El optimizador no girará una pieza de tablero de forma que viole su configuración de veta. Déjalo en Ninguna si la dirección de veta no importa.",

            "tooltip_optimizer_how": "Como funciona o otimizador\n\nMadeira & perfis — as peças são colocadas da maior para a menor, uma de cada vez.\nPainéis — várias ordens de classificação e direções de corte são testadas automaticamente; o plano com menos painéis e o maior retalho útil vence.\nNão globalmente ótimo — peças idênticas podem nem sempre ser agrupadas; os posicionamentos minimizam o desperdício local, não a complexidade da sequência de corte.\nPara melhorar o rendimento — desative a direção do veio se não for estruturalmente necessária e desative o modo de transporte se o comprimento de entrega não for uma restrição.",

            "ph_project_name": "Nome do projeto...",
            "tooltip_use_shop_stock": "Quando ativado, o otimizador verifica seu estoque de oficina antes de comprar — sobras e retalhos são usados primeiro. Esta opção fica bloqueada dentro de um Trabalho salvo para manter o trabalho completamente isolado do inventário da oficina.",
            "tooltip_transport": "Use isso se sua madeireira vai pré-cortar as peças para caber no seu veículo. Defina o comprimento máximo que você pode transportar e o otimizador planejará os cortes para que nenhum segmento ultrapasse esse limite, indicando os pré-cortes necessários na loja.",
            "tooltip_store_margin": "O retalho mínimo que a loja deve manter para fazer um corte limpo. Se seu carro comporta 2400mm e a margem é 20mm, o otimizador solicita peças de até 2380mm. Pergunte à sua loja qual é a política de corte mínimo — a maioria precisa de pelo menos 50–100mm.",
            "tooltip_kerf": "A espessura de corte é a largura de madeira removida pela lâmina da serra a cada corte. Uma lâmina padrão remove cerca de 3,2mm (⅛\"). O otimizador deduz esse valor a cada corte — com 5 cortes você perde 5 × a espessura de corte em material. Meça um corte de teste ou consulte a ficha técnica da sua lâmina.",
            "tooltip_trim": "Antes de cortar as peças, o otimizador apara uma extremidade de cada nova peça de madeira para criar uma borda de referência reta e esquadrejada. Em chapas, duas bordas adjacentes são aparadas. Padrão: 6mm (¼\"). Defina como 0 para pular esta etapa.",
            "tooltip_scrap_threshold": "Após cada corte, os retalhos restantes são medidos em relação a esses mínimos. Acima do limite — mantidos como sobra útil para a próxima peça do mesmo trabalho. Abaixo — contados como desperdício. Aumente esses valores se preferir não rastrear peças pequenas.",
            "tooltip_bulk_material": "Para madeira que é ajustada e cortada no local (revestimento, deck, ripas) em vez de cortada em um comprimento predeterminado. Marque uma linha de peça como a granel e seu comprimento passa a ser a extensão total necessária. Ela é excluída do otimizador de corte e nunca aparece nos diagramas — apenas uma quantidade de tábuas na lista de compras. O comprimento mínimo aqui define quais sobras de estoque da oficina são elegíveis para contar nesse total.",
            "tooltip_margin_percent": "Uma margem de segurança adicionada à lista de compras para madeira que não é a granel. Depois que o otimizador encaixa suas tábuas, se a sobra real ainda não cobrir essa porcentagem do necessário, tábuas extras são adicionadas somente à lista de compras — nunca encaixadas nos diagramas de corte.",
            "tooltip_grain": "Somente para chapas. Comprimento = o veio da face corre ao longo da borda longa da chapa. Largura = o veio corre na direção transversal. O otimizador não vai girar uma peça de chapa de forma que viole sua configuração de veio. Deixe como Nenhum se a direção do veio não importar.",
            "tooltip_scrap_stock": "Marque uma peça como sobra se for um retalho de um trabalho anterior. Quando Usar Estoque da Oficina estiver ativado, o otimizador usa as sobras antes das peças inteiras — evitando que sua pilha de retalhos cresça.",
            "tooltip_profile": "Um perfil é a seção transversal de uma peça de madeira — espessura e largura, sem comprimento. Para madeira serrada, insira as duas dimensões (ex: 38×89mm para um 2×4). Para chapas, insira apenas a espessura (ex: 18mm). Os comprimentos disponíveis para compra são configurados separadamente em Preços da Loja.",

            "txt_before_import_intro": "Per un risultato ottimale, il tuo modello SketchUp e la tua biblioteca SolidCutlist devono essere coerenti prima di continuare:",

            "txt_before_import_guide": "Per una guida completa al flusso SketchUp → OpenCutList → SolidCutlist, consulta la tua guida all'installazione in PDF.",
            "tooltip_optimizer_how": "Come funziona l'ottimizzatore\n\nLegno & profili — i pezzi vengono posizionati dal più lungo al più corto, uno alla volta.\nPannelli — vengono provati automaticamente più ordini di classificazione e direzioni di taglio; vince il piano con meno pannelli e lo sfrido utile più grande.\nNon globalmente ottimale — pezzi identici potrebbero non essere sempre raggruppati insieme; i posizionamenti minimizzano lo spreco locale, non la complessità della sequenza di taglio.\nPer migliorare la resa — disattiva la direzione della venatura se non è strutturalmente necessaria e disattiva la modalità trasporto se il vincolo di lunghezza di consegna non è rilevante.",
            "tooltip_select_to_build": "Selezione per la costruzione\n\nSeleziona un progetto per includere tutte le sue parti. Espandilo per vedere i suoi gruppi — deseleziona singoli gruppi per escluderli, oppure seleziona un singolo gruppo per calcolarlo da solo (il progetto padre viene selezionato automaticamente).\n\nSeleziona più progetti per combinarli in un'unica ottimizzazione.\n\nMoltiplicatore (×) — moltiplica la quantità di ogni parte in quella riga. I moltiplicatori di progetto e gruppo si combinano: progetto ×2 con un gruppo sedia ×4 produce 8 sedie. Usalo per costruire un set completo a partire da un unico modello.",
            "tooltip_price_freshness": "Freschezza del prezzo\n\nIl badge data colorato mostra quando il prezzo di una materia prima è stato confermato per l'ultima volta presso il fornitore di legname:\n\nVerde — confermato nelle ultime 2 settimane. Il prezzo è aggiornato.\nGiallo — da 2 a 4 settimane dall'ultima conferma. Vale la pena verificare.\nRosso — più di 4 settimane. Il prezzo potrebbe non essere più accurato.\n\nTocca qualsiasi badge data per confermare che il prezzo è ancora valido oggi. Questo azzera il contatore di freschezza senza modificare il prezzo.\n\nUsa l'icona 🔗 su ogni riga per salvare un link diretto a quell'articolo sul sito del tuo fornitore — un tocco ti porta direttamente al prezzo attuale.",

            "ph_search": "Cerca...",
            "ph_project_name": "Nome del progetto...",
            "tooltip_use_shop_stock": "Se attivo, l'ottimizzatore controlla lo stock dell'officina prima di acquistare — scarti e ritagli vengono usati per primi. Questa opzione è bloccata all'interno di un Lavoro salvato per mantenere il lavoro completamente isolato dall'inventario dell'officina.",
            "tooltip_transport": "Usalo se il tuo fornitore di legname pre-taglierà le tavole per farle stare nel tuo veicolo. Imposta la lunghezza massima trasportabile e l'ottimizzatore pianificherà i tagli in modo che nessun segmento la superi, indicando i pre-tagli necessari in negozio.",
            "tooltip_store_margin": "Il ritaglio minimo che il negozio deve mantenere per fare un taglio pulito. Se la tua auto porta 2400mm e il margine è 20mm, l'ottimizzatore richiede pezzi fino a 2380mm. Chiedi al tuo negozio la loro politica di taglio minimo — la maggior parte ne ha bisogno di almeno 50–100mm.",
            "tooltip_kerf": "Il kerf è la larghezza di legno rimossa dalla lama della sega ad ogni taglio. Una lama standard rimuove circa 3,2mm (⅛\"). L'ottimizzatore deduce questo valore per ogni taglio — con 5 tagli perdi 5 × kerf di materiale. Misura un taglio di prova o consulta la scheda tecnica della tua lama.",
            "tooltip_trim": "Prima di tagliare i pezzi, l'ottimizzatore squadra un'estremità di ogni nuova tavola per creare un bordo di riferimento retto e perpendicolare. Per i pannelli, vengono squadrati due bordi adiacenti. Standard: 6mm (¼\"). Imposta a 0 per saltare questo passaggio.",
            "tooltip_scrap_threshold": "Dopo ogni taglio, i ritagli rimanenti vengono misurati rispetto a questi minimi. Sopra la soglia — mantenuti come scarto utilizzabile per il pezzo successivo nello stesso lavoro. Sotto — conteggiati come rifiuto. Aumenta questi valori se preferisci non tenere traccia dei pezzi piccoli.",
            "tooltip_bulk_material": "Per legname che viene adattato e tagliato in loco (rivestimenti, decking, listelli) anziché tagliato a una lunghezza predeterminata. Contrassegna una riga pezzo come sfuso e la sua lunghezza diventa la lunghezza totale necessaria. Viene esclusa dall'ottimizzatore di taglio e non appare mai nei diagrammi — solo un conteggio di tavole nella lista della spesa. La lunghezza minima qui stabilisce quali ritagli di scorta sono idonei a contare in quel totale.",
            "tooltip_margin_percent": "Un margine di sicurezza aggiunto alla lista della spesa per il legname non sfuso. Dopo che l'ottimizzatore ha imballato le tue tavole, se lo scarto effettivo non copre ancora questa percentuale del fabbisogno, tavole aggiuntive vengono aggiunte solo alla lista della spesa — mai inserite nei diagrammi di taglio.",
            "tooltip_grain": "Solo per pannelli. Lunghezza = la venatura della faccia scorre lungo il bordo lungo del pannello. Larghezza = la venatura scorre in senso trasversale. L'ottimizzatore non ruoterà un pezzo di pannello in modo da violare la sua impostazione di venatura. Lascia su Nessuna se la direzione della venatura non è importante.",
            "tooltip_scrap_stock": "Segna una tavola come scarto se è un ritaglio di un lavoro precedente. Quando Usa Stock Officina è attivo, l'ottimizzatore usa gli scarti prima delle tavole intere — evitando che la tua pila di ritagli cresca.",
            "tooltip_profile": "Un profilo è la sezione trasversale di una tavola — spessore e larghezza, senza lunghezza. Per il legname, inserisci entrambe le dimensioni (es. 38×89mm per un 2×4). Per i pannelli, inserisci solo lo spessore (es. 18mm). Le lunghezze disponibili in negozio si configurano separatamente in Prezzi Negozio.",
            "tooltip_material": "Un materiale è la specie di legno o il tipo di pannello (es. Pino, MDF). È sempre abbinato a un profilo per descrivere completamente una tavola. La densità viene usata per le stime di peso nella lista di taglio — lascia a 0 se non hai bisogno di questa funzione.",

            "tooltip_imported_unit": "Unità importata\n\nSeleziona l'unità che hai usato per modellare in SketchUp. SolidCutlist scalerà automaticamente tutte le dimensioni.\n\nSe hai modellato in centimetri o metri, seleziona l'unità corrispondente qui — una parte disegnata come 72 cm verrà importata come 720 mm.\n\nSe hai modellato in pollici, seleziona pollici — una parte disegnata come 28 pollici verrà importata correttamente.\n\nSe il tuo CSV contiene già valori in millimetri, lascia questa impostazione su mm.\n\nLe lunghezze e gli spessori minimi e massimi accanto al selettore si aggiornano in tempo reale — usali per verificare che i valori siano plausibili per le tue parti.",
            "tooltip_commit_offcuts": "Conferma gli scarti a magazzino\n\nAggiunge gli scarti selezionati al magazzino del tuo laboratorio come pezzi di scarto. Saranno proposti per primi alla prossima esecuzione dell'ottimizzatore, in modo da utilizzare il materiale rimanente prima di aprire nuovi pannelli.\n\n⚠️ Attenzione alla riesecuzione: se ottimizzi di nuovo lo stesso progetto e confermi una seconda volta, gli stessi scarti vengono aggiunti nuovamente al magazzino. Controlla il magazzino per duplicati se ricalcoli lo stesso progetto.",

    function applyTranslations() {
        const lang = (appState.settings && appState.settings.language) ? appState.settings.language : 'en';
        const dict = translations[lang] || translations['en'];

        // 1. data-i18n → text content (or placeholder for plain inputs)
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) {
                if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
                    el.setAttribute('placeholder', dict[key]);
                } else {
                    el.innerHTML = dict[key];
                }
            }
        });

        // 2. data-i18n-title → title attribute (separate key, never collides with data-i18n)
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (dict[key]) el.setAttribute('title', dict[key]);
        });

        // 3. data-i18n-placeholder → placeholder attribute
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (dict[key]) el.setAttribute('placeholder', dict[key]);
        });
    }
    function t(key, replacements = {}) {
        const lang = (appState.settings && appState.settings.language) ? appState.settings.language : 'en';
        const dict = translations[lang] || translations['en'];
        let text = dict[key] || key;

        // Handle pluralization and variable replacement
        for (const placeholder in replacements) {
            text = text.replaceAll(`{${placeholder}}`, replacements[placeholder]);
        }

        return text;
    }
    function handleLanguageChange(newLang) {
        if (!appState.settings) appState.settings = {};
        appState.settings.language = newLang;
        saveState();
        applyTranslations();
        if (typeof renderSettings === 'function') renderSettings();

        // Re-render every data-driven table, not just the currently visible view —
        // JS-injected content (e.g. lumber/sheet category badges) lives in tables that
        // may be hidden (d-none) right now and would otherwise show stale-language
        // text until something else happens to re-render them later. Mirrors the same
        // unconditional refresh handleUnitChange() already does.
        if (typeof renderDictionaries === 'function') renderDictionaries();

        const importSel = document.getElementById('import-unit-select');
        if (importSel && typeof applyImportScale === 'function') applyImportScale(importSel.value);

        if (typeof populateCatalogDropdowns === 'function') populateCatalogDropdowns();
        if (typeof populateStockDropdowns === 'function') populateStockDropdowns();
        if (appState.latestResults) {
            if (typeof renderShoppingListTab === 'function') renderShoppingListTab(mergeShoppingResults([...appState.latestResults, ...(appState.latestBulkResults || []), ...(appState.latestMarginResults || [])]));
            if (typeof renderDiagramsTab === 'function') renderDiagramsTab(appState.latestResults);
            if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(appState.latestResults);
        }
        if (window.currentSandboxParts && typeof renderSandboxPartlistTab === 'function') {
            renderSandboxPartlistTab(window.currentSandboxParts);
        }

        showToast( t('msg_lang_changed') );
    }
</script>
