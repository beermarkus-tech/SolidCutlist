<script>
    // ==========================================
    // WELCOME TOUR & GETTING STARTED CHECKLIST
    // ==========================================

    const TOUR_STEPS = [
        { key: 'welcome', icon: '🪵' },
        { key: 'step1',   icon: '🔧' },
        { key: 'step2',   icon: '📁' },
        { key: 'step3',   icon: '📥' },
        { key: 'step4',   icon: '✂️'  }
    ];

    let _tourStep = 0;
    let _tourSessionOnly = false;

    function showWelcomeTour(sessionOnly) {
        if (window.innerWidth < 768) return;
        _tourSessionOnly = sessionOnly === true;
        _tourStep = 0;
        const overlay = document.getElementById('welcome-tour-overlay');
        if (overlay) {
            overlay.style.display = 'flex';
            renderTourStep();
        }
    }

    function _hideTourOverlay() {
        const overlay = document.getElementById('welcome-tour-overlay');
        if (overlay) overlay.style.display = 'none';
    }

    function skipTour() {
        _hideTourOverlay();
        if (!_tourSessionOnly) {
            appState.settings.tourComplete = true;
            saveState();
            renderChecklist();
        }
    }

    function _finishTour() {
        _hideTourOverlay();
        if (!appState.settings) appState.settings = {};
        appState.settings.isProjectCardView = false;
        if (!_tourSessionOnly) {
            appState.settings.tourComplete = true;
            saveState();
        }
        if (typeof navigateTo === 'function') navigateTo('view-projects');
        if (typeof renderProjectsTable === 'function') renderProjectsTable();
        if (!_tourSessionOnly) renderChecklist();
    }

    function tourNext() {
        // On step 0: apply all preference selections before advancing
        if (_tourStep === 0) {
            if (!appState.settings) appState.settings = {};

            const langSel  = document.getElementById('tour-lang-select');
            const unitSel  = document.getElementById('tour-unit-select');
            const currSel  = document.getElementById('tour-currency-select');

            // Language — handleLanguageChange handles its own save + re-translation
            const newLang = langSel ? langSel.value : (appState.settings.language || 'en');
            if (newLang !== (appState.settings.language || 'en')) {
                handleLanguageChange(newLang);
            }

            // Unit system + currency — set directly, then sync settings modal
            if (unitSel) appState.settings.displayUnit = unitSel.value;
            if (currSel) appState.settings.currency    = currSel.value;

            if (typeof renderSettings    === 'function') renderSettings();
            if (typeof updateUnitLabels  === 'function') updateUnitLabels();
            saveState();
        }
        if (_tourStep < TOUR_STEPS.length - 1) {
            _tourStep++;
            renderTourStep();
        } else {
            _finishTour();
        }
    }

    function tourPrev() {
        if (_tourStep > 0) {
            _tourStep--;
            renderTourStep();
        }
    }

    function renderTourStep() {
        const step = TOUR_STEPS[_tourStep];
        const total = TOUR_STEPS.length;

        // Dots
        const dotsEl = document.getElementById('tour-dots');
        if (dotsEl) {
            dotsEl.innerHTML = TOUR_STEPS.map((_, i) =>
                `<div style="width:10px;height:10px;border-radius:50%;transition:background 0.2s;background:${i === _tourStep ? 'var(--bs-primary)' : 'var(--bs-secondary-bg,#dee2e6)'}"></div>`
            ).join('');
        }

        // Content
        const contentEl = document.getElementById('tour-content');
        if (contentEl) {
            if (_tourStep === 0) {
                const s            = appState.settings || {};
                const currentLang  = s.language     || 'en';
                const currentUnit  = s.displayUnit  || 'mm';
                const currentCurr  = s.currency     || '€';
                contentEl.innerHTML = `
                    <div style="font-size:3.5rem;line-height:1;">${step.icon}</div>
                    <h5 class="fw-bold mt-3 mb-2">${t('tour_welcome_title')}</h5>
                    <p class="text-muted small mb-3">${t('tour_welcome_subtitle')}</p>
                    <div style="max-width:270px;margin:0 auto;text-align:left;">
                        <div class="mb-2">
                            <label class="form-label form-label-sm fw-bold text-secondary mb-1">${t('lbl_settings_language')}</label>
                            <select class="form-select form-select-sm" id="tour-lang-select">
                                <option value="en" ${currentLang==='en'?'selected':''}>🇬🇧 English</option>
                                <option value="de" ${currentLang==='de'?'selected':''}>🇩🇪 Deutsch</option>
                                <option value="fr" ${currentLang==='fr'?'selected':''}>🇫🇷 Français</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label form-label-sm fw-bold text-secondary mb-1">${t('lbl_display_units')}</label>
                            <select class="form-select form-select-sm" id="tour-unit-select">
                                <option value="mm"     ${currentUnit==='mm'    ?'selected':''}>${t('opt_metric')}</option>
                                <option value="dec_in" ${currentUnit==='dec_in'?'selected':''}>${t('opt_decimal_inches')}</option>
                                <option value="frac_in"${currentUnit==='frac_in'?'selected':''}>${t('opt_fractional_inches')}</option>
                            </select>
                        </div>
                        <div class="mb-0">
                            <label class="form-label form-label-sm fw-bold text-secondary mb-1">${t('lbl_currency')}</label>
                            <select class="form-select form-select-sm" id="tour-currency-select">
                                <option value="$" ${currentCurr==='$'?'selected':''}>${t('opt_dollars')}</option>
                                <option value="€" ${currentCurr==='€'?'selected':''}>${t('opt_euros')}</option>
                                <option value="£" ${currentCurr==='£'?'selected':''}>${t('opt_pounds')}</option>
                            </select>
                        </div>
                    </div>`;
            } else {
                contentEl.innerHTML = `
                    <div style="font-size:3.5rem;line-height:1;">${step.icon}</div>
                    <h5 class="fw-bold mt-3 mb-2">${t('tour_' + step.key + '_title')}</h5>
                    <p class="text-muted small mb-0">${t('tour_' + step.key + '_body')}</p>`;
            }
        }

        // Buttons
        const prevBtn = document.getElementById('tour-btn-prev');
        const nextBtn = document.getElementById('tour-btn-next');
        if (prevBtn) prevBtn.classList.toggle('invisible', _tourStep === 0);
        if (nextBtn) {
            const isLast = _tourStep === total - 1;
            nextBtn.textContent = isLast ? t('tour_btn_finish') : t('tour_btn_next');
            nextBtn.className = `btn btn-sm px-4 ${isLast ? 'btn-success' : 'btn-primary'}`;
        }
    }

    // ==========================================
    // GETTING STARTED CHECKLIST
    // ==========================================

    function renderChecklist() {
        const widget = document.getElementById('getting-started-widget');
        if (!widget || window.innerWidth < 768) return;

        const settings = appState.settings || {};
        if (!settings.tourComplete || settings.checklistDismissed) {
            widget.classList.add('d-none');
            return;
        }

        const starterLoaded = !!settings.starterPackLoaded;
        const hasMaterial   = (appState.materials || []).length > 0;
        const hasProfile    = (appState.profiles  || []).length > 0;
        const hasStock      = (appState.catalog   || []).length > 0 || (appState.stock || []).length > 0;
        const hasProject    = (appState.projects  || []).length > 0;
        const hasPart       = (appState.parts     || []).length > 0;
        const hasOptimized  = !!settings.hasOptimized;
        const hasPrinted    = !!settings.hasPrinted;

        const manualItems = [
            { done: hasMaterial, key: 'tour_checklist_material' },
            { done: hasProfile,  key: 'tour_checklist_profile'  },
            { done: hasStock,    key: 'tour_checklist_stock'     },
            { done: hasProject,  key: 'tour_checklist_project'   },
            { done: hasPart,     key: 'tour_checklist_part'      },
        ];
        const actionItems = [
            { done: hasOptimized, key: 'tour_checklist_optimize'  },
            { done: hasPrinted,  key: 'tour_checklist_print'     },
        ];

        const allDone = (starterLoaded || manualItems.every(i => i.done)) && actionItems.every(i => i.done);

        widget.classList.remove('d-none');
        const titleEl = widget.querySelector('[data-i18n="tour_checklist_title"]');
        if (titleEl) titleEl.textContent = t('tour_checklist_title');

        const listEl = document.getElementById('checklist-items');
        if (!listEl) return;

        const _item = (item) => `<li class="mb-1"><span style="${item.done ? 'opacity:0.6;' : ''}">${item.done ? '✅' : '⬜'} ${t(item.key)}</span></li>`;

        let html = '';
        html += _item({ done: starterLoaded, key: 'tour_checklist_1' });
        html += `<li class="text-center my-1" style="opacity:0.55;font-size:0.72rem;">${t('tour_checklist_or')}</li>`;
        manualItems.forEach(i => { html += _item(i); });
        html += `<li><hr style="border-color:rgba(255,255,255,0.3);margin:6px 0;"></li>`;
        actionItems.forEach(i => { html += _item(i); });

        if (allDone) {
            html += `<li class="mt-2 pt-2" style="border-top:1px solid rgba(255,255,255,0.3);">
                <div class="fw-bold small mb-2">${t('tour_checklist_done')}</div>
                <button class="btn btn-sm btn-light w-100" onclick="dismissChecklist()">${t('tour_btn_dismiss')}</button>
            </li>`;
        }

        listEl.innerHTML = html;
    }

    function dismissChecklist() {
        const widget = document.getElementById('getting-started-widget');
        if (widget) widget.classList.add('d-none');
        if (appState && appState.settings) {
            appState.settings.checklistDismissed = true;
            saveState();
        }
    }
</script>
