<script>
    function renderDiagramsTab(results) {
        const container = document.getElementById('pane-diagrams');
        let html = '';
        
        const k1D = appState.settings.bladeKerf !== undefined ? appState.settings.bladeKerf : 3.175;
        const t1D = appState.settings.factoryEdgeTrim !== undefined ? appState.settings.factoryEdgeTrim : 6.35;
        const k2D = appState.settings.sheetBladeKerf !== undefined ? appState.settings.sheetBladeKerf : 3.175;
        const t2D = appState.settings.sheetFactoryTrim !== undefined ? appState.settings.sheetFactoryTrim : 6.35;
        const threshold = appState.settings.cutoffThreshold !== undefined ? appState.settings.cutoffThreshold : 200.0;
        const minW = appState.settings.sheetScrapMinWidth !== undefined ? appState.settings.sheetScrapMinWidth : 50.0;
        const minL = appState.settings.sheetScrapMinLength !== undefined ? appState.settings.sheetScrapMinLength : 400.0;
        const _tr = appState.settings.optimizer?.transport || {};
        const boardTransportLmax = _tr.boardLmax  || 0;
        const boardTransportMargin = _tr.boardMargin !== undefined ? _tr.boardMargin : 20;
        const sheetTransportLmax = _tr.sheetLmax  || 0;
        const sheetTransportMargin = _tr.sheetMargin !== undefined ? _tr.sheetMargin : 10;
        
        let boardCounter = 1; 
        const canvasDrawQueue = []; 

        const mergedDiagrams = {};
        let globalMaxSheetDim = 0;
        let globalMaxLumberDim = 0;

        results.forEach(res => {
            if (res.error) return;
            
            const purchase = res.purchase;
            const isSheet = res.sku.category === 'sheet';
            const rawLength = purchase.catalogItem.length;
            const rawWidth = isSheet ? purchase.catalogItem.width : 0;
            const grain = purchase.catalogItem.grain || 'none';
            
            if (isSheet) {
                globalMaxSheetDim = Math.max(globalMaxSheetDim, rawLength, rawWidth);
            } else {
                globalMaxLumberDim = Math.max(globalMaxLumberDim, rawLength);
            }
            
            // 🪄 THE MERGE SANITIZER: Eliminates Float Errors but respects user orientation
            const cleanL = Math.round(rawLength);
            const cleanW = Math.round(rawWidth);

            // Grouping key is strictly bound to exactly what the user entered
            const boardKey = `${res.sku.profileId}|${res.sku.materialId}|${cleanL}|${cleanW}|${grain}`;

            if (!mergedDiagrams[boardKey]) {
                mergedDiagrams[boardKey] = {
                    profileId: res.sku.profileId,
                    materialId: res.sku.materialId,
                    category: res.sku.category,
                    length: rawLength, // Keep original for exact display
                    width: rawWidth,
                    grain: grain,
                    isStock: false,
                    layouts: []
                };
            }
            if (purchase.catalogItem.storeId === 'shop_stock') {
                mergedDiagrams[boardKey].isStock = true;
            }
            mergedDiagrams[boardKey].layouts.push(...purchase.layout);
        });

        const sortedGroups = Object.values(mergedDiagrams).sort((a, b) => {
            if (a.category === 'lumber' && b.category === 'sheet') return -1;
            if (a.category === 'sheet' && b.category === 'lumber') return 1;
            return b.length - a.length;
        });

        // 🪄 Resolve active job parts for loaded-job fallback (mirrors label printing fix)
        const activeJob = appState.jobs?.find(j => j.id === appState.ui?.activeJobId);
        function resolvePartData(partId) {
            return appState.parts.find(p => p.id === partId)
                || activeJob?.parts?.find(p => p.id === partId)
                || null;
        }

        // 🪄 Compute isMultiProject from actual cuts (works for both normal runs and loaded jobs)
        const seenProjectIds = new Set();
        results.forEach(res => {
            const allBoards = [...(res.stock?.layout || []), ...(res.purchase?.layout || [])];
            allBoards.forEach(board => board.cuts.forEach(cut => {
                const pd = resolvePartData(cut.partId);
                if (pd?.projectId) seenProjectIds.add(pd.projectId);
            }));
        });
        const isMultiProject = seenProjectIds.size > 1;

        sortedGroups.forEach(group => {
            const isSheet = group.category === 'sheet';
            const prof = appState.profiles.find(p => p.id === group.profileId);
            const mat = appState.materials.find(m => m.id === group.materialId);
            
            // 🪄 STRICT W x L FORMAT
            const sizeString = isSheet 
                ? `${formatForDisplay(group.width)} x ${formatForDisplay(group.length)}`
                : `${formatForDisplay(group.length)}`;

            const localMax = isSheet ? Math.max(group.length, group.width) : group.length;
            const globalMax = isSheet ? globalMaxSheetDim : globalMaxLumberDim;
            const canvasWidth = globalMax > 0 ? Math.max(50, Math.floor((localMax / globalMax) * 1000)) : 1000;
            
            let canvasHeight = 40; 
            if (isSheet && group.length > 0) {
                const displayLong = Math.max(group.length, group.width);
                const displayShort = Math.min(group.length, group.width);
                canvasHeight = Math.floor(canvasWidth * (displayShort / displayLong)); 
            }

            html += `
            <details class="sku-group mb-4" open>
                <summary class="mt-2 mb-2 border-bottom border-2 border-dark pb-1 d-flex justify-content-between align-items-end" style="cursor: pointer; outline: none; list-style-position: inside;">
                    <h5 class="mb-0 fw-bold d-inline-block">${safeHTML(prof?.name)} - ${safeHTML(mat?.name)}</h5>
                    <span class="d-flex align-items-center gap-2">
                        ${group.isStock ? `<span class="badge bg-success">${t('lbl_stock')}</span>` : ''}
                        <span class="badge bg-secondary">${t('lbl_raw_size')}: ${sizeString} <span class="display-unit-label"></span></span>
                    </span>
                </summary>
                <div class="pt-2"> 
            `;

            group.layouts.forEach((board, bIndex) => {
                const canvasId = `canvas-board-${boardCounter}`;

                let wasteVal = 0;
                if (isSheet) {
                    board.freeRects.forEach(r => wasteVal += (r.w * r.l));
                    // Add transport zone area to waste display (physical offcuts, not usable space)
                    if (board.transportZones && board.transportZones.length > 0) {
                        const perpDim = board.splitAxis === 'width' ? group.length : group.width;
                        board.transportZones.forEach(tz => wasteVal += tz.size * perpDim);
                    }
                } else {
                    wasteVal = board.remaining;
                }
                const wasteLabel = isSheet ? t('lbl_waste_area') : t('lbl_waste_length');
                const wasteDisplay = isSheet
                    ? (wasteVal / 1000000).toFixed(2) + ' m²'
                    : formatForDisplay(wasteVal);

                // 🪄 THE 1D HTML ENGINE: Build the HTML string BEFORE appending it to the main layout
                let labelStripHtml = '';
                let verticalStripHtml = '';
                let cardBodyFlex = 'flex-column align-items-center';
                let diagramHtml = '';
                if (isSheet) {
                    // Keep the canvas strictly for 2D Sheets
                    diagramHtml = `<canvas id="${canvasId}" width="${canvasWidth}" height="${canvasHeight}" style="width: ${canvasWidth}px !important; max-width: 100% !important; height: auto !important; border-radius: 4px; border: 1px solid #ced4da; margin: 0 auto; display: block;"></canvas>`;
                    // Piece-length label strip for 2D transport sheets
                    if (board.transportZones && board.transportZones.length > 0) {
                        const _nP = board.transportZones.length + 1;
                        const _sa = board.splitAxis;
                        const _fal = _sa === 'width' ? group.width : group.length;
                        const _flip = group.width > group.length;
                        const _aligns = (!_flip && _sa === 'length') || (_flip && _sa === 'width');
                        // Piece lengths from actual transport zone positions (dynamic, not fixed segMax)
                        const _pl = [];
                        let _prevEnd = 0;
                        board.transportZones.forEach(tz => {
                            _pl.push(tz.start - _prevEnd);
                            _prevEnd = tz.start + tz.size;
                        });
                        _pl.push(_fal - _prevEnd);
                        // nCuts for sheets is always nP-1 (one cut line per zone)
                        const _sNCuts  = _nP - 1;
                        const _sCutLine = `<div style="flex:0 0 2px;width:2px;min-width:2px;background:#dc3545;flex-shrink:0;"></div>`;
                        const _vCutLine = `<div style="flex:0 0 2px;height:2px;min-height:2px;background:#dc3545;flex-shrink:0;"></div>`;
                        // segMax for this board's split axis — used to detect oversized pieces
                        const _segMax = sheetTransportLmax;
                        if (_aligns) {
                            // Horizontal strip above the canvas — labels use calc(X% - Ypx) so they
                            // scale proportionally at any container width (mobile or desktop).
                            const _lPct = v => (v / _fal * 100).toFixed(3);
                            const _lAdj = v => (v / _fal * _sNCuts * 2).toFixed(3);
                            let _si = '';
                            for (let _i = 0; _i < _nP; _i++) {
                                const _last = _i === _nP - 1;
                                const _isOz  = _segMax > 0 && _pl[_i] > _segMax;
                                const _leftHalf  = _i > 0   ? sheetTransportMargin / 2 : 0;
                                const _rightHalf = !_last   ? sheetTransportMargin / 2 : 0;
                                const _displayLen = _pl[_i] + _leftHalf + _rightHalf;
                                const _r = _i === 0 ? '3px 0 0 3px' : (_last ? '0 3px 3px 0' : '0');
                                const _sColor  = _isOz ? '#dc3545' : '#495057';
                                const _sBorder = _isOz ? 'border:1px solid #dc3545;' : 'border:1px solid #adb5bd;';
                                const _sLabel  = _isOz ? `⚠️ ${formatForDisplay(_displayLen)}` : formatForDisplay(_displayLen);
                                _si += `<div style="flex:0 0 calc(${_lPct(_displayLen)}% - ${_lAdj(_displayLen)}px);min-width:0;background:#f8f9fa;${_sBorder}border-radius:${_r};display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;font-weight:bold;color:${_sColor};white-space:nowrap;padding:0 2px;">${_sLabel}</div>`;
                                if (!_last) _si += _sCutLine;
                            }
                            labelStripHtml = `<div style="width:${canvasWidth}px;max-width:100%;display:flex;height:26px;margin-bottom:4px;box-sizing:border-box;">${_si}</div>`;
                        } else {
                            // Vertical strip beside the canvas — height:auto + align-self:stretch so
                            // the strip matches the canvas height at any screen width.
                            const _lPct = v => (v / _fal * 100).toFixed(3);
                            const _lAdj = v => (v / _fal * _sNCuts * 2).toFixed(3);
                            let _vsi = '';
                            for (let _i = 0; _i < _nP; _i++) {
                                const _last = _i === _nP - 1;
                                const _isOz  = _segMax > 0 && _pl[_i] > _segMax;
                                const _leftHalf  = _i > 0   ? sheetTransportMargin / 2 : 0;
                                const _rightHalf = !_last   ? sheetTransportMargin / 2 : 0;
                                const _displayLen = _pl[_i] + _leftHalf + _rightHalf;
                                const _r = _i === 0 ? '3px 3px 0 0' : (_last ? '0 0 3px 3px' : '0');
                                const _sColor  = _isOz ? '#dc3545' : '#495057';
                                const _sBorder = _isOz ? 'border:1px solid #dc3545;' : 'border:1px solid #adb5bd;';
                                const _sLabel  = _isOz ? `⚠️ ${formatForDisplay(_displayLen)}` : formatForDisplay(_displayLen);
                                _vsi += `<div style="flex:0 0 calc(${_lPct(_displayLen)}% - ${_lAdj(_displayLen)}px);min-height:0;background:#f8f9fa;${_sBorder}border-radius:${_r};display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;font-weight:bold;color:${_sColor};writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;padding:2px 0;">${_sLabel}</div>`;
                                if (!_last) _vsi += _vCutLine;
                            }
                            verticalStripHtml = `<div style="width:30px;height:${canvasHeight}px;max-height:100%;display:flex;flex-direction:column;flex-shrink:0;margin-right:6px;box-sizing:border-box;align-self:stretch;">${_vsi}</div>`;
                            cardBodyFlex = 'flex-row justify-content-center align-items-start';
                        }
                    }
                } else {
                    // Generate 1D Lumber as pure Flexbox HTML using percentages
                    const fullLen = group.length;
                    let innerCuts = '';

                    if (t1D > 0 && board.cuts.length > 0) {
                        const trimPct = (t1D / fullLen) * 100;
                        innerCuts += `<div style="width: ${trimPct}%; background: #adb5bd; height: 100%;"></div>`;
                    }

                    // Helper: renders an explicit remaining-space div, green if usable offcut, red if waste
                    function remainDiv(remainMm) {
                        if (remainMm <= 0) return '';
                        const pct = (remainMm / fullLen) * 100;
                        const usable = remainMm >= threshold;
                        const bg     = usable ? 'rgba(40,167,69,0.15)'  : 'rgba(220,53,69,0.1)';
                        const border = usable ? '1px dashed #28a745'     : '1px dashed #dc3545';
                        return `<div style="width: ${pct}%; height: 100%; background: ${bg}; border-left: ${border}; box-sizing: border-box; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>`;
                    }

                    if (board.segments) {
                        // Transport mode: render segment-by-segment with red ✂ zones between them
                        let globalCutIndex = 0;
                        board.segments.forEach((seg, segIdx) => {
                            const isLastSeg = segIdx === board.segments.length - 1;
                            seg.cuts.forEach((cut, localIdx) => {
                                if (localIdx > 0) {
                                    const kerfPct = (k1D / fullLen) * 100;
                                    innerCuts += `<div style="width: ${kerfPct}%; height: 100%; background: #e9ecef;"></div>`;
                                }
                                const cutPct = (cut.length / fullLen) * 100;
                                innerCuts += `<div style="width: ${cutPct}%; background: #8B4513; border: 2px solid #5c2e0b; display: flex; align-items: center; justify-content: center; height: 100%; position: relative; box-sizing: border-box; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                                    <div style="position: absolute; top: 33%; left: 0; right: 0; border-top: 1px solid rgba(0,0,0,0.15);"></div>
                                    <div style="position: absolute; top: 66%; left: 0; right: 0; border-top: 1px solid rgba(0,0,0,0.15);"></div>
                                    <span style="color: #fff; font-weight: bold; font-size: 16px; position: relative; z-index: 1;">${globalCutIndex + 1}</span>
                                </div>`;
                                globalCutIndex++;
                            });
                            // Remaining space after the last part in this segment
                            if (isLastSeg && (seg.oversized || (board.segments.length === 1 && boardTransportLmax > 0 && boardTransportLmax < fullLen))) {
                                // Cut right after parts end — show gap then green offcut tail.
                                // (oversized: cut is mandatory; single-seg transport: cut at partsEnd maximises offcut)
                                const _tail = fullLen - seg.partsEnd - boardTransportMargin;
                                const _gapPct = (boardTransportMargin / fullLen) * 100;
                                innerCuts += `<div style="width: ${_gapPct}%; height: 100%; background: #dc3545; flex-shrink: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>`;
                                if (_tail > 0) {
                                    // Always show as usable green — this is a guaranteed separated piece, not waste
                                    const _tailPct = (_tail / fullLen) * 100;
                                    innerCuts += `<div style="width: ${_tailPct}%; height: 100%; background: rgba(40,167,69,0.15); border-left: 1px dashed #28a745; box-sizing: border-box; flex-shrink: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>`;
                                }
                            } else {
                                innerCuts += remainDiv(seg.remaining);
                            }
                            if (!isLastSeg) {
                                // Physical margin zone: red hatched, exactly margin mm wide
                                const tzWidth = board.transportZones[segIdx].width;
                                if (tzWidth > 0) {
                                    const gapPct = (tzWidth / fullLen) * 100;
                                    innerCuts += `<div style="width: ${gapPct}%; height: 100%; background: #dc3545; flex-shrink: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact;"></div>`;
                                }
                            }
                        });
                    } else {
                        // Normal mode
                        board.cuts.forEach((cut, index) => {
                            if (index > 0) {
                                const kerfPct = (k1D / fullLen) * 100;
                                innerCuts += `<div style="width: ${kerfPct}%; height: 100%; background: #e9ecef;"></div>`;
                            }
                            const cutPct = (cut.length / fullLen) * 100;
                            innerCuts += `
                            <div style="width: ${cutPct}%; background: #8B4513; border: 2px solid #5c2e0b; display: flex; align-items: center; justify-content: center; height: 100%; position: relative; box-sizing: border-box; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                                <div style="position: absolute; top: 33%; left: 0; right: 0; border-top: 1px solid rgba(0,0,0,0.15);"></div>
                                <div style="position: absolute; top: 66%; left: 0; right: 0; border-top: 1px solid rgba(0,0,0,0.15);"></div>
                                <span style="color: #fff; font-weight: bold; font-size: 16px; position: relative; z-index: 1;">${index + 1}</span>
                            </div>`;
                        });
                        // Remaining: green if usable offcut, red if waste
                        innerCuts += remainDiv(board.remaining);
                    }

                    diagramHtml = `<div style="width: ${canvasWidth}px !important; max-width: 100% !important; height: 40px !important; background: #e9ecef; border: 1px solid #ced4da; border-radius: 4px; display: flex; margin: 0 auto; overflow: hidden; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact;">${innerCuts}</div>`;
                    // Piece-length label strip for 1D transport boards
                    const _isSingleSegTransport = board.segments && board.segments.length === 1 && boardTransportLmax > 0 && boardTransportLmax < fullLen && !board.segments[0]?.oversized;
                    const _hasOversizedSeg = board.segments && board.segments.some(s => s.oversized);
                    if (board.segments && (board.segments.length > 1 || _isSingleSegTransport || _hasOversizedSeg)) {
                        let _si = '';
                        // Thin red cut line — represents the pencil-mark position, not to scale
                        const _cutLine = `<div style="flex:0 0 2px;width:2px;min-width:2px;background:#dc3545;flex-shrink:0;"></div>`;

                        // Label style: calc(X% - Ypx) so labels scale with the container on any screen
                        // width while the fixed-pixel cut lines keep their exact 2px size.
                        // pct  = this label's share of the full board length (%)
                        // nCuts = total number of 2px cut lines in this strip
                        // adj  = pct/100 × nCuts × 2  → this label's proportional share of cut-line space
                        const _lStyle = (pct, adj, radius, color, border) =>
                            `flex:0 0 calc(${pct}% - ${adj}px);min-width:0;background:#f8f9fa;${border}border-radius:${radius};display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;font-weight:bold;color:${color};white-space:nowrap;padding:0 2px;`;

                        if (_isSingleSegTransport) {
                            // Pencil mark = centre of margin; each label absorbs half the margin
                            const _seg0 = board.segments[0];
                            const _partLen  = _seg0.partsEnd - _seg0.segAbsStart;
                            const _tailLen  = fullLen - _seg0.partsEnd - boardTransportMargin;
                            const _leftDim  = _partLen + boardTransportMargin / 2;
                            const _rightDim = _tailLen + boardTransportMargin / 2;
                            // 1 cut line × 2px shared across labels
                            const _lPct  = v => (v / fullLen * 100).toFixed(3);
                            const _lAdj  = v => (v / fullLen * 2).toFixed(3);
                            _si  = `<div style="${_lStyle(_lPct(_leftDim),  _lAdj(_leftDim),  '3px 0 0 3px', '#495057', 'border:1px solid #adb5bd;')}">${formatForDisplay(_leftDim)}</div>`;
                            _si += _cutLine;
                            if (_tailLen > 0) {
                                _si += `<div style="${_lStyle(_lPct(_rightDim), _lAdj(_rightDim), '0 3px 3px 0', '#495057', 'border:1px solid #adb5bd;')}">${formatForDisplay(_rightDim)}</div>`;
                            }
                        } else {
                            const _nP = board.segments.length;
                            const _lastSeg = board.segments[_nP - 1];
                            // Total cut lines = (nP-1) inter-segment cuts + 1 if last seg is oversized
                            const _nCuts = (_nP - 1) + (_lastSeg.oversized ? 1 : 0);
                            const _lPct  = v => (v / fullLen * 100).toFixed(3);
                            const _lAdj  = v => (v / fullLen * _nCuts * 2).toFixed(3);

                            for (let _i = 0; _i < _nP; _i++) {
                                const _last        = _i === _nP - 1;
                                const _seg         = board.segments[_i];
                                const _isOversized = !!_seg.oversized;
                                const _hasCutRight = !_last || _isOversized;

                                // Core length: last normal segment stretches to board end
                                const _coreLen = _last && !_isOversized
                                    ? fullLen - _seg.segAbsStart
                                    : _seg.partsEnd - _seg.segAbsStart;

                                // Each cut absorbs half the margin on each side → measurement to pencil mark
                                const _leftHalf  = _i > 0       ? boardTransportMargin / 2 : 0;
                                const _rightHalf = _hasCutRight  ? boardTransportMargin / 2 : 0;
                                const _displayLen = _coreLen + _leftHalf + _rightHalf;

                                const _r      = _i === 0 ? '3px 0 0 3px' : (_last && !_isOversized ? '0 3px 3px 0' : '0');
                                const _color  = _isOversized ? '#dc3545' : '#495057';
                                const _border = _isOversized ? 'border:1px solid #dc3545;' : 'border:1px solid #adb5bd;';
                                const _label  = _isOversized ? `⚠️ ${formatForDisplay(_displayLen)}` : formatForDisplay(_displayLen);

                                _si += `<div style="${_lStyle(_lPct(_displayLen), _lAdj(_displayLen), _r, _color, _border)}">${_label}</div>`;

                                if (_hasCutRight) _si += _cutLine;

                                // Oversized last segment: tail offcut piece after the cut
                                if (_last && _isOversized) {
                                    const _tailLen = fullLen - _seg.partsEnd - boardTransportMargin;
                                    if (_tailLen > 0) {
                                        const _tailDim = _tailLen + boardTransportMargin / 2;
                                        _si += `<div style="${_lStyle(_lPct(_tailDim), _lAdj(_tailDim), '0 3px 3px 0', '#495057', 'border:1px solid #adb5bd;')}">${formatForDisplay(_tailDim)}</div>`;
                                    }
                                }
                            }
                        }
                        // padding: 0 1px offsets the 1px border on each side of the parts canvas,
                        // keeping the cut lines visually centred over the red margin blocks.
                        labelStripHtml = `<div style="width:${canvasWidth}px;max-width:100%;display:flex;height:26px;margin-bottom:4px;padding:0 1px;box-sizing:border-box;">${_si}</div>`;
                    }
                }

                html += `
                <div class="card shadow-sm mb-4 border-secondary" style="page-break-inside: avoid;">
                    <div class="card-header py-1 d-flex justify-content-between align-items-center">
                        <small class="fw-bold text-muted">${t(isSheet ? 'lbl_sheet_num' : 'lbl_board_num', { current: bIndex + 1, total: group.layouts.length })}</small>
                        <small class="text-muted">${wasteLabel}: ${wasteDisplay} ${isSheet ? '' : '<span class="display-unit-label"></span>'}</small>
                    </div>

                    <div class="card-body p-3 text-center overflow-auto d-flex ${cardBodyFlex}">
                        ${verticalStripHtml}${labelStripHtml}${diagramHtml}
                    </div>

                    <div id="cuts-table-${boardCounter}">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover table-striped align-middle mb-0 border-top cuts-detail-table" style="table-layout: fixed; width: 100%;">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3 text-center" style="width: 5%;">${t('col_cut')}</th>
                                    <th style="width: ${isSheet ? '28%' : '32%'};">${t('col_part_label')}</th>
                                    <th class="d-none d-md-table-cell" style="width: ${isSheet ? '20%' : '23%'};">${t('header_project')}</th>
                                    <th class="d-none d-md-table-cell" style="width: ${isSheet ? '20%' : '23%'};">${t('header_group')}</th>
                                    ${isSheet ? `<th class="text-center d-none d-md-table-cell" style="width: 10%;">${t('col_grain')}</th>` : ''}
                                    <th class="text-end pe-3" style="width: 17%;">${t('col_cut_size')}</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                let showBoardGrainWarning = false;

                board.cuts.forEach((cut, cIndex) => {
                    const partData = resolvePartData(cut.partId);
                    const projName = appState.projects.find(p => p.id === partData?.projectId)?.name || t('lbl_unknown');

                    // 🪄 1. Extract the Group Name (if it exists)
                    let groupName = '';
                    if (partData?.groupId && appState.groups) {
                        groupName = appState.groups.find(g => g.id === partData.groupId)?.name || '';
                    }

                    // 🪄 2. Label + separate Project / Group cells
                    const label = safeHTML(cut.name);
                    const projCell = safeHTML(projName);
                    const groupCell = (groupName && groupName !== '-') ? safeHTML(groupName) : '';

                    let grainCell = '';
                    let grainMobileStr = '';
                    if (isSheet) {
                        const hasGrain = partData && partData.grain && partData.grain !== 'none';
                        const grainStr = hasGrain ? t('opt_' + partData.grain) : '-';
                        let grainWarningBadge = '';
                        if (hasGrain && group.grain === 'none') {
                            grainWarningBadge = ` ⚠️`;
                            showBoardGrainWarning = true;
                        }
                        grainCell = `<td class="text-center text-capitalize text-muted d-none d-md-table-cell">${grainStr}${grainWarningBadge}</td>`;
                        if (hasGrain) grainMobileStr = ` · ${grainStr}${grainWarningBadge}`;
                    }

                    // 🪄 STRICT W x L FORMAT
                    const cutSizeStr = isSheet
                        ? `${formatForDisplay(cut.w)} x ${formatForDisplay(cut.l)}`
                        : `${formatForDisplay(cut.length)}`;

                    const rotationWarning = (isSheet && cut.rotated) ? ` <span class="badge bg-warning text-dark ms-1">${t('lbl_rotated')}</span>` : '';

                    // Mobile sub-row: project | group (· grain for sheets) — hidden on desktop
                    const mobileMeta = [projCell, groupCell ? ' | ' + groupCell : '', grainMobileStr].join('');
                    const mobileSubRow = mobileMeta
                        ? `<div class="d-md-none text-muted fw-normal mt-1" style="font-size:0.72rem;line-height:1.3;">${mobileMeta}</div>`
                        : '';

                    html += `
                                <tr class="small align-middle">
                                    <td class="ps-3 fw-bold text-muted text-center">${cIndex + 1}</td>
                                    <td class="fw-bold">${label}${rotationWarning}${mobileSubRow}</td>
                                    <td class="text-muted d-none d-md-table-cell">${projCell}</td>
                                    <td class="text-muted d-none d-md-table-cell">${groupCell}</td>
                                    ${grainCell}
                                    <td class="text-end pe-3 fw-bold">${cutSizeStr} <span class="display-unit-label"></span></td>
                                </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                if (showBoardGrainWarning) {
                    html += `<div class="card-footer text-danger py-1">
                        ⚠️ <strong>${t('lbl_warning')}:</strong> ${t('msg_grain_warning')}
                    </div>`;
                }
                html += `
                    </div>
                </div>
                `;
                
                // 🪄 Only push 2D Sheets to the canvas drawer. 1D is already drawn via HTML!
                if (isSheet) {
                    // Enrich each cut with its part's grain for per-part grain line rendering
                    board.cuts.forEach(cut => {
                        if (cut.partGrain === undefined) {
                            const pd = resolvePartData(cut.partId);
                            cut.partGrain = (pd && pd.grain && pd.grain !== 'none') ? pd.grain : 'none';
                        }
                    });
                    canvasDrawQueue.push({
                        id: canvasId, board: board, isSheet: isSheet,
                        length: group.length, width: group.width, grain: group.grain,
                        kerf: k2D, trim: t2D,
                        threshold: threshold, minW: minW, minL: minL
                    });
                }
                boardCounter++;
            });
            
            html += `</div></details>`;
        });

        if (html === '') {
            html = `<div class="alert alert-warning mt-3">${t('msg_no_diagrams')}</div>`;
        }

        container.innerHTML = html;
        updateUnitLabels();

        canvasDrawQueue.forEach(job => {
            if (job.isSheet) {
                drawSheetGraphic(job.id, job.board, job.length, job.width, job.grain, job.kerf, job.trim, job.minW, job.minL); 
            } else {
                drawBoardGraphic(job.id, job.board, job.length, job.kerf, job.trim);
            }
        });
    }
    function toggleAllSKUs(expand) {
        document.querySelectorAll('details.sku-group').forEach(el => {
            if (expand) el.setAttribute('open', '');
            else el.removeAttribute('open');
        });
    }

    // 🪄 The new Smart Toggle Engine
    function toggleDiagramsExpandCollapse() {
        const firstDetails = document.querySelector('details.sku-group');
        let isCurrentlyExpanded = true; // Default assumption
        
        // Read the actual DOM to see if the first diagram is currently open
        if (firstDetails) {
            isCurrentlyExpanded = firstDetails.hasAttribute('open');
        }
        
        // Flip the state
        const newState = !isCurrentlyExpanded;
        
        // Execute the visual change
        toggleAllSKUs(newState);
        
        // Update the button icon to match the NEXT action
        const iconSpan = document.getElementById('diagram-toggle-icon');
        if (iconSpan) {
            // 🗜️ means "Click to Clamp/Collapse", ☰ means "Click to Stack/Expand"
            iconSpan.innerText = newState ? '🗜️' : '☰'; 
        }
    }

    function toggleAllCutsTables() {
        const tables = document.querySelectorAll('[id^="cuts-table-"]');
        const anyVisible = Array.from(tables).some(t => t.style.display !== 'none');
        tables.forEach(t => { t.style.display = anyVisible ? 'none' : ''; });
        const btn = document.getElementById('btn-toggle-all-cuts');
        if (btn) {
            btn.textContent = anyVisible ? '⊞' : '⊟';
            btn.title = anyVisible ? t('title_show_cut_lists') : t('title_hide_cut_lists');
        }
    }

    // ==========================================
    // 2D SHEET RENDERING ENGINE
    // ==========================================
    function drawSheetGraphic(canvasId, board, sheetLength, sheetWidth, sheetGrain, kerf, trim, minW, minL) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;  
        const h = canvas.height; 
        
        const flipDisplay = (sheetWidth > sheetLength);
        const displayLong = flipDisplay ? sheetWidth : sheetLength;
        const pxPerMm = w / displayLong;

        function mapCoords(mathX, mathY, mathW, mathL) {
            if (flipDisplay) {
                return { cx: mathX * pxPerMm, cy: mathY * pxPerMm, cw: mathW * pxPerMm, ch: mathL * pxPerMm };
            } else {
                return { cx: mathY * pxPerMm, cy: mathX * pxPerMm, cw: mathL * pxPerMm, ch: mathW * pxPerMm };
            }
        }

        ctx.fillStyle = '#e9ecef'; 
        ctx.fillRect(0, 0, w, h);

        if (trim > 0 && board.cuts.length > 0) {
            ctx.fillStyle = '#adb5bd'; 
            ctx.fillRect(0, 0, w, trim * pxPerMm); 
            ctx.fillRect(0, 0, trim * pxPerMm, h); 
        }

        board.freeRects.forEach(rect => {
            const mapped = mapCoords(rect.x, rect.y, rect.w, rect.l);
            const shortestEdge = Math.min(rect.l, rect.w);
            const longestEdge = Math.max(rect.l, rect.w);
            const isUsable = (shortestEdge >= minW && longestEdge >= minL);

            if (isUsable) {
                ctx.fillStyle = 'rgba(40, 167, 69, 0.15)'; 
                ctx.strokeStyle = '#28a745'; 
            } else {
                ctx.fillStyle = 'rgba(220, 53, 69, 0.1)'; 
                ctx.strokeStyle = '#dc3545'; 
            }

            ctx.fillRect(mapped.cx, mapped.cy, mapped.cw, mapped.ch);
            ctx.setLineDash([5, 5]); 
            ctx.lineWidth = 1;
            ctx.strokeRect(mapped.cx, mapped.cy, mapped.cw, mapped.ch);
            ctx.setLineDash([]); 
        });

        // Sheet-level grain direction for background lines and default part lines
        let isVisualHorizontal = false;
        if (sheetGrain !== 'none') {
            isVisualHorizontal = (sheetGrain === 'length');
            if (flipDisplay) isVisualHorizontal = !isVisualHorizontal;
        }

        // Draw grain lines on the full raw-material background when sheet grain is set
        if (sheetGrain !== 'none') {
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            if (isVisualHorizontal) {
                for (let y = 15; y < h; y += 15) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
            } else {
                for (let x = 15; x < w; x += 15) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
            }
            ctx.stroke();
        }

        board.cuts.forEach((cut, index) => {
            const mapped = mapCoords(cut.x, cut.y, cut.w, cut.l);

            ctx.fillStyle = '#DEB887';
            ctx.fillRect(mapped.cx, mapped.cy, mapped.cw, mapped.ch);

            // Draw grain lines on part only when the part itself has a grain direction set
            if (cut.partGrain && cut.partGrain !== 'none') {
                // Direction: grain='length' means grain runs along part's length dimension.
                // If part was rotated during placement, length↔width are swapped on the canvas.
                // Non-flipped display: cut.l → canvas width (horizontal), cut.w → canvas height.
                let lineHoriz = (cut.partGrain === 'length') !== !!cut.rotated;
                if (flipDisplay) lineHoriz = !lineHoriz;
                ctx.strokeStyle = 'rgba(139, 69, 19, 0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                if (lineHoriz) {
                    const stepY = mapped.ch < 45 ? mapped.ch / 4 : 15;
                    for (let y = mapped.cy + stepY; y < mapped.cy + mapped.ch - 1; y += stepY) {
                        ctx.moveTo(mapped.cx, y); ctx.lineTo(mapped.cx + mapped.cw, y);
                    }
                } else {
                    const stepX = mapped.cw < 45 ? mapped.cw / 4 : 15;
                    for (let x = mapped.cx + stepX; x < mapped.cx + mapped.cw - 1; x += stepX) {
                        ctx.moveTo(x, mapped.cy); ctx.lineTo(x, mapped.cy + mapped.ch);
                    }
                }
                ctx.stroke();
            }

            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(mapped.cx, mapped.cy, mapped.cw, mapped.ch);

            if (mapped.cw > 25 && mapped.ch > 25) {
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index + 1, mapped.cx + (mapped.cw / 2), mapped.cy + (mapped.ch / 2));
            }
        });

        // Draw transport zone bands (red hatched stripes)
        if (board.transportZones && board.transportZones.length > 0) {
            board.transportZones.forEach(tz => {
                // tz: { axis, start, size } — start and size are in sheet-math coordinates
                let mapped;
                if (tz.axis === 'width') {
                    // Band runs across the full length at position tz.start along the width axis
                    mapped = mapCoords(tz.start, 0, tz.size, sheetLength);
                } else {
                    // Band runs across the full width at position tz.start along the length axis
                    mapped = mapCoords(0, tz.start, sheetWidth, tz.size);
                }

                ctx.fillStyle = '#dc3545';
                ctx.fillRect(mapped.cx, mapped.cy, mapped.cw, mapped.ch);
            });
        }
    }

    // ==========================================
    // 1D LUMBER RENDERING ENGINE
    // ==========================================
    function drawBoardGraphic(canvasId, board, fullLength, kerf, trim) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;  
        const h = canvas.height; 
        const pxPerMm = w / fullLength;

        ctx.fillStyle = '#e9ecef';
        ctx.fillRect(0, 0, w, h);

        let currentX = 0;

        if (trim > 0 && board.cuts.length > 0) {
            const trimPx = trim * pxPerMm;
            ctx.fillStyle = '#adb5bd'; 
            ctx.fillRect(currentX, 0, trimPx, h);
            currentX += trimPx;
        }

        board.cuts.forEach((cut, index) => {
            if (index > 0) {
                const kerfPx = kerf * pxPerMm;
                currentX += kerfPx;
            }

            const cutPx = cut.length * pxPerMm;
            
            ctx.fillStyle = '#8B4513'; 
            ctx.fillRect(currentX, 0, cutPx, h);

            ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.lineWidth = 1;
            ctx.beginPath();
            const stepY = h < 30 ? h / 3 : 10;
            for (let y = stepY; y < h; y += stepY) {
                ctx.moveTo(currentX, y);
                ctx.lineTo(currentX + cutPx, y);
            }
            ctx.stroke();
            
            ctx.strokeStyle = '#5c2e0b';
            ctx.lineWidth = 2;
            ctx.strokeRect(currentX, 0, cutPx, h);

            if (cutPx > 25) { 
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index + 1, currentX + (cutPx / 2), h / 2);
            }

            currentX += cutPx;
        });
    }
</script>
