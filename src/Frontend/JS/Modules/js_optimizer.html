<script>
    // ==========================================
    // PHASE A: DATA PREP (THE TRIAGE)
    // ==========================================
    function prepOptimizerData(partsToOptimize) {
        if (!partsToOptimize || partsToOptimize.length === 0) return [];

        // 🪄 NEW: Filter the injected array directly instead of appState.parts
        // Bulk rows (is_bulk) are excluded here — they never enter the packer; they're
        // resolved separately by computeBulkResults() (js_bulk_margin.html).
        const validParts = partsToOptimize.filter(p =>
            p.status === 'ready' &&
            (p.category === 'lumber' || p.category === 'sheet') &&
            !p.is_bulk
        );

        const groupedSKUs = {};

        validParts.forEach(part => {
            const skuKey = part.profileId + '|' + part.materialId;
            if (!groupedSKUs[skuKey]) {
                groupedSKUs[skuKey] = {
                    profileId: part.profileId,
                    materialId: part.materialId,
                    category: part.category,
                    partsToCut: []
                };
            }
            // Explode the quantities
            for (let i = 0; i < part.qty; i++) {
                groupedSKUs[skuKey].partsToCut.push({
                    partId: part.id,
                    name: part.name,
                    length: part.length,
                    width: part.width || 0,
                    grain: part.grain || 'none'
                });
            }
        });

        const batches = Object.values(groupedSKUs);
        batches.forEach(batch => {
            if (batch.category === 'sheet') {
                batch.partsToCut.sort((a, b) => (b.length * b.width) - (a.length * a.width));
            } else {
                batch.partsToCut.sort((a, b) => b.length - a.length);
            }
        });

        return batches;
    }
    
    // ==========================================
    // PHASE B: THE TWO-STAGE PACKING ENGINE
    // ==========================================
    function runPackingEngine(partsToOptimize, allowedStoreIds) {
        const batches = prepOptimizerData(partsToOptimize);
        
        const k1D = appState.settings.bladeKerf !== undefined ? appState.settings.bladeKerf : 3.175;
        const t1D = appState.settings.factoryEdgeTrim !== undefined ? appState.settings.factoryEdgeTrim : 6.35;
        const k2D = appState.settings.sheetBladeKerf !== undefined ? appState.settings.sheetBladeKerf : 3.175;
        const t2D = appState.settings.sheetFactoryTrim !== undefined ? appState.settings.sheetFactoryTrim : 6.35;
        const kerfEnabled = appState.settings.optimizer?.kerfEnabled !== false;
        const ek1D = kerfEnabled ? k1D : 0;
        const et1D = kerfEnabled ? t1D : 0;
        const ek2D = kerfEnabled ? k2D : 0;
        const et2D = kerfEnabled ? t2D : 0;
        const pref2D = appState.settings.optimizer?.sheetCutPreference || 'auto';
        const useStock = appState.settings.optimizer?.useStock;
        const _tr = appState.settings.optimizer?.transport || {};
        const transportEnabled   = !!_tr.enabled;
        const boardTransportLmax = _tr.boardLmax  || 0;
        const boardMargin        = _tr.boardMargin !== undefined ? _tr.boardMargin : 20;
        const sheetTransportLmax = _tr.sheetLmax  || 0;
        const sheetMargin        = _tr.sheetMargin !== undefined ? _tr.sheetMargin : 10;
        
        const finalCutlist = [];

        batches.forEach(batch => {
            const isSheet = batch.category === 'sheet';
            let currentParts = [...batch.partsToCut]; // The rolling list of parts we still need to cut
            
            // 🪄 STAGE 1: THE SCAVENGER (Shop Stock)
            if (useStock && appState.stock && currentParts.length > 0) {
                // Find matching stock
                const matchingStock = appState.stock.filter(s => 
                    s.profileId === batch.profileId && 
                    s.materialId === batch.materialId && 
                    s.categoryId === batch.category
                );
                
                // Explode quantities into individual boards
                let explodedStock = [];
                matchingStock.forEach(s => {
                    for(let i=0; i<s.qty; i++) explodedStock.push({...s});
                });
                
                // 🪄 PRIORITY: Scraps first, then smallest size first
                explodedStock.sort((a, b) => {
                    if (a.isCutoff !== b.isCutoff) return a.isCutoff ? -1 : 1; 
                    let sizeA = a.length * (a.width || 1);
                    let sizeB = b.length * (b.width || 1);
                    return sizeA - sizeB; 
                });
                
                let usedStockGroups = {}; 
                
                for (let i = 0; i < explodedStock.length; i++) {
                    if (currentParts.length === 0) break; 
                    
                    let stockPiece = explodedStock[i];
                    let packRes;
                    
                    if (isSheet) {
                        let resRip = packSingle2D(currentParts, stockPiece.length, stockPiece.width, stockPiece.grain, ek2D, et2D, 'rip');
                        let resCross = packSingle2D(currentParts, stockPiece.length, stockPiece.width, stockPiece.grain, ek2D, et2D, 'cross');
                        
                        if (pref2D === 'auto') {
                            let ripPacked = currentParts.length - resRip.unmapped.length;
                            let crossPacked = currentParts.length - resCross.unmapped.length;
                            if (ripPacked > crossPacked) packRes = resRip;
                            else if (crossPacked > ripPacked) packRes = resCross;
                            else packRes = (_sheetTrueWaste([resRip.board], stockPiece.length, stockPiece.width) <= _sheetTrueWaste([resCross.board], stockPiece.length, stockPiece.width)) ? resRip : resCross;
                        } else {
                            packRes = (pref2D === 'rip') ? resRip : resCross;
                        }
                    } else {
                        packRes = packSingle1D(currentParts, stockPiece.length, ek1D, et1D);
                    }
                    
                    // If we successfully placed at least one part on this stock piece
                    if (packRes.board.cuts.length > 0) {
                        let key = `${stockPiece.length}|${stockPiece.width || 0}|${stockPiece.grain || 'none'}`;
                        if (!usedStockGroups[key]) {
                            usedStockGroups[key] = {
                                catalogItem: { storeId: 'shop_stock', length: stockPiece.length, width: stockPiece.width || 0, grain: stockPiece.grain || 'none', price: 0 },
                                totalCost: 0,
                                boardsNeeded: 0,
                                layout: [],
                                waste: 0
                            };
                        }
                        usedStockGroups[key].boardsNeeded++;
                        usedStockGroups[key].layout.push(packRes.board);
                        usedStockGroups[key].waste += packRes.totalWaste;
                        
                        currentParts = packRes.unmapped; // Carry over only what didn't fit
                    }
                }
                
                // Log the consumed stock into the final output
                Object.values(usedStockGroups).forEach(group => {
                    finalCutlist.push({ sku: batch, success: true, purchase: group });
                });
            }

            // 🪄 STAGE 2: THE STORE RUN (Infinite Supply)
            if (currentParts.length > 0) {
                const allVendorOptions = (appState.catalog || []).filter(c =>
                    c.profileId === batch.profileId &&
                    c.materialId === batch.materialId &&
                    c.categoryId === batch.category &&
                    allowedStoreIds.includes(c.storeId)
                );
                // If the user has pinned a specific board for this SKU via the shopping list editor,
                // use only that entry — never silently switch to another store's board.
                const chosenOptions = allVendorOptions.filter(c => c._userChosen);
                const vendorOptions = chosenOptions.length > 0 ? chosenOptions : allVendorOptions;

                if (vendorOptions.length === 0) {
                    finalCutlist.push({ sku: batch, error: `Missing store inventory for remaining ${currentParts.length} parts.` });
                    return; 
                }

                let bestOption = null;
                let lowestCost = Infinity;
                let bestPartialOption = null;
                let bestPartialUnmapped = [];
                let fewestUnmapped = Infinity;
                let bestPartialCost = Infinity;

                vendorOptions.forEach(option => {
                    const boardCost = (typeof calculateCostPerPiece === 'function') ? calculateCostPerPiece(option) : option.price;
                    let packResult;

                    const use1DTransport = transportEnabled && boardTransportLmax > 0;
                    const use2DTransport = transportEnabled && sheetTransportLmax > 0;

                    if (isSheet) {
                        packResult = _bestPack2D(currentParts, option.length, option.width, option.grain, ek2D, et2D, use2DTransport, sheetTransportLmax, sheetMargin, pref2D);
                    } else {
                        packResult = use1DTransport
                            ? pack1DTransport(currentParts, option.length, ek1D, et1D, boardTransportLmax, boardMargin)
                            : pack1D(currentParts, option.length, ek1D, et1D);
                    }

                    if (!packResult) return;
                    const totalCost = packResult.boards.length * boardCost;

                    if (packResult.unmapped.length === 0) {
                        // Full fit
                        // Cheapest wins; on a (near-)tie — e.g. no prices entered — prefer fewer
                        // boards, then less waste, so the result never depends on catalog row order.
                        const _better = !bestOption
                            || totalCost < lowestCost - 1e-9
                            || (Math.abs(totalCost - lowestCost) <= 1e-9 &&
                                (packResult.boards.length < bestOption.boardsNeeded ||
                                 (packResult.boards.length === bestOption.boardsNeeded && packResult.totalWaste < bestOption.waste - 1e-9)));
                        if (_better) {
                            lowestCost = totalCost;
                            bestOption = {
                                catalogItem: option,
                                totalCost,
                                boardsNeeded: packResult.boards.length,
                                layout: packResult.boards,
                                waste: packResult.totalWaste
                            };
                        }
                    } else if (packResult.boards.length > 0) {
                        // Partial fit — some parts placed, some oversized
                        if (packResult.unmapped.length < fewestUnmapped ||
                            (packResult.unmapped.length === fewestUnmapped && (totalCost < bestPartialCost - 1e-9 ||
                                (Math.abs(totalCost - bestPartialCost) <= 1e-9 && bestPartialOption &&
                                 packResult.boards.length < bestPartialOption.boardsNeeded)))) {
                            fewestUnmapped = packResult.unmapped.length;
                            bestPartialCost = totalCost;
                            bestPartialOption = {
                                catalogItem: option,
                                totalCost,
                                boardsNeeded: packResult.boards.length,
                                layout: packResult.boards,
                                waste: packResult.totalWaste
                            };
                            bestPartialUnmapped = packResult.unmapped;
                        }
                    }
                });

                // TAIL SUBSTITUTION: walk backwards through bestOption's boards until we hit
                // one whose parts won't fit on an alternative catalog option. Everything after
                // that split point is repacked on the cheaper alternative (e.g. half-sheets).
                if (bestOption && bestOption.boardsNeeded >= 2 && chosenOptions.length === 0) {
                    const _origN      = bestOption.boardsNeeded;
                    const _origLayout = bestOption.layout;
                    const _origCost   = bestOption.totalCost;
                    const _origWaste  = bestOption.waste;
                    const _primCost   = (typeof calculateCostPerPiece === 'function')
                                        ? calculateCostPerPiece(bestOption.catalogItem)
                                        : bestOption.catalogItem.price;
                    const _tsUse1D    = transportEnabled && boardTransportLmax > 0;
                    const _tsUse2D    = transportEnabled && sheetTransportLmax > 0;
                    let   _bestHybrid = _origCost; // only update bestOption when strictly cheaper

                    vendorOptions.forEach(altOpt => {
                        // Skip same catalog entry
                        if (altOpt.storeId    === bestOption.catalogItem.storeId  &&
                            altOpt.length     === bestOption.catalogItem.length    &&
                            (altOpt.width||0) === (bestOption.catalogItem.width||0)) return;

                        // Walk backwards: find how many tail boards have parts that fit on altOpt
                        let splitIdx = _origN;
                        for (let i = _origN - 1; i >= 0; i--) {
                            const allFit = _origLayout[i].cuts.every(c => {
                                if (isSheet) {
                                    const cw = c.w, cl = c.l, aw = altOpt.width, al = altOpt.length;
                                    return (cw <= aw && cl <= al) || (cl <= aw && cw <= al);
                                }
                                return (c.length || c.l || 0) <= altOpt.length;
                            });
                            if (allFit) splitIdx = i; else break;
                        }
                        // splitIdx === 0  → existing loop already evaluated alt for all parts
                        // splitIdx === _origN → no moveable tail
                        if (splitIdx === 0 || splitIdx >= _origN) return;

                        // Map tail cuts back to original part objects by partId count
                        const _idCounts = {};
                        for (let i = splitIdx; i < _origN; i++)
                            _origLayout[i].cuts.forEach(c => _idCounts[c.partId] = (_idCounts[c.partId]||0) + 1);
                        const _taken = {};
                        const _tailParts = currentParts.filter(p => {
                            const need = _idCounts[p.partId] || 0;
                            const have = _taken[p.partId]   || 0;
                            if (have < need) { _taken[p.partId] = have + 1; return true; }
                            return false;
                        });
                        const expectedCuts = _origLayout.slice(splitIdx).reduce((s, b) => s + b.cuts.length, 0);
                        if (_tailParts.length !== expectedCuts) return; // partId mapping failed — skip safely

                        // Repack tail parts on the alternative option
                        const _altCostPer = (typeof calculateCostPerPiece === 'function')
                                            ? calculateCostPerPiece(altOpt) : altOpt.price;
                        const _altRes = isSheet
                            ? _bestPack2D(_tailParts, altOpt.length, altOpt.width, altOpt.grain,
                                          ek2D, et2D, _tsUse2D, sheetTransportLmax, sheetMargin, pref2D)
                            : (_tsUse1D
                                ? pack1DTransport(_tailParts, altOpt.length, ek1D, et1D, boardTransportLmax, boardMargin)
                                : pack1D(_tailParts, altOpt.length, ek1D, et1D));
                        if (!_altRes || _altRes.unmapped.length > 0) return;

                        const _hybridCost = splitIdx * _primCost + _altRes.boards.length * _altCostPer;
                        if (_hybridCost >= _bestHybrid) return; // not better than current best hybrid
                        _bestHybrid = _hybridCost;

                        const _tailWaste = _origLayout.slice(splitIdx).reduce((s, b) =>
                            s + (isSheet
                                ? (b.freeRects||[]).reduce((ws, r) => ws + r.w * r.l, 0)
                                : (b.remaining||0)), 0);

                        bestOption = {
                            ...bestOption,
                            boardsNeeded: splitIdx,
                            layout:       _origLayout.slice(0, splitIdx),
                            totalCost:    splitIdx * _primCost,
                            waste:        _origWaste - _tailWaste,
                            _tailAlt: {
                                catalogItem:  altOpt,
                                boardsNeeded: _altRes.boards.length,
                                layout:       _altRes.boards,
                                totalCost:    _altRes.boards.length * _altCostPer,
                                waste:        _altRes.totalWaste
                            }
                        };
                    });
                }

                if (bestOption) {
                    const { _tailAlt, ...primaryPurchase } = bestOption;
                    finalCutlist.push({ sku: batch, success: true, purchase: primaryPurchase });
                    if (_tailAlt) {
                        finalCutlist.push({ sku: batch, success: true, purchase: {
                            catalogItem:  _tailAlt.catalogItem,
                            boardsNeeded: _tailAlt.boardsNeeded,
                            layout:       _tailAlt.layout,
                            totalCost:    _tailAlt.totalCost,
                            waste:        _tailAlt.waste
                        }});
                    }
                } else if (bestPartialOption) {
                    // Some parts fit, some are oversized — show partial result with warning
                    finalCutlist.push({
                        sku: batch,
                        purchase: bestPartialOption,
                        oversizedParts: bestPartialUnmapped,
                        failedCatalogItems: vendorOptions,
                    });
                } else {
                    // No parts fit on any board at all
                    finalCutlist.push({
                        sku: batch,
                        error: `Remaining ${currentParts.length} parts are too large for any store boards.`,
                        failedCatalogItems: vendorOptions,
                        unmappedParts: currentParts
                    });
                }
            }
        });

        return finalCutlist;
    }
    // Evaluates 2D constraints and Grain
    // DIM_EPSILON absorbs binary-float noise (e.g. from independently-entered
    // dimensions that are conceptually equal but not bit-identical) so an
    // exact-boundary fit isn't wrongly rejected — 1 micron, irrelevant to any real cut.
    const DIM_EPSILON = 0.001;
    function checkFit(part, rect, sheetGrain) {
        let fitsNormal = (part.width <= rect.w + DIM_EPSILON && part.length <= rect.l + DIM_EPSILON);
        let fitsRotated = (part.length <= rect.w + DIM_EPSILON && part.width <= rect.l + DIM_EPSILON);
        let normalLegal = true;
        let rotatedLegal = true;
        
        if ((part.grain || 'none') !== 'none' && (sheetGrain || 'none') !== 'none') {
            if (part.grain === sheetGrain) rotatedLegal = false; 
            else normalLegal = false; 
        }
        
        let canNormal = fitsNormal && normalLegal;
        let canRotated = fitsRotated && rotatedLegal;

        if (!canNormal && !canRotated) return { fits: false };
        if (canNormal && !canRotated) return { fits: true, rotated: false };
        if (canRotated && !canNormal) return { fits: true, rotated: true };

        // 🪄 TIER 1: MAX TILING CAPACITY (The Grid Saver)
        // Which orientation theoretically fits the most identical parts in this specific rectangle?
        let normalCapacity = Math.floor(rect.w / part.width) * Math.floor(rect.l / part.length);
        let rotatedCapacity = Math.floor(rect.w / part.length) * Math.floor(rect.l / part.width);

        if (normalCapacity !== rotatedCapacity) {
            return { fits: true, rotated: rotatedCapacity > normalCapacity };
        }

        // 🪄 TIER 2: EXACT FIT BONUS (Zero-Waste Edge)
        // If capacity is tied, does one orientation perfectly close out an axis with zero remainder?
        let normalExact = (rect.w % part.width === 0 ? 1 : 0) + (rect.l % part.length === 0 ? 1 : 0);
        let rotatedExact = (rect.w % part.length === 0 ? 1 : 0) + (rect.l % part.width === 0 ? 1 : 0);

        if (normalExact !== rotatedExact) {
            return { fits: true, rotated: rotatedExact > normalExact };
        }

        // 🪄 TIER 3: SLE HEURISTIC (The Fallback)
        // If everything is perfectly tied, fall back to leaving the tightest possible gap.
        let normalMinEdge = Math.min(rect.w - part.width, rect.l - part.length);
        let rotatedMinEdge = Math.min(rect.w - part.length, rect.l - part.width);

        if (normalMinEdge === rotatedMinEdge) {
            // Tie-breaker: Maximize the Longest Leftover Edge to keep scrap chunky
            let normalMaxEdge = Math.max(rect.w - part.width, rect.l - part.length);
            let rotatedMaxEdge = Math.max(rect.w - part.length, rect.l - part.width);
            return { fits: true, rotated: rotatedMaxEdge > normalMaxEdge };
        }

        return { fits: true, rotated: rotatedMinEdge < normalMinEdge };
    }
    function place2DPart(board, rectIndex, part, rotated, kerf, pref) {
        let rect = board.freeRects.splice(rectIndex, 1)[0]; 
        let pw = rotated ? part.length : part.width;
        let pl = rotated ? part.width : part.length;
        
        board.cuts.push({ partId: part.partId, name: part.name, x: rect.x, y: rect.y, w: pw, l: pl, rotated: rotated });
        
        let rect1, rect2;
        // 🪄 FIXED: Rip cut travels along the Length (l). It leaves a full-length strip.
        if (pref === 'rip') { 
            rect1 = { x: rect.x + pw + kerf, y: rect.y, w: Math.max(0, rect.w - pw - kerf), l: rect.l };
            rect2 = { x: rect.x, y: rect.y + pl + kerf, w: pw, l: Math.max(0, rect.l - pl - kerf) };
        } else {
        // 🪄 FIXED: Cross cut travels along the Width (w). It leaves a full-width strip.
            rect1 = { x: rect.x, y: rect.y + pl + kerf, w: rect.w, l: Math.max(0, rect.l - pl - kerf) };
            rect2 = { x: rect.x + pw + kerf, y: rect.y, w: Math.max(0, rect.w - pw - kerf), l: pl };
        }
        
        if (rect1.w > 0 && rect1.l > 0) board.freeRects.push(rect1);
        if (rect2.w > 0 && rect2.l > 0) board.freeRects.push(rect2);
    }
    // Returns the area of the single largest free rect across all boards.
    // Used as the primary tournament tiebreaker: one big offcut beats many small ones.
    function _largestOffcut(boards) {
        let max = 0;
        boards.forEach(b => {
            const rects = b.freeRects || (b.strips || []).flatMap(s => s.freeRects || []);
            rects.forEach(r => { const a = r.w * r.l; if (a > max) max = a; });
        });
        return max;
    }
    // Enforces a canonical orientation for grain-unconstrained identical parts within one packing run.
    // The first placement of a given dimension pair sets the preference; later identical parts use
    // the same orientation when it fits, and fall back to checkFit's choice only when it doesn't.
    function _resolveRot(part, rect, sheetGrain, fit, canonRot) {
        if ((part.grain || 'none') !== 'none' && (sheetGrain || 'none') !== 'none') return fit.rotated; // grain decides
        const key = Math.max(part.length, part.width) + '|' + Math.min(part.length, part.width);
        if (canonRot[key] === undefined) { canonRot[key] = fit.rotated; return fit.rotated; }
        if (canonRot[key] === fit.rotated) return fit.rotated;
        const pw = canonRot[key] ? part.length : part.width;
        const pl = canonRot[key] ? part.width  : part.length;
        return (pw <= rect.w && pl <= rect.l) ? canonRot[key] : fit.rotated;
    }
    // Returns the true-waste rate for a set of pack2D boards: only scraps too small to reuse.
    // This matches the analytics tab metric (board − parts − usable offcuts) / total board area.
    function _sheetTrueWaste(boards, brdL, brdW) {
        if (!boards || boards.length === 0) return 1;
        const _scrapEnabled = appState.settings?.optimizer?.scrapEnabled !== false;
        const _rawScrapW = _scrapEnabled ? (appState.settings?.sheetScrapMinWidth  ?? 50)  : 0;
        const _rawScrapL = _scrapEnabled ? (appState.settings?.sheetScrapMinLength ?? 400) : 0;
        const minW = Math.min(_rawScrapW, _rawScrapL);
        const minL = Math.max(_rawScrapW, _rawScrapL);
        let tw = 0;
        boards.forEach(b => {
            // non-transport boards have top-level freeRects;
            // transport boards spread them across strips
            const rects = b.freeRects || (b.strips || []).flatMap(s => s.freeRects || []);
            rects.forEach(r => {
                if (Math.min(r.w, r.l) < minW || Math.max(r.w, r.l) < minL) tw += r.w * r.l;
            });
        });
        return tw / (boards.length * brdL * brdW);
    }

    // --- INFINITE SUPPLY ENGINES (Store Loop) ---
    function pack1D(parts, boardLength, kerf, trim) {
        let boards = [];
        let unmapped = [];
        let totalWaste = 0;
        parts.forEach(part => {
            let placed = false;
            for (let i = 0; i < boards.length; i++) {
                // 🪄 NEW LOGIC: If it fits, instantly subtract the part AND the kerf needed to sever it
                if (boards[i].remaining + DIM_EPSILON >= part.length) {
                    boards[i].cuts.push(part);
                    boards[i].remaining = Math.max(0, boards[i].remaining - part.length - kerf);
                    placed = true;
                    break;
                }
            }
            if (!placed) {
                let usableLength = boardLength - trim;
                if (usableLength + DIM_EPSILON >= part.length) {
                    // 🪄 First cut also eats a kerf to separate it from the remaining scrap
                    boards.push({ 
                        cuts: [part], 
                        remaining: Math.max(0, usableLength - part.length - kerf) 
                    });
                } else unmapped.push(part);
            }
        });
        boards.forEach(b => totalWaste += b.remaining);
        return { boards, unmapped, totalWaste };
    }
    // Best-fit greedy packer: at each step scans ALL remaining parts × ALL free rects and picks the
    // (part, rect) pair with minimum wasted area. Opens a new board only when nothing fits anywhere.
    // Does not rely on a pre-sorted order — the dynamic scan self-orders placement.
    function pack2DV2(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, pref) {
        const wUsable = Math.max(0, sheetWidth  - trim);
        const lUsable = Math.max(0, sheetLength - trim);
        let boards    = [];
        let unmapped  = [];
        let remaining = [...parts];
        let totalWaste = 0;
        const canonRot = {};

        while (remaining.length > 0) {
            let bestWaste = Infinity, bestPi = -1, bestBi = -1, bestRi = -1, bestRot = false;

            for (let pi = 0; pi < remaining.length; pi++) {
                for (let bi = 0; bi < boards.length; bi++) {
                    const frects = boards[bi].freeRects;
                    for (let ri = 0; ri < frects.length; ri++) {
                        const fit = checkFit(remaining[pi], frects[ri], sheetGrain);
                        if (!fit.fits) continue;
                        const pw = fit.rotated ? remaining[pi].length : remaining[pi].width;
                        const pl = fit.rotated ? remaining[pi].width  : remaining[pi].length;
                        const waste = frects[ri].w * frects[ri].l - pw * pl;
                        if (waste < bestWaste) {
                            bestWaste = waste; bestPi = pi; bestBi = bi; bestRi = ri; bestRot = fit.rotated;
                        }
                    }
                }
            }

            if (bestPi >= 0) {
                const rot = _resolveRot(remaining[bestPi], boards[bestBi].freeRects[bestRi], sheetGrain, { fits: true, rotated: bestRot }, canonRot);
                place2DPart(boards[bestBi], bestRi, remaining[bestPi], rot, kerf, pref);
                remaining.splice(bestPi, 1);
            } else {
                // Nothing fits on existing boards — open a new board with the largest remaining part.
                const li = remaining.reduce((best, p, i) =>
                    (p.length * p.width) > (remaining[best].length * remaining[best].width) ? i : best, 0);
                const newBoard = { cuts: [], freeRects: [{ x: trim, y: trim, w: wUsable, l: lUsable }], cutPref: pref };
                const fit = checkFit(remaining[li], newBoard.freeRects[0], sheetGrain);
                if (fit.fits) {
                    const rot = _resolveRot(remaining[li], newBoard.freeRects[0], sheetGrain, fit, canonRot);
                    place2DPart(newBoard, 0, remaining[li], rot, kerf, pref);
                    boards.push(newBoard);
                } else {
                    unmapped.push(remaining[li]);
                }
                remaining.splice(li, 1);
            }
        }

        boards.forEach(b => b.freeRects.forEach(r => totalWaste += r.w * r.l));
        return { boards, unmapped, totalWaste };
    }

    // Tries 6 sort orders × rip/cross (V1) plus rip/cross with best-fit V2 and returns the
    // pack with fewest boards, then least true waste.
    function _bestPack2D(parts, sheetL, sheetW, sheetGrain, kerf, trim, useTransport, transportLmax, margin, pref) {
        const _lMax = p => Math.max(p.length, p.width);
        const _lMin = p => Math.min(p.length, p.width);
        const _sorters = [
            (a, b) => (b.length * b.width) - (a.length * a.width),          // area desc
            (a, b) => _lMax(b) - _lMax(a),                                   // longest edge desc (no tiebreak)
            (a, b) => { const d = _lMax(b) - _lMax(a); return d !== 0 ? d : _lMin(a) - _lMin(b); }, // longest edge desc, shortest edge asc
            (a, b) => b.length - a.length,                                   // length desc
            (a, b) => b.width  - a.width,                                    // width desc
            (a, b) => (a.length * a.width) - (b.length * b.width),          // area asc
        ];
        const _prefs = pref === 'auto' ? ['rip', 'cross'] : [pref];
        const _isBetter = (res, best) => {
            if (!best) return true;
            if (res.unmapped.length !== best.unmapped.length) return res.unmapped.length < best.unmapped.length;
            if (res.boards.length   !== best.boards.length)   return res.boards.length   < best.boards.length;
            const ro = _largestOffcut(res.boards), bo = _largestOffcut(best.boards);
            if (ro !== bo) return ro > bo;
            return _sheetTrueWaste(res.boards, sheetL, sheetW) < _sheetTrueWaste(best.boards, sheetL, sheetW);
        };
        let best = null;

        // V1: sort-order candidates (transport-aware)
        _sorters.forEach(sorter => {
            const sorted = [...parts].sort(sorter);
            _prefs.forEach(p => {
                const res = useTransport
                    ? pack2DTransport(sorted, sheetL, sheetW, sheetGrain, kerf, trim, transportLmax, margin, p)
                    : pack2D(sorted, sheetL, sheetW, sheetGrain, kerf, trim, p);
                if (res && _isBetter(res, best)) best = res;
            });
        });

        // V2: best-fit scan (non-transport only — transport packing has its own strip logic)
        if (!useTransport) {
            _prefs.forEach(p => {
                const res = pack2DV2(parts, sheetL, sheetW, sheetGrain, kerf, trim, p);
                if (res && _isBetter(res, best)) best = res;
            });
        }

        return best;
    }

    function pack2D(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, pref) {
        let boards = [];
        let unmapped = [];
        let totalWaste = 0;
        const canonRot = {};
        parts.forEach(part => {
            let placed = false;
            for (let b of boards) {
                b.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
                for (let i = 0; i < b.freeRects.length; i++) {
                    let fit = checkFit(part, b.freeRects[i], sheetGrain);
                    if (fit.fits) {
                        place2DPart(b, i, part, _resolveRot(part, b.freeRects[i], sheetGrain, fit, canonRot), kerf, pref);
                        placed = true;
                        break;
                    }
                }
                if (placed) break;
            }
            if (!placed) {
                let wUsable = Math.max(0, sheetWidth - trim);
                let lUsable = Math.max(0, sheetLength - trim);
                let newBoard = { cuts: [], freeRects: [{ x: trim, y: trim, w: wUsable, l: lUsable }], cutPref: pref };
                let fit = checkFit(part, newBoard.freeRects[0], sheetGrain);
                if (fit.fits) {
                    place2DPart(newBoard, 0, part, _resolveRot(part, newBoard.freeRects[0], sheetGrain, fit, canonRot), kerf, pref);
                    boards.push(newBoard);
                } else unmapped.push(part);
            }
        });
        boards.forEach(b => b.freeRects.forEach(r => totalWaste += (r.w * r.l)));
        return { boards, unmapped, totalWaste };
    }
    // --- FINITE SUPPLY ENGINES (Stock Loop) ---
    function packSingle1D(parts, length, kerf, trim) {
        let usableLength = length - trim;
        let board = { cuts: [], remaining: usableLength };
        let unmapped = [];
        parts.forEach(part => {
            // 🪄 NEW LOGIC: Ensure the kerf is taken out of the remaining scrap
            if (board.remaining + DIM_EPSILON >= part.length) {
                board.cuts.push(part);
                board.remaining = Math.max(0, board.remaining - part.length - kerf);
            } else {
                unmapped.push(part);
            }
        });
        return { board, unmapped, totalWaste: board.remaining };
    }
    function packSingle2D(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, pref) {
        let wUsable = Math.max(0, sheetWidth - trim);
        let lUsable = Math.max(0, sheetLength - trim);
        let board = { cuts: [], freeRects: [{ x: trim, y: trim, w: wUsable, l: lUsable }], cutPref: pref };
        let unmapped = [];
        let totalWaste = 0;
        parts.forEach(part => {
            let placed = false;
            board.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
            for (let i = 0; i < board.freeRects.length; i++) {
                let fit = checkFit(part, board.freeRects[i], sheetGrain);
                if (fit.fits) {
                    place2DPart(board, i, part, fit.rotated, kerf, pref);
                    placed = true;
                    break;
                }
            }
            if (!placed) unmapped.push(part);
        });
        board.freeRects.forEach(r => totalWaste += (r.w * r.l));
        return { board, unmapped, totalWaste };
    }

    // ==========================================
    // TRANSPORT PACKING: SEGMENT-BASED ENGINES
    // ==========================================
    //
    // These functions wrap pack1D / pack2D with physical store-cut margin zones.
    // When transport is disabled, pack1D / pack2D are called directly (zero regression).
    //
    function pack1DTransport(parts, boardLength, kerf, trim, transportLmax, margin) {
        // Fall through to normal packer when board fits within the transport limit.
        if (boardLength <= transportLmax) return pack1D(parts, boardLength, kerf, trim);

        let boards     = [];
        let unmapped   = [];
        let totalWaste = 0;

        // Attempt to fit part into an open segment. Tracks absolute partsEnd position.
        function fitInSeg(seg, part, boardCuts) {
            if (seg.sealed) return false;                        // segment is frozen — no more parts
            const k         = seg.cuts.length === 0 ? 0 : kerf; // no kerf before first part
            const available = Math.min(seg.segAbsStart + transportLmax - margin, boardLength) - seg.partsEnd;
            if (available + DIM_EPSILON >= part.length + k) {
                seg.cuts.push(part);
                boardCuts.push(part);
                seg.partsEnd += k + part.length;
                return true;
            }
            return false;
        }

        // Try to open a new segment on an existing board (after its last segment's partsEnd + margin).
        function openNewSeg(b, part) {
            const lastSeg  = b.segments[b.segments.length - 1];
            const newStart = lastSeg.partsEnd + margin;
            if (newStart >= boardLength) return false;              // no board left
            if (part.length > boardLength - newStart + DIM_EPSILON) return false; // truly won't fit on board
            lastSeg.sealed = true;                               // commit — freeze partsEnd before opening next seg
            const oversized = part.length > transportLmax;
            const newSeg = { segAbsStart: newStart, partsEnd: newStart, cuts: [], remaining: 0, oversized };
            b.segments.push(newSeg);
            b.transportZones.push({ width: margin });
            newSeg.cuts.push(part);
            b.cuts.push(part);
            newSeg.partsEnd += part.length;
            return true;
        }

        parts.forEach(part => {
            let placed = false;

            // Pass 1: try all open segments across all boards (first-fit)
            for (let b of boards) {
                for (let seg of b.segments) {
                    if (fitInSeg(seg, part, b.cuts)) { placed = true; break; }
                }
                if (placed) break;
            }

            // Pass 2: extend an existing board with a new segment
            if (!placed) {
                for (let b of boards) {
                    if (openNewSeg(b, part)) { placed = true; break; }
                }
            }

            // Pass 3: open a new board (allow parts that exceed transportLmax but fit on the board)
            if (!placed) {
                if (part.length <= boardLength - trim + DIM_EPSILON) {
                    const oversized = part.length > transportLmax;
                    const firstSeg = { segAbsStart: 0, partsEnd: trim, cuts: [], remaining: 0, oversized };
                    const newBoard = { cuts: [], segments: [firstSeg], transportZones: [], remaining: 0 };
                    firstSeg.cuts.push(part);
                    newBoard.cuts.push(part);
                    firstSeg.partsEnd = trim + part.length;
                    boards.push(newBoard);
                    placed = true;
                } else {
                    unmapped.push(part);
                }
            }
        });

        // Finalize: last segment's remaining = space from partsEnd to board end
        boards.forEach(b => {
            b.cuts = b.segments.flatMap(seg => seg.cuts);        // canonical segment order for table/canvas sync
            const lastSeg     = b.segments[b.segments.length - 1];
            lastSeg.remaining = boardLength - lastSeg.partsEnd;
            let boardWaste    = lastSeg.remaining;
            b.transportZones.forEach(tz => boardWaste += tz.width);
            b.remaining  = boardWaste;
            totalWaste  += boardWaste;
        });

        return { boards, unmapped, totalWaste };
    }

    function pack2DTransport(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, transportLmax, margin, pref) {
        // No splitting required — fall through to normal 2D packer
        if (transportLmax <= 0 || sheetLength <= transportLmax) {
            return pack2D(parts, sheetLength, sheetWidth, sheetGrain, kerf, trim, pref);
        }

        const segMax   = transportLmax - margin;
        const totalDim = sheetLength;

        // Build strip specifications and transport zone specs (length axis only)
        const stripSpecs = [];
        const tzSpecs    = [];
        let k = 0;
        while (true) {
            const segStart = k * (segMax + margin);
            if (segStart >= totalDim) break;
            const segEnd  = Math.min(segStart + segMax, totalDim);
            const segSize = segEnd - segStart;
            stripSpecs.push({ stripW: sheetWidth, stripL: segSize, trimW: trim, trimL: k === 0 ? trim : 0 });
            if (segEnd < totalDim) {
                tzSpecs.push({ axis: 'length', start: segEnd, size: Math.min(margin, totalDim - segEnd) });
                k++;
            } else {
                break;
            }
        }

        function makeNewBoard() {
            return {
                cuts: [],
                freeRects: [],   // rebuilt with absolute coords after packing
                strips: stripSpecs.map(ss => ({
                    freeRects: [{ x: ss.trimW, y: ss.trimL, w: Math.max(0, ss.stripW - ss.trimW), l: Math.max(0, ss.stripL - ss.trimL) }],
                    cuts: []
                })),
                transportZones: tzSpecs.map(tz => ({ ...tz })),
                splitAxis: 'length'
            };
        }

        // Creates a board for an oversized part.  The oversized strip holds the part (and any
        // additional oversized parts that fit beside it in width).  Tail strips are NOT pre-computed
        // here; they are added in Phase B after all oversized parts have been placed, so that
        // multiple oversized strips can be stacked length-wise on the same raw sheet before tails
        // consume the remaining space.
        function makeOversizedBoard(oversizedDim) {
            const ozZoneEnd = trim + oversizedDim;          // fixed transport cut position
            const strips  = [{
                freeRects: [{ x: trim, y: trim, w: Math.max(0, sheetWidth - trim), l: oversizedDim }],
                cuts: [],
                oversized: true,
                specL: trim + oversizedDim
            }];
            return {
                cuts: [],
                freeRects: [],
                strips,
                transportZones: [{ axis: 'length', start: ozZoneEnd, size: margin }],
                splitAxis: 'length',
                hasOversized: true,
                nextOzStart: ozZoneEnd + margin   // where the next oz strip (or tail zone) begins
            };
        }

        let boards   = [];
        let unmapped = [];

        // Effective transport-direction length of a part, accounting for grain-forced rotation.
        // When grains are set and mismatched the part MUST be rotated, so its width becomes the
        // transport-direction dimension.  When one grain is 'none' the optimizer can choose the
        // shorter dimension — but only if the other dimension fits within the usable sheet width.
        function effectiveTransportL(p) {
            if ((p.grain || 'none') !== 'none' && (sheetGrain || 'none') !== 'none') {
                return p.grain === sheetGrain ? p.length : p.width;
            }
            const minDim = Math.min(p.length, p.width);
            const maxDim = Math.max(p.length, p.width);
            // Rotation is only feasible when the longer dimension fits within the sheet width.
            return maxDim <= sheetWidth - trim + DIM_EPSILON ? minDim : maxDim;
        }

        // Split parts: oversized (effective transport-L >= segMax) sorted largest-first, then normal.
        // >= segMax because a part exactly equal to the limit can't fit in the trimmed first strip
        // and must use the oversized-strip path to get its full usable length.
        const ozParts = parts.filter(p => effectiveTransportL(p) >= segMax)
                             .sort((a, b) => effectiveTransportL(b) - effectiveTransportL(a));
        const nmParts = parts.filter(p => effectiveTransportL(p) < segMax);

        // === PHASE A: Pack all oversized parts ===
        // Each oversized part first tries to share an existing oz strip (width-wise), then tries
        // to extend an existing ozBoard with a new oz strip (length-wise), and only as a last
        // resort opens a new raw sheet.  This lets multiple oversized parts stack on one board.
        ozParts.forEach(part => {
            let placed = false;

            // Pass 1-OZ: fit width-wise in any existing oversized strip
            for (let b of boards) {
                if (!b.hasOversized) continue;
                for (let strip of b.strips) {
                    if (!strip.oversized) continue;
                    strip.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
                    for (let i = 0; i < strip.freeRects.length; i++) {
                        let fit = checkFit(part, strip.freeRects[i], sheetGrain);
                        if (fit.fits) {
                            place2DPart({ cuts: strip.cuts, freeRects: strip.freeRects }, i, part, fit.rotated, kerf, pref);
                            strip.cuts[strip.cuts.length - 1].oversized = true;
                            placed = true;
                            break;
                        }
                    }
                    if (placed) break;
                }
                if (placed) break;
            }

            // Pass 2-OZ: extend an existing ozBoard with a fresh oversized strip
            if (!placed) {
                const ozL = effectiveTransportL(part);
                for (let b of boards) {
                    if (!b.hasOversized) continue;
                    if (b.nextOzStart + ozL <= totalDim + DIM_EPSILON) {
                        const newStripStart = b.nextOzStart;
                        const newStrip = {
                            freeRects: [{ x: trim, y: 0, w: Math.max(0, sheetWidth - trim), l: ozL }],
                            cuts: [],
                            oversized: true,
                            absStart: newStripStart,
                            specL: ozL
                        };
                        const fit = checkFit(part, newStrip.freeRects[0], sheetGrain);
                        if (fit.fits) {
                            b.strips.push(newStrip);
                            b.transportZones.push({ axis: 'length', start: newStripStart + ozL, size: margin });
                            b.nextOzStart = newStripStart + ozL + margin;
                            place2DPart({ cuts: newStrip.cuts, freeRects: newStrip.freeRects }, 0, part, fit.rotated, kerf, pref);
                            newStrip.cuts[newStrip.cuts.length - 1].oversized = true;
                            placed = true;
                        }
                        if (placed) break;
                    }
                }
            }

            // Pass 3-OZ: open a brand-new oversized board
            const ozL3 = effectiveTransportL(part);
            if (!placed && ozL3 <= totalDim + DIM_EPSILON) {
                const ozBoard = makeOversizedBoard(ozL3);
                const ozStrip = ozBoard.strips[0];
                const fit = checkFit(part, ozStrip.freeRects[0], sheetGrain);
                if (fit.fits) {
                    place2DPart({ cuts: ozStrip.cuts, freeRects: ozStrip.freeRects }, 0, part, fit.rotated, kerf, pref);
                    ozStrip.cuts[ozStrip.cuts.length - 1].oversized = true;
                    boards.push(ozBoard);
                    placed = true;
                }
            }

            if (!placed) unmapped.push(part);
        });

        // === PHASE B: Add tail strips to every oversized board ===
        // Now that all oz parts are placed we know where each board's oz zone ends, so we can
        // append segMax-length tail strips in the remaining length without risk of them being
        // "stolen" by subsequent oz parts.
        boards.forEach(b => {
            if (!b.hasOversized) return;
            let tailPos = b.nextOzStart;
            while (tailPos < totalDim) {
                const segEnd  = Math.min(tailPos + segMax, totalDim);
                const segSize = segEnd - tailPos;
                b.strips.push({
                    freeRects: [{ x: trim, y: 0, w: Math.max(0, sheetWidth - trim), l: segSize }],
                    cuts: [],
                    absStart: tailPos,
                    specL: segSize
                });
                if (segEnd < totalDim) {
                    b.transportZones.push({ axis: 'length', start: segEnd, size: Math.min(margin, totalDim - segEnd) });
                }
                tailPos = segEnd + margin;
            }
        });

        // === PHASE C: Pack all normal parts ===
        // Normal parts fill remaining width in oz strips first (Pass 1), then fall back to new
        // normal boards (Pass 2).
        nmParts.forEach(part => {
            let placed = false;

            // Pass 1: try all strips of all boards (oz strips' remaining width + tail strips)
            for (let b of boards) {
                for (let strip of b.strips) {
                    strip.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
                    for (let i = 0; i < strip.freeRects.length; i++) {
                        let fit = checkFit(part, strip.freeRects[i], sheetGrain);
                        if (fit.fits) {
                            place2DPart({ cuts: strip.cuts, freeRects: strip.freeRects }, i, part, fit.rotated, kerf, pref);
                            placed = true;
                            break;
                        }
                    }
                    if (placed) break;
                }
                if (placed) break;
            }

            // Pass 2: open a new normal board
            if (!placed) {
                const newBoard = makeNewBoard();
                for (let strip of newBoard.strips) {
                    strip.freeRects.sort((r1, r2) => (r1.w * r1.l) - (r2.w * r2.l));
                    for (let i = 0; i < strip.freeRects.length; i++) {
                        let fit = checkFit(part, strip.freeRects[i], sheetGrain);
                        if (fit.fits) {
                            place2DPart({ cuts: strip.cuts, freeRects: strip.freeRects }, i, part, fit.rotated, kerf, pref);
                            boards.push(newBoard);
                            placed = true;
                            break;
                        }
                    }
                    if (placed) break;
                }
            }

            if (!placed) unmapped.push(part);
        });

        // Build absolute-coordinate cuts and freeRects from actual packed extents.
        // Two paths: oversized boards use pre-set zones + absStart offsets;
        // normal boards compute zones dynamically from actual packed extents.
        let totalWaste = 0;
        boards.forEach(b => {
            b.cuts = []; b.freeRects = [];

            if (b.hasOversized) {
                // Oversized board: transportZones are pre-set by makeOversizedBoard.
                // Each strip carries its absolute y-offset in absStart (tail strips)
                // or is implicitly offset at 0 (the oversized strip itself, which uses
                // absolute coords in its freeRects already).
                b.strips.forEach(strip => {
                    const yOff = strip.absStart !== undefined ? strip.absStart : 0;
                    let actualSize = 0;
                    strip.cuts.forEach(c => actualSize = Math.max(actualSize, c.y + c.l));
                    strip.cuts.forEach(cut => b.cuts.push({ ...cut, y: cut.y + yOff }));
                    if (actualSize > 0) {
                        strip.freeRects.map(r => {
                            if (r.y >= actualSize) return null;
                            return { ...r, l: Math.min(r.l, actualSize - r.y) };
                        }).filter(r => r && r.w > 0 && r.l > 0)
                          .forEach(r => b.freeRects.push({ ...r, y: r.y + yOff }));
                        // Cover the strip tail after the last part (grey area without this)
                        if (strip.specL > actualSize) {
                            b.freeRects.push({ x: 0, y: yOff + actualSize, w: sheetWidth, l: strip.specL - actualSize });
                        }
                    } else {
                        // Empty strip (no parts placed): include its full free area for waste accounting
                        strip.freeRects.filter(r => r.w > 0 && r.l > 0)
                                       .forEach(r => b.freeRects.push({ ...r, y: r.y + yOff }));
                    }
                });
            } else {
                // Normal board: compute transport zones dynamically from actual packed extents.
                // Empty strips don't advance cumOffset; tail is filled with segMax-sized freeRects.
                b.transportZones = [];
                let cumOffset = 0;

                b.strips.forEach((strip, si) => {
                    const isLast = si === b.strips.length - 1;
                    let actualSize = 0;
                    strip.cuts.forEach(c => actualSize = Math.max(actualSize, c.y + c.l));

                    strip.cuts.forEach(cut => b.cuts.push({ ...cut, y: cut.y + cumOffset }));

                    if (actualSize > 0) {
                        // Strip has parts: clip its freeRects to the actual extent and add to board
                        strip.freeRects.map(r => {
                            if (r.y >= actualSize) return null;
                            return { ...r, l: Math.min(r.l, actualSize - r.y) };
                        }).filter(r => r && r.w > 0 && r.l > 0)
                          .forEach(r => b.freeRects.push({ ...r, y: r.y + cumOffset }));

                        if (!isLast) {
                            b.transportZones.push({ axis: 'length', start: cumOffset + actualSize, size: margin });
                            cumOffset += actualSize + margin;
                        } else {
                            cumOffset += actualSize;
                        }
                    }
                    // Empty strips: skip — their area is covered by tail processing below
                });

                // Fill remaining tail (cumOffset → totalDim) with transport-sized freeRects.
                let tailPos = cumOffset;
                while (totalDim - tailPos > segMax) {
                    b.transportZones.push({ axis: 'length', start: tailPos + segMax, size: margin });
                    b.freeRects.push({ x: 0, y: tailPos, w: sheetWidth, l: segMax });
                    tailPos += segMax + margin;
                }
                if (tailPos < totalDim) {
                    b.freeRects.push({ x: 0, y: tailPos, w: sheetWidth, l: totalDim - tailPos });
                }
            }

            b.freeRects.forEach(r => totalWaste += r.w * r.l);
            b.transportZones.forEach(tz => totalWaste += tz.size * sheetWidth);
        });

        return { boards, unmapped, totalWaste };
    }

    // ==========================================
    // PHASE C: OPTIMIZER UI & CONFIG STATE
    // ==========================================
    function renderOptimizerConfig() {
        const activeActions = document.getElementById('job-config-actions-active');
        const isPostCalculate = activeActions && !activeActions.classList.contains('d-none');

        // For saved jobs: never rebuild — would destroy job state
        if (isPostCalculate && window.activeJobId) return;

        const treeContainer = document.getElementById('job-configurator-tree');

        // For unsaved post-calculate state: snapshot checkboxes, multipliers, collapse state
        const snapshot = {};
        if (isPostCalculate) {
            treeContainer.querySelectorAll('input[type="checkbox"]').forEach(el => {
                snapshot[el.id] = { checked: el.checked };
            });
            treeContainer.querySelectorAll('input[type="number"]').forEach(el => {
                if (!snapshot[el.id]) snapshot[el.id] = {};
                snapshot[el.id].value = el.value;
            });
            treeContainer.querySelectorAll('.collapse.show').forEach(el => {
                snapshot[el.id] = { ...(snapshot[el.id] || {}), expanded: true };
            });
        }
        treeContainer.innerHTML = '';

        if (!appState.projects || appState.projects.length === 0) {
            treeContainer.innerHTML = `<div class="text-muted small">${t('lbl_no_projects_avail')}</div>`;
            return;
        }

        let html = '';
        const allParts = appState.parts || []; 

        // 🪄 SORT 1: Alphabetize the Projects array
        const sortedProjects = [...appState.projects].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    // --- UI LOCK STATES ---
    function toggleConfiguratorState(isLocked, isSaved = false, lockInputs = true) {
        const settingsDiv = document.getElementById('job-config-settings');
        const treeDiv = document.getElementById('job-configurator-tree');
        const defaultActions = document.getElementById('job-config-actions-default');
        const activeActions = document.getElementById('job-config-actions-active');

        // Target the two dynamic buttons
        const btnSave = document.getElementById('btn-active-save');
        const btnLoad = document.getElementById('btn-active-load');

        // Target inputs — settings pane stays editable on saved jobs; only tree + use-stock are locked
        const treeInputs = document.querySelectorAll('#job-configurator-tree input');
        const settingsInputs = document.querySelectorAll('#job-config-settings input, #job-config-settings select');
        const useStockInput = document.getElementById('opt-use-stock');

        if (isLocked) {
            if (lockInputs) {
                // Lock the part tree — never lock the settings pane
                if (treeDiv) treeDiv.classList.add('pointer-events-none');
                treeInputs.forEach(input => input.disabled = true);
                // Use Shop Stock must stay locked on saved jobs (avoids catalog coupling)
                if (useStockInput) useStockInput.disabled = true;
            }
            // Ensure settings pane is always interactive
            if (settingsDiv) settingsDiv.classList.remove('pointer-events-none');
            if (defaultActions) defaultActions.classList.add('d-none');
            if (activeActions) activeActions.classList.remove('d-none');

            // Toggle the Save/Load buttons based on the isSaved flag
            if (btnSave) {
                if (isSaved) btnSave.classList.add('d-none');
                else btnSave.classList.remove('d-none');
            }
            if (btnLoad) {
                if (isSaved) btnLoad.classList.remove('d-none');
                else btnLoad.classList.add('d-none');
            }
        } else {
            // Unlock Visuals
            if (settingsDiv) settingsDiv.classList.remove('pointer-events-none');
            if (treeDiv) treeDiv.classList.remove('pointer-events-none');
            if (defaultActions) defaultActions.classList.remove('d-none');
            if (activeActions) activeActions.classList.add('d-none');

            // Restore functionality for all inputs
            treeInputs.forEach(input => input.disabled = false);
            settingsInputs.forEach(input => input.disabled = false);
        }
    }

    // ==========================================
    // PHASE D: EXECUTION & RENDERING
    // ==========================================
    function runOptimization() {
        let partsToOptimize = [];

        if (!appState.parts || appState.parts.length === 0) {
            if (typeof showToast === 'function') showToast(t('msg_no_parts_in_db'), "warning");
            return;
        }

        appState.parts.forEach(originalPart => {
            // Check: Is the Project selected?
            const projCheckbox = document.getElementById('chk-' + originalPart.projectId);
            if (!projCheckbox || !projCheckbox.checked) return; 
            
            const _projMultiEl = document.getElementById('multi-' + originalPart.projectId);
            const _rawProjMulti = parseInt(_projMultiEl.value);
            const projMulti = isNaN(_rawProjMulti) ? 1 : _rawProjMulti;
            if (isNaN(_rawProjMulti)) _projMultiEl.value = 1;
            if (projMulti === 0) return;
            let finalMulti = projMulti;

            // Check: Does it have a Group?
            if (!originalPart.groupId || originalPart.groupId.trim() === '') {
                // 🪄 IT HAS NO GROUP -> Explicitly check the artificial 'Ungrouped Parts' checkbox
                const noGroupCheckbox = document.getElementById('chk-nogroup-' + originalPart.projectId);

                // Is the 'Ungrouped Parts' group selected?
                if (!noGroupCheckbox || !noGroupCheckbox.checked) return;

                // Stack the multipliers
                const _noGrpMultiEl = document.getElementById('multi-nogroup-' + originalPart.projectId);
                const _rawGrpMulti = parseInt(_noGrpMultiEl.value);
                const grpMulti = isNaN(_rawGrpMulti) ? 1 : _rawGrpMulti;
                if (isNaN(_rawGrpMulti)) _noGrpMultiEl.value = 1;
                if (grpMulti === 0) return;
                finalMulti = projMulti * grpMulti;

            } else {
                // IT HAS A REAL GROUP -> Check the real group checkbox
                const grpCheckbox = document.getElementById('chk-' + originalPart.groupId);

                // Is the Group selected?
                if (!grpCheckbox || !grpCheckbox.checked) return;

                // Stack the multipliers
                const _grpMultiEl = document.getElementById('multi-' + originalPart.groupId);
                const _rawGrpMulti = parseInt(_grpMultiEl.value);
                const grpMulti = isNaN(_rawGrpMulti) ? 1 : _rawGrpMulti;
                if (isNaN(_rawGrpMulti)) _grpMultiEl.value = 1;
                if (grpMulti === 0) return;
                finalMulti = projMulti * grpMulti;
            }

            // Select the part! Clone it and apply the math
            let tempPart = JSON.parse(JSON.stringify(originalPart));
            if (tempPart.is_bulk) {
                // 🪄 Bulk rows have no qty of identical pieces — `length` IS the total
                // requirement, so the project/group multiplier scales it directly
                // instead of qty (e.g. "2x siding" doubles the total run).
                tempPart.length = (parseFloat(originalPart.length) || 0) * finalMulti;
                tempPart.qty = 1;
            } else {
                tempPart.qty = (parseInt(originalPart.qty) || 1) * finalMulti;
            }
            partsToOptimize.push(tempPart);
        });

        if (partsToOptimize.length === 0) {
            if (typeof showToast === 'function') showToast(t('msg_select_project_or_group'), "warning");
            return;
        }

        // Switch button row without locking inputs (inputs stay interactive until Save Job)
        const isRecalculate = window.hasCalculated === true;
        window.hasCalculated = true;
        if (!isRecalculate && appState.settings && !appState.settings.hasOptimized) {
            appState.settings.hasOptimized = true;
            saveState();
            if (typeof renderChecklist === 'function') renderChecklist();
        }
        toggleConfiguratorState(true, false, false);
        // Reset action button to Restart (handles the Recalculate→Restart transition too)
        const _btnA1 = document.getElementById('btn-active-action1');
        if (_btnA1) {
            _btnA1.innerText = t('btn_restart');
            _btnA1.dataset.state = 'restart';
            _btnA1.className = 'btn btn-primary flex-grow-1 shadow-sm';
            _btnA1.onclick = resetConfigurator;
        }

        if (typeof showToast === 'function') showToast(t('msg_calculating_cutlist'));

        // Gather Allowed Stores
        let allowedStores = appState.stores.map(s => s.id);

        // FEED THE ENGINE
        if (!isRecalculate) window._transientPurchasedItems = {}; // fresh run: forget transient checkboxes
        const results = runPackingEngine(partsToOptimize, allowedStores);

        // Bulk material (Feature A) and safety-margin top-up (Feature B) results are
        // shopping-list-only — they must NEVER be merged into `results` itself, since
        // renderDiagramsTab groups by SKU unconditionally and would render an empty,
        // header-only card for any SKU with no packed boards. Kept as separate arrays,
        // merged only into the renderShoppingListTab() call below.
        const bulkResults = (typeof computeBulkResults === 'function')
            ? computeBulkResults(partsToOptimize, appState, allowedStores) : [];
        const marginResults = (typeof computeMarginTopups === 'function')
            ? computeMarginTopups(partsToOptimize, results, appState, allowedStores) : [];

        // Render the UI
        document.getElementById('optimizer-empty-state').classList.add('d-none');
        document.getElementById('optimizer-tab-content').classList.remove('d-none');
        appState.latestResults = results; // unchanged — canonical for diagrams/analytics/job persistence
        // Persisted separately so every other place that re-renders the shopping list from
        // appState.latestResults (unit/language-change redraws, post-save-job redraw — see
        // js_materials.html, js_languages.html, js_jobs.html) can still include bulk/margin
        // lines without recomputing them and without polluting latestResults itself.
        appState.latestBulkResults = bulkResults;
        appState.latestMarginResults = marginResults;

        if (!isRecalculate) {
            // First calculation: reveal shopping controls and switch to shopping tab
            const shopCtrl = document.getElementById('shopping-controls');
            const diagCtrl = document.getElementById('diagram-controls');
            if (shopCtrl) shopCtrl.classList.remove('d-none');
            if (diagCtrl) diagCtrl.classList.add('d-none');

            const defaultTabBtn = document.getElementById('tab-shopping');
            if (defaultTabBtn) {
                const tabInstance = new bootstrap.Tab(defaultTabBtn);
                tabInstance.show();
            }
        }

        renderShoppingListTab(mergeShoppingResults([...results, ...bulkResults, ...marginResults])); // shopping-list only
        if (typeof renderDiagramsTab === 'function') renderDiagramsTab(results); // packer-only — see note above
        if (typeof renderAnalyticsTab === 'function') renderAnalyticsTab(results); // packer-only — see note above
        if (typeof renderSandboxPartlistTab === 'function') renderSandboxPartlistTab(partsToOptimize); // 🪄 Render 4th Tab
    }

    /**
     * Orders two shopping-list items the same way renderDiagramsTab() orders its
     * SKU card groups (js_canvas.html): lumber before sheets, then ascending
     * natural-sort by "Profile - Material". Pure — unit-testable.
     */
    function _compareShoppingListItems(a, b) {
        if (a.category === 'lumber' && b.category === 'sheet') return -1;
        if (a.category === 'sheet' && b.category === 'lumber') return 1;
        const aTitle = `${a.profName} - ${a.matName}`;
        const bTitle = `${b.profName} - ${b.matName}`;
        return aTitle.localeCompare(bTitle, undefined, { numeric: true, sensitivity: 'base' });
    }
    function renderShoppingListTab(results) {
        const container = document.getElementById('pane-shopping');
        let totalCost = 0;
        let totalWeightKg = 0;
        let html = '';
        const _effectiveJobId = window.activeJobId || appState.ui?.activeJobId;
        const activeJob = _effectiveJobId ? appState.jobs?.find(j => j.id === _effectiveJobId) : null;
        const _purchasedMap = activeJob ? (activeJob.purchasedItems || {}) : (window._transientPurchasedItems || {});
        const isMetric = (activeJob?.settings?.displayUnit || appState.settings.displayUnit) === 'mm';
        const weightUnit = isMetric ? 'kg' : 'lbs';
        const currency = activeJob?.settings?.currency || appState.settings.currency || '$';

        const storeBuckets = {};
        
        results.forEach(res => {
            if (res.error) {
                // 🪄 If we are in a saved job, keep ONE broken row alive so the user can fix it.
                // Showing all vendor options causes confusing duplicate rows with different lengths.
                // Prefer the item the user last edited; otherwise pick the longest board (most useful reference).
                if (res.failedCatalogItems && res.failedCatalogItems.length > 0) {
                    const repOpt = res.failedCatalogItems.find(o => o.id === _editingCatalogId)
                        || res.failedCatalogItems.find(o => o._userChosen)
                        || res.failedCatalogItems.reduce((best, o) => (o.length > best.length ? o : best), res.failedCatalogItems[0]);

                    const storeId = repOpt.storeId;
                    const storeName = (storeId === 'shop_stock') ? '🏪 My Shop Stock' : (appState.stores.find(s => s.id === storeId)?.name || 'Unknown Store');
                    if (!storeBuckets[storeName]) storeBuckets[storeName] = [];

                    const prof = appState.profiles.find(p => p.id === res.sku.profileId);
                    const mat = appState.materials.find(m => m.id === res.sku.materialId);

                    storeBuckets[storeName].push({
                        catalogId: repOpt.id,
                        category: res.sku.category,
                        length: repOpt.length,
                        width: repOpt.width,
                        qty: '⚠️',
                        profName: prof?.name || 'Unknown',
                        matName: mat?.name || 'Unknown',
                        cost: 0,
                        weight: 0,
                        url: repOpt.url || repOpt.link || '',
                        price: repOpt.price || 0,
                        priceUnit: repOpt.priceUnit || 'piece',
                        priceSystem: getItemPriceSystem(repOpt),
                        profileThickness: prof?.thickness || 0,
                        profileWidth: prof?.width || 0,
                        isError: true,
                        errorMessage: res.error,
                        unmappedParts: res.unmappedParts
                    });
                } else {
                    // No catalog options exist at all for this SKU — show a sourcing error row
                    const prof = appState.profiles.find(p => p.id === res.sku.profileId);
                    const mat = appState.materials.find(m => m.id === res.sku.materialId);
                    const bucketKey = '⚠️ Sourcing Issues';
                    if (!storeBuckets[bucketKey]) storeBuckets[bucketKey] = [];
                    storeBuckets[bucketKey].push({
                        catalogId: `no-source-${res.sku.profileId}-${res.sku.materialId}`,
                        category: res.sku.category,
                        length: 0,
                        width: 0,
                        qty: '⚠️',
                        profName: prof?.name || 'Unknown',
                        matName: mat?.name || 'Unknown',
                        cost: 0,
                        weight: 0,
                        url: '',
                        price: 0,
                        priceUnit: 'piece',
                        profileThickness: prof?.thickness || 0,
                        profileWidth: prof?.width || 0,
                        isError: true,
                        errorMessage: res.error,
                        unmappedParts: res.unmappedParts
                    });
                }
                return;
            }
            
            const purchase = res.purchase;
            const storeId = purchase.catalogItem.storeId;
            
            const storeName = (storeId === 'shop_stock') 
                ? '🏪 My Shop Stock' 
                : (appState.stores.find(s => s.id === storeId)?.name || 'Unknown Store');
            
            if (!storeBuckets[storeName]) storeBuckets[storeName] = [];
            
            const prof = appState.profiles.find(p => p.id === res.sku.profileId);
            const mat = appState.materials.find(m => m.id === res.sku.materialId);
            
            let batchWeight = 0;
            if (prof && mat) {
                let volumeM3 = 0;
                if (res.sku.category === 'sheet') {
                    volumeM3 = (purchase.catalogItem.length * purchase.catalogItem.width * prof.thickness) / 1000000000;
                } else {
                    volumeM3 = (purchase.catalogItem.length * prof.width * prof.thickness) / 1000000000;
                }
                batchWeight = volumeM3 * mat.density * purchase.boardsNeeded;

            totalCost += purchase.totalCost;
            totalWeightKg += batchWeight;

            storeBuckets[storeName].push({
                catalogId: purchase.catalogItem.id,
                category: res.sku.category,
                length: purchase.catalogItem.length,
                width: purchase.catalogItem.width,

                matName: mat?.name || 'Unknown',

                weight: batchWeight,
                url: purchase.catalogItem.url || purchase.catalogItem.link || '',
                price: purchase.catalogItem.price || 0,
                priceUnit: purchase.catalogItem.priceUnit || 'piece',
                priceSystem: getItemPriceSystem(purchase.catalogItem),
                profileThickness: prof?.thickness || 0,
                profileWidth: prof?.width || 0,

        const totalWeightDisplay = isMetric ? totalWeightKg : (totalWeightKg * 2.20462);

                </div>

        `;

        // 🪄 Ensure "My Shop Stock" remains securely at the top
        const sortedStores = Object.keys(storeBuckets).sort((a, b) => {
            if (a === '🏪 My Shop Stock') return -1;
            if (b === '🏪 My Shop Stock') return 1;
            if (a === '⚠️ Sourcing Issues') return 1;

        for (const storeName of sortedStores) {

            // Match the Cut Diagrams tab's ordering within each store card.

                    : '';

                // Helper to build a collapsed part list from an array of part objects
                function buildPartList(parts) {

                                ${(item.isError && item.length === 0) ? '' : `<div class="d-flex align-items-center mt-1 text-muted" style="font-size:0.8rem;">${t('lbl_raw_size')}: ${sizeDisplay}<span class="display-unit-label ms-1"></span>${pencilBtn}</div>`}
                                ${errorText}

                        <!-- DESKTOP layout (hidden below md) -->

                                <span class="fw-bold ${item.isError ? 'text-danger' : ''}">${safeHTML(item.profName)}</span>
                                <span class="text-muted"> - ${safeHTML(item.matName)}</span>

                                ${(item.isError && item.length === 0) ? '' : `<small class="text-muted ms-5 d-flex align-items-center mt-1">${t('lbl_raw_size')}: ${sizeDisplay} <span class="display-unit-label ms-1"></span>${pencilBtn}</small>`}

        container.innerHTML = html;
