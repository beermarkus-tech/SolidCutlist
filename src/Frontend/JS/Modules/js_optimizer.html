    function toggleCommitCheckboxes(checkStatus) {
        const checkboxes = document.querySelectorAll('.commit-checkbox:not(:disabled)');
        checkboxes.forEach(cb => {
            cb.checked = checkStatus;
        });
    }
    function executeCommitToStock() {
        const checkboxes = document.querySelectorAll('.commit-checkbox:checked:not(:disabled)');
        if (checkboxes.length === 0) {
            showToast('No items selected.', true);
            return;
        }

        if (!appState.stock) appState.stock = [];
        let itemsAdded = 0;

        checkboxes.forEach(cb => {
            const index = parseInt(cb.value);
            const off = window.currentOffcuts[index];
            const saveQty = parseInt(document.getElementById(`commit-qty-${index}`).value) || 1;

            // 1. Create the new Stock Database Object
            const newStockItem = {
                id: 'STK-' + Date.now() + Math.floor(Math.random() * 1000), // Ensure unique IDs in fast loops
                categoryId: off.category,
                profileId: off.profileId,
                materialId: off.materialId,
                qty: saveQty,
                length: off.length,
                width: off.width || 0,
                grain: off.grain || 'none',
                isCutoff: true // 🪄 Automatically tags it as scrap!
            };

            // 2. Push to global inventory
            appState.stock.unshift(newStockItem);
            
            // 3. Mark the local optimizer memory so it can't be double-clicked
            off.committed = true; 
            
            // 4. If they only saved a partial quantity, update the remaining visual number
            off.qty = off.qty - saveQty;
            if (off.qty > 0) off.committed = false; // Allow them to commit the rest later!

            itemsAdded += saveQty;
        });

        saveState();
        if (typeof renderStockTable === 'function') renderStockTable(); // Update the UI in the background
        
        commitModalInstance.hide();
        showToast(`Successfully moved ${itemsAdded} scrap(s) to Shop Stock!`);
        
        // Redraw the analytics table to reflect the new remaining quantities
        sortOffcuts(window.currentOffcutSort.field); 

        setTimeout(() => {
            // 1. Switch the main app view
            if (typeof navigateTo === 'function') {
                navigateTo('view-setup');
            }
            
            // 2. Programmatically click the "My Stock" tab to activate it
            const stockTab = document.getElementById('tab-stock');
            if (stockTab) {
                stockTab.click();
            }
        }, 300); // 300ms delay allows the Bootstrap modal to fade out smoothly before the screen jumps
    }

    // ==========================================
    // EDIT RAW MATERIAL MODAL
    // ==========================================
    const _shoppingItemRegistry = new Map(); // catalogId → enriched bucket item
    let editMaterialModalInstance = null;
    let _editingCatalogId = null;

    function calcNormalizedPrice(price, priceUnit, lengthMm, widthMm, thicknessMm, profileWidthMm, category, isMetric) {
        if (!price || price <= 0 || !lengthMm || lengthMm <= 0) return null;
        const w_mm = category === 'sheet' ? widthMm : profileWidthMm;
        const t_mm = thicknessMm || 0;
        let cpp;
        if (priceUnit === 'piece') {
            cpp = price;
        } else if (priceUnit === 'linear') {
            cpp = isMetric ? price * (lengthMm / 1000) : price * (lengthMm / 304.8);
        } else if (priceUnit === 'area') {
            cpp = isMetric
                ? price * (lengthMm / 1000) * (w_mm / 1000)
                : price * (lengthMm * w_mm / 92903.04);
        } else if (priceUnit === 'volume') {
            if (!t_mm) return null;
            cpp = isMetric
                ? price * (lengthMm / 1000) * (w_mm / 1000) * (t_mm / 1000)
                : price * (lengthMm * w_mm * t_mm / 2359737.216);
        } else {
            return null;
        }
        if (category === 'sheet') {
            const area = isMetric
                ? (lengthMm / 1000) * (w_mm / 1000)
                : (lengthMm * w_mm / 92903.04);
            if (!area) return null;
            return { value: cpp / area, unit: isMetric ? '/ m²' : '/ sqft' };
        } else {
            const len = isMetric ? (lengthMm / 1000) : (lengthMm / 304.8);
            if (!len) return null;
            return { value: cpp / len, unit: isMetric ? '/ m' : '/ ft' };
        }
    }

            <option value="volume">${isMetric ? 'per m³' : 'per board ft'}</option>
        `;

        // Normalized price preview (original)
        const orig = calcNormalizedPrice(item.price, item.priceUnit, item.length, item.width, item.profileThickness, item.profileWidth, item.category, isMetric);

    function updateEditMaterialPreview() {
        const item = _shoppingItemRegistry.get(_editingCatalogId);
        if (!item) return;
        const job = appState.jobs.find(j => j.id === window.activeJobId);
        if (!job) return;
        const isMetric = (job.settings?.displayUnit || appState.settings.displayUnit) === 'mm';
        const currency = job.settings?.currency || appState.settings.currency || '$';

        const lengthMm = parseToBaseUnit(document.getElementById('edit-mat-length').value);
        const widthMm = item.category === 'sheet' ? parseToBaseUnit(document.getElementById('edit-mat-width').value) : item.width;
        const price = parseFloat(document.getElementById('edit-mat-price').value) || 0;
        const priceUnit = document.getElementById('edit-mat-price-unit').value;

        const result = calcNormalizedPrice(price, priceUnit, lengthMm, widthMm, item.profileThickness, item.profileWidth, item.category, isMetric);

    function saveAndRecalculateMaterial() {
        const item = _shoppingItemRegistry.get(_editingCatalogId);
        if (!item) return;
        const job = appState.jobs.find(j => j.id === window.activeJobId);
        if (!job || !job.catalog) return;

        const lengthMm = parseToBaseUnit(document.getElementById('edit-mat-length').value);
        const widthMm = item.category === 'sheet' ? parseToBaseUnit(document.getElementById('edit-mat-width').value) : item.width;
        const price = parseFloat(document.getElementById('edit-mat-price').value);
        const priceUnit = document.getElementById('edit-mat-price-unit').value;

        if (!lengthMm || lengthMm <= 0) { showToast('Invalid length.', 'warning'); return; }
        if (item.category === 'sheet' && (!widthMm || widthMm <= 0)) { showToast('Invalid width.', 'warning'); return; }
        if (isNaN(price) || price < 0) { showToast('Invalid price.', 'warning'); return; }

        const catalogItem = job.catalog.find(c => c.id === _editingCatalogId);
        if (!catalogItem) { showToast('Catalog item not found in job.', 'warning'); return; }

        // Pin this as the chosen board for its SKU. Clear any prior choice on same-SKU siblings
        // so the engine doesn't silently switch to another store's entry that still has the old length.
        job.catalog.forEach(c => {
            if (c.profileId === catalogItem.profileId &&
                c.materialId === catalogItem.materialId &&
                c.categoryId === catalogItem.categoryId) {
                delete c._userChosen;
            }
        });
        catalogItem._userChosen = true;

        catalogItem.length = lengthMm;
        if (item.category === 'sheet') catalogItem.width = widthMm;
        catalogItem.price = price;
        catalogItem.priceUnit = priceUnit;

        setUnsavedChangesState('dirty_input');
        editMaterialModalInstance.hide();
        executeRecalculate();
    }

                analyticsControls.classList.add('d-none');
                sandboxControls.classList.add('d-none'); // 🪄 Hide Sandbox controls

                // 2. Reveal only the controls for the active tab
                if (event.target.id === 'tab-diagrams') {
                    diagramControls.classList.remove('d-none');
                } else if (event.target.id === 'tab-shopping') {
                    shoppingControls.classList.remove('d-none');
                } else if (event.target.id === 'tab-analytics') {
                    analyticsControls.classList.remove('d-none');
                } else if (event.target.id === 'tab-sandbox-partlist') {
                    sandboxControls.classList.remove('d-none'); // 🪄 Show only for Sandbox Partlist
                }
            });
        }
    });

</script>
