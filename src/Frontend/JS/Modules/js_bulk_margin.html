<script>
    // ==========================================
    // BULK MATERIAL (Feature A) + SAFETY MARGIN (Feature B)
    // ==========================================
    // resolveShortfallGreedy() is intentionally pure — no appState/document/t() references —
    // so it can be lifted out of this partial and unit-tested standalone (see test/).

    /**
     * Greedily covers a length requirement from an "infinite supply" set of store
     * board options, always drawing from the single best price/length option
     * (ties broken by longest length, fewer boards/joints) until the requirement
     * is met. The final board's overshoot is the natural ceiling — no separate
     * rounding step. Deliberately simpler than the real optimizer's per-vendor
     * cost-compare + tail-substitution logic (agreed scope cut for bulk/margin
     * math, which has no individual parts to place).
     *
     * @param {number} remainingLength - length still needed (base unit, mm)
     * @param {Array<{id, length, price}>} storeOptions
     * @returns {{groups: Array<{optionId, length, price, boardsNeeded, lineCost}>,
     *            totalBoards: number, totalCost: number, coveredLength: number,
     *            unresolved?: boolean}}
     */
    function resolveShortfallGreedy(remainingLength, storeOptions) {
        if (!(remainingLength > 0)) {
            return { groups: [], totalBoards: 0, totalCost: 0, coveredLength: 0 };
        }

        const validOptions = (storeOptions || []).filter(o => o && o.length > 0 && o.price >= 0);
        if (validOptions.length === 0) {
            return { groups: [], totalBoards: 0, totalCost: 0, coveredLength: 0, unresolved: true };
        }

        const sorted = [...validOptions].sort((a, b) => {
            const ratioA = a.price / a.length;
            const ratioB = b.price / b.length;
            if (ratioA !== ratioB) return ratioA - ratioB;
            return b.length - a.length; // tie-break: longest first (fewer boards, fewer joints)
        });
        const best = sorted[0];

        const boardsNeeded = Math.ceil(remainingLength / best.length);
        const group = {
            optionId: best.id,
            length: best.length,
            price: best.price,
            boardsNeeded,
            lineCost: boardsNeeded * best.price
        };

        return {
            groups: [group],
            totalBoards: boardsNeeded,
            totalCost: group.lineCost,
            coveredLength: boardsNeeded * best.length
        };
    }

    /**
     * Resolves every bulk (is_bulk) lumber row in partsToOptimize into shopping-list-only
     * result entries, in the same {sku, success, purchase:{catalogItem, totalCost,
     * boardsNeeded, layout:[]}} shape runPackingEngine() produces — so renderShoppingListTab()
     * needs no special-casing. layout is always [] (bulk rows never nest cuts on a board,
     * so they must never be passed to renderDiagramsTab/renderAnalyticsTab — see the
     * runOptimization() call site). Runs whenever any is_bulk row is present, independent of
     * the bulkEnabled toggle, which only gates the stock-length filter (§4/§5 of the spec).
     *
     * Impure: reads appState.stock/catalog/settings and the shared appState-level
     * calculateCostPerPiece() helper. resolveShortfallGreedy() above stays pure.
     */
    function computeBulkResults(partsToOptimize, appState, allowedStoreIds) {
        const bulkParts = (partsToOptimize || []).filter(p =>
            p.category === 'lumber' && p.is_bulk === true && p.status === 'ready'
        );
        if (bulkParts.length === 0) return [];

        const settings = appState.settings || {};
        const opt = settings.optimizer || {};
        const marginEnabled = opt.marginEnabled === true;
        const marginPercent = settings.marginPercent || 0;
        const bulkLengthFilterEnabled = opt.bulkEnabled === true;
        const bulkMinimumStockLength = settings.bulkMinimumStockLength || 0;

        // Group bulk rows by profileId|materialId — a bulk material could be split
        // across multiple selected projects/groups, so totals are summed per SKU.
        const groups = {};
        bulkParts.forEach(part => {
            const key = part.profileId + '|' + part.materialId;
            if (!groups[key]) {
                groups[key] = { profileId: part.profileId, materialId: part.materialId, totalLengthRequired: 0 };
            }
            groups[key].totalLengthRequired += parseFloat(part.length) || 0;
        });

        const results = [];

        Object.values(groups).forEach(group => {
            // Step 1: apply the safety margin to the total requirement first.
            const targetLength = marginEnabled
                ? group.totalLengthRequired * (1 + marginPercent / 100)
                : group.totalLengthRequired;

            // Step 2: draw from eligible shop stock piece by piece until the target is
            // covered (a filter, not an offcut setting — when the toggle is OFF, all
            // matching stock counts regardless of length). Every piece actually drawn is
            // reported as its own shopping-list line under "My Shop Stock", the same way
            // runPackingEngine's Stage 1 (Scavenger) reports stock used by non-bulk parts —
            // not just silently subtracted from the target.
            const matchingStock = (appState.stock || []).filter(s =>
                s.profileId === group.profileId &&
                s.materialId === group.materialId &&
                s.categoryId === 'lumber' &&
                (!bulkLengthFilterEnabled || (s.length || 0) >= bulkMinimumStockLength)
            );
            let explodedStock = [];
            matchingStock.forEach(s => {
                for (let i = 0; i < (s.qty || 1); i++) explodedStock.push(s);
            });
            // Longest first — fewer, larger pieces consumed before smaller ones, leaving
            // the more useful (larger) offcuts in stock for later jobs.
            explodedStock.sort((a, b) => (b.length || 0) - (a.length || 0));

            let remaining = targetLength;
            const usedStockGroups = {};
            for (let i = 0; i < explodedStock.length && remaining > 0; i++) {
                const piece = explodedStock[i];
                const gKey = `${piece.length}|${piece.width || 0}|${piece.grain || 'none'}`;
                if (!usedStockGroups[gKey]) {
                    usedStockGroups[gKey] = { length: piece.length, width: piece.width || 0, grain: piece.grain || 'none', boardsNeeded: 0 };
                }
                usedStockGroups[gKey].boardsNeeded++;
                remaining -= piece.length || 0;
            }

            Object.values(usedStockGroups).forEach(g => {
                results.push({
                    sku: { profileId: group.profileId, materialId: group.materialId, category: 'lumber' },
                    success: true,
                    purchase: {
                        catalogItem: { storeId: 'shop_stock', length: g.length, width: g.width, grain: g.grain, price: 0 },
                        totalCost: 0,
                        boardsNeeded: g.boardsNeeded,
                        layout: []
                    }
                });
            });

            const remainder = Math.max(0, remaining);
            if (remainder === 0) return; // stock alone covers it — nothing left to buy

            // Step 3: resolve the remainder against the store catalog.
            const vendorOptions = (appState.catalog || []).filter(c =>
                c.profileId === group.profileId &&
                c.materialId === group.materialId &&
                c.categoryId === 'lumber' &&
                (allowedStoreIds || []).includes(c.storeId)
            );
            const storeOptions = vendorOptions.map(c => ({
                id: c.id,
                length: c.length,
                price: (typeof calculateCostPerPiece === 'function') ? calculateCostPerPiece(c) : (c.price || 0)
            }));

            const resolved = resolveShortfallGreedy(remainder, storeOptions);

            if (resolved.unresolved || resolved.totalBoards === 0) {
                results.push({
                    sku: { profileId: group.profileId, materialId: group.materialId, category: 'lumber' },
                    error: 'Missing store inventory for bulk material requirement.'
                });
                return;
            }

            resolved.groups.forEach(g => {
                const catalogItem = vendorOptions.find(c => c.id === g.optionId);
                if (!catalogItem) return;
                results.push({
                    sku: { profileId: group.profileId, materialId: group.materialId, category: 'lumber' },
                    success: true,
                    purchase: {
                        catalogItem,
                        totalCost: g.lineCost,
                        boardsNeeded: g.boardsNeeded,
                        layout: []
                    }
                });
            });
        });

        return results;
    }

    /**
     * Resolves the global safety-margin top-up (Feature B) for non-bulk lumber. The packer
     * (runPackingEngine) runs completely unmodified beforehand — this only reads its output
     * (`packerResults`, the finalCutlist) after the fact. For each non-bulk lumber SKU: if
     * the packer's own actual leftover already meets marginPercent of the SKU's nominal
     * required length, nothing is added (the packer's imperfect nesting already carries the
     * buffer for free — the common case on small jobs). Otherwise the shortfall is resolved
     * via the same resolveShortfallGreedy() used by Feature A, as additional shopping-list-only
     * entries (layout: [] — never assigned to the canvas, matching computeBulkResults()).
     *
     * Impure: reads appState.catalog/settings and calculateCostPerPiece(). Pure math only
     * touches the passed-in partsToOptimize/packerResults, never appState.parts directly.
     */
    function computeMarginTopups(partsToOptimize, packerResults, appState, allowedStoreIds) {
        const settings = appState.settings || {};
        const opt = settings.optimizer || {};
        if (opt.marginEnabled !== true) return [];

        const marginPercent = settings.marginPercent || 0;

        // Nominal totals per SKU — non-bulk lumber only, the same rows the packer ran on.
        const nominalTotals = {};
        (partsToOptimize || []).forEach(part => {
            if (part.category !== 'lumber' || part.is_bulk || part.status !== 'ready') return;
            const key = part.profileId + '|' + part.materialId;
            const len = parseFloat(part.length) || 0;
            const qty = parseInt(part.qty) || 1;
            nominalTotals[key] = (nominalTotals[key] || 0) + len * qty;
        });

        // Actual leftover per SKU — SUM across every matching finalCutlist entry. A SKU can
        // legitimately produce 2+ entries (a shop-stock draw + a store purchase, or a primary
        // + a tail-substituted alt from the hybrid-repack logic), so this must not read a
        // single "winning option" waste value.
        const leftoverBySku = {};
        (packerResults || []).forEach(res => {
            if (res.error || !res.purchase || !res.sku || res.sku.category !== 'lumber') return;
            const key = res.sku.profileId + '|' + res.sku.materialId;
            leftoverBySku[key] = (leftoverBySku[key] || 0) + (res.purchase.waste || 0);
        });

        const results = [];

        Object.keys(nominalTotals).forEach(key => {
            const [profileId, materialId] = key.split('|');
            const totalNominal = nominalTotals[key];
            const actualLeftover = leftoverBySku[key] || 0;
            const marginThreshold = (marginPercent / 100) * totalNominal;

            if (actualLeftover >= marginThreshold) return; // packer's own slack already covers it

            const shortfall = marginThreshold - actualLeftover;

            // Prefer adding more of the SAME board the packer already bought for this
            // SKU (from a real store, not shop stock) rather than letting the resolver
            // pick a possibly different "best value" length — the shopping list should
            // read "21x 2x4 @ 144in", never "20x 2x4 @ 144in" + "1x 2x4 @ 194in".
            const existingStorePurchases = (packerResults || []).filter(res =>
                !res.error && res.purchase && res.purchase.catalogItem &&
                res.purchase.catalogItem.storeId !== 'shop_stock' &&
                res.sku && res.sku.profileId === profileId && res.sku.materialId === materialId
            );

            let storeOptions, catalogLookup;
            if (existingStorePurchases.length > 0) {
                // Multiple lengths can already be on the list for this SKU (e.g. a
                // tail-substituted hybrid purchase) — top up whichever one the packer
                // bought the most of.
                const primary = existingStorePurchases.reduce((best, r) =>
                    (r.purchase.boardsNeeded || 0) > (best.purchase.boardsNeeded || 0) ? r : best
                );
                const c = primary.purchase.catalogItem;
                storeOptions = [{
                    id: c.id,
                    length: c.length,
                    price: (typeof calculateCostPerPiece === 'function') ? calculateCostPerPiece(c) : (c.price || 0)
                }];
                catalogLookup = new Map([[c.id, c]]);
            } else {
                // No existing store purchase for this SKU (fully covered by shop stock) —
                // nothing to top up, so fall back to resolving against the catalog normally.
                const vendorOptions = (appState.catalog || []).filter(c =>
                    c.profileId === profileId &&
                    c.materialId === materialId &&
                    c.categoryId === 'lumber' &&
                    (allowedStoreIds || []).includes(c.storeId)
                );
                storeOptions = vendorOptions.map(c => ({
                    id: c.id,
                    length: c.length,
                    price: (typeof calculateCostPerPiece === 'function') ? calculateCostPerPiece(c) : (c.price || 0)
                }));
                catalogLookup = new Map(vendorOptions.map(c => [c.id, c]));
            }

            const resolved = resolveShortfallGreedy(shortfall, storeOptions);
            // Margin is a best-effort safety buffer on top of an already-successful pack —
            // if no vendor stocks this SKU, silently skip the top-up rather than erroring;
            // the SKU's actual required boards were already resolved by the packer.
            if (resolved.unresolved || resolved.totalBoards === 0) return;

            resolved.groups.forEach(g => {
                const catalogItem = catalogLookup.get(g.optionId);
                if (!catalogItem) return;
                results.push({
                    sku: { profileId, materialId, category: 'lumber' },
                    success: true,
                    purchase: {
                        catalogItem,
                        totalCost: g.lineCost,
                        boardsNeeded: g.boardsNeeded,
                        layout: []
                    }
                });
            });
        });

        return results;
    }

    /**
     * Merges shopping-list-only result entries so a bulk/margin top-up that resolves
     * to the SAME catalog item a packer entry already bought shows as one combined
     * line ("10x 2x4" instead of "8x 2x4" + "2x 2x4") rather than a separate row.
     * Error entries are never merged — each stays its own line. Never mutates its
     * input objects (the packer-only `results` array is reused elsewhere for the
     * diagrams/analytics tabs and must stay untouched).
     *
     * @param {Array} entries - concatenation of packer results + bulk/margin results
     * @returns {Array} a new array with matching success entries summed together
     */
    function mergeShoppingResults(entries) {
        const merged = [];
        const indexByKey = new Map();

        (entries || []).forEach(res => {
            if (!res || res.error || !res.purchase || !res.purchase.catalogItem) {
                merged.push(res);
                return;
            }
            const c = res.purchase.catalogItem;
            // Real catalog items share a stable id, which is already scoped to one
            // profile+material by definition — safe to merge on id alone. shop_stock
            // synthetic entries have no id (see runPackingEngine Stage 1), so those fall
            // back to a length/width/grain composite — but that alone isn't SKU-specific,
            // so two DIFFERENT profile+material SKUs that happen to share a stock size
            // must not collapse into one line; include sku in the fallback key too.
            const sku = res.sku || {};
            const key = c.id
                ? `id:${c.id}`
                : `stock:${sku.profileId}|${sku.materialId}|${c.storeId}|${c.length}|${c.width || 0}|${c.grain || 'none'}`;

            if (indexByKey.has(key)) {
                const target = merged[indexByKey.get(key)];
                target.purchase = {
                    ...target.purchase,
                    boardsNeeded: (target.purchase.boardsNeeded || 0) + (res.purchase.boardsNeeded || 0),
                    totalCost: (target.purchase.totalCost || 0) + (res.purchase.totalCost || 0)
                };
            } else {
                indexByKey.set(key, merged.length);
                merged.push({ ...res, purchase: { ...res.purchase } });
            }
        });

        return merged;
    }
</script>
